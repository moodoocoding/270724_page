<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>우리 반 핵심어휘 설명 게임</title>

      body { margin: 0; font-family: sans-serif; background: #10271d; color: white; display: grid; min-height: 100vh; place-items: center; }
      main { width: min(720px, 88vw); text-align: center; }

  <body>
    <main>
      <p>연수생 예시 콘텐츠</p>
      <h1>우리 반 핵심어휘 설명 게임</h1>
      <p>핵심어휘의 뜻을 확인하고 짝에게 설명해 보세요.</p>
      <button>시작하기</button>
    </main>
  </body>
</html>
