    // Audio Engine for zero-dependency sound effects
    const AudioEngine = {
        ctx: null,
        init: function() {
            if (!this.ctx) {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            } else if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        },
        playTone: function(freq, type, duration, vol=0.3, startTime=null) {
            if (!this.ctx) this.init();
            if (this.ctx.state === 'suspended') this.ctx.resume();
            
            const now = startTime || this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + duration);
        },
        playCorrect: function(isP1) { 
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const base = isP1 ? 660 : 880; 
            this.playTone(base, 'square', 0.1, 0.15, now);
            this.playTone(base * 1.25, 'triangle', 0.2, 0.2, now + 0.1);
            this.playTone(base * 1.5, 'sine', 0.4, 0.2, now + 0.2);
        },
        playWrong: function() { 
            this.playTone(150, 'sawtooth', 0.3, 0.4);
            setTimeout(() => this.playTone(100, 'sawtooth', 0.4, 0.4), 150);
        },
        playHint: function() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            this.playTone(300, 'sine', 0.1, 0.05, now); 
            this.playTone(400, 'sine', 0.1, 0.05, now + 0.1);
        },
        playCountdown: function() { this.playTone(1200, 'sine', 0.1, 0.2); },
        playStart: function() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            this.playTone(600, 'square', 0.1, 0.3, now);
            this.playTone(800, 'square', 0.4, 0.4, now + 0.15);
            this.playTone(1200, 'sine', 0.5, 0.2, now + 0.3);
        },
        playFanfare: function() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            [523, 659, 783, 1046, 783, 1046].forEach((freq, i) => {
                this.playTone(freq, 'square', 0.2, 0.3, now + i*0.15);
            });
        }
    };

    function renderTargets(playerStr, targets) {
        const container = document.getElementById(`${playerStr}-targets`);
        
        // 무조건 2줄을 만들기 위해 컬럼 개수를 타겟 수의 절반(올림)으로 설정
        container.style.gridTemplateColumns = `repeat(${Math.ceil(targets.length / 2)}, 1fr)`;

        container.innerHTML = targets.map(t => {
            // 단어 길이에 따라 폰트 크기를 동적으로 조절하여 1줄에 맞춤
            let wordStyle = '';
            if (t.word.length > 8) {
                wordStyle = 'style="font-size: 0.7em; letter-spacing: -0.5px;"';
            } else if (t.word.length > 6) {
                wordStyle = 'style="font-size: 0.85em; letter-spacing: -0.2px;"';
            }

            return `
            <div id="${playerStr}-target-${t.word}" class="target-chip">
                <span class="emoji-icon grayscale opacity-40">❓</span>
                <span ${wordStyle}>${t.word.toLowerCase()}</span>
            </div>
            `;
        }).join('');
    }

    function renderGrid(playerStr, emojiArray) {
        const container = document.getElementById(`${playerStr}-grid`);
        // 레벨 설정에 맞게 동적으로 Grid 속성 주입
        container.style.gridTemplateColumns = `repeat(${currentConfig.cols}, 1fr)`;
        container.style.gridTemplateRows = `repeat(${currentConfig.rows}, 1fr)`;

        // onclick 대신 onpointerdown을 사용하여 터치 지연 없이 다중 터치로 즉각 반응하게 수정
        container.innerHTML = emojiArray.map((e) => {
            const isTarget = state[playerStr].targets.some(t => t.word === e.word);
            return `<div class="emoji-btn" data-word="${e.word}" data-istarget="${isTarget}" onpointerdown="handleTap('${playerStr}', '${e.word}', this); event.preventDefault();">
                ${e.emoji}
            </div>`;
        }).join('');
    }

    function initGame() {
        document.getElementById('win-p1').style.display = 'none';
        document.getElementById('win-p2').style.display = 'none';
        document.getElementById('restart-container').style.display = 'none';

        // 해당 레벨 이하의 이모지들만 필터링
        let availablePool = emojiData.filter(e => e.level <= currentConfig.maxLvl);
        let shuffled = [...availablePool].sort(() => Math.random() - 0.5);
        
        // 정답 개수만큼 추출
        let targets = shuffled.slice(0, currentConfig.targets);
        
        // 오답(filler) 추출
        let remaining = shuffled.slice(currentConfig.targets);
        let fillers = remaining.slice(0, currentConfig.total - currentConfig.targets);
        
        // 정답과 오답을 합쳐서 최종 풀 생성
        let pool = [...targets, ...fillers];

        state.p1 = { score: 0, found: new Set(), targets: [...targets] };
        state.p2 = { score: 0, found: new Set(), targets: [...targets] };

        document.getElementById('score-p1').textContent = '0';
        document.getElementById('score-p2').textContent = '0';

        renderTargets('p1', targets);
        renderTargets('p2', targets);

        // 독립적으로 섞어서 보드 렌더링
        renderGrid('p1', [...pool].sort(() => Math.random() - 0.5));
        renderGrid('p2', [...pool].sort(() => Math.random() - 0.5));
    }

    function applyHint(playerStr) {
        const grid = document.getElementById(`${playerStr}-grid`);
        const fillers = Array.from(grid.querySelectorAll('.emoji-btn[data-istarget="false"]:not(.hidden-emoji):not(.hint-fade)'));
        
        if(fillers.length === 0) return false;

        fillers.sort(() => Math.random() - 0.5);
        // 레벨별 설정된 소거 개수 적용
        const toHide = fillers.slice(0, currentConfig.hide);
        
        toHide.forEach(btn => {
            btn.classList.add('hint-fade');
        });

        return true;
    }

    function handleTap(playerStr, word, element) {
        if(!isPlaying) return;

        const playerState = state[playerStr];
        const target = playerState.targets.find(t => t.word === word);

        if (target && !playerState.found.has(word)) {
            // Correct Touch
            playerState.found.add(word);
            element.classList.add('hidden-emoji');
            AudioEngine.playCorrect(playerStr === 'p1');

            // Update Target UI
            const targetUI = document.getElementById(`${playerStr}-target-${word}`);
            targetUI.classList.add('found');
            const icon = targetUI.querySelector('.emoji-icon');
            icon.textContent = target.emoji;
            icon.classList.remove('grayscale', 'opacity-40');

            // Update Score
            playerState.score++;
            document.getElementById(`score-${playerStr}`).textContent = playerState.score;

            // Win condition (설정된 정답 개수와 비교)
            if (playerState.score >= currentConfig.targets) {
                endGame();
            }
        } else {
            // Wrong Touch - Apply Penalty
            AudioEngine.playWrong();
            const grid = document.getElementById(`${playerStr}-grid`);
            grid.classList.add('penalty-mode');

            setTimeout(() => {
                grid.classList.remove('penalty-mode');
            }, 3000);
        }
    }

    function startCountdown(level) {
        AudioEngine.init();
        currentLevelNum = level;
        currentConfig = levelConfigs[level];

        document.getElementById('overlay').style.display = 'none';
        document.getElementById('restart-container').style.display = 'none';
        
        const countOverlay = document.getElementById('countdown-overlay');
        const countText = document.getElementById('countdown-text');
        countOverlay.style.display = 'flex';
        
        let count = 3;
        let countInt; 
        
        function updateCount() {
            countText.classList.remove('count-anim');
            void countText.offsetWidth; // trigger reflow
            countText.classList.add('count-anim');
            
            if(count > 0) {
                countText.textContent = count;
                AudioEngine.playTone(800, 'square', 0.1, 0.3); // Beep
            } else if(count === 0) {
                countText.textContent = 'START!';
                AudioEngine.playTone(1200, 'sine', 0.5, 0.4); // High beep
            } else {
                clearInterval(countInt); 
                countOverlay.style.display = 'none'; 
                startGame(); 
                return; 
            }
            count--;
        }
        
        updateCount(); // 초기 3 바로 표시
        countInt = setInterval(updateCount, 1000); // 1초마다 실행
    }

    function startGame() {
        if(isPlaying) return;
        
        initGame();

        timeLeft = maxTime;
        isPlaying = true;

        const timerFill = document.getElementById('top-timer-fill');
        timerFill.style.width = '100%';

        clearInterval(timerId);
        clearInterval(hintTimerId);

        // 메인 타이머
        timerId = setInterval(() => {
            timeLeft--;
            let pct = (timeLeft / maxTime) * 100;
            timerFill.style.width = pct + '%';
            
            if (timeLeft <= 10 && timeLeft > 0) AudioEngine.playCountdown();
            if (timeLeft <= 0) endGame();
        }, 1000);

        // 10초마다 힌트 제공 타이머
        hintTimerId = setInterval(() => {
            if(!isPlaying) return;
            const h1 = applyHint('p1');
            const h2 = applyHint('p2');
            
            if(h1 || h2) AudioEngine.playHint();
        }, 10000);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerId);
        clearInterval(hintTimerId);
        AudioEngine.playFanfare();

        // 1. 못 찾은 이모지에 O 표시
        ['p1', 'p2'].forEach(playerStr => {
            const playerState = state[playerStr];
            playerState.targets.forEach(t => {
                if (!playerState.found.has(t.word)) {
                    const grid = document.getElementById(`${playerStr}-grid`);
                    const btn = grid.querySelector(`.emoji-btn[data-word="${t.word}"]`);
                    if (btn) {
                        btn.classList.add('missed-target');
                        btn.classList.add(playerStr === 'p1' ? 'missed-p1' : 'missed-p2');
                        btn.classList.remove('hint-fade'); 
                    }
                }
            });
        });

        // 2. 상단 패널에 승/패 표시
        const winP1 = document.getElementById('win-p1');
        const winP2 = document.getElementById('win-p2');

        winP1.style.display = 'flex';
        winP2.style.display = 'flex';
        
        // 이전 클래스 제거
        winP1.className = 'win-overlay';
        winP2.className = 'win-overlay';

        if (state.p1.score > state.p2.score) {
            winP1.innerHTML = '🏆 WIN!';
            winP1.classList.add('win');
            winP2.innerHTML = '😥 LOSE';
            winP2.classList.add('lose');
        } else if (state.p2.score > state.p1.score) {
            winP2.innerHTML = '🏆 WIN!';
            winP2.classList.add('win');
            winP1.innerHTML = '😥 LOSE';
            winP1.classList.add('lose');
        } else {
            winP1.innerHTML = '🤝 DRAW';
            winP1.classList.add('draw');
            winP2.innerHTML = '🤝 DRAW';
            winP2.classList.add('draw');
        }

        // 3. 3초 후 다시하기 버튼 노출
        setTimeout(() => {
            document.getElementById('restart-container').style.display = 'flex';
        }, 3000);
    }

    const setAppHeight = () => {
        const doc = document.documentElement;
        doc.style.setProperty('--app-height', `${window.innerHeight}px`);
    }
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    setAppHeight();

</script>

</body>
</html>
