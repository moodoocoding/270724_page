    function getInitialLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('lang')) {
            const lang = urlParams.get('lang');
            if (translations[lang]) return lang;
        }
        const saved = localStorage.getItem('kingsmath_lang');
        if (saved && translations[saved]) return saved;

        const browser = navigator.language.slice(0, 2).toLowerCase();
        if (translations[browser]) return browser;
        if (navigator.language.toLowerCase() === 'pt-br' && translations['pt-br']) return 'pt-br';

        return 'en';
    }

    function setLanguage(langCode) {
        if (!translations[langCode]) return;
        currentLang = langCode;
        localStorage.setItem('kingsmath_lang', langCode);

        const url = new URL(window.location);
        url.searchParams.set('lang', langCode);
        window.history.pushState({}, '', url);

        applyLanguage();
        generateGlobalScenarios(); 
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function sfxStop() { 
        playTone(880, 'square', 0.1); 
    }
    
    function sfxWin() { 
        const now = audioCtx.currentTime;
        playTone(523.25, 'triangle', 0.1); 
        setTimeout(() => playTone(523.25, 'triangle', 0.1), 120);
        setTimeout(() => playTone(523.25, 'triangle', 0.1), 240);
        setTimeout(() => playTone(783.99, 'square', 0.6), 360);
    }
    
    function sfxStart() {

    function generateData() {
        const scenarioIdx = Math.floor(Math.random() * SCENARIOS.length);
        currentScenario = SCENARIOS[scenarioIdx];
        
        const scales = currentScenario.maxScaleCandidates;
        gameData.maxScale = scales[Math.floor(Math.random() * scales.length)];
        
        let nums = [0,0,0,0,0];
        const type = currentScenario.genType;

        if (type === 'random') {
            for(let i=0; i<5; i++) {
                const min = currentScenario.minVal || 0;
                nums[i] = Math.floor(Math.random() * (gameData.maxScale - min + 1)) + min;
            }
        } else if (type === 'decreasing') {
            nums[0] = currentScenario.startFixed;
            for(let i=1; i<5; i++) {
                const prev = nums[i-1];
                if (prev <= 0) nums[i] = 0;
                else {
                    const dec = Math.floor(Math.random() * (prev * 0.8));
                    nums[i] = Math.max(0, prev - dec - 5);
                }
            }
        } else if (type === 'increasing') {
            let current = Math.floor(Math.random() * 5) + 1;
            nums[0] = current;
            for(let i=1; i<5; i++) {
                const inc = Math.floor(Math.random() * (gameData.maxScale/5)) + 1; 
                current += inc;
                if (current > gameData.maxScale) current = gameData.maxScale;
                nums[i] = current;
            }
        }

        const highValueIdx = Math.floor(Math.random() * 5);
        if (type !== 'decreasing' || highValueIdx === 0) { 
             const targetMin = Math.floor(gameData.maxScale * 0.8);
             const targetMax = Math.floor(gameData.maxScale * 0.99);
             if (type !== 'decreasing') {
                nums[highValueIdx] = Math.floor(Math.random() * (targetMax - targetMin + 1)) + targetMin;
                if (type === 'increasing') {
                    nums[4] = Math.floor(Math.random() * (targetMax - targetMin + 1)) + targetMin;
                }
             }
        }

        if (type === 'increasing') {
            nums.sort((a, b) => a - b);
        }

        gameData.targets = nums;

        document.getElementById('scenario-title').innerText = currentScenario.title;
        
        const thead = document.getElementById('header-row');
        let hHtml = `<th class="table-header-col">${currentScenario.xHeaderTitle}</th>`;
        currentScenario.xLabels.forEach(l => hHtml += `<th>${l}</th>`);
        thead.innerHTML = hHtml;

        const tbody = document.getElementById('data-row');
        let bHtml = `<td class="table-header-col">${currentScenario.rowLabel}</td>`;
        nums.forEach(n => bHtml += `<td>${n}</td>`);
        tbody.innerHTML = bHtml;

        setupControls('p1', currentScenario.xLabels);
        setupControls('p2', currentScenario.xLabels);
    }

    function initPlayerState(p) {
        p.doneCount = 0;
        p.points = [];
        for(let i=0; i<5; i++) {
            p.points.push({
                val: Math.random() * gameData.maxScale,
                speed: (Math.random() * (gameData.maxScale * 0.015)) + (gameData.maxScale * 0.005),
                dir: Math.random() > 0.5 ? 1 : -1,
                stopped: false,
                finalVal: 0
            });
        }
        const zone = document.getElementById(`zone-${p.id}`);
        const btns = zone.querySelectorAll(`.ingame-btn`);
        btns.forEach(b => b.classList.remove('stopped'));
            
        document.getElementById(`crown-${p.id}`).style.transform = 'translateX(-50%) scale(0)';
        document.getElementById(`error-${p.id}`).style.opacity = 0;

    function initAudioAndStart() {
        initAudio();
        document.getElementById('overlay').style.display = 'none';

    function startGame() {
        isPlaying = true;
        document.getElementById('result-modal').style.display = 'none';
            
        generateData();
        initPlayerState(players.p1);
        initPlayerState(players.p2);
        
        resizeCanvas();

        setTimeout(() => {
            msg.style.display = 'none';
            animId = requestAnimationFrame(loop);
        }, 1000);

    function restartGame() {
        startGame();
    }

    function stopPoint(pid, idx, btnElement) {
        if (!isPlaying) return;
        const p = players[pid];
        if (p.points[idx].stopped) return;

        p.points[idx].stopped = true;
        p.points[idx].finalVal = Math.round(p.points[idx].val);
        btnElement.classList.add('stopped');
        sfxStop();

        p.doneCount++;
        if (p.doneCount === 5 && players.p1.doneCount === 5 && players.p2.doneCount === 5) {
            endGame();
        }
    }

    function endGame() {
        isPlaying = false;
        cancelAnimationFrame(animId);

        let p1Err = 0, p2Err = 0;
        for(let i=0; i<5; i++) {
            p1Err += Math.abs(gameData.targets[i] - players.p1.points[i].finalVal);
            p2Err += Math.abs(gameData.targets[i] - players.p2.points[i].finalVal);
        }

        const t = translations[currentLang];
        document.getElementById('error-p1').innerText = `${t.errorLabel}: ${p1Err}`;
        document.getElementById('error-p1').style.opacity = 1;
        document.getElementById('error-p2').innerText = `${t.errorLabel}: ${p2Err}`;
        document.getElementById('error-p2').style.opacity = 1;

        if (p1Err < p2Err) {
            document.getElementById(`crown-p1`).style.transform = 'translateX(-50%) scale(1)';
        } else if (p2Err < p1Err) {
            document.getElementById(`crown-p2`).style.transform = 'translateX(-50%) scale(1)';
        } else {
            document.getElementById(`crown-p1`).style.transform = 'translateX(-50%) scale(1)';
            document.getElementById(`crown-p2`).style.transform = 'translateX(-50%) scale(1)';
        }
        sfxWin();

        draw(players.p1, 'canvas-p1', true);
        draw(players.p2, 'canvas-p2', true);

        setTimeout(() => {
            document.getElementById('result-modal').style.display = 'block';
        }, 2000);
    }

    function loop() {
        if (!isPlaying) return;
        updatePoints(players.p1);
        updatePoints(players.p2);
        draw(players.p1, 'canvas-p1', false);
        draw(players.p2, 'canvas-p2', false);
        animId = requestAnimationFrame(loop);
    }

    function updatePoints(p) {
        p.points.forEach(pt => {
            if (!pt.stopped) {
                pt.val += pt.speed * pt.dir;
                if (pt.val >= gameData.maxScale) { pt.val = gameData.maxScale; pt.dir = -1; }
                if (pt.val <= 0) { pt.val = 0; pt.dir = 1; }
            }
        });
    }

    function draw(p, canvasId, showAnswer) {
        const cvs = document.getElementById(canvasId);
        const ctx = cvs.getContext('2d');
        const w = cvs.width;
        const h = cvs.height;
        const max = gameData.maxScale;

        const btnColors = ['#ff4757', '#2ecc71', '#3742fa', '#ffa502', '#9b59b6'];

        ctx.clearRect(0, 0, w, h);

        const margin = w * 0.15;            
        const rightPadding = w * 0.05;      
        const topPadding = h * 0.15;        
        const bottomMargin = h * 0.25;      
            
        const chartW = w - margin - rightPadding; 
        const chartH = h - bottomMargin - topPadding;
            
        const slotWidth = chartW / 6; 

        ctx.fillStyle = '#fff';
        ctx.font = '22px ' + (currentLang === 'ko' ? 'Jua' : 'sans-serif'); 
        ctx.textAlign = 'center';
        ctx.fillText(currentScenario.title, w / 2, topPadding * 0.4);

        const majorStep = max / 5;
        
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.font = '16px ' + (currentLang === 'ko' ? 'Jua' : 'sans-serif');
        
        for (let i = 0; i <= 5; i++) {
            const val = i * majorStep;
            const y = bottomMargin + (val / max) * chartH;
            const canvasY = h - y;

            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.moveTo(margin, canvasY);
            ctx.lineTo(w - rightPadding, canvasY);
            ctx.stroke();

            let textY = canvasY;
            if (val === 0) textY -= 10;

            ctx.fillStyle = '#fff';
            ctx.fillText(Math.round(val), margin - 10, textY);

            if (i < 5) {
                const subStepPixels = (chartH / 5) / 5;
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                
                for(let k=1; k<5; k++) {
                    const subY = canvasY - (subStepPixels * k);
                    ctx.beginPath();
                    ctx.moveTo(margin, subY);
                    ctx.lineTo(w - rightPadding, subY);
                    ctx.stroke();
                }
            }
        }

        ctx.beginPath();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        
        ctx.moveTo(margin, h - bottomMargin);
        ctx.lineTo(margin, h - bottomMargin + 40); 
        
        ctx.moveTo(margin, h - bottomMargin);
        ctx.lineTo(margin - 60, h - bottomMargin); 
        
        ctx.moveTo(margin, h - bottomMargin);
        ctx.lineTo(margin - 60, h - bottomMargin + 40);
        ctx.stroke();

        ctx.font = '14px ' + (currentLang === 'ko' ? 'Jua' : 'sans-serif');
        ctx.fillStyle = '#ddd';
        ctx.textAlign = 'center';
        
        const rowTitle = currentScenario.rowLabel.split('(')[0]; 
        ctx.fillText(rowTitle, margin - 50, h - bottomMargin + 15); 
        
        const colTitle = currentScenario.xUnitName.replace(/[()]/g, ''); 
        ctx.fillText(colTitle, margin - 25, h - bottomMargin + 35); 

        ctx.textAlign = 'left';
        ctx.fillText(currentScenario.yUnitName, margin - 70, topPadding - 10);

        ctx.beginPath();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.moveTo(margin, topPadding);
        ctx.lineTo(margin, h - bottomMargin);
        ctx.lineTo(w - rightPadding, h - bottomMargin);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        for(let i=0; i<5; i++) {
            const x = margin + ((i + 1) * slotWidth);
            ctx.beginPath();
            ctx.moveTo(x, h - bottomMargin);
            ctx.lineTo(x, topPadding);
            ctx.stroke();
            
            if (i === 4) {
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'left';
                ctx.fillText(currentScenario.xUnitName, x + 50, h - bottomMargin + 20); 
            }
        }

        const coords = [];
        for(let i=0; i<5; i++) {
            const pt = p.points[i];
            const currentVal = pt.stopped ? pt.finalVal : pt.val;
            
            const cx = margin + ((i + 1) * slotWidth);
            const cy = h - (bottomMargin + (currentVal / max) * chartH);
            coords.push({x: cx, y: cy, stopped: pt.stopped, val: currentVal});
        }

        ctx.save();
        ctx.beginPath();
        ctx.lineWidth = 6; 
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        const lineColor = (canvasId === 'canvas-p1') ? '#00d2d3' : '#ff9ff3'; 
        ctx.strokeStyle = lineColor;
        ctx.shadowColor = lineColor;
        ctx.shadowBlur = 10;
        
        coords.forEach((c, i) => {
            if (i===0) ctx.moveTo(c.x, c.y);
            else ctx.lineTo(c.x, c.y);
        });
        ctx.stroke();
        ctx.restore();

        coords.forEach((c, i) => {
            ctx.beginPath();
            const pointColor = btnColors[i];

            if (c.stopped) {
                ctx.fillStyle = pointColor; 
                ctx.arc(c.x, c.y, 12, 0, Math.PI*2); 
            } else {
                ctx.fillStyle = pointColor;
                ctx.arc(c.x, c.y, 9, 0, Math.PI*2); 
            }
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            if (c.stopped) {
                ctx.fillStyle = '#fff';
                ctx.font = '14px ' + (currentLang === 'ko' ? 'Jua' : 'sans-serif');
                ctx.textAlign = 'center';
                ctx.fillText(Math.round(c.val), c.x, c.y - 20);
            }
        });

        if (showAnswer) {
            ctx.save();
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffff00';
            ctx.beginPath();

            for (let i = 0; i < 5; i++) {
                const target = gameData.targets[i];
                const cx = margin + ((i + 1) * slotWidth);
                const cy = h - (bottomMargin + (target / max) * chartH);
                
                if (i===0) ctx.moveTo(cx, cy);
                else ctx.lineTo(cx, cy);
                
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(cx - 3, cy - 3, 6, 6);
            }
            ctx.stroke();
            ctx.restore();
        }
    }

    function repositionButtons(pid) {
        const c1 = document.getElementById(`canvas-${pid}`);
        const con = c1.parentElement;
        const w = con.clientWidth;
        const h = con.clientHeight;
        
        const margin = w * 0.15; 
        const rightPadding = w * 0.05;
        const bottomMargin = h * 0.25; 
        
        const chartW = w - margin - rightPadding;
        const slotWidth = chartW / 6;

        const zone = document.getElementById(`zone-${pid}`);
        const btns = zone.querySelectorAll('.ingame-btn');
        
        btns.forEach(btn => {
            const idx = parseInt(btn.dataset.idx);
            const pointX = margin + ((idx + 1) * slotWidth);
            const btnWidth = 60; 
            
            btn.style.left = (pointX - btnWidth/2) + 'px';
            btn.style.width = btnWidth + 'px'; 
            btn.style.bottom = (bottomMargin - 60) + 'px';
        });
    }

    function resizeCanvas() {
        const c1 = document.getElementById('canvas-p1');
        const c2 = document.getElementById('canvas-p2');
        const con = c1.parentElement;
            
        c1.width = con.clientWidth;
        c1.height = con.clientHeight;
        c2.width = con.clientWidth;
        c2.height = con.clientHeight;

        repositionButtons('p1');
        repositionButtons('p2');
            
        if (!isPlaying && players.p1.points.length > 0) {
             draw(players.p1, 'canvas-p1', players.p1.doneCount === 5);
             draw(players.p2, 'canvas-p2', players.p2.doneCount === 5);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    // 홈 이모지 전체 화면 지체 없이 첫화면 가는 소스 반영
    document.getElementById('reset-match-btn').addEventListener('click', () => {
        // 1. 만약 전체 화면 모드라면
        if (document.fullscreenElement) {
            // 새로고침 대신 화면 초기화 로직 실행 (전체 화면 유지)
            isPlaying = false;
            cancelAnimationFrame(animId);
            
            document.getElementById('langSelectorContainer').style.display = 'block'; // 언어 선택기 다시 보이게 처리
            document.getElementById('top-area').style.display = 'none';
            document.getElementById('result-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'flex';
            
            // 기존 캔버스/표기값 초기화
            initPlayerState(players.p1);
            initPlayerState(players.p2);
            resizeCanvas();
        } else {
            // 2. 전체 화면이 아니라면 그냥 새로고침
            location.reload();
        }
    });

</script>
