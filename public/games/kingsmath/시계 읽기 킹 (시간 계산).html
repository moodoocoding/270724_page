<style>
    /* 1. 기본 설정 및 전자칠판 최적화 (기존 코드 완벽 유지) */
    body {
        margin: 0; padding: 0;
        background-color: #050510;
        background-image: 
            linear-gradient(rgba(18, 16, 16, 0.8) 1px, transparent 1px),
            linear-gradient(90deg, rgba(18, 16, 16, 0.8) 1px, transparent 1px);
        background-size: 50px 50px;
        overflow: hidden; 
        font-family: 'Jua', sans-serif;
        font-weight: 500;
        touch-action: none; 
        user-select: none; 
        -webkit-user-select: none;
        overscroll-behavior: none;
        color: #fff;
    }

    a { text-decoration: none; color: inherit; cursor: pointer; }

    /* 2. 레이아웃 구조 */
    #top-area {
        position: absolute; top: 0; left: 0; width: 100%; height: 35%;
        display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
        padding-top: 20px; box-sizing: border-box;
        z-index: 10; pointer-events: none;
    }

    #game-area {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
    }

    .player-zone {
        flex: 1; position: relative;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        border-right: 2px solid rgba(0, 255, 255, 0.1);
        touch-action: none;
    }
    .player-zone:last-child { border-right: none; }

    .guide-text {
        position: absolute; bottom: 10px; width: 100%;
        text-align: center; font-size: 1.2rem; 
        color: rgba(255,255,255,1);
        pointer-events: none; z-index: 8;
        text-shadow: 0 0 5px #000;
    }

    /* 3. 네온 UI 컴포넌트 */
    .top-link {
        pointer-events: auto;
        font-size: 1.2rem;
        color: #feca57;
        margin-bottom: 10px;
        text-shadow: 0 0 10px #feca57;
        background: rgba(0,0,0,0.5);
        padding: 5px 15px;
        border-radius: 20px;
        border: 1px solid #feca57;
        animation: glowLink 2s infinite alternate;
        text-align: center;
        max-width: 90%;
    }
    @keyframes glowLink { from { box-shadow: 0 0 5px #feca57; } to { box-shadow: 0 0 15px #feca57; } }

    .mission-wrap {
        position: relative;
        padding: 6px; 
        border-radius: 20px;
        background: conic-gradient(#ff00de 0%, #333 0%);
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        pointer-events: auto;
        margin-top: 20px;
        transition: background 0.1s linear;
    }

    .mission-inner {
        display: flex; flex-direction: column; align-items: center;
        background: rgba(5, 5, 10, 0.9);
        padding: 10px 40px;
        border-radius: 16px;
        backdrop-filter: blur(5px);
    }

    #mission-label {
        font-size: 1.3rem; color: #ff9ff3; margin-bottom: 0px; letter-spacing: 2px;
    }

    #target-time {
        font-family: 'Jua', sans-serif;
        font-size: 4rem; color: #fff;
        line-height: 1.2;
        white-space: nowrap;
    }

    .timer-wrap { display: none; }

    /* 4. 플로팅 버튼 */
    .float-btn {
        position: absolute; top: 50%; transform: translateY(-50%);
        width: 60px; height: 60px;
        background: rgba(0,0,0,0.6);
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        color: white; font-size: 1.8rem;
        cursor: pointer; z-index: 500;
        display: flex; justify-content: center; align-items: center;
        backdrop-filter: blur(4px);
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        transition: all 0.2s;
        touch-action: manipulation;
    }
    .float-btn:active { transform: translateY(-50%) scale(0.9); background: rgba(255,0,222,0.3); border-color: #ff00de; }
    .float-left { left: 20px; }
    .float-right { right: 20px; }

    /* 5. 오버레이 */
    #overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(5, 5, 16, 0.95);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 100;
        backdrop-filter: blur(10px);
    }

    #ready-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: none;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 400;
        backdrop-filter: blur(5px);
    }
    .ready-title {
        font-size: 3rem; color: #ff9ff3; margin-bottom: 20px; text-shadow: 0 0 10px #ff9ff3;
        text-align: center;
        padding: 0 20px;
    }
    .ready-target-text {
        font-size: 6rem; color: #fff; margin-bottom: 40px; font-weight: bold;
        text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    .ready-count-text {
        font-size: 8rem; color: #00d2d3;
        text-shadow: 0 0 40px #00d2d3;
        animation: pulseReady 1s infinite;
    }
    @keyframes pulseReady {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.2); opacity: 0.8; }
        100% { transform: scale(1); opacity: 1; }
    }

    .logo-area { margin-bottom: 20px; text-align: center; }
    
    .neon-clock-icon {
        width: 100px; height: 100px;
        border: 4px solid #00d2d3;
        border-radius: 50%;
        position: relative;
        margin: 0 auto 15px auto;
        box-shadow: 0 0 20px #00d2d3, inset 0 0 20px #00d2d3;
        background: rgba(0,0,0,0.5);
    }
    .neon-clock-icon::after {
        content: ''; position: absolute;
        top: 15%; left: 48%; width: 4px; height: 35%;
        background: #ff00de; transform-origin: bottom center;
        animation: spinHand 4s infinite linear;
        box-shadow: 0 0 10px #ff00de;
    }
    .neon-clock-icon::before {
        content: ''; position: absolute;
        top: 30%; left: 48%; width: 6px; height: 20%;
        background: #fff; transform-origin: bottom center;
        transform: rotate(90deg);
        box-shadow: 0 0 10px #fff;
    }
    @keyframes spinHand { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .game-title {
        font-family: 'Jua', sans-serif;
        font-size: 6rem;
        color: #fff;
        text-shadow: 0 0 10px #00d2d3, 0 0 40px #00d2d3;
        margin: 0; transform: skewX(-5deg);
        font-weight: 500;
        white-space: nowrap;
        transition: font-size 0.3s ease;
    }

    /* 언어별 긴 텍스트 대응 (자동 폰트 축소 CSS 로직) */
    html[lang="ru"] .game-title, 
    html[lang="fr"] .game-title, 
    html[lang="es"] .game-title,
    html[lang="pt-br"] .game-title,
    html[lang="it"] .game-title,

    html[lang="id"] .game-title,
    html[lang="vi"] .game-title,
    html[lang="tr"] .game-title { font-size: 4.5rem; }
    .text-small #target-time { font-size: 3rem; }

    .desc-box {
        background: rgba(255, 255, 255, 0.1);
        padding: 15px 30px; border-radius: 15px;
        text-align: center; margin-bottom: 25px;
        border: 1px solid rgba(255,255,255,0.2);
        font-size: 1.3rem; line-height: 1.6;
        max-width: 80%;
    }
    .highlight { color: #ff00de; font-weight: 500; font-size: 1.4rem; }

    .btn-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .start-btn {
        background: transparent; color: #00d2d3;
        font-family: 'Jua', sans-serif;
        font-size: 1.5rem; padding: 10px 20px;
        border: 3px solid #00d2d3; border-radius: 50px;
        cursor: pointer; box-shadow: 0 0 15px #00d2d3;
        transition: all 0.2s;
        font-weight: 500;
        white-space: nowrap;
    }
    .start-btn:active, .start-btn:hover { background: #00d2d3; color: #000; box-shadow: 0 0 30px #00d2d3; }
    
    .btn-normal { color: #feca57; border-color: #feca57; box-shadow: 0 0 15px #feca57; }
    .btn-normal:active, .btn-normal:hover { background: #feca57; color: #000; box-shadow: 0 0 30px #feca57; }

    .btn-hard { color: #ff6b6b; border-color: #ff6b6b; box-shadow: 0 0 15px #ff6b6b; }
    .btn-hard:active, .btn-hard:hover { background: #ff6b6b; color: #000; box-shadow: 0 0 30px #ff6b6b; }

    .other-game-link {
        margin-top: 10px;
        padding: 10px 20px;
        background: #333; border-radius: 20px;
        color: #ddd; font-size: 1.2rem;
        border: 1px solid #555;
        transition: 0.3s;
    }
    .other-game-link:hover { background: #555; color: #fff; }

    /* 결과 피드백 */
    .count-overlay {
        position: absolute; top: 40%; left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Jua', sans-serif;
        font-size: 8rem; color: #fff;
        text-shadow: 0 0 50px #ff00de;
        z-index: 50; display: none;
        pointer-events: none;
    }
    
    .winner-badge {
        position: absolute; top: 10%; left: 50%;
        transform: translateX(-50%) scale(0);
        font-size: 5rem;
        color: #feca57;
        text-shadow: 0 0 30px #feca57, 0 0 60px #ff00de;
        z-index: 200; pointer-events: none;
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        white-space: nowrap; font-family: 'Jua', sans-serif;
        width: 100%; text-align: center;
    }

    .diff-text {
        position: absolute; bottom: 20%; width: 100%;
        text-align: center; font-size: 2.5rem; color: #fff;
        opacity: 0; transition: opacity 0.5s;
        text-shadow: 0 0 5px #000;
        pointer-events: none;
    }

    /* 다시 시작 버튼 영역 */
    #restart-area {
        position: absolute; bottom: 28%; left: 0; width: 100%;
        display: flex; flex-direction: column; 
        align-items: center; justify-content: center;
        gap: 20px;
        z-index: 300; pointer-events: none; 
    }
    
    #retry-btn {
        pointer-events: auto;
        display: none;
        background: #ff00de; color: #fff;
        font-family: 'Jua', sans-serif;
        font-size: 2rem; padding: 10px 40px;
        border: none; border-radius: 50px;
        box-shadow: 0 0 20px #ff00de;
        cursor: pointer;
        animation: pulseBtn 1.5s infinite;
        white-space: nowrap;
    }
    
    #home-btn {
        pointer-events: auto;
        display: none;
        background: rgba(0,0,0,0.6); color: #ddd;
        font-family: 'Jua', sans-serif;
        font-size: 1.2rem;
        padding: 8px 25px;
        border: 2px solid rgba(255,255,255,0.3); 
        border-radius: 30px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: all 0.2s;
        white-space: nowrap;
    }
    #home-btn:hover { background: rgba(255,255,255,0.2); color: #fff; border-color: #fff; }

    @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    /* 캔버스 레이어링 스타일 */
    canvas { 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        display: block; 
        touch-action: none; 
    }
    .static-canvas { z-index: 1; }
    .dynamic-canvas { z-index: 2; }

    /* Quantico 디지털 폰트 스타일 */
    .digital-font {
        font-family: 'Quantico', sans-serif;
        font-weight: 700;
        font-style: italic;
        color: #00ff41 !important;
        text-shadow: 
            0 0 5px rgba(0, 255, 65, 0.5),
            0 0 10px rgba(0, 255, 65, 0.5),
            0 0 20px rgba(0, 255, 65, 0.2) !important;
        letter-spacing: 4px;
        background: #0a1f0a;
        padding: 5px 25px;
        border-radius: 8px;
        border: 2px solid #004411;
        display: inline-block;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    /* --- 언어 선택기 CSS 시작 (Z-INDEX 99999 반영) --- */
    #langUIWrapper {
        font-family: 'Noto Sans KR', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

    .modal-overlay {
        opacity: 0; visibility: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
        transform: scale(0.95) translateY(-10px);
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
    .toast-anim {
        transform: translateY(100%); opacity: 0;
        transition: all 0.3s ease;
    }
    .toast-anim.show { transform: translateY(0); opacity: 1; }
    /* --- 언어 선택기 CSS 끝 --- */

</style>
</head>

    // --- 언어 감지 및 초기화 (우선순위 준수) ---
    function initI18n() {
        // 1. URL 파라미터 감지
        const urlParams = new URLSearchParams(window.location.search);
        let lang = urlParams.get('lang');

        // 2. 없으면 로컬 스토리지
        if (!lang) {
            lang = localStorage.getItem('kingsmath_lang');
        }

        // 3. 없으면 브라우저 언어
        if (!lang) {
            const navLang = navigator.language.slice(0, 2);
            if (i18n[navLang]) lang = navLang;
        }

        // 4. 지원하지 않는 언어면 기본값(en)
        if (!i18n[lang]) lang = 'en';

        // 언어 객체 찾기
        const langObj = languages.find(l => l.code === lang) || languages[1];
        
        // 언어 적용
        selectLanguage(langObj, true); 
    }

    // 모달 언어 선택 또는 초기 로드 시 처리
    function selectLanguage(lang, isInit = false) {
        currentLang = lang.code;
        
        // 1. 상단 버튼 업데이트
        currentFlagImg.src = `https://flagcdn.com/w40/${lang.country}.png`;
        currentLangSpan.textContent = lang.name;
        
        // 2. 모달 텍스트 업데이트
        const tUi = uiTranslations[lang.code] || uiTranslations['en'];
        document.getElementById('ui-title').textContent = tUi.title;
        document.getElementById('ui-desc').textContent = tUi.desc;
        document.getElementById('searchInput').placeholder = tUi.search;
        document.getElementById('ui-empty').textContent = tUi.empty;
        document.getElementById('ui-toast').textContent = tUi.toast;

        // 3. 상태 저장 및 URL 푸시 (init이 아닐때만 토스트)
        localStorage.setItem('kingsmath_lang', lang.code);
        const url = new URL(window.location);
        url.searchParams.set('lang', lang.code);
        window.history.pushState({}, '', url);
        document.documentElement.lang = lang.code;

        // 4. 게임 내 텍스트 전체 갱신
        applyGameTexts(lang.code);

        if (!isInit) {
            closeModal();
            showToast(lang.name);
            renderLanguages(searchInput.value); // 체크 아이콘 갱신
            
            // 문제 표시(진행중일때 언어변경시)
            if(gameState === 'playing' || gameState === 'ended' || document.getElementById('target-time').innerText !== '00:00') {
                displayProblem(targetMin);
            }
        }
    }

    // 모달 언어 리스트 렌더링
    function renderLanguages(filterText = '') {
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languages.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected 
                    ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                    : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;

                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start" ${dirAttr}>
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}

                btn.addEventListener('click', () => selectLanguage(lang));

    // --- 드래그/우클릭/더블클릭 방지 (전자칠판 최적화) ---
    document.addEventListener('contextmenu', event => event.preventDefault());

    // --- 오디오 시스템 (Web Audio API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx;

    function initAudio() {
        if (!actx) actx = new AudioContext();
        if (actx.state === 'suspended') actx.resume();
    }

    function playSound(type) {
        if (!actx) return;
        const now = actx.currentTime;

        if (type === 'tick') {
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'start') {
            const freqs = [523.25, 659.25, 783.99]; 
            freqs.forEach((f, i) => {
                const osc = actx.createOscillator(); const gain = actx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(f, now);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.1, now + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
                osc.connect(gain); gain.connect(actx.destination);
                osc.start(now); osc.stop(now + 1.0);
            });
        } else if (type === 'win') {
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98]; 
            notes.forEach((f, i) => {
                const osc = actx.createOscillator(); const gain = actx.createGain();
                osc.type = 'triangle'; osc.frequency.value = f;
                const startTime = now + i * 0.08;
                gain.gain.setValueAtTime(0, startTime); gain.gain.linearRampToValueAtTime(0.15, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.8);
                osc.connect(gain); gain.connect(actx.destination);
                osc.start(startTime); osc.stop(startTime + 0.8);
            });
        } else if (type === 'count') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'warning') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(880, now);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'end') {
            const osc = actx.createOscillator(); const gain = actx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(100, now + 1.0);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 1.0);
            osc.connect(gain); gain.connect(actx.destination);
            osc.start(now); osc.stop(now + 1.0);
        }
    }

    // --- 게임 변수 ---
    const TOTAL_TIME = 30;
    let gameState = 'ready'; 
    let timeLeft = TOTAL_TIME;
    let targetMin = 0; 
    let difficulty = 10; 
    let loopId;
    let lastWarnTime = -1;

    const p1 = { id: 'left', min: 0, color: '#00d2d3', lastAngle: 0, isDrag: false, winTimer: null, winCnt: 3, pointerId: null, bgCtx: null };
    const p2 = { id: 'right', min: 0, color: '#ff9ff3', lastAngle: 0, isDrag: false, winTimer: null, winCnt: 3, pointerId: null, bgCtx: null };

    window.onload = () => {
        renderLanguages();
        initI18n(); 
        initCanvas(p1, 'cvs-left', 'bg-left');
        initCanvas(p2, 'cvs-right', 'bg-right');
        window.addEventListener('resize', resizeAll);
        resizeAll();
        drawLoop();
    };

    function initCanvas(p, id, bgId) {
        p.cvs = document.getElementById(id);
        p.bgCvs = document.getElementById(bgId); 
        p.ctx = p.cvs.getContext('2d', { desynchronized: true });
        p.bgCtx = p.bgCvs.getContext('2d'); 
        
        const onDown = (e) => {
            if (gameState !== 'playing') return;
            if (!p.isDrag) {
                e.preventDefault();
                p.isDrag = true;
                p.pointerId = e.pointerId; 
                p.cvs.setPointerCapture(e.pointerId); 
                const {x, y} = getPos(e, p.cvs);
                p.lastAngle = Math.atan2(y - p.cy, x - p.cx);
                stopWinCheck(p);
            }
        };

        const onMove = (e) => {
            if (!p.isDrag || e.pointerId !== p.pointerId) return;
            e.preventDefault();
            const {x, y} = getPos(e, p.cvs);
            const angle = Math.atan2(y - p.cy, x - p.cx);
            let diff = angle - p.lastAngle;
            while (diff <= -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;

            let deltaMin = (diff / (Math.PI * 2)) * 60;
            const prevIntMin = Math.floor(p.min / 5); 

            p.min += deltaMin;
            if (p.min < 0) p.min += 720;
            if (p.min >= 720) p.min -= 720;

            if (Math.floor(p.min / 5) !== prevIntMin) { playSound('tick'); }
            p.lastAngle = angle;
        };

        const onUp = (e) => {
            if (p.isDrag && e.pointerId === p.pointerId) {
                e.preventDefault();
                p.isDrag = false; p.pointerId = null;
                p.cvs.releasePointerCapture(e.pointerId);
                if (gameState === 'playing') {
                    p.min = Math.round(p.min / difficulty) * difficulty;
                    startWinCheck(p);
                }
            }
        };

        p.cvs.addEventListener('pointerdown', onDown);
        p.cvs.addEventListener('pointermove', onMove);
        p.cvs.addEventListener('pointerup', onUp);
        p.cvs.addEventListener('pointercancel', onUp);
        p.cvs.addEventListener('pointerleave', onUp);
    }

    function getPos(e, cvs) {
        const rect = cvs.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function resizeAll() {
        [p1, p2].forEach(p => {
            const rect = p.cvs.parentElement.getBoundingClientRect();
            p.cvs.width = rect.width; p.cvs.height = rect.height;
            p.bgCvs.width = rect.width; p.bgCvs.height = rect.height;
            p.cx = rect.width / 2;
            p.cy = rect.height * 0.6; 
            p.r = Math.min(rect.width, rect.height) * 0.35;
            drawStaticClock(p);
        });
    }

    // --- 게임 로직 ---
    function startGame(diff) {
        initAudio(); playSound('start'); 
        difficulty = diff; timeLeft = TOTAL_TIME; lastWarnTime = -1;
        
        // 🌟 게임 시작 시 언어 선택 UI 숨기기
        document.getElementById('langUIWrapper').style.display = 'none';
        
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('retry-btn').style.display = 'none';
        document.getElementById('home-btn').style.display = 'none';

        resetUI();

        let maxStep = 720 / difficulty;
        targetMin = Math.floor(Math.random() * maxStep) * difficulty;
        displayProblem(targetMin);

        const problemHTML = document.getElementById('target-time').innerHTML;
        document.getElementById('ready-target-display').innerHTML = problemHTML;

        const startMin = Math.floor(Math.random() * 720);
        p1.min = startMin; p2.min = startMin;

        const readyOverlay = document.getElementById('ready-overlay');
        const countNum = document.getElementById('ready-count-num');
        readyOverlay.style.display = 'flex';
        
        let count = 3; countNum.innerText = count;
        
        const countInterval = setInterval(() => {
            count--;
            if (count > 0) {
                countNum.innerText = count; playSound('count'); 
            } else {
                clearInterval(countInterval);
                readyOverlay.style.display = 'none'; 
                playSound('start'); 
                gameState = 'playing';
                if (loopId) clearInterval(loopId);
                loopId = setInterval(gameTimer, 100);
            }
        }, 1000); 
    }

    function retryGame() { startGame(difficulty); }

    function displayProblem(minVal) {
        let h = Math.floor(minVal / 60);
        let m = minVal % 60;
        if (h === 0) h = 12;

        let text = "";
        const t = i18n[currentLang];
        
        if (Math.random() < 0.3) {
            let dH = h.toString().padStart(2, '0');
            let dM = m.toString().padStart(2, '0');
            text = `<span class="digital-font">${dH}:${dM}</span>`;
        } else {
            if (m === 0) {
                if (['ko', 'zh', 'ja', 'th', 'vi', 'id', 'hi', 'bn', 'tr'].includes(currentLang)) {
                    text = `${h}${t.oClock} ${t.exact}`;
                } else if (currentLang === 'es' || currentLang === 'pt-br' || currentLang === 'it') {
                    text = `${t.oClock}${h}${t.exact}`;
                } else {
                    text = `${h}${t.exact}`; 
                }
            } else {
                if (m >= 40 && m % 5 === 0 && Math.random() > 0.5) {
                    let nextH = h + 1;
                    if (nextH > 12) nextH = 1;
                    let mLeft = 60 - m;

                    if (currentLang === 'ko') { 
                         text = `<span style="color:#ff6b6b">${nextH}${t.oClock} ${mLeft}${t.before}</span>`;
                    } else if (['zh', 'ru'].includes(currentLang)) {
                         text = `<span style="color:#ff6b6b">${t.before}${mLeft}${t.min} ${nextH}${t.oClock}</span>`;
                    } else if (currentLang === 'ja') { 
                         text = `<span style="color:#ff6b6b">${nextH}${t.oClock}${mLeft}${t.before}</span>`;
                    } else if (currentLang === 'en') { 
                         text = `<span style="color:#ff6b6b">${mLeft}${t.before}${nextH}</span>`;
                    } else if (['es', 'pt-br', 'it'].includes(currentLang)) { 
                         text = `<span style="color:#ff6b6b">${t.oClock}${nextH}${t.before}${mLeft}</span>`;
                    } else if (currentLang === 'fr' || currentLang === 'de') { 
                         text = `<span style="color:#ff6b6b">${nextH}${t.oClock}${t.before}${mLeft}</span>`;
                    } else {
                         text = `<span style="color:#ff6b6b">${mLeft}${t.before}${nextH}</span>`;
                    }
                } else {
                    if (['ko', 'zh', 'ja'].includes(currentLang)) {
                        text = `${h}${t.oClock} ${m}${t.min}`;
                    } else if (currentLang === 'es' || currentLang === 'pt-br' || currentLang === 'it') {
                         text = `${t.oClock}${h} y ${m}`;
                    } else if (currentLang === 'fr') {
                         text = `${h}h${m.toString().padStart(2,'0')}`;
                    } else {
                         text = `${h}:${m.toString().padStart(2,'0')}`;
                    }
                }
            }
        }
        document.getElementById('target-time').innerHTML = text;
    }

    function gameTimer() {
        timeLeft -= 0.1;
        if (timeLeft < 0) timeLeft = 0;

        const percentage = (timeLeft / TOTAL_TIME) * 100;
        document.getElementById('mission-bg').style.background = 
            `conic-gradient(#ff00de ${percentage}%, #333 ${percentage}%)`;

        if (timeLeft <= 5.0 && timeLeft > 0) {
            const intTime = Math.ceil(timeLeft);
            if (intTime !== lastWarnTime) {
                playSound('warning'); lastWarnTime = intTime;
            }
        }
        if (timeLeft <= 0) endGame(null);
    }

    function startWinCheck(p) {
        let t = targetMin % 720;
        let c = Math.round(p.min) % 720;
        
        let diff = Math.abs(t - c);
        if (diff === 0) {
            p.winCnt = 3;
            const cntEl = document.getElementById(p.id === 'left' ? 'cnt-left' : 'cnt-right');
            cntEl.style.display = 'block'; cntEl.innerText = "3";
            playSound('count');
            cntEl.style.animation = 'none'; cntEl.offsetHeight; 
            cntEl.style.animation = 'pulse 1s infinite';

            p.winTimer = setInterval(() => {
                p.winCnt--;
                if (p.winCnt > 0) {
                    cntEl.innerText = p.winCnt; playSound('count');
                } else {
                    cntEl.innerText = i18n[currentLang].correct; endGame(p);
                }
            }, 1000);
        }
    }

    function stopWinCheck(p) {
        if (p.winTimer) {
            clearInterval(p.winTimer); p.winTimer = null;
            document.getElementById(p.id === 'left' ? 'cnt-left' : 'cnt-right').style.display = 'none';
        }
    }

    function endGame(winner) {
        clearInterval(loopId);
        gameState = 'ended';
        stopWinCheck(p1); stopWinCheck(p2);

        const t = i18n[currentLang];

        const retryBtn = document.getElementById('retry-btn');
        retryBtn.innerText = t.retryBtn.replace('{n}', difficulty);
        retryBtn.style.display = 'block';

        document.getElementById('home-btn').innerText = t.homeBtn;
        document.getElementById('home-btn').style.display = 'block';

        if (winner) {
            playSound('win');
            const badge = document.getElementById(winner.id === 'left' ? 'badge-left' : 'badge-right');
            badge.innerText = t.winBadge;
            badge.style.transform = 'translateX(-50%) scale(1)';
        } else {
            playSound('end');
            let tMin = targetMin % 720;
            let m1 = Math.round(p1.min) % 720; let m2 = Math.round(p2.min) % 720;
            let d1 = Math.abs(tMin - m1); if(d1 > 360) d1 = 720 - d1;
            let d2 = Math.abs(tMin - m2); if(d2 > 360) d2 = 720 - d2;

            showDiff(d1, d2);

            const badgeL = document.getElementById('badge-left');
            const badgeR = document.getElementById('badge-right');

            if (d1 < d2) {
                badgeL.innerText = t.winBadge; badgeL.style.transform = 'translateX(-50%) scale(1)';
            } else if (d2 < d1) {
                badgeR.innerText = t.winBadge; badgeR.style.transform = 'translateX(-50%) scale(1)';
            } else {
                badgeL.innerText = t.draw; badgeR.innerText = t.draw;
                badgeL.style.transform = 'translateX(-50%) scale(1)';
                badgeR.style.transform = 'translateX(-50%) scale(1)';
            }
        }
    }

    function showDiff(d1, d2) {
        const t = i18n[currentLang];
        const leftDiff = document.getElementById('diff-left');
        const rightDiff = document.getElementById('diff-right');

        leftDiff.innerText = `${t.error}: ${d1}${t.min}`; leftDiff.style.opacity = 1;
        rightDiff.innerText = `${t.error}: ${d2}${t.min}`; rightDiff.style.opacity = 1;

        if (d1 === 0) { leftDiff.style.color = '#00ff00'; leftDiff.style.textShadow = '0 0 10px #00ff00'; }
        else { leftDiff.style.color = '#fff'; leftDiff.style.textShadow = '0 0 5px #000'; }

        if (d2 === 0) { rightDiff.style.color = '#00ff00'; rightDiff.style.textShadow = '0 0 10px #00ff00'; }
        else { rightDiff.style.color = '#fff'; rightDiff.style.textShadow = '0 0 5px #000'; }
    }

    function resetToTitle() {
        if (loopId) clearInterval(loopId);
        gameState = 'ready';
        stopWinCheck(p1); stopWinCheck(p2);
        
        // 🌟 메인 화면 복귀 시 언어 선택 UI 다시 표시
        document.getElementById('langUIWrapper').style.display = 'block';

        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('ready-overlay').style.display = 'none';
        document.getElementById('retry-btn').style.display = 'none';
        document.getElementById('home-btn').style.display = 'none';

        resetUI();
    }

    function resetUI() {
        document.getElementById('badge-left').style.transform = 'translateX(-50%) scale(0)';
        document.getElementById('badge-right').style.transform = 'translateX(-50%) scale(0)';
        document.getElementById('cnt-left').style.display = 'none';
        document.getElementById('cnt-right').style.display = 'none';
        document.getElementById('diff-left').style.opacity = 0;
        document.getElementById('diff-right').style.opacity = 0;
        document.getElementById('mission-bg').style.background = 'conic-gradient(#ff00de 100%, #333 100%)';
        document.getElementById('diff-left').style.color = '#fff';
        document.getElementById('diff-right').style.color = '#fff';
    }

    // --- 렌더링 ---
    function drawLoop() {
        drawClockHands(p1); drawClockHands(p2);
        requestAnimationFrame(drawLoop);
    }

    function drawStaticClock(p) {
        const ctx = p.bgCtx;
        if (!ctx) return;
        const r = p.r; const cx = p.cx; const cy = p.cy;

        ctx.clearRect(0, 0, p.bgCvs.width, p.bgCvs.height);

        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(30, 30, 40, 0.8)'; ctx.fill();

        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.strokeStyle = p.color; ctx.lineWidth = 5;
        ctx.shadowBlur = 20; ctx.shadowColor = p.color; ctx.stroke();
        ctx.shadowBlur = 0;

        for (let i=0; i<60; i++) {
            let ang = (i*6 - 90) * Math.PI/180;
            let isHour = (i%5 === 0);
            let len = isHour ? 15 : 5;
            let x1 = cx + Math.cos(ang)*(r-10); let y1 = cy + Math.sin(ang)*(r-10);
            let x2 = cx + Math.cos(ang)*(r-10-len); let y2 = cy + Math.sin(ang)*(r-10-len);
            
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
            ctx.lineWidth = isHour ? 3 : 1; ctx.strokeStyle = '#fff'; ctx.stroke();
        }

        ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
        ctx.font = `normal ${r*0.15}px 'Jua'`; 
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for(let i=1; i<=12; i++) {
            let ang = (i*30 - 90) * Math.PI/180; let dist = r - 45;
            ctx.fillText(i, cx + Math.cos(ang)*dist, cy + Math.sin(ang)*dist);
        }
    }

    function drawClockHands(p) {
        const ctx = p.ctx;
        if (!ctx) return;
        const r = p.r; const cx = p.cx; const cy = p.cy;

        ctx.clearRect(0, 0, p.cvs.width, p.cvs.height);

        let m = p.min; let h = m / 60;
        let mAng = (m * 6 - 90) * Math.PI/180; let hAng = (h * 30 - 90) * Math.PI/180;

        ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(hAng)*(r*0.5), cy + Math.sin(hAng)*(r*0.5));
        ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.lineCap = 'round'; ctx.stroke();

        ctx.shadowBlur = 20; ctx.shadowColor = p.color;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(mAng)*(r*0.85), cy + Math.sin(mAng)*(r*0.85));
        ctx.lineWidth = 6; ctx.strokeStyle = p.color; ctx.lineCap = 'round'; ctx.stroke();

        ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI*2);
        ctx.fillStyle = '#fff'; ctx.fill();

        if(p.isDrag) {
            ctx.beginPath(); ctx.arc(cx, cy, r*1.1, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.stroke();
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(e=>{});
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    document.addEventListener('click', initAudio);
    document.addEventListener('touchstart', initAudio);

    const styleSheet = document.createElement("style");
    styleSheet.innerText = `
        @keyframes pulse { 
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1;} 
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8;} 
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1;} 
        }
    `;
    document.head.appendChild(styleSheet);
</script>
