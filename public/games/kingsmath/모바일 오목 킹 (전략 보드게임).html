<!DOCTYPE html>
<html lang="ko">
<head>
   
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gomoku King 오목킹 </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme Colors - Inherited from King Series */
            --bg-color: #1a1a1a;
            --wood-dark: #2e2017;
            --wood-light: #dca357; /* 오목판 색상 */
            --gold: #c5a059;
            --gold-light: #e5c07b;
            --gold-dark: #8c6a28;
            --text-color: #f0f0f0;
            --line-color: #000000;
        }

        * { box-sizing: border-box; }
        
        /* [수정 2] 모바일 확대/축소/드래그 방지 최적화 */
        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 스크롤 방지 */
            
            /* 핵심: 모든 터치 제스처(확대, 팬, 스크롤) 차단 */
            touch-action: none; 
            /* iOS 사파리 스크롤 팅김(Rubber band) 방지 */
            overscroll-behavior: none;
            /* 텍스트 크기 자동 조정 방지 */
            -webkit-text-size-adjust: 100%;
        }

        /* --- Intro Screen --- */
        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2b1d0e 0%, #1a1108 60%, #050301 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease-in-out;
            text-align: center;
        }

        #intro-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(45deg, rgba(255, 255, 255, 0.03) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.03) 75%, rgba(255, 255, 255, 0.03));
            background-size: 60px 60px;
            opacity: 0.5;
            pointer-events: none;
        }

        .brand-links { 
            position: relative; margin-bottom: 3vh; font-size: 1rem; letter-spacing: 2px; font-weight: 300; opacity: 0.7; z-index: 2; 
        }
        .brand-links a { color: #aaa; text-decoration: none; margin: 0 10px; transition: color 0.3s; }
        .brand-links a:hover { color: var(--gold); }

        .title-wrapper {
            position: relative; z-index: 2; margin-bottom: 2vh; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .title-wrapper::before, .title-wrapper::after {
            content: ''; display: block; width: 60px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 15px auto;
        }

        .title-main {
            font-family: 'Georgia', serif;
            font-size: clamp(3rem, 9vw, 5.5rem);
            font-weight: 900;
            line-height: 1;
            margin: 0;
            background: linear-gradient(to bottom, #fff5d1, #c5a059, #8c6a28);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.8));
            letter-spacing: 3px;
        }

        .title-korean {
            font-family: 'Nanum Myeongjo', serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 800;
            color: #e5c07b;
            margin: 10px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            letter-spacing: 10px;
        }

        .title-sub {
            font-family: 'Georgia', serif;
            font-size: clamp(1rem, 3.5vw, 1.8rem);
            color: #8c6a28;
            text-transform: uppercase;
            letter-spacing: clamp(4px, 1.5vw, 10px);
            margin-top: 5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* QR Code & Buttons */
        #qr-container {
            position: relative; z-index: 2; margin-bottom: 5vh; background: #fff;
            padding: 8px; border: 1px solid var(--gold);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.15); cursor: pointer; transition: all 0.3s ease;
        }
        #qr-image { width: 100px; height: 100px; display: block; }
        #qr-container.qr-fullscreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 500; border: none;
            display: flex; justify-content: center; align-items: center;
        }
        #qr-container.qr-fullscreen #qr-image { width: min(80vw, 80vh); height: min(80vw, 80vh); border: 4px solid #fff; }

        /* 버튼도 터치 액션 허용 (body에서 막았으므로 필요한 곳은 auto로 풀어줌) */
        .btn-start, .undo-btn, #home-btn, .more-games a, #qr-container {
            touch-action: manipulation;
        }

        .btn-start {
            position: relative; z-index: 2; padding: 16px 50px;
            font-size: 1.3rem; font-family: 'Georgia', serif; font-weight: bold;
            background: linear-gradient(180deg, #2b2b2b, #1a1a1a);
            color: var(--gold); border: 1px solid var(--gold);
            box-shadow: 0 0 10px rgba(0,0,0,0.5); cursor: pointer;
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5vh;
        }
        .btn-start:hover { background: var(--gold); color: #1a1a1a; box-shadow: 0 0 20px var(--gold); }
        .btn-start:active { transform: scale(0.98); }

        .more-games { position: relative; z-index: 2; }
        .more-games a {
            color: #888; text-decoration: none; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px; padding: 8px 16px;
            border: 1px solid #444; border-radius: 4px; background: rgba(0,0,0,0.3);
            transition: all 0.3s; letter-spacing: 1px;
        }
        .more-games a:hover { color: var(--gold); border-color: var(--gold); }

        /* --- Game UI --- */
        #home-btn {
            position: absolute; top: 20px; left: 20px; z-index: 200;
            background: rgba(0, 0, 0, 0.6); border: 2px solid var(--gold);
            color: var(--gold); font-size: 1.5rem; width: 50px; height: 50px;
            border-radius: 50%; display: none; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center center;
        }
        #home-btn:hover { background: var(--gold); color: #000; transform: scale(1.1); }
        
        .home-btn-large {
            transform: scale(2.0) !important;
            background: var(--gold) !important;
            color: #1a1a1a !important;
            box-shadow: 0 0 30px var(--gold);
            border-width: 4px !important;
        }

        #game-area {
            display: flex; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity 1s;
        }

        .player-zone {
            display: flex; align-items: center; justify-content: center;
            position: relative; padding: 10px; gap: 15px; border: 2px solid transparent;
        }

        .turn-indicator {
            padding: 20px 40px; 
            border-radius: 16px; 
            background: #222;
            color: #666; border: 1px solid #444; font-weight: bold;
            letter-spacing: 1px; transition: all 0.3s;
            display: flex; align-items: center; 
            gap: 20px;
            font-size: 2.2rem;
            box-shadow: inset 0 0 5px #000; z-index: 20; white-space: nowrap;
            visibility: visible; 
        }
        
        .active-turn { 
            color: #2b1d0e; border-color: #fff;
            background: linear-gradient(270deg, var(--gold), var(--gold-light), var(--gold));
            background-size: 200% 200%; animation: shine 3s ease infinite;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.6);
            transform: scale(1.05); 
        }
        @keyframes shine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .stone-icon { width: 32px; height: 32px; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .stone-icon.black { background: radial-gradient(circle at 30% 30%, #555, #000); }
        .stone-icon.white { background: radial-gradient(circle at 30% 30%, #fff, #ddd); border: 1px solid #ccc; }

        .timer-display {
            font-family: 'Courier New', monospace; 
            font-size: 2.8rem;
            font-weight: bold;
            color: inherit; border-left: 3px solid rgba(0,0,0,0.2); padding-left: 20px;
            min-width: 80px; text-align: center;
        }

        .undo-btn {
            background: none; border: none; 
            font-size: 3rem; 
            cursor: pointer;
            margin-left: 20px; padding: 0; line-height: 1; transition: all 0.3s;
        }
        .undo-active { color: #3b82f6; opacity: 1; pointer-events: auto; filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.5)); }
        .undo-disabled { color: #444; opacity: 0.3; pointer-events: none; filter: grayscale(100%); }

        /* --- The Board (15x15) --- */
        #board-container {
            background-color: #5d4037;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjNWQ0MDM3Ii8+CjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjIiIGZpbGw9IiM2ZDQ5MzkiLz4KPC9zdmc+');
            padding: 15px;
            border: 4px solid #281a14;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            flex-shrink: 0;
            transition: all 0.5s ease;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            width: 100%;
            height: 100%;
            background-color: var(--wood-light);
            background-image: none; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            border: 2px solid #000; 
            cursor: pointer;
            touch-action: none; /* 보드 내에서도 터치 액션 차단 */
        }

        .intersection {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .intersection::before { /* 가로선 */
            content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; 
            background: var(--line-color); transform: translateY(-50%); z-index: 1;
        }
        .intersection::after { /* 세로선 */
            content: ''; position: absolute; left: 50%; top: 0; height: 100%; width: 1px; 
            background: var(--line-color); transform: translateX(-50%); z-index: 1;
        }
        
        .hwajeom-dot {
            width: 18%; height: 18%; background: #000;
            border-radius: 50%; position: absolute; 
            z-index: 2;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 1px 1px rgba(255,255,255,0.2);
        }

        /* --- Stones --- */
        .stone {
            width: 85%; height: 85%;
            border-radius: 50%;
            position: absolute;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            transform: scale(0);
            animation: place-stone 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 5;
        }
        @keyframes place-stone { to { transform: scale(1); } }

        .stone.black {
            background: radial-gradient(circle at 35% 35%, #666, #000);
        }
        .stone.white {
            background: radial-gradient(circle at 35% 35%, #fff, #ccc 40%, #999 90%);
        }

        /* Last Move Marker */
        .last-move-marker {
            width: 20%; height: 20%;
            background-color: #ef4444; /* Red */
            border-radius: 50%;
            position: absolute;
            z-index: 10;
            box-shadow: 0 0 4px rgba(255,0,0,0.8);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .winning-marker {
            width: 30%; height: 30%;
            background-color: #ff0000; /* Bright Red */
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            z-index: 15;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ff0000;
            animation: pulse-dot 1s infinite alternate;
        }
        @keyframes pulse-dot { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.3); } }


        /* --- Orientation Logic --- */
        @media (orientation: portrait) {
            #game-area { flex-direction: column; justify-content: center; align-items: center; }
            .player-zone { width: 100%; height: 20vh; flex-direction: column; }
            .player-top { transform: rotate(180deg); }
            
            #board-container {
                width: 95vw; height: 95vw;
                max-width: 65vh; max-height: 65vh;
            }

            .turn-indicator {
                width: min(76vw, 52vh);
                padding: 10px 0;
                font-size: clamp(1.4rem, 4vw, 2rem);
                justify-content: center;
                gap: 10px;
            }
            .stone-icon { width: clamp(20px, 4vw, 30px); height: clamp(20px, 4vw, 30px); }
            .timer-display { font-size: 1.2em; min-width: 50px; padding-left: 10px; border-left-width: 2px; }
            .undo-btn { font-size: 1.4em; margin-left: 10px; }
        }

        @media (orientation: landscape) {
            #game-area { flex-direction: row; justify-content: center; align-items: center; gap: 20px; }
            .player-zone { width: 25vw; height: 100vh; flex-direction: row; }
            
            #board-container { height: 90vh; width: 90vh; order: 2; transform: rotate(0deg); }
            
            #zone-black { 
                order: 1; justify-content: flex-end; padding-right: 20px;
            }
            #zone-black .turn-indicator, 
            #zone-black .win-message, 
            #zone-black .lose-message { transform: rotate(90deg); }

            #zone-white { 
                order: 3; justify-content: flex-start; padding-left: 20px;
            }
            #zone-white .turn-indicator, 
            #zone-white .win-message, 
            #zone-white .lose-message { transform: rotate(-90deg); }
        }

        .win-message, .lose-message {
            position: absolute; font-family: 'Georgia', serif; font-weight: 900;
            font-size: 4rem; 
            z-index: 100; pointer-events: none; animation: pulse-win 1.5s infinite;
            white-space: nowrap;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0 0 20px rgba(0,0,0,0.5);
        }

        .win-message { color: var(--gold); }
        .lose-message { color: #888; }

        @keyframes pulse-win {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        #restart-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); 
            display: none !important; 
            justify-content: center; align-items: center; z-index: 200;
        }

    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="brand-links">
            <a href="http://킹수학.com" target="_blank">킹수학.com</a>
            <span style="color:#555">|</span>
            <a href="/" target="_blank">KingsMath.com</a>
        </div>
        
        <div class="title-wrapper">
            <h1 class="title-main">GOMOKU KING</h1>
            <div class="title-korean">오 목 킹</div>
            <div class="title-sub">Mobile</div>
        </div>
        
        <div id="qr-container" onclick="toggleQr()" title="Click to enlarge">
            <img id="qr-image" src="" alt="QR Code" />
        </div>

        <button class="btn-start" onclick="startGameSequence()">Game Start</button>
        
        <div class="more-games">
            <a href="/" target="_self">
                <i class="fas fa-gamepad"></i> MORE MATH GAMES
            </a>
        </div>
    </div>

    <button id="home-btn" onclick="location.reload()" title="Home">
        <i class="fas fa-home"></i>
    </button>

    <div id="game-area">
        <div id="zone-black" class="player-zone player-top">
            <div id="indicator-black" class="turn-indicator">
                <div class="stone-icon black"></div> BLACK 
                <span id="timer-black" class="timer-display">30</span>
                <button id="undo-btn-black" class="undo-btn undo-disabled" onclick="undoLastMove('black')">↩️</button>
            </div>
        </div>

        <div id="board-container">
            <div id="board">
                </div>
        </div>

        <div id="zone-white" class="player-zone player-bottom">
            <div id="indicator-white" class="turn-indicator">
                <div class="stone-icon white"></div> WHITE 
                <span id="timer-white" class="timer-display">30</span>
                <button id="undo-btn-white" class="undo-btn undo-disabled" onclick="undoLastMove('white')">↩️</button>
            </div>
        </div>
    </div>

    <div id="restart-overlay">
        <button id="restart-btn" onclick="resetGame()">RESTART</button>
    </div>

<script>
    // [수정 2] 스마트폰 최적화: 제스처 차단
    // 핀치 줌(두 손가락 확대) 방지
    document.addEventListener('touchmove', function(e) {
        if (e.scale !== 1) { 
            e.preventDefault(); 
        }
    }, { passive: false });

    // 더블 탭 확대 방지
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            e.preventDefault();
        }
        lastTouchEnd = now;
    }, false);


    // --- Utils & Audio ---
    window.onload = function() {
        const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(window.location.href);
        document.getElementById('qr-image').src = qrUrl;
    };
    function toggleQr() { document.getElementById('qr-container').classList.toggle('qr-fullscreen'); }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'stone') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gainNode.gain.setValueAtTime(0.5, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now+0.1);
            osc.frequency.setValueAtTime(783.99, now+0.2); osc.frequency.setValueAtTime(1046.50, now+0.3);
            gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 3);
            osc.start(now); osc.stop(now + 3);
        } else if (type === 'timeout') {
             osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
             osc.frequency.linearRampToValueAtTime(100, now + 0.5);
             gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
             osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'warning') {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
            gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'tick') { 
            osc.type = 'square'; osc.frequency.setValueAtTime(1200, now);
            gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'start') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
        }
    }

    // --- Game Logic ---
    const BOARD_SIZE = 15;
    let board = [];
    let turn = 1; // 1: Black, 2: White
    let isGameOver = false;
    let timerValue = 30;
    let timerInterval = null;
    let historyStack = [];
    
    let canUndo = false; 
    
    // UI Elements
    const boardEl = document.getElementById('board');
    const introEl = document.getElementById('intro-screen');
    const gameAreaEl = document.getElementById('game-area');
    const timerWhiteEl = document.getElementById('timer-white');
    const timerBlackEl = document.getElementById('timer-black');
    const homeBtn = document.getElementById('home-btn');

    const hwajeomPoints = [
        {r: 3, c: 3}, {r: 3, c: 11}, 
        {r: 7, c: 7}, 
        {r: 11, c: 3}, {r: 11, c: 11}
    ];

    function initGame(startingTurn = 1) {
        board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        turn = startingTurn;
        isGameOver = false;
        historyStack = [];
        
        canUndo = false;
        
        document.querySelectorAll('.win-message, .lose-message').forEach(el => el.remove());
        
        homeBtn.classList.remove('home-btn-large');
        document.getElementById('indicator-black').style.visibility = 'visible';
        document.getElementById('indicator-white').style.visibility = 'visible';
        
        renderBoard();
        updateTurnIndicators();
        updateUndoUI();
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'intersection';
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.onclick = () => handleInput(r, c);

                if (hwajeomPoints.some(p => p.r === r && p.c === c)) {
                    const dot = document.createElement('div');
                    dot.className = 'hwajeom-dot';
                    cell.appendChild(dot);
                }

                if (board[r][c] !== 0) {
                    const stone = document.createElement('div');
                    stone.className = `stone ${board[r][c] === 1 ? 'black' : 'white'}`;
                    
                    if (historyStack.length > 0) {
                        const last = historyStack[historyStack.length - 1];
                        if (last.r === r && last.c === c) {
                            const marker = document.createElement('div');
                            marker.className = 'last-move-marker';
                            stone.appendChild(marker);
                        }
                    }
                    cell.appendChild(stone);
                }
                boardEl.appendChild(cell);
            }
        }
    }

    function startGameSequence() {
        introEl.style.opacity = '0';
        introEl.style.pointerEvents = 'none';

        if(board.length === 0) {
             board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        }
        renderBoard(); 

        setTimeout(() => {
            introEl.style.display = 'none';
            homeBtn.style.display = 'flex';
            gameAreaEl.style.opacity = '1';
            gameAreaEl.style.pointerEvents = 'auto';
            
            startFirstPlayerRoulette();
        }, 800);
    }

  function startFirstPlayerRoulette() {
        const bInd = document.getElementById('indicator-black');
        const wInd = document.getElementById('indicator-white');
        
        let count = 0;
        let speed = 50;
        let rouletteTurn = 1; 
        
        // 추가된 부분: 50% 확률로 20번 또는 21번 룰렛이 돌도록 설정
        const maxCount = 20 + Math.floor(Math.random() * 2);
        
        bInd.classList.remove('active-turn');
        wInd.classList.remove('active-turn');
        
        function step() {
            playSound('tick'); 
            
            if (rouletteTurn === 1) {
                bInd.classList.add('active-turn');
                wInd.classList.remove('active-turn');
                rouletteTurn = 2;
            } else {
                wInd.classList.add('active-turn');
                bInd.classList.remove('active-turn');
                rouletteTurn = 1;
            }
            
            count++;
            
            // 기존 고정값 20을 maxCount로 변경
            if (count < maxCount) {
                setTimeout(step, speed);
                if (count > 10) speed += 30; 
            } else {
                const winner = rouletteTurn === 1 ? 2 : 1; 
                
                setTimeout(() => {
                    playSound('start');
                    initGame(winner);
                    startTimer();
                }, 500);
            }
        }
        
        step();
    }
    function handleInput(r, c) {
        if (isGameOver || board[r][c] !== 0) return;

        historyStack.push({
            r: r, c: c,
            boardSnapshot: JSON.parse(JSON.stringify(board)),
            prevTurn: turn,
            timerSnapshot: timerValue
        });

        board[r][c] = turn;
        playSound('stone');

        canUndo = true;

        const winResult = checkWin(r, c, turn);
        if (winResult.won) {
            renderBoard();
            highlightWinningStones(winResult.stones);
            endGame(turn);
            return;
        }

        turn = turn === 1 ? 2 : 1;
        renderBoard();
        updateTurnIndicators();
        updateUndoUI(); 
        startTimer();
    }

    function highlightWinningStones(stones) {
        stones.forEach(pos => {
            const cell = document.querySelector(`.intersection[data-r="${pos.r}"][data-c="${pos.c}"]`);
            if (cell) {
                const stone = cell.querySelector('.stone');
                if (stone) {
                    const marker = document.createElement('div');
                    marker.className = 'winning-marker'; 
                    stone.appendChild(marker);
                }
            }
        });
    }

    function checkWin(r, c, player) {
        const directions = [
            {dr: 0, dc: 1},  // Horizontal
            {dr: 1, dc: 0},  // Vertical
            {dr: 1, dc: 1},  // Diagonal \
            {dr: 1, dc: -1}  // Diagonal /
        ];

        for (let d of directions) {
            let stones = [{r: r, c: c}];
            
            // 정방향
            let nr = r + d.dr;
            let nc = c + d.dc;
            while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                stones.push({r: nr, c: nc});
                nr += d.dr;
                nc += d.dc;
            }
            
            // 역방향
            nr = r - d.dr;
            nc = c - d.dc;
            while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                stones.push({r: nr, c: nc});
                nr -= d.dr;
                nc -= d.dc;
            }

            // [수정 1] 6목, 7목 이상도 승리 인정 (=== 5 -> >= 5)
            if (stones.length >= 5) return { won: true, stones: stones };
        }
        return { won: false, stones: [] };
    }

    function endGame(winner) {
        isGameOver = true;
        stopTimer();
        playSound('win');
        
        const winnerZoneId = winner === 1 ? 'zone-black' : 'zone-white';
        const loserZoneId = winner === 1 ? 'zone-white' : 'zone-black';
        
        document.getElementById('indicator-black').style.visibility = 'hidden';
        document.getElementById('indicator-white').style.visibility = 'hidden';

        const winDiv = document.createElement('div');
        winDiv.className = 'win-message';
        winDiv.innerText = "WIN";
        document.getElementById(winnerZoneId).appendChild(winDiv);
        
        const loseDiv = document.createElement('div');
        loseDiv.className = 'lose-message';
        loseDiv.innerText = "LOSE";
        document.getElementById(loserZoneId).appendChild(loseDiv);
        
        homeBtn.classList.add('home-btn-large');
    }

    function resetGame() {
        stopTimer();
        startFirstPlayerRoulette();
    }

    // --- Timer Logic ---
    function startTimer() {
        clearInterval(timerInterval);
        timerValue = 30;
        updateTimerUI();
        
        timerInterval = setInterval(() => {
            timerValue--;
            updateTimerUI();
            if (timerValue <= 5 && timerValue > 0) playSound('warning');
            if (timerValue === 0) {
                clearInterval(timerInterval);
                playSound('timeout');
                turn = turn === 1 ? 2 : 1;
                updateTurnIndicators();
                startTimer();
            }
        }, 1000);
    }

    function stopTimer() { clearInterval(timerInterval); }

    function updateTimerUI() {
        if (turn === 1) { // Black
            timerBlackEl.innerText = timerValue;
            timerWhiteEl.innerText = 30;
        } else { // White
            timerWhiteEl.innerText = timerValue;
            timerBlackEl.innerText = 30;
        }
    }

    function updateTurnIndicators() {
        const bInd = document.getElementById('indicator-black');
        const wInd = document.getElementById('indicator-white');
        
        if (turn === 1) {
            bInd.classList.add('active-turn');
            wInd.classList.remove('active-turn');
        } else {
            wInd.classList.add('active-turn');
            bInd.classList.remove('active-turn');
        }
    }

    function undoLastMove(requester) {
        if (!canUndo) return;
        if (historyStack.length === 0 || isGameOver) return;

        const lastAction = historyStack.pop();
        board[lastAction.r][lastAction.c] = 0;
        turn = lastAction.prevTurn;
        
        canUndo = false;

        startTimer();
        renderBoard();
        updateTurnIndicators();
        updateUndoUI();
    }

    function updateUndoUI() {
        const btnBlack = document.getElementById('undo-btn-black');
        const btnWhite = document.getElementById('undo-btn-white');
        const hasHistory = historyStack.length > 0;

        if (hasHistory && canUndo) {
            btnBlack.classList.remove('undo-disabled');
            btnBlack.classList.add('undo-active');
            
            btnWhite.classList.remove('undo-disabled');
            btnWhite.classList.add('undo-active');
        } else {
            btnBlack.classList.remove('undo-active');
            btnBlack.classList.add('undo-disabled');
            
            btnWhite.classList.remove('undo-active');
            btnWhite.classList.add('undo-disabled');
        }
    }
</script>
