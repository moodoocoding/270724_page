        body {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 전자칠판용 다크모드 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #1f2937; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        /* 학생 및 투표 버튼 애니메이션 및 터치 효과 */
        .btn-press { transition: all 0.1s ease-in-out; }
        .btn-press:active { transform: scale(0.95); }
        
        /* 선택된 학생의 반짝이는 효과 */
        .selected-glow {
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
            border-color: #facc15 !important;
        }

        /* ========================================================

           ======================================================== */

        #langModal i, #langTriggerBtn i, #btn-home, #toastNotification i { font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands", sans-serif !important; }

        #langModal-container .modal-overlay.active { opacity: 1; visibility: visible; }
        #langModal-container .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #langModal-container .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
        
        #toastNotification { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        #toastNotification.show { transform: translateY(0); opacity: 1; }

        .floating-btn {
            position: fixed; top: 80px; right: 24px; z-index: 99998;

        const languageList = [
            { code: 'ko', country: 'kr', name: '한국어', enName: 'Korean' },
            { code: 'en', country: 'us', name: 'English', enName: 'English' },
            { code: 'zh', country: 'cn', name: '中文 (简体)', enName: 'Chinese (Simplified)' },
            { code: 'ja', country: 'jp', name: '日本語', enName: 'Japanese' },
            { code: 'es', country: 'es', name: 'Español', enName: 'Spanish' },
            { code: 'fr', country: 'fr', name: 'Français', enName: 'French' },
            { code: 'de', country: 'de', name: 'Deutsch', enName: 'German' },
            { code: 'it', country: 'it', name: 'Italiano', enName: 'Italian' },
            { code: 'pt-br', country: 'br', name: 'Português', enName: 'Portuguese (Brazil)' },
            { code: 'ru', country: 'ru', name: 'Русский', enName: 'Russian' },
            { code: 'hi', country: 'in', name: 'हिन्दी', enName: 'Hindi' },
            { code: 'bn', country: 'bd', name: 'বাংলা', enName: 'Bengali' },
            { code: 'id', country: 'id', name: 'Bahasa Indonesia', enName: 'Indonesian' },
            { code: 'vi', country: 'vn', name: 'Tiếng Việt', enName: 'Vietnamese' },
            { code: 'th', country: 'th', name: 'ไทย', enName: 'Thai' },
            { code: 'tr', country: 'tr', name: 'Türkçe', enName: 'Turkish' }
        ];

        let currentLang = 'ko'; // 기본값 세팅용 변수

        // 1. 언어 감지 로직 (URL -> LocalStorage -> Browser -> Default)
        function detectLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            const savedLang = localStorage.getItem('kingsmath_lang');
            const browserLang = navigator.language.slice(0, 2).toLowerCase();
            const browserLangMatch = languageList.find(l => l.code === browserLang) ? browserLang : null;

            if (urlLang && translations[urlLang]) return urlLang;
            if (savedLang && translations[savedLang]) return savedLang;
            if (browserLangMatch) return browserLangMatch;
            return 'en';
        }

        // 2. 텍스트/UI 번역 적용 함수
        function applyTranslations(lang) {
            const data = translations[lang];
            
            // 모든 data-i18n 태그 텍스트 교체
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (data[key]) el.innerHTML = data[key]; // HTML 태그(strong 등) 유지를 위해 innerHTML
            });

            // 플레이스홀더 교체 (추가 UI가 있다면)
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (data[key]) el.placeholder = data[key];
            });

            // SEO 적용
            if(data.title) {
                document.title = data.title;
                document.getElementById('seo-title').innerText = data.title;
            }
            if(data.seo_desc) document.getElementById('seo-desc').content = data.seo_desc;

            // 버튼 동적 폰트 스케일링 (버튼 텍스트가 넘치면 폰트 축소)
            setTimeout(() => {
                document.querySelectorAll('.dynamic-text').forEach(el => {
                    let fontSize = parseInt(window.getComputedStyle(el).fontSize);
                    while (el.scrollWidth > el.clientWidth && fontSize > 10) {
                        fontSize--;
                        el.style.fontSize = fontSize + 'px';
                    }
                });
            }, 50);
        }

        // 3. 언어 변경 실행 함수
        function setLanguage(langCode, isUserClick = false) {
            currentLang = langCode;
            localStorage.setItem('kingsmath_lang', langCode);
            
            // URL 파라미터 업데이트 (history.pushState)
            const url = new URL(window.location);
            url.searchParams.set('lang', langCode);
            window.history.pushState({}, '', url);

            // UI 상단 버튼 업데이트
            const langInfo = languageList.find(l => l.code === langCode);
            document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${langInfo.country}.png`;
            document.getElementById('currentLangName').textContent = langInfo.name;

            // 실제 텍스트 적용
            applyTranslations(langCode);

            // 언어 변경 시 게임 화면 다시 렌더링 (단위 '명/votes' 등 적용 위해)
            render();

            if(isUserClick) {
                showToast(langInfo.name, langCode);
                closeModal();
            }
        }

        // ==========================================
        // 다국어 모달 관련 컨트롤러
        // ==========================================
        const modal = document.getElementById('langModal');
        const searchInput = document.getElementById('searchInput');
        const grid = document.getElementById('languageGrid');
        const noResult = document.getElementById('noResult');
        const toast = document.getElementById('toastNotification');
        let toastTimeout;

        function renderLanguages(filterText = '') {
            grid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            
            const filteredLangs = languageList.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                grid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                noResult.classList.add('hidden');
                noResult.classList.remove('flex');

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden font-sans";
                    const stateClasses = isSelected 
                        ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                        : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                    const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;

                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;
                    btn.innerHTML = `
                        <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                            <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col items-start">
                            <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                            <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                    `;
                    btn.addEventListener('click', () => setLanguage(lang.code, true));
                    grid.appendChild(btn);
                });
            }
        }

        function openModal() {
            modal.classList.add('active');
            renderLanguages(''); // 열때마다 리스트 갱신 (선택상태 표시 위해)
            searchInput.value = '';
            document.body.style.overflow = 'hidden';
            setTimeout(() => searchInput.focus(), 100);
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function showToast(langName, langCode) {
            document.getElementById('ui-toast').textContent = translations[langCode].toast;
            document.getElementById('toastLangName').textContent = langName;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // 이벤트 리스너 세팅
        document.getElementById('langTriggerBtn').addEventListener('click', openModal);
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
        searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });

        // ==========================================
        // 4. 홈 이모지 전체 화면 지체 없이 첫 화면 가기 소스 적용
        // ==========================================
        document.getElementById('btn-home').addEventListener('click', () => {
            // 원본 소스의 logic을 융합 (전체 화면일시 상태초기화, 아니면 새로고침)
            if (document.fullscreenElement) {
                // 게임오버 컨테이너가 없으므로 현재 상태(투표함) 초기화 모드로 세팅
                state.isResultRevealed = false;
                closeSetup(); // 모달 닫기 확인
                location.reload(); // 투표킹은 별도 타이머가 없으므로 깔끔하게 리로드
            } else {
                location.reload();
            }
        });

        // ==========================================
        // 기존 전자칠판 투표킹 로직 (절대 수정/삭제 안함)
        // ==========================================
        let state = {
            students: [],
            options: [],
            selectedStudentId: null,
            resultMode: 'delayed',
            isResultRevealed: false
        };

        // 초기 샘플 데이터 입력란 세팅
        document.getElementById('inputStudents').value = "김민준, 이서연, 박도윤, 최지우\n정하준, 강서현, 조은우, 윤민서";
        document.getElementById('inputOptions').value = "짜장면\n짬뽕\n볶음밥\n탕수육";

        function openSetup() { document.getElementById('setupModal').classList.remove('hidden'); }
        function closeSetup() { document.getElementById('setupModal').classList.add('hidden'); }
        function clearStudents() { document.getElementById('inputStudents').value = ''; }
        function clearOptions() { document.getElementById('inputOptions').value = ''; }

        function parseInput(text) {
            return text.split(/[\n,]+/).map(item => item.trim()).filter(item => item !== '');
        }

        function saveAndStart() {
            const rawStudents = document.getElementById('inputStudents').value.trim();
            const rawOptions = document.getElementById('inputOptions').value;

            let parsedStudents = [];
            
            if (/^\d+$/.test(rawStudents)) {
                const count = parseInt(rawStudents, 10);
                if (count > 0 && count <= 100) {
                    for (let i = 1; i <= count; i++) {
                        parsedStudents.push(`${i}`);
                    }
                } else {
                    alert(translations[currentLang].alert_count);
                    return;
                }
            } else {
                parsedStudents = parseInput(rawStudents);
            }

            const parsedOptions = parseInput(rawOptions);

            if (parsedStudents.length === 0) { alert(translations[currentLang].alert_min_stu); return; }
            if (parsedOptions.length === 0) { alert(translations[currentLang].alert_min_opt); return; }
            if (parsedOptions.length > 10) { alert(translations[currentLang].alert_max_opt + ` (${parsedOptions.length})`); return; }

            state.students = parsedStudents.map((name, idx) => ({ id: idx, name: name, voted: false }));
            state.options = parsedOptions.map((name, idx) => ({ id: idx, name: name, count: 0 }));
            state.selectedStudentId = null;
            state.isResultRevealed = false;
            
            changeResultMode(document.querySelector('input[name="resultMode"]:checked').value);

            closeSetup();
            render();
        }

        function changeResultMode(mode) {
            state.resultMode = mode;
            const revealBtn = document.getElementById('revealBtn');
            if (mode === 'delayed') {
                revealBtn.classList.remove('hidden');
                state.isResultRevealed = false;
            } else {
                revealBtn.classList.add('hidden');
                state.isResultRevealed = true;
            }
            render();
        }

        function revealResults() {
            state.isResultRevealed = true;
            document.getElementById('revealBtn').classList.add('hidden');
            render();
        }

        function selectStudent(id) {
            const student = state.students.find(s => s.id === id);
            if (student.voted) return; 
            if (state.selectedStudentId === id) {
                state.selectedStudentId = null;
            } else {
                state.selectedStudentId = id;
            }
            render();
        }

        function voteOption(id) {
            if (state.selectedStudentId === null) {
                alert(translations[currentLang].alert_select_stu);
                return;
            }
            const option = state.options.find(o => o.id === id);
            const student = state.students.find(s => s.id === state.selectedStudentId);

            option.count++;
            student.voted = true;
            state.selectedStudentId = null;

            render();
        }

        function render() {
            const studentContainer = document.getElementById('studentContainer');
            studentContainer.innerHTML = '';
            
            state.students.forEach(student => {
                const btn = document.createElement('button');
                btn.className = `px-2 py-4 text-xl font-bold rounded-xl border-2 btn-press flex items-center justify-center transition-all whitespace-nowrap overflow-hidden text-ellipsis dynamic-text ${
                    student.voted 
                    ? 'bg-green-700/50 text-green-200 border-green-600 cursor-not-allowed opacity-60' 
                    : student.id === state.selectedStudentId
                        ? 'bg-yellow-400 text-black border-yellow-400 selected-glow scale-105 z-10' 
                        : 'bg-gray-700 text-gray-200 border-gray-600 hover:bg-gray-600 hover:border-gray-500' 
                }`;
                btn.innerText = student.name;
                if (!student.voted) {
                    btn.onclick = () => selectStudent(student.id);
                }
                studentContainer.appendChild(btn);
            });

            const optionContainer = document.getElementById('optionContainer');
            optionContainer.innerHTML = '';

            const len = state.options.length;
            let cols = 1;
            if (len === 2) cols = 2; 
            else if (len <= 4) cols = 2; 
            else if (len <= 6) cols = 3; 
            else if (len <= 8) cols = 4; 
            else if (len <= 10) cols = 5; 
            
            optionContainer.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

            state.options.forEach(option => {
                const btn = document.createElement('button');
                btn.onclick = () => voteOption(option.id);
                btn.className = 'bg-slate-700 border-2 border-slate-600 hover:bg-slate-600 hover:border-blue-400 rounded-2xl p-6 flex flex-col items-center justify-center gap-4 btn-press relative overflow-hidden group';
                
                const showCount = state.resultMode === 'immediate' || state.isResultRevealed;
                // 명칭에 다국어 적용 (명 / votes / 票 등)
                const unitText = translations[currentLang].votes; 
                const countText = showCount ? `${option.count} ${unitText}` : `? ${unitText}`;
                const countColor = showCount && option.count > 0 ? 'text-pink-400' : 'text-gray-400';

                btn.innerHTML = `
                    <span class="text-2xl md:text-3xl font-bold text-white z-10 text-center break-keep w-full px-2 leading-tight flex-1 flex items-center justify-center dynamic-text">${option.name}</span>
                    <span class="text-3xl font-bold ${countColor} z-10 tracking-wider mb-2 dynamic-text">${countText}</span>
                    ${showCount && option.count > 0 ? `<div class="absolute bottom-0 left-0 h-2 bg-blue-500 transition-all duration-500" style="width: min(100%, ${option.count * 10}%);"></div>` : ''}
                `;
                optionContainer.appendChild(btn);
            });
            
            // 폰트 사이즈 조정 헬퍼 한번 더 호출
            setTimeout(() => applyTranslations(currentLang), 10);
        }

        // 초기 시작
        window.onload = () => {
            const initLang = detectLanguage();
            setLanguage(initLang); // 언어 세팅 및 적용
            renderLanguages();     // 모달 내 리스트 초기 생성
            saveAndStart();        // 게임 화면 생성
        };

    </script>
</body>
</html>
