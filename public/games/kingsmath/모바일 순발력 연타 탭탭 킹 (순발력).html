            align-items: center;
            justify-content: center;

            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 3s ease-in-out infinite;
            position: relative;

            font-size: 3.5rem;
            color: #333;
            margin: 0;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #eee;
            transition: font-size 0.3s ease;
        }
        
        .subtitle {
            font-family: 'Jua', sans-serif;
            font-size: 1.5rem;
            color: #888;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .desc {
            font-size: 1.1rem;
            color: #666;
            margin: 15px 0 25px 0;
            background: #f1f3f5;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        #qrcode { 
            margin: 10px auto; 
            padding: 10px; 
            background: white; 
            border-radius: 15px; 
            border: 3px dashed #ced4da;
        }

        .btn-start {
            background: linear-gradient(90deg, #FF6B6B 0%, #4D96FF 100%);
            color: white; 
            border: none; 
            padding: 15px 50px;
            font-size: 1.8rem; 
            border-radius: 50px; 
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'Jua', sans-serif;
            margin-top: 20px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-start:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .top-badges {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .badge {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.8rem;
            color: #555;
            text-decoration: none;
            background: #fff;
            padding: 5px 12px;
            border-radius: 15px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);

            display: flex;
            align-items: center;

            margin-top: 20px; 
            font-size: 0.9rem; 
            color: #868e96; 
            text-decoration: none;
            display: block;
        }
        .link-others:hover { text-decoration: underline; color: #333; }

        #game-container {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            width: 100vh; height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
            background-color: #222;
            overflow: hidden;
            font-family: 'Jua', sans-serif;
        }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start;
            padding-top: 20px;
        }
        
        .hud-round {
            font-size: 1.5rem; color: #ffd700; margin-bottom: 5px;
            text-shadow: 0 0 5px black;
        }
        .score-board {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%); z-index: 20; pointer-events: none;
            font-size: 4rem; color: white; text-shadow: 0 0 10px black; line-height: 1;
        }
        .hud-target {
            font-size: 1.8rem; color: #fff;
            text-shadow: 0 0 5px black;
            background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px;
        }

        .timer-container {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 15px;
            background: rgba(255, 255, 255, 0.2); z-index: 6;
        }
        #timer-bar {
            width: 0%; height: 100%; background: #ff0000; transition: width 0.05s linear;
        }

        .play-area {
            position: absolute; width: 50%; height: 100%; top: 0;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column;
            font-size: 3rem; font-weight: bold; color: rgba(255,255,255,0.9);
            transition: background-color 0.1s; text-align: center;

        #p1-area { left: 0; background-color: #c0392b; } 
        #p2-area { right: 0; background-color: #2980b9; } 
        
        .result-status { font-size: 4rem; display: block; margin-bottom: 10px; }
        .result-count { font-size: 2.5rem; display: block; }

        #round-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 20;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center;
        }
        .overlay-round { font-size: 3rem; color: #ffd700; margin-bottom: 10px; }
        .overlay-target { font-size: 3.5rem; margin-bottom: 30px; }
        .overlay-countdown { font-size: 6rem; font-weight: bold; color: #ff0000; animation: pop 0.5s ease-in-out; }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }

        #restart-btn {
            display: none; margin-top: 20px; font-size: 2rem; cursor: pointer;
            background: #27ae60; color: white; padding: 10px 30px; border-radius: 20px; pointer-events: auto;

        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Noto Sans KR', sans-serif;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            transform: scale(0.95) translateY(-10px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .toast {
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .top-ui-layer {
            position: fixed;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 99999;
            pointer-events: none;
        }
        .top-ui-layer > * { pointer-events: auto; }

        .floating-home-btn {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;

        // --- 다국어 초기화 및 감지 (우선순위: URL > localStorage > 기기 언어 > en) ---
        let currentLangCode = 'en';

        function initGlobalLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const storedLang = localStorage.getItem('kingsmath_lang');
            const browserLangRaw = navigator.language.toLowerCase();
            const browserLang = browserLangRaw.startsWith('pt-br') ? 'pt-br' : browserLangRaw.slice(0, 2);

            if (urlParams.has('lang') && translations[urlParams.get('lang')]) {
                currentLangCode = urlParams.get('lang');
            } else if (storedLang && translations[storedLang]) {
                currentLangCode = storedLang;
            } else if (translations[browserLang]) {
                currentLangCode = browserLang;
            }

            applyGlobalLanguage(currentLangCode, false);
        }

        function applyGlobalLanguage(langCode, showToastMsg = true) {
            currentLangCode = langCode;
            localStorage.setItem('kingsmath_lang', langCode);
            
            const t = translations[langCode];
            const langObj = languages.find(l => l.code === langCode);

            // 상단 모달 버튼 갱신
            document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${t.flag}.png`;
            document.getElementById('currentLangName').innerText = langObj ? langObj.name : "English";

            // 인게임 및 카드 UI 텍스트 업데이트
            document.getElementById('txt-home').innerText = t.home;
            document.getElementById('txt-domain-link').innerText = "🌐 " + t.domain;
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-desc').innerText = t.desc;
            document.getElementById('txt-qr').innerText = t.qr;
            document.getElementById('btn-start').innerText = t.start;
            document.getElementById('txt-more').innerText = t.more;
            document.getElementById('restart-btn').innerText = t.restart;

            // 폰트 사이즈 동적 조정
            const titleEl = document.querySelector('.title');
            if (['ru', 'fr', 'es', 'pt-br', 'de', 'it', 'id', 'th'].includes(langCode)) {
                titleEl.style.fontSize = '2.4rem';
            } else if (['en', 'vi', 'tr'].includes(langCode)) {
                titleEl.style.fontSize = '2.8rem';
            } else {
                titleEl.style.fontSize = '3.5rem';
            }

            // SEO 메타 태그 업데이트
            document.title = t.seoTitle;
            document.querySelector('meta[name="description"]').setAttribute("content", t.seoDesc);
            document.querySelector('meta[property="og:title"]').setAttribute("content", t.seoTitle);
            document.querySelector('meta[property="og:description"]').setAttribute("content", t.seoDesc);
            document.documentElement.lang = langCode;

            // URL 업데이트 (공유 목적)
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', langCode);
            window.history.pushState({}, '', newUrl);

            // QR 코드 재생성
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href,
                width: 110,
                height: 110,
                colorDark : "#333333",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // 토스트 메시지
            if (showToastMsg && langObj) {
                showToast(langObj.name, langCode);
            }
            
            // 모달 다시 열었을 때 대비 목록 갱신
            if (typeof renderLanguages === "function") {

        // --- 모달 제어 로직 ---

        function renderLanguages(filterText = '') {
            grid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            
            const filteredLangs = languages.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                grid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                noResult.classList.add('hidden');
                noResult.classList.remove('flex');

                    const isSelected = lang.code === currentLangCode;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";

                        ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                        : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

                    const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;

                    btn.innerHTML = `

                    btn.addEventListener('click', () => {

                    });
                    grid.appendChild(btn);
                });
            }
        }

        // --- 오디오 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type = 'sine') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playWinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50]; 
            
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + (index * 0.1));
                
                gain.gain.setValueAtTime(0.1, now + (index * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.001, now + (index * 0.1) + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now + (index * 0.1));
                osc.stop(now + (index * 0.1) + 0.3);
            });
        }

        }

        // --- 수학 문제 생성 ---
        function generateMathProblem(currentRound) {
            let val = 0;
            let str = "";
            let valid = false;

            while (!valid) {
                if (currentRound === 1) {
                    let a = getRandomInt(1, 9);
                    let b = getRandomInt(1, 9);
                    if (Math.random() > 0.5) { val = a + b; str = `${a} + ${b}`; } 
                    else { val = a - b; str = `${a} - ${b}`; }
                    if (val >= 1 && val <= 10) valid = true;
                }
                else if (currentRound === 2) {
                    let a = getRandomInt(10, 30);
                    let b = getRandomInt(1, 9);
                    if (Math.random() > 0.5) { val = a + b; str = `${a} + ${b}`; } 
                    else { val = a - b; str = `${a} - ${b}`; }
                    if (val >= 10 && val <= 20) valid = true;
                }
                else if (currentRound === 3) {
                    let a = getRandomInt(2, 9);
                    let b = getRandomInt(2, 9);
                    val = a * b; str = `${a} × ${b}`;
                    if (val >= 20 && val <= 40) valid = true;
                }
                else if (currentRound === 4) {
                    let a = getRandomInt(10, 99);
                    let b = getRandomInt(10, 99);
                    if (Math.random() > 0.5) { val = a + b; str = `${a} + ${b}`; } 
                    else { val = a - b; str = `${a} - ${b}`; }
                    if (val >= 40 && val <= 49) valid = true;
                }
                else {
                    val = 50; str = "50"; valid = true;
                }
            }
            return { val: val, str: str };
        }

        // --- 라운드 준비 ---
        function prepareRound() {
            isRoundEnd = false;
            isPlaying = false;
            p1Taps = 0;
            p2Taps = 0;
            resetPlayArea();

            const problemData = generateMathProblem(round);
            targetTaps = problemData.val;
            targetProblem = problemData.str;

            const t = translations[currentLangCode];
            document.getElementById('hud-round-info').innerText = `${t.round} ${round}`;
            
            let displayText = "";
            if(round === 5) {
                displayText = t.speedRound;
            } else {
                displayText = `${targetProblem} ${t.tapTarget}`;
            }

            document.getElementById('hud-target-text').innerText = displayText;
            document.getElementById('timer-bar').style.width = '0%'; 

            const overlay = document.getElementById('round-overlay');
            const rText = document.getElementById('overlay-round-text');
            const tText = document.getElementById('overlay-target-text');
            const cText = document.getElementById('overlay-countdown');

            rText.innerText = `${t.round} ${round}`;
            tText.innerText = displayText;
            
            overlay.style.display = 'flex';
            
            let count = 3;
            cText.innerText = count;
            cText.style.display = 'block';
            
            playTone(800, 'triangle');

            if(countdownInterval) clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                count--;
                if(count > 0) {
                    cText.innerText = count;
                    playTone(800, 'triangle'); 
                    cText.style.animation = 'none';
                    cText.offsetHeight; 
                    cText.style.animation = 'pop 0.5s ease-in-out';
                } else if(count === 0) {
                    cText.innerText = t.startMsg; 
                    cText.style.color = "#00ff00";
                    playTone(1200, 'square'); 
                } else {
                    clearInterval(countdownInterval);
                    overlay.style.display = 'none';
                    cText.style.color = "#ff0000"; 
                    startRound();
                }
            }, 1000);
        }

        // --- 라운드 진행 ---
        function startRound() {
            isPlaying = true;
            
            if (round === 5) {
                 document.getElementById('timer-bar').style.width = '100%';
                 document.getElementById('timer-bar').style.background = 'red';
            } else {
                let startTime = Date.now();
                document.getElementById('timer-bar').style.background = 'red';
                
                timerInterval = setInterval(() => {
                    let elapsed = Date.now() - startTime;
                    let pct = (elapsed / ROUND_TIME) * 100;
                    
                    if (pct >= 100) {
                        pct = 100;
                        clearInterval(timerInterval);
                        endRound();
                    }
                    document.getElementById('timer-bar').style.width = pct + '%';
                }, 16);
            }
        }

        // --- 탭 처리 ---
        function handleTap(player, event) {
            if(event.type === 'touchstart') event.preventDefault(); 
            if (!isPlaying) return;

            const area = document.getElementById(player === 1 ? 'p1-area' : 'p2-area');
            area.classList.add('flash');
            setTimeout(() => area.classList.remove('flash'), 50);

            playTone(player === 1 ? 440 : 660, 'square'); 

            if (player === 1) p1Taps++;
            else p2Taps++;

            if (round === 5) {
                if (p1Taps >= 50 || p2Taps >= 50) {
                    endRound();
                }
            }
        }

        // --- 라운드 종료 ---
        function endRound() {
            isPlaying = false;
            isRoundEnd = true;
            clearInterval(timerInterval);

            playWinSound();

            let winner = 0; 

            if (round === 5) {
                if (p1Taps >= 50 && p2Taps < 50) winner = 1;
                else if (p2Taps >= 50 && p1Taps < 50) winner = 2;
                else winner = 0; 
            } else {
                let diff1 = Math.abs(targetTaps - p1Taps);
                let diff2 = Math.abs(targetTaps - p2Taps);

                if (diff1 < diff2) winner = 1;
                else if (diff2 < diff1) winner = 2;
                else winner = 0;
            }

            if (winner === 1) p1Score++;
            if (winner === 2) p2Score++;
            updateScoreBoard();

            const t = translations[currentLangCode];
            const p1Status = winner === 1 ? t.win : (winner === 0 ? t.draw : t.lose);
            const p2Status = winner === 2 ? t.win : (winner === 0 ? t.draw : t.lose);

            showAreaResult(1, p1Taps, p1Status);
            showAreaResult(2, p2Taps, p2Status);

            setTimeout(() => {
                if (round < TOTAL_ROUNDS) {
                    round++;
                    prepareRound();
                } else {
                    showFinalResult();
                }
            }, 4000); 
        }

        function showAreaResult(player, taps, status) {
            const area = document.getElementById(player === 1 ? 'p1-area' : 'p2-area');
            let color = (status === translations[currentLangCode].win) ? "#f1c40f" : "#fff";
            
            area.innerHTML = `
                <div class="result-status" style="color:${color}">${status}</div>
                <div class="result-count">${taps}${translations[currentLangCode].countUnit}</div>
            `;
        }

        function resetPlayArea() {
            document.getElementById('p1-area').innerHTML = "";
            document.getElementById('p2-area').innerHTML = "";
        }

        function updateScoreBoard() {
            document.getElementById('score-display').innerText = `${p1Score} : ${p2Score}`;
        }

        function showFinalResult() {
            const endOverlay = document.getElementById('round-overlay-end');
            const msg = document.getElementById('final-msg');
            const t = translations[currentLangCode];
            
            let finalMsg = "";
            if (p1Score > p2Score) finalMsg = t.redWin;
            else if (p2Score > p1Score) finalMsg = t.blueWin;
            else finalMsg = t.drawGame;

            msg.innerHTML = finalMsg;
            endOverlay.style.display = 'flex';
            
            playWinSound(); 
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
    </script>
</body>
</html>
