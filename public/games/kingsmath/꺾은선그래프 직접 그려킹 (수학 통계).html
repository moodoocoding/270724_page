        if (navLangFull === 'pt-br' && translations['pt-br']) return 'pt-br';

    /**

    const AudioContext = window.AudioContext || window.webkitAudioContext;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function sfxSlide() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.05);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.05);
    }

    function sfxWin() { playTone(523, 'triangle', 0.1); setTimeout(() => playTone(784, 'square', 0.4), 200); }
    function sfxError() { playTone(150, 'sawtooth', 0.1); setTimeout(() => playTone(100, 'sawtooth', 0.3), 100); }
    function sfxStart() { playTone(400, 'sine', 0.1); setTimeout(() => playTone(600, 'sine', 0.1), 200); setTimeout(() => playTone(800, 'sine', 0.3), 400); }

    function generateData() {
        const scenarioIdx = Math.floor(Math.random() * SCENARIOS.length);
        currentScenario = SCENARIOS[scenarioIdx];
        
        const scales = currentScenario.maxScaleCandidates;
        gameData.maxScale = scales[Math.floor(Math.random() * scales.length)];
        
        if (gameData.maxScale <= 50) gameData.step = 2;
        else if (gameData.maxScale <= 100) gameData.step = 5;
        else if (gameData.maxScale <= 200) gameData.step = 10;
        else if (gameData.maxScale <= 500) gameData.step = 25;
        else gameData.step = 50;

        const step = gameData.step;
        let nums = [0,0,0,0,0];
        const type = currentScenario.genType;

        if (type === 'random') {
            for(let i=0; i<5; i++) {
                const min = currentScenario.minVal || 0;
                const maxSteps = Math.floor(gameData.maxScale / step);
                const minSteps = Math.ceil(min / step);
                const randSteps = Math.floor(Math.random() * (maxSteps - minSteps + 1)) + minSteps;
                nums[i] = randSteps * step;
            }
        } else if (type === 'decreasing') {
            nums[0] = currentScenario.startFixed; 
            for(let i=1; i<5; i++) {
                const prev = nums[i-1];
                if (prev <= 0) nums[i] = 0;
                else {
                    const prevSteps = prev / step;
                    const dropSteps = Math.floor(Math.random() * (prevSteps * 0.5));
                    let nextVal = prev - (dropSteps * step);
                    if (nextVal >= prev && prev > 0) nextVal = prev - step;
                    nums[i] = Math.max(0, nextVal);
                }
            }
        } else if (type === 'increasing') {
            let currentSteps = Math.floor(Math.random() * 3) + 1;
            nums[0] = currentSteps * step;
            for(let i=1; i<5; i++) {
                const maxIncSteps = Math.floor((gameData.maxScale / 5) / step) || 1;
                const inc = (Math.floor(Math.random() * maxIncSteps) + 1) * step;
                let nextVal = nums[i-1] + inc;
                if (nextVal > gameData.maxScale) nextVal = gameData.maxScale;
                nums[i] = nextVal;
            }
        }
        
        gameData.targets = nums;

        document.getElementById('scenario-title').innerText = currentScenario.title;
        const thead = document.getElementById('header-row');
        let hHtml = `<th class="table-header-col">${currentScenario.xHeaderTitle}</th>`;
        currentScenario.xLabels.forEach(l => hHtml += `<th>${l}</th>`);
        thead.innerHTML = hHtml;

        const tbody = document.getElementById('data-row');
        let bHtml = `<td class="table-header-col">${currentScenario.rowLabel} ${currentScenario.yUnitName}</td>`;
        nums.forEach(n => bHtml += `<td>${n}</td>`);
        tbody.innerHTML = bHtml;
    }

    function addCanvasListeners(pid) {
        const cvs = document.getElementById(`canvas-${pid}`);
        const start = (e) => handleStart(pid, e);
        const move = (e) => handleMove(pid, e);
        const end = (e) => handleEnd(pid, e);

        // window가 아닌 각각의 캔버스에 이벤트를 바인딩
        cvs.addEventListener('mousedown', start);
        cvs.addEventListener('touchstart', start, {passive: false});
        cvs.addEventListener('mousemove', move);
        cvs.addEventListener('touchmove', move, {passive: false});
        cvs.addEventListener('mouseup', end);
        cvs.addEventListener('touchend', end);
        // 마우스나 터치가 캔버스를 벗어나면 드래그 취소
        cvs.addEventListener('mouseleave', end);
        cvs.addEventListener('touchcancel', end);
    }

    function getEventPos(canvas, e) {
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        // 멀티 터치 시 화면 전체가 아닌 해당 캔버스의 터치(targetTouches)로만 좌표를 가져오도록 수정
        if (e.targetTouches && e.targetTouches.length > 0) {
            clientX = e.targetTouches[0].clientX;
            clientY = e.targetTouches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function handleStart(pid, e) {
        if(!isPlaying || players[pid].isDone) return;
        e.preventDefault();
        
        const cvs = document.getElementById(`canvas-${pid}`);
        const pos = getEventPos(cvs, e);
        const layout = getLayout(cvs.width, cvs.height);
        
        let colIndex = -1;
        let minDist = 9999;
        for(let i=0; i<5; i++) {
            const pointX = layout.margin + ((i + 1) * layout.slotWidth);
            const dist = Math.abs(pos.x - pointX);
            if(dist < layout.slotWidth / 2 && dist < minDist) {
                minDist = dist;
                colIndex = i;
            }
        }

        if (colIndex >= 0) {
            players[pid].draggingIdx = colIndex;
            updateValueFromPos(pid, pos.y - 60, cvs.height, layout);
        }
    }

    function handleMove(pid, e) {
        if(!isPlaying || players[pid].draggingIdx === -1) return;
        e.preventDefault();
        const cvs = document.getElementById(`canvas-${pid}`);
        const pos = getEventPos(cvs, e);
        const relY = pos.y;
        
        const layout = getLayout(cvs.width, cvs.height);
        updateValueFromPos(pid, relY - 60, cvs.height, layout);
    }

    function handleEnd(pid, e) {
        players[pid].draggingIdx = -1;
    }

    function updateValueFromPos(pid, y, h, layout) {
        const graphBottom = h - layout.bottomMargin;
        let valRatio = (graphBottom - y) / layout.chartH;
        if (valRatio < 0) valRatio = 0;
        if (valRatio > 1) valRatio = 1;
        
        const rawVal = valRatio * gameData.maxScale;
        const snappedVal = Math.round(rawVal / gameData.step) * gameData.step;
        
        if(players[pid].currentVals[players[pid].draggingIdx] !== snappedVal) {
            sfxSlide();
            players[pid].currentVals[players[pid].draggingIdx] = snappedVal;
        }
    }

    function checkAnswer(pid) {
        if(!isPlaying || players[pid].isDone) return;
        
        let wrong = [];
        const p = players[pid];
        for(let i=0; i<5; i++) {
            if(p.currentVals[i] !== gameData.targets[i]) wrong.push(i);
        }

        if(wrong.length === 0) {
            p.isDone = true;
            endGame(pid);
        } else {
            p.wrongIndices = wrong;
            sfxError();
            const errEl = document.getElementById(`error-${pid}`);
            errEl.style.opacity = 1;
            setTimeout(() => {
                errEl.style.opacity = 0;
                p.wrongIndices = [];
            }, 1500);
        }
    }

    function timeOut() {
        isPlaying = false;
        clearInterval(gameData.timerInterval);
        cancelAnimationFrame(animId);
        document.getElementById('result-modal').style.display = 'block';
    }

    function endGame(winnerPid) {
        isPlaying = false;
        clearInterval(gameData.timerInterval);
        cancelAnimationFrame(animId);
        document.getElementById(`crown-${winnerPid}`).style.transform = 'translateX(-50%) scale(1)';
        sfxWin();
        draw(players.p1, 'canvas-p1');
        draw(players.p2, 'canvas-p2');
        setTimeout(() => {
            document.getElementById('result-modal').style.display = 'block';
        }, 2000);
    }

    function loop() {
        if (!isPlaying) return;
        draw(players.p1, 'canvas-p1');
        draw(players.p2, 'canvas-p2');
        animId = requestAnimationFrame(loop);
    }

    function getLayout(w, h) {
        const margin = w * 0.15;            
        const rightPadding = w * 0.08;      
        const topPadding = h * 0.15;        
        const bottomMargin = h * 0.25;      
        const chartW = w - margin - rightPadding; 
        const chartH = h - bottomMargin - topPadding;
        const slotWidth = chartW / 6;
        return { margin, rightPadding, topPadding, bottomMargin, chartW, chartH, slotWidth };
    }

    function draw(p, canvasId) {
        const cvs = document.getElementById(canvasId);
        const ctx = cvs.getContext('2d');
        const w = cvs.width;
        const h = cvs.height;
        const layout = getLayout(w, h);
        const { margin, rightPadding, topPadding, bottomMargin, chartH, slotWidth } = layout;
        const max = gameData.maxScale;
        
        ctx.clearRect(0, 0, w, h);

        const step = max / 5;
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; 
        ctx.font = "24px 'Jua', Arial, sans-serif"; // [수정] 강제 폰트 지정으로 브라우저 인식 오류 해결
        
        for (let i = 0; i <= 5; i++) {
            const val = i * step;
            const y = bottomMargin + (val / max) * chartH;
            const canvasY = h - y;

            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1;
            ctx.moveTo(margin, canvasY);
            ctx.lineTo(w - rightPadding, canvasY);
            ctx.stroke();

            ctx.fillStyle = '#fff';
            let textY = canvasY;
            if (val === 0) textY -= 15; // 폰트가 커져서 0 위치 살짝 조정
            ctx.fillText(Math.round(val), margin - 15, textY); // 간격 살짝 조정
            
            if(i < 5) {
                const subStepsPerMain = step / gameData.step; 
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 0.5;
                const gap = chartH / 5 / subStepsPerMain;
                for(let k=1; k < subStepsPerMain; k++) {
                    const subY = canvasY - (gap * k);
                    ctx.beginPath(); ctx.moveTo(margin, subY); ctx.lineTo(w - rightPadding, subY); ctx.stroke();
                }
            }
        }
        
        ctx.textAlign = 'left';
        ctx.font = "20px 'Jua', Arial, sans-serif"; // [수정] 강제 폰트 지정
        ctx.fillText(currentScenario.yUnitName, margin - 55, topPadding - 25);

        ctx.beginPath();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.moveTo(margin, topPadding);
        ctx.lineTo(margin, h - bottomMargin);
        ctx.lineTo(w - rightPadding, h - bottomMargin);
        ctx.stroke();

        const diagSize = 40; 
        const originX = margin;
        const originY = h - bottomMargin;

        ctx.beginPath();
        ctx.moveTo(originX, originY);
        ctx.lineTo(originX - 60, originY + 40);
        
        ctx.moveTo(originX, originY);
        ctx.lineTo(originX, originY + 40);
        ctx.moveTo(originX, originY);
        ctx.lineTo(originX - 60, originY);
        ctx.stroke();

        ctx.font = "20px 'Jua', Arial, sans-serif"; // [수정] 강제 폰트 지정
        ctx.fillStyle = '#ddd';
        ctx.textAlign = 'center';
        
        const rowTitle = currentScenario.rowLabel.split('(')[0]; 
        ctx.fillText(rowTitle, originX - 55, originY + 15); // 위치 살짝 조정
        
        const colTitle = currentScenario.xUnitName.replace(/[()]/g, ''); 
        ctx.fillText(colTitle, originX - 15, originY + 35); // 위치 살짝 조정

        for(let i=0; i<5; i++) {
            const x = margin + ((i + 1) * slotWidth);
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.moveTo(x, h - bottomMargin);
            ctx.lineTo(x, topPadding);
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.font = "24px 'Jua', Arial, sans-serif"; // [수정] 강제 폰트 지정
            ctx.fillText(currentScenario.xLabels[i], x, h - bottomMargin + 15);

            if(i === 4) {
                 ctx.textAlign = 'left';
                 ctx.font = "20px 'Jua', Arial, sans-serif"; // [수정] 강제 폰트 지정
                 ctx.fillText(currentScenario.xUnitName, x + 35, h - bottomMargin + 15);
            }
        }

        const coords = [];
        for(let i=0; i<5; i++) {
            const val = p.currentVals[i];
            const cx = margin + ((i + 1) * slotWidth);
            const cy = h - (bottomMargin + (val / max) * chartH);
            coords.push({x: cx, y: cy, val: val});
        }

        ctx.save();
        ctx.beginPath();
        ctx.lineWidth = 6;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        const lineColor = (canvasId === 'canvas-p1') ? '#00d2d3' : '#ff9ff3';
        ctx.strokeStyle = lineColor;
        ctx.shadowColor = lineColor;
        ctx.shadowBlur = 10;
        coords.forEach((c, i) => {
            if(i===0) ctx.moveTo(c.x, c.y);
            else ctx.lineTo(c.x, c.y);
        });
        ctx.stroke();
        ctx.restore();

        const btnColors = ['#ff4757', '#2ecc71', '#3742fa', '#ffa502', '#9b59b6'];

        coords.forEach((c, i) => {
            ctx.beginPath();
            ctx.fillStyle = btnColors[i];
            const r = (p.draggingIdx === i) ? 20 : 8;
            ctx.arc(c.x, c.y, r, 0, Math.PI*2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = "32px 'Jua', Arial, sans-serif"; // [수정] 확실하게 강제 폰트 지정 (대폭 확대)
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(c.val, c.x, c.y - 35); // 겹치지 않게 위로 올림

            if(p.wrongIndices.includes(i)) {
                 ctx.fillStyle = 'red';
                 ctx.font = "40px Arial"; // [수정] 틀림 표시 X 크기 확대
                 ctx.fillText('❌', c.x, c.y - 70);
            }
        });
    }

    function resizeCanvas() {
        const c1 = document.getElementById('canvas-p1');
        const c2 = document.getElementById('canvas-p2');
        const con = c1.parentElement;
        c1.width = con.clientWidth;
        c1.height = con.clientHeight;
        c2.width = con.clientWidth;
        c2.height = con.clientHeight;
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }
</script>
