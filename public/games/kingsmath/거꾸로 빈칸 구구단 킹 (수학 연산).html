<!DOCTYPE html>
<html lang="ko">
<head>  
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2b2b2b">
    
    <meta name="description" content="거꾸로 구구단킹 - 친구들과 함께하는 수학 대결">
    <meta name="keywords" content="킹수학, 구구단, 곱셈, 수학게임, 초등수학">
    <meta property="og:type" content="website">
    <meta property="og:title" content="거꾸로 구구단킹 👑">
    <meta property="og:description" content="친구들과 함께하는 수학 대결, 거꾸로 구구단킹!">
    
    <title>거꾸로 구구단킹 👑</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: #2b2b2b;
            --card-bg: #3a3a3a;
            --text-color: #f0f0f0;
            --accent-color: #FFD93D;
            --btn-active: #6c5ce7;
            --correct-color: #00cec9;
            --wrong-color: #ff7675;
            --border-color: #555;
        }

        /* 폰트어썸 아이콘 깨짐 방지용 예외 처리 */
        i[class^="fa-"] {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
        }

        * { 
            box-sizing: border-box; 
            touch-action: none; 
        }

        body {
            margin: 0; padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            background-color: #1e1e1e;
            padding: 0 20px;
            height: 70px; 
            display: flex;
            justify-content: center; 
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
            position: relative;
            flex-shrink: 0;
        }

        .header-title {
            position: absolute;
            left: 20px;
            font-size: 1.8rem;
            color: var(--accent-color);
            text-shadow: 1px 1px 0 #000;
        }

        #timer-display {
            font-size: 2.5rem;
            color: #fff;
            background: #444;
            padding: 2px 30px;
            border-radius: 15px;
            border: 5px solid #888; 
            min-width: 120px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #timer-display.urgent {
            color: #ff7675;
            border-color: #ff7675;
            animation: blink 0.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* --- Main Container --- */
        #app-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: calc(100% - 70px);
        }

        /* --- Ranking Bar --- */
        .ranking-bar {
            width: 100%;
            height: 40px;
            background: #252525;
            border-bottom: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: #fff;
            font-size: 1.2rem;
            z-index: 20;
            pointer-events: none;
            flex-shrink: 0;
        }
        .rank-item { display: flex; align-items: center; gap: 5px; }
        .rank-item span { color: var(--accent-color); font-weight: bold; }

        /* --- Start Screen --- */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            z-index: 200;
        }

        .start-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 3px solid #444;
            text-align: center;
            max-width: 90%;
            width: 500px; /* 약간 넓힘 */
        }

        /* Start Screen Links */
        .top-banner-link {
            color: #FFD93D;
            text-decoration: none;
            font-size: 1rem;
            margin-bottom: 10px;
            display: block;
            font-weight: bold;
        }
        .top-banner-link:hover { text-decoration: underline; }

        .footer-link {
            color: #888;
            text-decoration: none;
            font-size: 1.1rem;
            margin-top: 20px;
            display: inline-block;
            border-bottom: 1px solid #555;
            transition: color 0.2s;
        }
        .footer-link:hover { color: #fff; border-color: #fff; }

        h1 { 
            margin: 0 0 20px 0; 
            font-size: 3rem;
            color: #fff; 
            text-shadow: 3px 3px 0 #000; 
            line-height: 1.2; 
        }
        /* 긴 제목 대응 */
        h1.long-text { font-size: 2.2rem; }

.option-group { 
    display: grid; 
    grid-template-columns: repeat(3, auto); 
    gap: 10px; 
    margin: 20px 0; 
    justify-content: center; 
}
        .btn-option {
            padding: 10px 20px;
            font-size: 1.2rem;   
            border: 2px solid #555;
            background: #222;
            color: #aaa;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-option.selected {
            background-color: var(--btn-active);
            color: white;
            border-color: var(--btn-active);
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--btn-active);
        }

        #btn-start {
            width: 100%;
            padding: 15px;
            font-size: 2rem;
            background-color: var(--wrong-color);
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 6px 0 #d63031;
            font-family: 'Jua', sans-serif;
            cursor: pointer;
            margin-top: 10px;
        }
        #btn-start:active { transform: translateY(6px); box-shadow: none; }

        .guide-box {
            background:#222; padding:15px; border-radius:10px; margin-top:20px; text-align:left; font-size:0.9rem; color:#ccc;
        }
        .guide-box b { color: #fff; }

        /* --- Game Screen --- */
        #game-screen {
            display: none; 
            width: 100%;
            flex: 1; 
            flex-direction: row;
            overflow: hidden;
            justify-content: center; 
        }

        .player-area {
            flex: 0 0 25%; 
            border-right: 2px solid #444;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #2b2b2b;
            overflow: hidden;
            height: 100%;
        }
        .player-area:last-child { border-right: 2px solid #444; } 

        .p-theme-0 { --p-color: #00cec9; background: rgba(0, 206, 201, 0.05); }
        .p-theme-1 { --p-color: #fdcb6e; background: rgba(253, 203, 110, 0.05); }
        .p-theme-2 { --p-color: #ff7675; background: rgba(255, 118, 117, 0.05); }
        .p-theme-3 { --p-color: #a29bfe; background: rgba(162, 155, 254, 0.05); }
        .p-theme-4 { --p-color: #55efc4; background: rgba(85, 239, 196, 0.05); }
        .p-theme-5 { --p-color: #fd79a8; background: rgba(253, 121, 168, 0.05); }

        .info-area {
            height: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 2px dashed rgba(255,255,255,0.1);
        }

        .player-header {
            width: 100%;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            padding: 5px 0;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            gap: 5px;
        }
        .p-name { font-size: 2.5rem; color: var(--p-color); font-weight: bold; line-height: 1.1; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .p-score { font-size: 3rem; color: white; line-height: 1.1; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        .character-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .animal-icon { font-size: 3.5rem; margin-bottom: 5px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .target-box {
            background: #444;
            border-radius: 20px;
            text-align: center;
            border: 4px solid var(--p-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            padding: 5px 15px;
            min-width: 120px;
        }
        .target-label { font-size: 1rem; color: #aaa; margin-bottom: 0px; }
        .target-num { font-size: 4rem; font-weight: bold; color: white; line-height: 1; text-shadow: 2px 2px 0 #000; }

        .game-board {
            height: 50%;
            display: flex;
            position: relative; 
            padding: 10px 20px; 
            justify-content: space-between;
            align-items: center;
        }

        .num-column {
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            height: 100%;
            width: 60px;
            z-index: 5;
            padding: 10px 0;
        }

        .num-btn {
            width: 55px; height: 55px;
            background: #333;
            border: 3px solid #555;
            border-radius: 50%;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            cursor: pointer;
            font-family: 'Jua';
            user-select: none;
            touch-action: none; 
            position: relative;
            transition: transform 0.1s;
        }
        
        .num-btn.active {
            background: var(--p-color);
            color: #000;
            transform: scale(1.2);
            z-index: 10;
        }
        .num-btn.matched { background: var(--correct-color); border-color: #fff; transform: scale(1.3); animation: popSuccess 0.3s; }
        .num-btn.wrong { background: var(--wrong-color); animation: shake 0.3s; }

        @keyframes popSuccess { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }

        .svg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
            z-index: 4;
        }
        .drag-path {
            stroke-width: 8; 
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            opacity: 0.8;
            pointer-events: none;
        }
        .result-path {
            stroke-width: 8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            opacity: 1;
            transition: stroke 0.2s;
        }

        .result-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); 
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .medal { font-size: 8rem; margin-bottom: 10px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .rank-text { font-size: 4rem; color: white; font-weight: bold; }
        .final-score { font-size: 2.5rem; color: var(--accent-color); margin-top: 20px; }

        #global-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }
        #global-overlay.transparent-bg {
            background: rgba(0,0,0,0) !important;
            pointer-events: none; 
        }
        #global-overlay.transparent-bg button, #global-overlay.transparent-bg a {
            pointer-events: auto; 
        }

        #countdown-txt { font-size: 8rem; color: var(--accent-color); font-weight: bold; }

        .restart-container {
            position: absolute;
            bottom: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 600;
        }

        .floating-btn {
            position: absolute;
            top: 25vh; 
            width: 60px; height: 60px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #666;
            border-radius: 50%;
            color: white;
            font-size: 1.8rem;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; 
            z-index: 200;
            transition: transform 0.2s;
        }
        .floating-btn:hover { transform: scale(1.1); background: rgba(0,0,0,0.8); }
        .floating-btn:active { transform: scale(0.95); }

        #btn-home { left: 10px; }
        #btn-fs { right: 10px; }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } 100% { transform: translateX(0); } }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

        @media (max-width: 768px) {
            .header-title { font-size: 1.2rem; }
            .num-btn { width: 40px; height: 40px; font-size: 1.4rem; }
            .target-num { font-size: 3rem; }
            .p-name { font-size: 1.8rem; }
            .p-score { font-size: 2rem; }
            .animal-icon { font-size: 2.5rem; }
            .ranking-bar { font-size: 1rem; }
            .floating-btn { width: 45px; height: 45px; font-size: 1.2rem; top: 80px; }
        }

        /* =========================================================
           [완벽 격리용 언어 선택 UI 전용 CSS] 
           게임 디자인과 절대 충돌하지 않도록 모달과 버튼에만 적용
           z-index 99999 보장, 사이징 강제 보정
        ========================================================= */
        #langSelectorContainer {
            position: fixed; top: 15px; right: 15px; z-index: 99999;
            font-family: 'Noto Sans KR', sans-serif; /* 한글 폰트 적용 및 외국어 기본 폰트 처리 */
        }
        #langModal, #langModal * { box-sizing: border-box !important; }
        
        .lang-trigger-btn {
            display: flex; align-items: center; gap: 8px;
            background: rgba(55, 65, 81, 0.5); border: 1px solid #4b5563;
            border-radius: 9999px; padding: 8px 16px;
            color: #f3f4f6; font-size: 14px; font-weight: 500; cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .lang-trigger-btn:hover { background: rgba(55, 65, 81, 1); }
        .lang-trigger-btn img { width: 20px; height: auto; border-radius: 2px; }
        
        #langModal {
            position: fixed; inset: 0; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
        }
        #langModal.active { opacity: 1; visibility: visible; }
        
        .lm-content {
            background: #111827; border: 1px solid #374151; border-radius: 1rem;
            width: 90%; max-width: 800px; max-height: 85vh;
            display: flex; flex-direction: column; overflow: hidden;
            transform: scale(0.95) translateY(-10px); opacity: 0;
            transition: all 0.3s ease; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        #langModal.active .lm-content { transform: scale(1) translateY(0); opacity: 1; }
        
        .lm-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.25rem; border-bottom: 1px solid #1f2937; background: #111827;
        }
        .lm-header h2 { margin: 0; font-size: 1.25rem; color: #fff; display: flex; align-items: center; gap: 8px; font-family: sans-serif;}
        .lm-close-btn {
            background: #1f2937; border: none; width: 40px; height: 40px; border-radius: 50%;
            color: #9ca3af; font-size: 1.2rem; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .lm-close-btn:hover { background: #374151; color: #fff; }
        
        .lm-search-area { padding: 1.25rem; background: #111827; position: relative; }
        .lm-search-area i { position: absolute; left: 2rem; top: 50%; transform: translateY(-50%); color: #9ca3af; }
        .lm-search-input {
            width: 100%; background: #1f2937; border: 1px solid #374151; color: #fff;
            padding: 0.875rem 1rem 0.875rem 2.75rem; border-radius: 0.75rem; outline: none; font-size: 0.875rem;
        }
        .lm-search-input:focus { border-color: #eab308; box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2); }
        
        .lm-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
        .lm-grid {
            display: grid; gap: 0.75rem;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
        
        .lm-item {
            display: flex; align-items: center; gap: 12px; padding: 0.75rem;
            background: rgba(31, 41, 55, 0.4); border: 1px solid #374151; border-radius: 0.75rem;
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .lm-item:hover { background: #374151; border-color: #6b7280; }
        .lm-item.selected { background: #1f2937; border-color: #eab308; box-shadow: 0 0 0 1px rgba(234, 179, 8, 0.5); }
        .lm-item img { width: 32px; height: 24px; object-fit: cover; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .lm-item-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .lm-item-name { font-size: 0.875rem; color: #fff; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lm-item.selected .lm-item-name { color: #facc15; }
        .lm-item-en { font-size: 0.75rem; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lm-item-check { color: #eab308; font-size: 1.1rem; margin-left: auto; }
        
        .lm-no-result { display: none; flex-direction: column; align-items: center; padding: 3rem 0; color: #6b7280; }
        
        /* 토스트 알림 */
        #toastNotification {
            position: fixed; bottom: 24px; right: 24px; z-index: 99999;
            background: #1f2937; border: 1px solid #374151; border-radius: 0.75rem; padding: 1rem;
            display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            transform: translateY(150%); opacity: 0; transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
        }
        #toastNotification.show { transform: translateY(0); opacity: 1; }
        .toast-icon { width: 32px; height: 32px; background: rgba(34, 197, 94, 0.2); color: #4ade80; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .toast-text p { margin: 0; }
        .toast-msg { font-size: 0.875rem; font-weight: 500; color: #fff; }
        .toast-lang { font-size: 0.75rem; color: #9ca3af; }

        /* 모바일 모달 조정 */
        @media (max-width: 640px) {
            #langSelectorContainer { top: 10px; right: 10px; }
            .lang-trigger-btn span { display: none; }
            #langModal { padding: 1rem; }
            .lm-content { width: 100%; max-height: 90vh; }
            .lm-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="langSelectorContainer">
        <button id="langTriggerBtn" class="lang-trigger-btn">
            <i class="fa-solid fa-globe text-gray-400"></i>
            <img id="currentFlag" src="https://flagcdn.com/w40/kr.png" alt="KR">
            <span id="currentLangName">한국어</span>
            <i class="fa-solid fa-chevron-down text-gray-400 ml-1 text-xs"></i>
        </button>
    </div>

    <div id="langModal">
        <div class="lm-content">
            <div class="lm-header">
                <h2>
                    <i class="fa-solid fa-language" style="color:#eab308;"></i>
                    <span>Language / 언어</span>
                </h2>
                <button id="closeModalBtn" class="lm-close-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="lm-search-area">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="lm-search-input" placeholder="Search / 검색 ...">
            </div>
            <div class="lm-body">
                <div id="languageGrid" class="lm-grid"></div>
                <div id="noResult" class="lm-no-result">
                    <i class="fa-regular fa-face-frown-open text-4xl mb-3" style="font-size:2rem; margin-bottom:10px;"></i>
                    <p>No results / 검색 결과 없음</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toastNotification">
        <div class="toast-icon"><i class="fa-solid fa-check"></i></div>
        <div class="toast-text">
            <p id="ui-toast" class="toast-msg">언어가 변경되었습니다.</p>
            <p id="toastLangName" class="toast-lang">Korean</p>
        </div>
    </div>

    <header>
        <div class="header-title" id="header-title-text">거꾸로 구구단킹 👑</div>
        <div id="timer-display">60</div>
    </header>

    <div id="app-container">
        
        <div class="ranking-bar" id="ranking-bar" style="display:none;">
            </div>

        <div id="start-screen">

        // --- Audio System ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); 
                osc.frequency.setValueAtTime(659.25, now + 0.1); 
                osc.frequency.setValueAtTime(783.99, now + 0.2); 
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(783.99, now + 0.1);
                osc.frequency.setValueAtTime(1046.50, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now); // A5
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
        }

        // --- Drag Logic ---
        function handlePointerDown(e) {
            if (gameTime <= 0) return;
            const btn = e.target.closest('.num-btn');
            if (!btn) return;

            e.preventDefault(); 
            const pIdx = parseInt(btn.dataset.p);
            const side = btn.dataset.side;
            const val = parseInt(btn.dataset.val);
            const svg = document.getElementById(`svg-${pIdx}`);
            const boardRect = document.getElementById(`board-${pIdx}`).getBoundingClientRect();
            const btnRect = btn.getBoundingClientRect();

            const startX = btnRect.left + btnRect.width / 2 - boardRect.left;
            const startY = btnRect.top + btnRect.height / 2 - boardRect.top;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M ${startX} ${startY}`);
            path.classList.add('drag-path');
            path.setAttribute('stroke', themeColors[pIdx]);
            
            svg.appendChild(path);

            btn.classList.add('active');
            playSound('click');

            activeDrags[e.pointerId] = {
                pIdx, startEl: btn, startSide: side, startVal: val, pathEl: path,
                points: [{x: startX, y: startY}], boardRect: boardRect, completed: false
            };
            btn.setPointerCapture(e.pointerId);
        }

        function handlePointerMove(e) {
            const drag = activeDrags[e.pointerId];
            if (!drag || drag.completed) return;

            e.preventDefault();
            const currentX = e.clientX - drag.boardRect.left;
            const currentY = e.clientY - drag.boardRect.top;

            drag.points.push({x: currentX, y: currentY});
            const d = drag.pathEl.getAttribute('d') + ` L ${currentX} ${currentY}`;
            drag.pathEl.setAttribute('d', d);

            const hitElement = document.elementFromPoint(e.clientX, e.clientY);
            const targetBtn = hitElement ? hitElement.closest('.num-btn') : null;

            if (targetBtn) {
                const targetPIdx = parseInt(targetBtn.dataset.p);
                const targetSide = targetBtn.dataset.side;
                const targetVal = parseInt(targetBtn.dataset.val);

                if (targetPIdx === drag.pIdx && targetSide !== drag.startSide) {
                    const product = drag.startVal * targetVal;
                    const required = players[drag.pIdx].target;

                    completeDrag(drag, targetBtn, (product === required), e.pointerId);
                }
            }
        }

        function handlePointerUp(e) {
            const drag = activeDrags[e.pointerId];
            if (!drag) return;
            e.preventDefault();
            
            if (!drag.completed) {
                if (drag.pathEl.parentNode) drag.pathEl.parentNode.removeChild(drag.pathEl);
                drag.startEl.classList.remove('active');
            }
            if(drag.startEl && drag.startEl.hasPointerCapture(e.pointerId)) {
                drag.startEl.releasePointerCapture(e.pointerId);
            }
            delete activeDrags[e.pointerId];
        }

        function completeDrag(drag, targetBtn, isSuccess, pointerId) {
            drag.completed = true;
            if(drag.startEl && pointerId) {
                try { drag.startEl.releasePointerCapture(pointerId); } catch(e){}
            }

            if (isSuccess) {
                drag.pathEl.classList.remove('drag-path');
                drag.pathEl.classList.add('result-path');
                drag.pathEl.setAttribute('stroke', '#ffffff');
                
                const btnRect = targetBtn.getBoundingClientRect();
                const endX = btnRect.left + btnRect.width / 2 - drag.boardRect.left;
                const endY = btnRect.top + btnRect.height / 2 - drag.boardRect.top;
                const d = drag.pathEl.getAttribute('d') + ` L ${endX} ${endY}`;
                drag.pathEl.setAttribute('d', d);

                drag.startEl.classList.add('matched');
                targetBtn.classList.add('matched');
                
                players[drag.pIdx].score++;
                document.getElementById(`score-${drag.pIdx}`).innerText = players[drag.pIdx].score + langData[currentLang].score;
                playSound('correct');

                setTimeout(() => {
                    drag.startEl.classList.remove('active', 'matched');
                    targetBtn.classList.remove('active', 'matched');
                    if(drag.pathEl.parentNode) drag.pathEl.parentNode.removeChild(drag.pathEl);
                    generateProblem(drag.pIdx);
                }, 500);
            } else {
                const btnRect = targetBtn.getBoundingClientRect();
                const endX = btnRect.left + btnRect.width / 2 - drag.boardRect.left;
                const endY = btnRect.top + btnRect.height / 2 - drag.boardRect.top;
                const d = drag.pathEl.getAttribute('d') + ` L ${endX} ${endY}`;
                drag.pathEl.setAttribute('d', d);

                drag.pathEl.setAttribute('stroke', '#ff7675'); 
                drag.startEl.classList.add('wrong');
                targetBtn.classList.add('wrong');
                playSound('wrong');

                setTimeout(() => {
                    drag.startEl.classList.remove('active', 'wrong');
                    targetBtn.classList.remove('active', 'wrong');
                    if(drag.pathEl.parentNode) drag.pathEl.parentNode.removeChild(drag.pathEl);
                }, 300);
            }
        }

        function updateRankingBar() {
            const sorted = [...players].sort((a,b) => b.score - a.score);
            const bar = document.getElementById('ranking-bar');
            const data = langData[currentLang];
            
            let html = '';
            let currentRank = 1;
            for(let i=0; i<sorted.length; i++) {
                if (i > 0 && sorted[i].score < sorted[i-1].score) {
                    currentRank = i + 1;
                }
                
                const p = sorted[i];
                let rankStr = currentRank + data.rankFormat;
                
                if(currentLang === 'en') {
                    if(currentRank === 1) rankStr = "1st";
                    else if(currentRank === 2) rankStr = "2nd";
                    else if(currentRank === 3) rankStr = "3rd";
                    else rankStr = currentRank + "th";
                }

                html += `<div class="rank-item"><span>${rankStr}</span> ${data.animals[p.id]}(${p.score})</div>`;
                if(i < sorted.length -1) html += '<div style="color:#555">|</div>';
            }
            bar.innerHTML = html;
        }

        function endGame() {
            clearInterval(timerInterval);
            clearInterval(rankInterval);
            playSound('win');

            // 게임 끝난 뒤 결과 오버레이에는 언어 모달 필요 없음 (이미 숨김 상태 유지)

            const sortedPlayers = [...players].sort((a,b) => b.score - a.score);
            const data = langData[currentLang];
            
            let currentRank = 1;
            for(let i=0; i<sortedPlayers.length; i++) {
                if(i > 0 && sortedPlayers[i].score < sortedPlayers[i-1].score) {
                    currentRank = i + 1;
                }
                sortedPlayers[i].finalRank = currentRank;
            }

            players.forEach(p => {
                const overlay = document.getElementById(`result-${p.id}`);
                const medalEl = document.getElementById(`medal-${p.id}`);
                const rankTxt = document.getElementById(`rank-text-${p.id}`);
                const scoreTxt = document.getElementById(`final-score-${p.id}`);
                
                const rank = sortedPlayers.find(sp => sp.id === p.id).finalRank;
                
                let medal = '';
                if(rank === 1) medal = '🥇';
                else if(rank === 2) medal = '🥈';
                else if(rank === 3) medal = '🥉';
                else medal = '👏';

                let rankStr = rank + data.rankFormat;
                if(currentLang === 'en') {
                    if(rank === 1) rankStr = "1st";
                    else if(rank === 2) rankStr = "2nd";
                    else if(rank === 3) rankStr = "3rd";
                    else rankStr = rank + "th";
                }

                medalEl.innerText = medal;
                rankTxt.innerText = rankStr;
                scoreTxt.innerText = `${p.score}${data.score}`;
                
                overlay.style.display = 'flex';
            });

            const overlay = document.getElementById('global-overlay');
            overlay.innerHTML = '';
            overlay.style.display = 'flex';
            overlay.classList.add('transparent-bg'); 

            const container = document.createElement('div');
            container.className = 'restart-container';

            const restartBtn = document.createElement('button');
            restartBtn.innerText = data.restartBtn;
            restartBtn.className = 'restart-btn-dynamic'; 
            restartBtn.style.padding = "15px 40px";
            restartBtn.style.fontSize = "2rem";
            restartBtn.style.borderRadius = "50px";
            restartBtn.style.border = "none";
            restartBtn.style.background = "#6c5ce7";
            restartBtn.style.color = "white";
            restartBtn.style.cursor = "pointer";
            restartBtn.style.fontFamily = "'Jua', sans-serif";
            restartBtn.style.boxShadow = "0 5px 15px rgba(0,0,0,0.5)";
            
            // 다시하기 버튼 누르면 홈 화면 로직으로 이동 (이때 언어 선택기도 다시 노출)
            restartBtn.onclick = () => {
                document.getElementById('btn-home').click();
            };

            const extraLink = document.createElement('a');
            extraLink.innerText = data.moreGames;
            extraLink.className = 'more-games-dynamic';
            extraLink.href = "/";
            extraLink.target = "_self"; 
            extraLink.style.color = "#fff";
            extraLink.style.textDecoration = "none";
            extraLink.style.fontSize = "1.2rem";
            extraLink.style.textShadow = "1px 1px 2px black";
            extraLink.style.fontWeight = "bold";

            container.appendChild(restartBtn);
            container.appendChild(extraLink);
            overlay.appendChild(container);
        }

        // --- Init ---
        currentLang = getInitialLang();
        const initialLangObj = languages.find(l => l.code === currentLang);
        currentFlagImg.src = `https://flagcdn.com/w40/${initialLangObj.country}.png`;
        currentLangSpan.textContent = initialLangObj.name;
        
        applyLanguageUI();
        
        // 초기 언어 리스트 렌더링 호출
        renderLanguages();
    </script>
</body>
</html>
