        height: 100dvh; 
        height: var(--app-height); 
        
        touch-action: none; 
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;

        -webkit-touch-callout: none;

        align-items: center;
        position: relative;
        z-index: 10;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #scoreboard-row {
        display: flex;
        justify-content: space-around;
        align-items: center;
        width: 100%;
        padding: 0 20px;
        height: 100%;
    }

    .player-zone {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 15px 25px;
        border-radius: 16px;
        background: rgba(255,255,255,0.05);
        min-width: 250px;
        justify-content: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .p1-zone { border: 3px solid #ff6b6b; color: #ff6b6b; }
    .p2-zone { border: 3px solid #4dabf7; color: #4dabf7; flex-direction: row-reverse; }

    .player-label { font-size: clamp(18px, 2.5vw, 28px); font-weight: 800; letter-spacing: 1px; white-space: nowrap; }
    .score { font-size: 55px; font-weight: 800; margin: 0 10px; line-height: 1; display: flex; align-items: baseline; }
    .score span.unit { font-size: clamp(16px, 2vw, 24px); font-weight: 700; margin-left: 8px; color: #eee; }
    
    .timer-container {
        width: 40%;
        max-width: 500px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .timer-label { 
        color: #ffd32a; 
        font-size: clamp(20px, 2.5vw, 32px); 
        margin-bottom: 10px; 
        font-weight: 700; 
        letter-spacing: 1px; 
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    #timer-bar {
        width: 100%; height: 16px; background: #333; border-radius: 8px;
        overflow: hidden; border: 2px solid #555;
    }
    #timer-fill {
        width: 100%; height: 100%;
        background: linear-gradient(90deg, #4cd964, #ffd32a, #ff3b30);
        transition: width 1s linear;
    }

    /* --- 하단 게임 영역 --- */
    #game-area-wrapper {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding: 15px;
        background-color: #0d0d0d;
        position: relative;
        overflow: hidden;
    }

    #game-area {
        width: 100%;
        height: 100%; 
        display: flex;
        position: relative;
        gap: 15px;
    }

    canvas {
        position: absolute; top: 0; left: 0;
        display: block; width: 100%; height: 100%; z-index: 5;
    }

    .table-bg {
        flex: 1;
        border-radius: 15px;
        border: 10px solid #2e1a10;
        box-shadow: inset 0 0 60px rgba(0,0,0,0.8), 0 5px 20px rgba(0,0,0,0.5);
        position: relative;
        transition: box-shadow 0.2s ease-out;
    }

    .left-table { background: radial-gradient(circle at 50% 50%, #2b4c34 0%, #112116 90%); }
    .right-table { background: radial-gradient(circle at 50% 50%, #2b4c34 0%, #112116 90%); }

    /* 페널티 발생 시 붉게 번쩍이는 효과 */
    .penalty-flash {
        box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.9) !important;
        border-color: #ff3333 !important;
    }

    .divider {
        position: absolute; left: 50%; top: 10px; bottom: 10px;
        width: 6px; background: rgba(255, 255, 255, 0.2);
        transform: translateX(-50%); z-index: 4;
        border-radius: 3px;
        border-left: 2px dashed rgba(255,255,255,0.4);
    }

    /* --- 플로팅 버튼 공통 스타일 --- */
    .float-btn {
        position: fixed;
        bottom: 20px;
        width: 50px;
        height: 50px;
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        cursor: pointer;
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 24px;
        transition: all 0.2s;
        backdrop-filter: blur(4px);
        pointer-events: auto;
    }
    .float-btn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.1); }
    .float-btn:active { transform: scale(0.95); }
    #fullscreen-btn { right: 20px; }
    #home-btn { left: 20px; }

    /* --- 오버레이 --- */
    #overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 100; backdrop-filter: blur(8px);
    }
    
    .modal-content-game {
        background: rgba(30, 40, 30, 0.95); padding: 50px 80px;
        border-radius: 30px; border: 2px solid rgba(168, 230, 207, 0.5);
        display: flex; flex-direction: column; align-items: center;
        text-align: center; max-width: 900px; width: 90%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        pointer-events: auto;
    }

    /* 타이틀 크기 대폭 확대 및 충돌 방지 */
    h1 { 
        font-size: clamp(40px, 8vw, 140px) !important; 
        margin: 0 0 30px 0; 
        font-family: 'Nanum Gothic', sans-serif;
        font-weight: 800;

        word-break: keep-all;

    .sub-msg { font-size: clamp(16px, 2.2vw, 26px); color: #ddd; line-height: 1.6; font-weight: 400; word-break: keep-all; }

    button.start-btn {
        padding: 20px 60px; font-size: clamp(20px, 3.5vw, 36px); font-family: 'Nanum Gothic', sans-serif;
        font-weight: 800;
        background: linear-gradient(to bottom, #d4fc79, #96e6a1);
        border: 4px solid #fff; border-radius: 60px; color: #222; cursor: pointer;
        box-shadow: 0 10px 30px rgba(150, 230, 161, 0.5); margin-top: 40px;
        transition: transform 0.1s, box-shadow 0.2s;
        touch-action: manipulation;
        white-space: nowrap;
    }
    button.start-btn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(150, 230, 161, 0.7); }
    button.start-btn:active { transform: scale(0.95); }

    .other-game-link {
        margin-top: 30px;
        color: #aaa;
        font-size: 22px;
        text-decoration: underline;
        cursor: pointer;
        transition: color 0.2s;
    }
    .other-game-link:hover { color: #fff; }


    /* =====================================================================
       [다국어 모달 및 UI 전용 독립 CSS]
       게임 캔버스나 요소에 영향이 가지 않도록 엄격하게 분리
       폰트 어썸 아이콘(i)이 깨지지 않도록 예외 처리
       ===================================================================== */
    
    /* 박스 사이징 강제 보정 */
    #langModal, #langModal * {
        box-sizing: border-box !important;
    }

    /* 폰트 어썸 아이콘을 제외한 모달 내 요소만 Noto Sans 적용 */
    #langModal :not(i), #langTriggerBtn :not(i), #toastNotification :not(i) {
        font-family: 'Noto Sans KR', sans-serif;
    }

    .lang-ui-container {
        position: absolute; top: 1rem; right: 1rem; z-index: 99999;
    }
    @media (min-width: 640px) {
        .lang-ui-container { top: 1.5rem; right: 1.5rem; }
    }

    /* 커스텀 스크롤바 (모달 내부 스크롤용) */
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

    /* 모달 등장 애니메이션 */
    .modal-overlay {
        opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 99999 !important;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    
    .lang-modal-content {
        transform: scale(0.95) translateY(-10px);
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-overlay.active .lang-modal-content {
        transform: scale(1) translateY(0);
        opacity: 1;
    }

    /* 토스트 알림 애니메이션 */
    .toast-popup {
        transform: translateY(150%);
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 99999 !important;
    }
    .toast-popup.show { transform: translateY(0); opacity: 1; }

    // [언어 감지 최우선 순위 세팅]
    function initializeLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        const savedLang = localStorage.getItem('kingsmath_lang');
        const browserLang = navigator.language.split('-')[0].toLowerCase();
        
        let targetLang = 'en'; // 최종 Fallback
        
        if (urlLang && TRANSLATIONS[urlLang]) {
            targetLang = urlLang;
        } else if (savedLang && TRANSLATIONS[savedLang]) {
            targetLang = savedLang;
        } else if (TRANSLATIONS[browserLang]) {
            targetLang = browserLang;
        }
        
        setAppLanguage(targetLang, false); // 초기 로드시에는 토스트 안띄움
    }

    function setAppLanguage(langCode, showToastMsg = true) {
        currentLangCode = langCode;
        localStorage.setItem('kingsmath_lang', langCode);
        
        // URL 파라미터 업데이트 (공유용)
        const url = new URL(window.location);
        url.searchParams.set('lang', langCode);
        window.history.pushState({}, '', url);

        const t = TRANSLATIONS[langCode];
        const langInfo = LANGUAGES.find(l => l.code === langCode) || LANGUAGES[1];

        // 1. 헤더 언어 버튼 업데이트
        document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${langInfo.country}.png`;
        document.getElementById('currentLangName').textContent = langInfo.name;

        // 2. SEO 태그 업데이트
        document.title = t.title;
        document.getElementById('page-title').textContent = t.title;
        document.getElementById('meta-desc').content = t.seoDesc;
        document.getElementById('meta-keywords').content = t.seoKeys;
        document.getElementById('og-title').content = t.title + " | kingsmath.com";
        document.getElementById('og-desc').content = t.seoDesc;

        // 3. 게임 내 텍스트 업데이트

        document.getElementById('msg-title').textContent = t.title;

            document.getElementById('ui-toast').textContent = t.toastMsg;

    function renderLanguages(filterText = '') {
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = LANGUAGES.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLangCode;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected 
                    ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                    : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;
                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="https://flagcdn.com/w40/${lang.country}.png" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;

                btn.addEventListener('click', () => {
                    setAppLanguage(lang.code, true);
                    langModal.classList.remove('active'); // 선택 시 닫힘 확인
                });
                grid.appendChild(btn);
            });
        }
    }

    // 오디오 엔진
    const AudioEngine = {
        ctx: null,
        init: function() {
            if (!this.ctx) {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            } else if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        },
        playTone: function(freq, type, duration, vol=0.3) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + duration);
        },
        playDraw: function() { this.playTone(400, 'sine', 0.1, 0.05); },
        playConnect: function() { this.playTone(880, 'square', 0.1, 0.1); this.playTone(1100, 'sine', 0.2, 0.1); },
        playWrong: function() { this.playTone(150, 'sawtooth', 0.3, 0.4); },
        playWin: function() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => this.playTone(f, 'square', 0.2, 0.3), i*100)); }
    };

    // 화면 크기 관리
    function resizeCanvas() {
        const area = document.getElementById('game-area');
        if (area) {
            canvas.width = area.clientWidth;
            canvas.height = area.clientHeight;
        }
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => {});
        else if (document.exitFullscreen) document.exitFullscreen();
    }

    const setAppHeight = () => {
        document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
        resizeCanvas();
    }
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    setAppHeight();

    // --- 클래스 ---
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.5) * 6;
            this.life = 1.0; this.color = color;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= 0.03; }
        draw(ctx) {
            ctx.save(); ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, 5, 0, Math.PI*2);
            ctx.fill(); ctx.restore();
        }
    }

    class GameNode {
        constructor(id, emoji, zone, x, y) {
            this.id = id; this.emoji = emoji;
            this.zone = zone; this.x = x; this.y = y;
            this.radius = Math.min(canvas.width, canvas.height) * 0.055; 
            if(this.radius < 35) this.radius = 35;
            if(this.radius > 55) this.radius = 55;
            this.isHighlight = false;
        }

        draw(ctx) {
            ctx.beginPath();
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 8; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;

            ctx.fillStyle = this.isHighlight ? '#fff9c4' : '#ffffff';
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 3; 
            ctx.strokeStyle = this.zone === 'p1' ? '#ff6b6b' : '#4dabf7';
            ctx.stroke();

            ctx.shadowColor = 'transparent';
            
            // 텍스트를 없애고 이모지만 크게 정중앙에 배치
            ctx.font = `${this.radius * 1.3}px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(this.emoji, this.x, this.y + this.radius * 0.1);
        }

        contains(px, py) {
            // 터치 인식 범위를 반지름 + 5로 설정 (노드 간격이 넓어졌으므로 정밀하게)
            return Math.sqrt((px - this.x)**2 + (py - this.y)**2) <= this.radius + 5;
        }
    }

    // 초기 설정 - 노드 간격 대폭 확대
    function generateNodes(zone) {
        let nodes = [];
        let minX = zone === 'p1' ? 60 : canvas.width/2 + 60;
        let maxX = zone === 'p1' ? canvas.width/2 - 60 : canvas.width - 60;
        let minY = 60, maxY = canvas.height - 60;

        // 노드 간의 안전 거리를 크게 늘림 (18%)
        let safeDist = Math.min(canvas.width, canvas.height) * 0.18;

        ENTITIES.forEach(ent => {
            let placed = false;
            let attempts = 0;
            let currentSafeDist = safeDist;
            
            while (!placed && attempts < 500) {
                // 시도가 길어지면 배치가 불가능할 수 있으므로 안전 거리를 서서히 줄여서 보장
                if (attempts > 200) currentSafeDist *= 0.95; 
                
                let x = Math.random() * (maxX - minX) + minX;
                let y = Math.random() * (maxY - minY) + minY;
                
                let isSafe = nodes.every(n => Math.sqrt((n.x - x)**2 + (n.y - y)**2) > currentSafeDist);
                if (isSafe) {
                    nodes.push(new GameNode(ent.id, ent.emoji, zone, x, y));
                    placed = true;
                }
                attempts++;
            }
        });
        return nodes;
    }

    function initGame() {
        resizeCanvas();
        gameNodes.p1 = generateNodes('p1');
        gameNodes.p2 = generateNodes('p2');
        connectedEdges.p1 = [];
        connectedEdges.p2 = [];
        activeLines = {};
        particles = [];
        updateScores();
    }

    // --- 프리드래그 곡선 그리기 함수 ---
    function drawCurve(ctx, points, color, isDashed = false) {
        if (!points || points.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        if (isDashed) ctx.setLineDash([12, 12]);
        else ctx.setLineDash([]);
        
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // --- 그리기 루프 ---
    function render() {
        if (!isPlaying) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ['p1', 'p2'].forEach(zone => {
            ctx.save();
            ctx.beginPath();
            if (zone === 'p1') {
                ctx.rect(0, 0, canvas.width / 2, canvas.height);
            } else {
                ctx.rect(canvas.width / 2, 0, canvas.width / 2, canvas.height);
            }
            ctx.clip();

            connectedEdges[zone].forEach(edge => {
                drawCurve(ctx, edge.points, edge.color, false);
            });

            Object.values(activeLines).forEach(line => {
                if(line.zone === zone) {
                    drawCurve(ctx, line.points, line.color, true);
                }
            });
            ctx.restore();
        });

        gameNodes.p1.forEach(n => n.draw(ctx));
        gameNodes.p2.forEach(n => n.draw(ctx));

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(); particles[i].draw(ctx);
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        gameLoopId = requestAnimationFrame(render);
    }

    // --- 입력 처리 ---
    function getRandomColor() {
        const hue = Math.floor(Math.random() * 360);
        return `hsla(${hue}, 85%, 60%, 0.8)`;
    }

    function isValidEdge(id1, id2) {
        return VALID_EDGES.some(e => (e[0]===id1 && e[1]===id2) || (e[0]===id2 && e[1]===id1));
    }

    function isAlreadyConnected(zone, id1, id2) {
        return connectedEdges[zone].some(e => (e.startId===id1 && e.endId===id2) || (e.startId===id2 && e.endId===id1));
    }

    function triggerPenaltyEffect(zone) {
        const bgId = zone === 'p1' ? 'bg-p1' : 'bg-p2';
        const bgElement = document.getElementById(bgId);
        if(bgElement) {
            bgElement.classList.add('penalty-flash');
            setTimeout(() => {
                bgElement.classList.remove('penalty-flash');
            }, 300);
        }
    }

    // 터치/마우스 시작
    function handleStart(id, x, y) {
        if (!isPlaying) return;
        const zone = x < canvas.width / 2 ? 'p1' : 'p2';
        let node = gameNodes[zone].find(n => n.contains(x, y));
        
        if (node) {
            AudioEngine.playDraw();
            node.isHighlight = true;
            activeLines[id] = {
                zone: zone,
                startNode: node,
                points: [{x: node.x, y: node.y}], 
                color: getRandomColor()
            };
        }
    }

    // 드래그 중 실시간 판정
    function handleMove(id, x, y) {
        if (!isPlaying || !activeLines[id]) return;
        
        let line = activeLines[id];
        line.points.push({x: x, y: y});

        let touchedNode = gameNodes[line.zone].find(n => n !== line.startNode && n.contains(x, y));

        if (touchedNode) {
            line.startNode.isHighlight = false;
            let isConnected = isAlreadyConnected(line.zone, line.startNode.id, touchedNode.id);
            let valid = isValidEdge(line.startNode.id, touchedNode.id);

            if (valid && !isConnected) {
                AudioEngine.playConnect();
                line.points.push({x: touchedNode.x, y: touchedNode.y});
                connectedEdges[line.zone].push({
                    startId: line.startNode.id,
                    endId: touchedNode.id,
                    points: line.points,
                    color: line.color
                });

                let midX = (line.startNode.x + touchedNode.x) / 2;
                let midY = (line.startNode.y + touchedNode.y) / 2;
                for(let i=0; i<15; i++) particles.push(new Particle(midX, midY, line.color));
                
                updateScores();
                checkWinCondition();
            } else if (!isConnected) {
                AudioEngine.playWrong();
                triggerPenaltyEffect(line.zone);
                
                if (connectedEdges[line.zone].length > 0) {
                    connectedEdges[line.zone].shift(); 
                }
                updateScores();
            }
            
            delete activeLines[id];
        }
    }

    function handleEnd(id, x, y) {
        if (!isPlaying || !activeLines[id]) return;
        activeLines[id].startNode.isHighlight = false;
        delete activeLines[id];
    }

    canvas.addEventListener('mousedown', e => {
        const rect = canvas.getBoundingClientRect();
        handleStart('mouse', e.clientX - rect.left, e.clientY - rect.top);
    });
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        handleMove('mouse', e.clientX - rect.left, e.clientY - rect.top);
    });
    window.addEventListener('mouseup', e => {
        const rect = canvas.getBoundingClientRect();
        handleEnd('mouse', e.clientX - rect.left, e.clientY - rect.top);
    });

    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        for (let i = 0; i < e.changedTouches.length; i++) {
            let t = e.changedTouches[i];
            handleStart(t.identifier, t.clientX - rect.left, t.clientY - rect.top);
        }
    }, {passive: false});
    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        for (let i = 0; i < e.changedTouches.length; i++) {
            let t = e.changedTouches[i];
            handleMove(t.identifier, t.clientX - rect.left, t.clientY - rect.top);
        }
    }, {passive: false});
    window.addEventListener('touchend', e => {
        const rect = canvas.getBoundingClientRect();
        for (let i = 0; i < e.changedTouches.length; i++) {
            let t = e.changedTouches[i];
            handleEnd(t.identifier, t.clientX - rect.left, t.clientY - rect.top);
        }
    });

    function updateScores() {
        let p1Remaining = TOTAL_EDGES - connectedEdges.p1.length;
        let p2Remaining = TOTAL_EDGES - connectedEdges.p2.length;
        
        document.getElementById('score-p1').textContent = p1Remaining;
        document.getElementById('score-p2').textContent = p2Remaining;
    }

    function checkWinCondition() {
        let p1Remaining = TOTAL_EDGES - connectedEdges.p1.length;
        let p2Remaining = TOTAL_EDGES - connectedEdges.p2.length;
        
        if (p1Remaining <= 0 || p2Remaining <= 0) {
            endGame();
        }
    }

    function startGame() {
        AudioEngine.init();
        
        if(isPlaying) return;
        
        timeLeft = maxTime;
        isPlaying = true;
        
        // 언어 버튼 숨기기 (게임 플레이 시 몰입)
        document.getElementById('langBtnWrapper').style.display = 'none';
        
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('result-score').style.display = 'none';
        document.getElementById('main-msg').style.display = 'block';
        document.querySelector('.sub-msg').style.display = 'block';

        initGame();
        
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        gameLoopId = requestAnimationFrame(render);

        clearInterval(timerId);
        timerFill.style.width = '100%';
        
        timerId = setInterval(() => {
            timeLeft--;
            let pct = (timeLeft / maxTime) * 100;
            timerFill.style.width = pct + '%';
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    // [다국어 지원을 위해 endGame 로직 수정 (번역된 변수값 활용)]
    function endGame() {
        isPlaying = false;
        clearInterval(timerId);
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        AudioEngine.playWin();

        const overlay = document.getElementById('overlay');
        overlay.style.display = 'flex';

        // 게임 종료 시 다시 언어 버튼 활성화
        document.getElementById('langBtnWrapper').style.display = 'block';

        document.getElementById('main-msg').style.display = 'none';
        document.querySelector('.sub-msg').style.display = 'none';
        
        const resDiv = document.getElementById('result-score');
        resDiv.style.display = 'block';
        
        let p1Remaining = TOTAL_EDGES - connectedEdges.p1.length;
        let p2Remaining = TOTAL_EDGES - connectedEdges.p2.length;

        const t = TRANSLATIONS[currentLangCode]; // 현재 선택된 언어 참조

        let msg = "";
        if (p1Remaining < p2Remaining) msg = `<span style="color:#ff6b6b; font-size:42px; font-weight:800;">${t.winLeft}</span>`;
        else if (p2Remaining < p1Remaining) msg = `<span style="color:#4dabf7; font-size:42px; font-weight:800;">${t.winRight}</span>`;
        else msg = `<span style="color:#fff; font-size:42px; font-weight:800;">${t.draw}</span>`;

        resDiv.innerHTML = `
            <div style="font-size:30px; margin-bottom:10px; color:#ddd;">${t.remainNets}</div>
            <div style="font-size:70px; margin-bottom:30px; font-family:'Nanum Gothic'; font-weight:800; letter-spacing:2px; display:flex; justify-content:center; align-items:baseline;">
                <span style="color:#ff6b6b">${p1Remaining}<span style="font-size:30px; margin-left:5px;">${t.unit.trim()}</span></span> 
                <span style="font-size:40px; color:#aaa; margin: 0 15px;">:</span> 
                <span style="color:#4dabf7">${p2Remaining}<span style="font-size:30px; margin-left:5px;">${t.unit.trim()}</span></span>
            </div>
            ${msg}
        `;
    }

    // 초기 실행 세팅
    initializeLanguage();
</script>
</body>
</html>
