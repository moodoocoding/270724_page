    <script>
        // 기존 게임 디자인(버튼 등)이 망가지지 않도록 Tailwind 초기화(Preflight) 비활성화

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ========================================================
           1. 기존 게임 스타일 (절대 수정/삭제하지 않음)
           ======================================================== */
        body {
            margin: 0; padding: 0;
            background-color: #0b0e27;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            overflow: hidden;
            font-family: 'Jua', sans-serif;
            touch-action: none; user-select: none;
        }

        #top-area {
            position: absolute; top: 0; left: 0; width: 100%; height: 30%;
            display: none; flex-direction: column; justify-content: flex-start; align-items: center;
            z-index: 3000; pointer-events: none;
            padding-top: 20px; box-sizing: border-box;
        }
        
        #game-area {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
        }

        .player-zone {
            flex: 1; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .player-zone:last-child { border-right: none; }

        .score-board {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); padding: 10px 30px;
            border-radius: 40px; 
            border: 3px solid rgba(255,255,255,0.3);
            pointer-events: none;
            z-index: 50; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .score-num { font-size: 5vw; color: white; margin: 0 15px; font-weight: bold; }
        .score-colon { font-size: 4vw; color: #aaa; }

        .mission-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 8px 30px;
            border-radius: 20px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: auto;
            margin-bottom: 5px;
        }

        #mission-title { color: #aaa; font-size: 1.2vw; margin-bottom: 2px; }
        #mission-target { 
            color: #FFD700; font-size: 3.5vw; font-weight: bold; 
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .timer-circle {
            width: 6vw; height: 6vw;
            background: #ff4757; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 3px solid white; box-shadow: 0 0 20px #ff4757;
            margin-top: 5px; animation: pulse 1s infinite;
            transition: transform 0.2s, background 0.2s;
        }
        #timer-text { color: white; font-size: 3vw; font-weight: bold; }

        .canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        .canvas-fg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; cursor: crosshair; }

        .lock-btn {
            position: absolute; bottom: 5%; 
            padding: 1.5vh 3vw; font-size: 2vw;
            border: none; border-radius: 50px; cursor: pointer;
            font-family: 'Jua', sans-serif; color: #0b0e27;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: 0.2s; 
            z-index: 200; 
        }
        .lock-btn:active { transform: scale(0.95); }
        #btn-left { background: #FFD700; }
        #btn-left:hover { background: #ffe44d; }
        #btn-right { background: #70ffea; }
        #btn-right:hover { background: #9dfff2; }
        .lock-btn.locked { background: #555 !important; color: #aaa; pointer-events: none; }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 14, 39, 0.95);
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; z-index: 1000;
            text-align: center;
        }
        .title-logo {
            font-size: 5vw; color: #fff; margin-bottom: 20px;
            text-shadow: 0 0 20px #00ffff;
            animation: bounce 2s infinite;
        }
        
        .rules-box {
            background: rgba(255,255,255,0.1); padding: 20px 40px; border-radius: 15px;
            margin-bottom: 30px; color: #ddd; font-size: 1.5vw; line-height: 1.6;
            text-align: left; border: 1px solid rgba(255,255,255,0.2); max-width: 60%;
        }
        .rules-box strong { color: #FFD700; }
        
        .start-btn, #replay-btn {
            padding: 15px 50px; font-size: 2.5vw; color: #0b0e27;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white; border: none; border-radius: 50px; cursor: pointer;
            font-family: 'Jua', sans-serif; box-shadow: 0 0 20px rgba(0, 114, 255, 0.5);
            transition: transform 0.1s;
        }

        #replay-btn { display: none; position: absolute; bottom: 15%; z-index: 2000; left: 50%; transform: translateX(-50%); }

        #reset-match-btn, #fullscreen-btn {
            position: absolute; bottom: 20px;
            padding: 10px 25px;
            font-size: 1.5vw;   
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 10px;
            cursor: pointer; z-index: 2000; font-family: 'Jua', sans-serif;
            transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        #reset-match-btn { left: 20px; }
        #fullscreen-btn { right: 20px; } 
        #reset-match-btn:hover, #fullscreen-btn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }

        .other-games-link {
            margin-top: 25px; color: #888; text-decoration: none; font-size: 1.8vw;
            transition: color 0.2s, transform 0.2s; pointer-events: auto;
        }
        .other-games-link:hover { color: #ccc; transform: scale(1.05); }

        #message-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center;
            align-items: center; flex-direction: column; z-index: 800; pointer-events: none;
        }
        .big-message {
            font-size: 6vw; color: white; text-shadow: 0 0 30px #ff00de;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center; line-height: 1.3;
        }

        .result-angle {
            position: absolute; top: 70%; width: 100%; text-align: center;
            font-size: 6vw; opacity: 0; pointer-events: none; 
            z-index: 50; color: white; 
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8), 0 0 15px currentColor;
        }
        .winner-crown {
            position: absolute; top: 20vh; left: 50%; transform: translateX(-50%) scale(0);
            font-size: 5vw; color: #FFD700; z-index: 50; 
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* ========================================================
           2. 신규 추가: 다국어 UI 모달 & 토스트 스타일
           ======================================================== */
        .noto-sans { font-family: 'Noto Sans KR', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay {
            opacity: 0; visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            transform: scale(0.95) translateY(-10px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .toast-ui {
            transform: translateY(100%); opacity: 0; transition: all 0.3s ease;
        }
        .toast-ui.show { transform: translateY(0); opacity: 1; }

        /* 동적 폰트 리사이징 보조 클래스 */
        .auto-resize { white-space: nowrap; }
    </style>
</head>
<body>

                </div>

    <script>
        // --- 1. 다국어 모달 UI 내부 텍스트 ---
        const uiTranslations = {
            'ko': { title: '언어 및 지역 선택', desc: '선호하는 언어를 선택하세요.', search: '언어 검색 (예: English, 한국어...)', empty: '검색 결과가 없습니다.', toast: '언어가 변경되었습니다.' },

            'ja': { title: '言語と地域の選択', desc: '希望する言語を選択してください。', search: '言語を検索 (例: 日本語...)', empty: '結果が見つかりません。', toast: '言語が変更されました。' },
            'es': { title: 'Idioma y Región', desc: 'Selecciona tu idioma preferido.', search: 'Buscar idioma (ej. Español...)', empty: 'No se encontraron resultados.', toast: 'Idioma cambiado.' },
            'fr': { title: 'Langue et Région', desc: 'Sélectionnez votre langue.', search: 'Rechercher (ex: Français...)', empty: 'Aucun résultat trouvé.', toast: 'Langue modifiée.' },
            'ru': { title: 'Язык и Регион', desc: 'Выберите предпочитаемый язык.', search: 'Поиск языка (напр. Русский...)', empty: 'Ничего не найдено.', toast: 'Язык изменен.' },
            'vi': { title: 'Ngôn ngữ & Khu vực', desc: 'Chọn ngôn ngữ của bạn.', search: 'Tìm kiếm (VD: Tiếng Việt...)', empty: 'Không tìm thấy kết quả.', toast: 'Ngôn ngữ đã được thay đổi.' },

            'hi': { title: 'भाषा और क्षेत्र', desc: 'अपनी पसंदीदा भाषा चुनें।', search: 'भाषा खोजें (उदा: हिन्दी...)', empty: 'कोई परिणाम नहीं मिला।', toast: 'भाषा बदल दी गई है।' },
            'bn': { title: 'ভাষা এবং অঞ্চল', desc: 'আপনার পছন্দের ভাষা নির্বাচন করুন।', search: 'ভাষা অনুসন্ধান করুন...', empty: 'কোন ফলাফল পাওয়া যায়নি।', toast: 'ভাষা পরিবর্তন করা হয়েছে।' },

        // 16개국 언어 데이터베이스
        const languageOptions = [
            { code: 'ko', country: 'kr', name: '한국어', enName: 'Korean' },
            { code: 'en', country: 'us', name: 'English', enName: 'English' },

            { code: 'es', country: 'es', name: 'Español', enName: 'Spanish' },

        // --- 3. 언어 감지 및 세팅 로직 ---
        let currentLang = 'en';

        function getLanguagePriority() {
            // 1순위: URL 파라미터
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            if (langParam && translations[langParam]) return langParam;

            // 2순위: 로컬 스토리지
            const savedLang = localStorage.getItem('kingsmath_lang');
            if (savedLang && translations[savedLang]) return savedLang;

            // 3순위: 브라우저 기본 설정
            const browserLang = navigator.language.slice(0, 2);
            if (translations[browserLang]) return browserLang;

            // 기본값
            return 'en';
        }

        function setLanguage(langCode, showToastMsg = false) {
            if (!translations[langCode]) return;
            currentLang = langCode;
            
            // 상태 유지 (로컬 스토리지)
            localStorage.setItem('kingsmath_lang', langCode);
            
            // 링크 공유를 위한 URL 업데이트 (새로고침 없이)
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', langCode);
            window.history.pushState({}, '', newUrl);

            // 데이터 갱신
            updateUIComponents();
            updateGameTexts();
            updateSEO();
            setTimeout(autoResizeText, 100);

            // 토스트 알림
            if (showToastMsg) {
                const langObj = languageOptions.find(l => l.code === langCode);
                showToast(langObj ? langObj.name : langCode);
            }
        }

        // --- 4. UI 렌더링 및 모달 조작 ---
        const modal = document.getElementById('langModal');
        const triggerBtn = document.getElementById('langTriggerBtn');
        const searchInput = document.getElementById('searchInput');
        const grid = document.getElementById('languageGrid');
        const noResult = document.getElementById('noResult');
        const toast = document.getElementById('toastNotification');
        let toastTimeout;

            const langObj = languageOptions.find(l => l.code === currentLang);

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playTone(freq, type, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function playDrawSound() { playTone(200 + Math.random()*100, 'sine', 0.1); }

        function playTick() { playTone(1000, 'sine', 0.05); }
        function playRiseSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 1.5);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }

        const colors = { p1: { line: '#FFD700', guide: 'rgba(255, 215, 0, 0.2)' }, p2: { line: '#70ffea', guide: 'rgba(112, 255, 234, 0.2)' }, ref: '#ff4757' };
        let gameState = 'ready', currentRound = 1, currentMission = 'perpendicular', nextMissionType = null, timeLeft = 20, timerInterval, p1Wins = 0, p2Wins = 0;

        const p1 = { id: 'left', canvasBg: null, ctxBg: null, canvasFg: null, ctxFg: null, color: colors.p1, refLine: null, fixedStart: null, userLine: null, isDrawing: false, locked: false, score: 0, particles: [], img: imgP1, cx: 0, cy: 0, anim: { active: false, state: '', yOffset: 0, speed: 0 } };
        const p2 = { id: 'right', canvasBg: null, ctxBg: null, canvasFg: null, ctxFg: null, color: colors.p2, refLine: null, fixedStart: null, userLine: null, isDrawing: false, locked: false, score: 0, particles: [], img: imgP2, cx: 0, cy: 0, anim: { active: false, state: '', yOffset: 0, speed: 0 } };

        function initPlayer(p, side) {

        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); }

        function startGame() {

        function startRound(roundNum) {

            if (currentRound === 1) currentMission = 'perpendicular'; 
            else if (currentRound === 2) currentMission = 'parallel';

            const t = translations[currentLang];

            resetPlayerRound(p1); resetPlayerRound(p2); resizeAll();

        function resetPlayerRound(p) {
            p.userLine = null; p.locked = false; p.score = 0; p.particles = []; p.anim = { active: false, state: '', yOffset: 0, speed: 0 };

        function updateScoreBoard() { document.getElementById('score-val-left').innerText = p1Wins; document.getElementById('score-val-right').innerText = p2Wins; }

        function generateProblem(p) {
            const w = p.canvasBg.width, h = p.canvasBg.height;
            const cx = w/2, cy = h * 0.6; 
            const angle = Math.random()*Math.PI; 
            const length = Math.min(w, h) * 0.55;

            const dx = Math.cos(angle)*(length/2), dy = Math.sin(angle)*(length/2), ox = (Math.random()-0.5)*60, oy = (Math.random()-0.5)*60;
            const x1 = cx - dx + ox, y1 = cy - dy + oy, x2 = cx + dx + ox, y2 = cy + dy + oy;
            p.refLine = { x1, y1, x2, y2, angle: Math.atan2(dy, dx) };

            if (currentMission === 'parallel') {
                const isHorizontal = Math.abs(x1 - x2) > Math.abs(y1 - y2);
                let fsX, fsY;
                const perpAngle = p.refLine.angle + Math.PI/2;
                
                if (isHorizontal) {
                    const midX = (x1 + x2) / 2; const midY = (y1 + y2) / 2; const dist = 120;
                    let offX = Math.cos(perpAngle) * dist; let offY = Math.sin(perpAngle) * dist;
                    if (offY < 0) { offX = -offX; offY = -offY; } 
                    const shiftX = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 80 + 20);
                    fsX = midX + offX + shiftX; fsY = midY + offY;
                    if (fsY > h - 50) fsY = h - 50; if (fsX < 50) fsX = 50; if (fsX > w - 50) fsX = w - 50;
                } else {
                    const topPt = y1 < y2 ? {x: x1, y: y1} : {x: x2, y: y2}; const dist = 100;
                    fsX = topPt.x + Math.cos(perpAngle) * dist; fsY = topPt.y + Math.sin(perpAngle) * dist;
                    if (fsX < 50 || fsX > w - 50 || fsY < 100) { fsX = topPt.x - Math.cos(perpAngle) * dist; fsY = topPt.y - Math.sin(perpAngle) * dist; }
                }
                p.fixedStart = { x: fsX, y: fsY };
            } else { p.fixedStart = null; }
        }

        function gameLoop() {
            timeLeft -= 0.1;
            if (timeLeft <= 5.0 && timeLeft > 0 && Math.abs(timeLeft % 1) < 0.1) playTick();
            if (timeLeft <= 0) { timeLeft = 0; endRound(); }
            updateTimerUI();
        }

        function updateTimerUI() {
            const dt = Math.ceil(timeLeft), timerEl = document.getElementById('timer-text'), bg = document.getElementById('timer-bg');
            timerEl.innerText = dt;
            if (timeLeft <= 5) { bg.style.background = '#ff0000'; bg.style.transform = `scale(${1 + (timeLeft%1)*0.3})`; }
            else { bg.style.background = '#ff4757'; bg.style.transform = 'scale(1)'; }
        }

        function startDraw(e, p) {
            if (gameState !== 'playing' || p.locked) return; e.preventDefault();
            const rect = p.canvasFg.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            p.isDrawing = true;
            if (currentMission === 'parallel' && p.fixedStart) { p.userLine = { x1: p.fixedStart.x, y1: p.fixedStart.y, x2: x, y2: y }; } 
            else { p.userLine = { x1: x, y1: y, x2: x, y2: y }; }
        }
        function moveDraw(e, p) {
            if (!p.isDrawing || p.locked) return; e.preventDefault();
            const rect = p.canvasFg.getBoundingClientRect();
            p.userLine.x2 = e.clientX - rect.left; p.userLine.y2 = e.clientY - rect.top;
            if (Math.random() > 0.85) playDrawSound();
        }
        function endDraw(e, p) {
            if (!p.isDrawing) return; p.isDrawing = false;
            if (p.userLine && Math.hypot(p.userLine.x2 - p.userLine.x1, p.userLine.y2 - p.userLine.y1) < 20) p.userLine = null;
        }

        function lockPlayer(p) {
            if (gameState !== 'playing' || p.locked || !p.userLine) return;

            const btn = document.getElementById(`btn-${p.id}`);

        function endRound() {
            clearInterval(timerInterval); gameState = 'round_end';
            document.getElementById('btn-left').style.display = 'none'; document.getElementById('btn-right').style.display = 'none';

                let ra = Math.atan2(p.refLine.y2 - p.refLine.y1, p.refLine.x2 - p.refLine.x1);
                let ua = Math.atan2(p.userLine.y2 - p.userLine.y1, p.userLine.x2 - p.userLine.x1);
                let diff = Math.abs(ra*180/Math.PI - ua*180/Math.PI) % 180;
                p.score = parseFloat((currentMission === 'parallel' ? Math.min(diff, 180-diff) : Math.abs(90-diff)).toFixed(1));
            });

            setTimeout(autoResizeText, 50);
            const e1 = p1.userLine ? p1.score : 999, e2 = p2.userLine ? p2.score : 999;

        function checkMatchStatus() {
            const t = translations[currentLang];

            else if (currentRound === 1) showMsgAndNext(`${t.msg_round} 2<br>${t.msg_para_short} ${t.msg_draw_cmd}`, 2);

        function showMsgAndNext(t, n) { const o = document.getElementById('message-overlay'); const m = document.getElementById('msg-text'); m.innerHTML = t; o.style.display = 'flex'; setTimeout(autoResizeText, 50); setTimeout(() => { o.style.display = 'none'; startRound(n); }, 2500); }
        function finishMatch() { gameState = 'match_end'; playWinSound(); setTimeout(() => { document.getElementById('replay-btn').style.display = 'block'; }, 1000); }

        function animate() { [p1, p2].forEach(p => { if (p.anim.active && p.anim.state === 'win') { p.anim.speed *= 1.05; p.anim.yOffset -= p.anim.speed; createThrustParticles(p, p.cx, p.cy + p.anim.yOffset + 110, '#FFD700'); } }); drawScene(p1); drawScene(p2); updateParticles(p1); updateParticles(p2); requestAnimationFrame(animate); }

        function drawScene(p) {
            if (!p.ctxBg || !p.ctxFg) return;
            const ctxBg = p.ctxBg; ctxBg.clearRect(0, 0, p.canvasBg.width, p.canvasBg.height);
            
            if (p.refLine) { 
                ctxBg.beginPath(); ctxBg.moveTo(p.refLine.x1, p.refLine.y1); ctxBg.lineTo(p.refLine.x2, p.refLine.y2); 
                ctxBg.strokeStyle = colors.ref; ctxBg.lineWidth = 4; ctxBg.setLineDash([10, 10]); ctxBg.stroke(); ctxBg.setLineDash([]); 
            }

            if (currentMission === 'parallel' && p.fixedStart && gameState === 'playing' && !p.locked) {
                ctxBg.save(); ctxBg.beginPath(); ctxBg.arc(p.fixedStart.x, p.fixedStart.y, 8, 0, Math.PI*2); 
                ctxBg.fillStyle = "#fff"; ctxBg.shadowBlur = 15; ctxBg.shadowColor = "#00ffff"; ctxBg.fill(); ctxBg.restore();
            }

            if (p.userLine) {
                if (gameState === 'round_end' || gameState === 'match_end') {
                    ctxBg.save(); let ra = Math.atan2(p.refLine.y2-p.refLine.y1, p.refLine.x2-p.refLine.x1); let ta = currentMission === 'parallel' ? ra : ra+Math.PI/2;
                    ctxBg.translate(p.userLine.x1, p.userLine.y1); ctxBg.rotate(ta); ctxBg.beginPath(); ctxBg.moveTo(-2000, 0); ctxBg.lineTo(2000, 0); ctxBg.strokeStyle = '#00ff00'; ctxBg.lineWidth = 3; ctxBg.setLineDash([15, 10]); ctxBg.stroke(); ctxBg.restore();
                }
                if (p.isDrawing) { ctxBg.beginPath(); ctxBg.moveTo(p.userLine.x1, p.userLine.y1); ctxBg.lineTo(p.userLine.x2, p.userLine.y2); ctxBg.strokeStyle = p.color.guide; ctxBg.lineWidth = 1; ctxBg.stroke(); }
                ctxBg.beginPath(); ctxBg.moveTo(p.userLine.x1, p.userLine.y1); ctxBg.lineTo(p.userLine.x2, p.userLine.y2); ctxBg.strokeStyle = p.locked ? '#888' : p.color.line; ctxBg.lineWidth = 8; ctxBg.lineCap = 'round'; ctxBg.stroke();
                ctxBg.fillStyle = '#fff'; ctxBg.beginPath(); ctxBg.arc(p.userLine.x1, p.userLine.y1, 6, 0, Math.PI*2); ctxBg.fill(); ctxBg.beginPath(); ctxBg.arc(p.userLine.x2, p.userLine.y2, 6, 0, Math.PI*2); ctxBg.fill();
            }

            const ctxFg = p.ctxFg; ctxFg.clearRect(0, 0, p.canvasFg.width, p.canvasFg.height);
            drawParticles(ctxFg, p.particles);

            if (p.anim.active && p.anim.state === 'win') { 
                ctxFg.save(); ctxFg.translate(p.cx, p.cy + p.anim.yOffset); ctxFg.scale(8, 8); 
                if (p.img.complete) ctxFg.drawImage(p.img, -25, -25, 50, 50); 
                ctxFg.restore(); 
            }
            else if (p.img.complete) { 
                const iconY = p.canvasFg.height*0.04, size = 200; 
                ctxFg.drawImage(p.img, p.cx-size/2, iconY, size, size); 
            }
        }

        function createThrustParticles(p, x, y, c) { for(let i=0; i<5; i++) p.particles.push({ x: x+(Math.random()-0.5)*20, y: y, vx: (Math.random()-0.5)*2, vy: Math.random()*5+5, life: 1.0, color: c, size: Math.random()*5+2 }); }
        function createConfetti(p) { const cx = p.cx, cy = p.cy; for(let i=0; i<40; i++) p.particles.push({ x: cx, y: cy, vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20-5, life: 1.0, color: p.color.line, size: Math.random()*6+2 }); }
        function updateParticles(p) { p.particles.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; if(!(p.anim.active && p.anim.state === 'win')) pt.vy += 0.5; pt.life -= 0.02; }); p.particles = p.particles.filter(pt => pt.life > 0); }
        function drawParticles(ctx, ps) { ps.forEach(pt => { ctx.globalAlpha = pt.life; ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill(); }); ctx.globalAlpha = 1.0; }
    </script>
