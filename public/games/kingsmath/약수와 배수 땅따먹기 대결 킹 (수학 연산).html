        };

        let currentLang = 'en';

        // 요소 가져오기
        const langTriggerBtn = document.getElementById('langTriggerBtn');
        const langModal = document.getElementById('langModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const searchInput = document.getElementById('searchInput');
        const languageGrid = document.getElementById('languageGrid');
        const noResult = document.getElementById('noResult');
        const currentFlagImg = document.getElementById('currentFlag');
        const currentLangSpan = document.getElementById('currentLangName');
        const toast = document.getElementById('toastNotification');
        const toastLangName = document.getElementById('toastLangName');
        const langSwitcherContainer = document.getElementById('langSwitcherContainer');
        let toastTimeout;

        // 글자 수 기반 동적 폰트 조절 로직
        function adjustFontSizeByLength(elementId, baseSize, maxLength) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const len = el.innerText.length;
            if (len > maxLength) {
                const newSize = baseSize * (maxLength / len);
                el.style.fontSize = Math.max(newSize, baseSize * 0.45) + 'rem';
            } else {
                el.style.fontSize = baseSize + 'rem';
            }
        }

        function getInitialLang() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && dict[urlLang]) return urlLang;
            const storedLang = localStorage.getItem('kingsmath_lang');
            if (storedLang && dict[storedLang]) return storedLang;
            const navLang = navigator.language.slice(0, 2);
            if (dict[navLang]) return navLang;
            return 'en';
        }

        function changeLanguage(langCode) {
            currentLang = langCode;
            localStorage.setItem('kingsmath_lang', langCode);
            
            // URL 업데이트 (상태 유지 및 공유 기능)
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', langCode);
            window.history.pushState({}, '', newUrl);

            applyLanguage();
        }

        function applyLanguage() {
            const data = dict[currentLang];
            const uiData = uiTranslations[currentLang] || uiTranslations['en'];
            const langObj = languages.find(l => l.code === currentLang) || languages[1];
            
            // 버튼 및 UI 텍스트 업데이트
            currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;
            currentLangSpan.textContent = langObj.name;
            document.getElementById('ui-title').textContent = uiData.title;
            document.getElementById('ui-desc').textContent = uiData.desc;
            document.getElementById('searchInput').placeholder = uiData.search;
            document.getElementById('ui-empty').textContent = uiData.empty;
            document.getElementById('ui-toast').textContent = uiData.toast;

            // SEO & Title 업데이트
            document.title = data.title;
            document.querySelector('meta[name="description"]').setAttribute("content", data.desc);
            document.querySelector('meta[name="keywords"]').setAttribute("content", data.keywords);
            document.querySelector('meta[property="og:title"]').setAttribute("content", data.title);
            document.querySelector('meta[property="og:description"]').setAttribute("content", data.desc);
            document.querySelector('meta[property="og:site_name"]').setAttribute("content", data.siteName);

            // 게임 내 텍스트 업데이트
            document.getElementById('top-header').innerText = data.topHeader;
            document.getElementById('main-title').innerText = data.mainTitle;
            document.getElementById('btn-divisor').innerText = data.btnDivisor;
            document.getElementById('btn-multiple').innerText = data.btnMultiple;
            document.getElementById('btn-common-div').innerText = data.btnCommonDiv;
            document.getElementById('btn-common-mult').innerText = data.btnCommonMult;
            document.getElementById('game-desc').innerText = data.gameDesc;
            document.getElementById('start-btn').innerText = data.startBtn;
            document.getElementById('question-text').innerText = data.waiting;
            document.getElementById('p1-label').innerText = data.p1Name;
            document.getElementById('p2-label').innerText = data.p2Name;
            document.querySelectorAll('.txt-select').forEach(el => el.innerText = data.selectTxt);
            document.querySelectorAll('.submit-btn').forEach(el => el.innerText = data.submitBtn);
            document.getElementById('restart-btn').innerText = data.restartBtn;

            // 하이퍼링크 (전체 새 창이 아닌 현재창 self)
            document.querySelectorAll('.more-games-link').forEach(link => {
                link.innerText = data.moreGames;
                link.href = data.homeLink;
            });

            // 문제 진행 중 언어 변경 시
            if(document.getElementById('question-text').innerText !== data.waiting && state && state.problemInfo) {
                document.getElementById('question-text').innerText = getLocalizedProblemText(state.problemInfo);
                document.getElementById('final-question-text').innerText = getLocalizedProblemText(state.problemInfo);
            }

            // 동적 폰트 사이즈 조절 로직 적용 (메인 타이틀 12자 이상, 버튼 8자 이상 시 축소)
            adjustFontSizeByLength('main-title', 4.5, 12);
            document.querySelectorAll('.dynamic-font').forEach(el => adjustFontSizeByLength(el.id, 2.2, 8));
        }

        // 언어 목록 렌더링 함수 (UI)
        function renderLanguages(filterText = '') {
            languageGrid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            const filteredLangs = languages.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                languageGrid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                languageGrid.classList.remove('hidden');
                noResult.classList.add('hidden');
                noResult.classList.remove('flex');

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                    const stateClasses = isSelected 
                        ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                        : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;
                    btn.innerHTML = `
                        <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                            <img src="https://flagcdn.com/w40/${lang.country}.png" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col items-start">
                            <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                            <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                    `;
                    btn.addEventListener('click', () => {
                        changeLanguage(lang.code);
                        closeModal();
                        showToast(lang.name);
                        renderLanguages(searchInput.value);
                    });
                    languageGrid.appendChild(btn);
                });
            }
        }

        // 모달 및 토스트 알림 제어
        function openModal() { langModal.classList.add('active'); document.body.style.overflow = 'hidden'; setTimeout(() => searchInput.focus(), 100); }
        function closeModal() { langModal.classList.remove('active'); document.body.style.overflow = ''; }
        function showToast(langName) {
            toastLangName.textContent = langName;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 이벤트 리스너
        langTriggerBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        langModal.addEventListener('click', (e) => { if (e.target === langModal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && langModal.classList.contains('active')) closeModal(); });
        searchInput.addEventListener('input', (e) => renderLanguages(e.target.value));

        /* ==============================================================
           기존 게임 로직
        ============================================================== */
        function getLocalizedProblemText(info) {
            const data = dict[currentLang];
            if (config.topic === 'divisor') return data.probDiv.replace('{n}', info.n1);
            if (config.topic === 'multiple') return data.probMult.replace('{n}', info.n1);
            if (config.topic === 'commonDivisor') return data.probComDiv.replace('{n}', info.n1).replace('{m}', info.n2);
            if (config.topic === 'commonMultiple') return data.probComMult.replace('{n}', info.n1).replace('{m}', info.n2);
            return "";
        }

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('touchmove', event => { if (event.scale !== 1) event.preventDefault(); }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', event => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) event.preventDefault();
            lastTouchEnd = now;
        }, false);
        document.ondragstart = function() { return false; };

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // 홈으로 이동 시 상태 및 UI 복구
        function resetToHome() {
            if (state.timerId) clearInterval(state.timerId);
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            // 홈화면에서 언어 선택기 노출
            langSwitcherContainer.style.display = 'block'; 
            SFX.select();
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(vol * 0.1, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        const SFX = {
            select: () => playTone(800, 'sine', 0.1),
            start: () => {
                playTone(400, 'triangle', 0.1);
                setTimeout(() => playTone(600, 'triangle', 0.1), 100);
                setTimeout(() => playTone(800, 'triangle', 0.3), 200);
            },
            correct: () => {
                setTimeout(() => playTone(523.25, 'sine', 0.4), 0); 
                setTimeout(() => playTone(659.25, 'sine', 0.4), 200); 
                setTimeout(() => playTone(783.99, 'sine', 0.8), 400); 
            },
            wrong: () => {
                playTone(150, 'sawtooth', 0.4);
                setTimeout(() => playTone(100, 'sawtooth', 0.4), 100);
            },
            win: () => {
                const now = audioCtx.currentTime;
                [523, 659, 783, 1046].forEach((f, i) => {
                    setTimeout(() => playTone(f, 'square', 0.2), i*100);
                });
                setTimeout(() => playTone(1046, 'square', 1.0), 400);
            },
            tick: () => playTone(1200, 'square', 0.05, 0.5)
        };

        let config = { topic: 'divisor' };
        let state = { gridData: [], correctNumbers: [], p1Selection: new Set(), p2Selection: new Set(), isGameOver: false, timer: 60, timerId: null, problemInfo: {} };

        function setTopic(topic, btn) {
            config.topic = topic;
            document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            SFX.select();
        }

        function startGame() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            // 게임 몰입을 위해 언어 선택기 숨김
            langSwitcherContainer.style.display = 'none'; 
            SFX.start();
            initGame();
        }

        function initGame() {
            state.p1Selection.clear();
            state.p2Selection.clear();
            state.isGameOver = false;
            state.timer = 60;
            updateUI('p1');
            updateUI('p2');
            document.getElementById('timer').innerText = state.timer;

            const problem = generateProblem();
            state.gridData = problem.gridData;
            state.correctNumbers = problem.correctPool;
            state.problemInfo = { n1: problem.n1, n2: problem.n2 };
            
            const localizedText = getLocalizedProblemText(state.problemInfo);
            document.getElementById('question-text').innerText = localizedText;
            document.getElementById('final-question-text').innerText = localizedText;

            renderBoard('p1', state.gridData);
            renderBoard('p2', state.gridData);

            if (state.timerId) clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timer--;
                document.getElementById('timer').innerText = state.timer;
                if(state.timer <= 5 && state.timer > 0) SFX.tick(); 
                if(state.timer <= 0) timeOver();
            }, 1000);
        }

        function generateProblem() {
            let n1, n2;
            let correctPool = []; 
            let maxRange = 100;

            if (config.topic === 'divisor') {
                while(true) {
                    n1 = Math.floor(Math.random() * 80) + 20; 
                    correctPool = [];
                    for(let i=1; i<=n1; i++) if(n1%i===0) correctPool.push(i);
                    if(correctPool.length >= 4) break;
                }
            } else if (config.topic === 'multiple') {
                while(true) {
                    n1 = Math.floor(Math.random() * 14) + 2; 
                    correctPool = [];
                    for(let i=1; i*n1<=100; i++) correctPool.push(i*n1);
                    if(correctPool.length >= 4) break;
                }
            } else if (config.topic === 'commonDivisor') {
                while(true) {
                    n1 = Math.floor(Math.random() * 90) + 10;
                    n2 = Math.floor(Math.random() * 90) + 10;
                    correctPool = [];
                    for(let i=1; i<=Math.min(n1,n2); i++) {
                        if(n1%i===0 && n2%i===0) correctPool.push(i);
                    }
                    if(correctPool.length >= 4) break;
                }
            } else if (config.topic === 'commonMultiple') {
                maxRange = 200; 
                while(true) {
                    n1 = Math.floor(Math.random() * 8) + 2;
                    n2 = Math.floor(Math.random() * 8) + 2;
                    if(n1===n2) continue;
                    const gcd = (a, b) => b ? gcd(b, a%b) : a;
                    const lcm = (n1 * n2) / gcd(n1, n2);
                    correctPool = [];
                    for(let i=1; i*lcm<=maxRange; i++) correctPool.push(i*lcm);
                    if(correctPool.length >= 4) break;
                }
            }

            let finalCorrects = [...correctPool]; 
            if (finalCorrects.length > 10) {
                for (let i = finalCorrects.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [finalCorrects[i], finalCorrects[j]] = [finalCorrects[j], finalCorrects[i]];
                }
                finalCorrects = finalCorrects.slice(0, 10);
            } else {
                while(finalCorrects.length < 10) {
                    const pick = correctPool[Math.floor(Math.random() * correctPool.length)];
                    finalCorrects.push(pick);
                }
            }
            
            state.correctNumbers = correctPool.sort((a,b)=>a-b);

            let finalWrongs = [];
            while(finalWrongs.length < 15) {
                const r = Math.floor(Math.random() * maxRange) + 1;
                let isActuallyCorrect = false;
                if (config.topic === 'divisor' && n1 % r === 0) isActuallyCorrect = true;
                if (config.topic === 'multiple' && r % n1 === 0) isActuallyCorrect = true;
                if (config.topic === 'commonDivisor' && n1 % r === 0 && n2 % r === 0) isActuallyCorrect = true;
                if (config.topic === 'commonMultiple' && r % n1 === 0 && r % n2 === 0) isActuallyCorrect = true;
                if (!isActuallyCorrect) finalWrongs.push(r);
            }

            let gridData = [...finalCorrects.map(n => ({val: n, isAns: true})), 
                            ...finalWrongs.map(n => ({val: n, isAns: false}))];
            
            for (let i = gridData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [gridData[i], gridData[j]] = [gridData[j], gridData[i]];
            }
            return { n1, n2, gridData, correctPool };
        }

        function renderBoard(player, data) {
            const board = document.getElementById(`${player}-board`);
            board.innerHTML = '';
            data.forEach((item, idx) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = item.val;
                cell.onpointerdown = () => toggleSelect(player, idx, cell);
                board.appendChild(cell);
            });
        }

        function toggleSelect(player, idx, cell) {
            if(state.isGameOver) return;
            const selection = player === 'p1' ? state.p1Selection : state.p2Selection;
            if (selection.has(idx)) {
                selection.delete(idx);
                cell.classList.remove('selected');
                SFX.select();
            } else {
                if(selection.size >= 10) {
                    showFeedback(player, dict[currentLang].feedSelected, "#ffd60a");
                    SFX.wrong(); 
                    return;
                }
                selection.add(idx);
                cell.classList.add('selected');
                SFX.select();
            }
            updateUI(player);
        }

        function updateUI(player) {
            const selection = player === 'p1' ? state.p1Selection : state.p2Selection;
            document.getElementById(`${player}-count`).innerText = selection.size;
            const btn = document.getElementById(`${player}-submit`);
            if(selection.size === 10) btn.classList.add('ready');
            else btn.classList.remove('ready');
        }

        function submitAnswer(player) {
            if(state.isGameOver) return;
            const selection = player === 'p1' ? state.p1Selection : state.p2Selection;
            if(selection.size !== 10) return; 
            let wrongCount = 0;
            selection.forEach(idx => {
                if (!state.gridData[idx].isAns) wrongCount++;
            });
            if (wrongCount === 0) {
                state.isGameOver = true;
                endGame(player, dict[currentLang].feedPerfect);
            } else {
                SFX.wrong();
                showFeedback(player, dict[currentLang].feedWrong.replace('{n}', wrongCount), "#ff4757");
            }
        }

        function showFeedback(player, msg, color) {
            const el = document.getElementById(`${player}-msg`);
            el.innerText = msg;
            el.style.borderColor = color; el.style.color = color;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        function timeOver() {
            state.isGameOver = true;
            clearInterval(state.timerId);
            SFX.wrong(); 
            const p1Score = countCorrect(state.p1Selection);
            const p2Score = countCorrect(state.p2Selection);
            if (p1Score > p2Score) endGame('p1', dict[currentLang].winReasonTime);
            else if (p2Score > p1Score) endGame('p2', dict[currentLang].winReasonTime);
            else endGame('draw', dict[currentLang].winReasonDraw);
        }

        function countCorrect(selection) {
            let cnt = 0;
            selection.forEach(idx => { if(state.gridData[idx].isAns) cnt++; });
            return cnt;
        }

        function endGame(winner, reason) {
            clearInterval(state.timerId);
            const resultScreen = document.getElementById('result-screen');
            const winnerText = document.getElementById('winner-text');
            const reasonText = document.getElementById('win-reason');
            const uniqueAnswers = [...new Set(state.correctNumbers)].sort((a,b)=>a-b);
            let answerString = uniqueAnswers.join(', ');
            if(config.topic === 'multiple' || config.topic === 'commonMultiple') answerString += ', ...';
            document.getElementById('final-answer-list').innerText = answerString;

            if (winner === 'draw') {
                winnerText.innerText = dict[currentLang].draw; winnerText.style.color = "#fff"; SFX.wrong();
            } else {
                SFX.win();
                const name = winner === 'p1' ? dict[currentLang].p1Name : dict[currentLang].p2Name;
                const color = winner === 'p1' ? "#4cc9f0" : "#f72585";
                winnerText.innerText = `${name}${dict[currentLang].winSuffix}`; winnerText.style.color = color;
            }
            reasonText.innerText = reason;
            resultScreen.style.display = 'flex';
        }

        // 초기화 실행
        currentLang = getInitialLang();
        applyLanguage();
        renderLanguages();

    </script>
