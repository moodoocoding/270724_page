<!DOCTYPE html>
<html lang="ko">
<head>
   
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ataxx King - 세균전 킹</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <style>
        :root {
            /* King Series Theme */
            --bg-color: #121212;
            --wood-board: #2b2d42;
            --gold: #ffd700;
            --text-color: #f0f0f0;
            
            /* Ataxx Specific Colors */
            --p1-color: #00ff88; /* Green Slime */
            --p2-color: #ff00cc; /* Purple Virus */
            --intro-grad: linear-gradient(135deg, #1a0b2e 0%, #000000 100%);
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Jua', 'Pretendard', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none; 
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
        }

        /* --- Intro Screen --- */
        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--intro-grad);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease-in-out;
            text-align: center;
            overflow-y: auto; /* For small screens */
        }

        /* Intro Decorations */
        #intro-screen::before {
            content: ''; position: absolute; top: -10%; left: -10%; width: 50%; height: 50%;
            background: radial-gradient(circle, rgba(0,255,136,0.2) 0%, transparent 70%);
            filter: blur(50px); pointer-events: none;
        }
        #intro-screen::after {
            content: ''; position: absolute; bottom: -10%; right: -10%; width: 50%; height: 50%;
            background: radial-gradient(circle, rgba(255,0,204,0.2) 0%, transparent 70%);
            filter: blur(50px); pointer-events: none;
        }

        .top-link {
            font-size: 1.2rem;
            color: #fff;
            text-decoration: none;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
            position: relative; z-index: 10;
        }
        .top-link:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

        .title-main {
            font-family: 'Jua', sans-serif;
            font-size: clamp(3.5rem, 10vw, 6rem);
            margin: 0;
            /* Gradient Text */
            background: linear-gradient(to right, var(--p1-color), #fff, var(--p2-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            line-height: 1.1;
        }

        .title-korean {
            font-family: 'Jua', sans-serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: #fff;
            margin: 5px 0 15px 0;
            text-shadow: 0 0 10px var(--p2-color);
        }

        .mobile-tag {
            font-size: 1.2rem; color: #aaa; margin-bottom: 10px; letter-spacing: 2px;
            border-bottom: 2px solid #333; padding-bottom: 5px;
        }

        #qr-container {
            margin: 15px 0;
            display: flex; justify-content: center; align-items: center;
        }
        #qr-code {
            width: 100px; height: 100px;
            border: 4px solid #fff; border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            background: white;
        }
        #qr-code.enlarged {
            transform: scale(2.2);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            z-index: 200;
        }

        .btn-start {
            margin-top: 20px;
            padding: 15px 60px;
            font-size: 2rem; font-family: 'Jua', sans-serif;
            background: #fff;
            color: #000;
            border: none; border-radius: 50px;
            box-shadow: 0 0 20px var(--p1-color);
            cursor: pointer;
            transition: all 0.2s;
            position: relative; overflow: hidden; z-index: 10;
        }
        .btn-start:active { transform: scale(0.95); }
        .btn-start:hover { box-shadow: 0 0 40px var(--p1-color), 0 0 10px var(--p2-color); }

        .more-games-link {
            margin-top: 25px;
            font-size: 1.2rem;
            color: var(--gold);
            text-decoration: underline;
            text-underline-offset: 5px;
            cursor: pointer;
            position: relative; z-index: 10;
        }

        /* --- Game UI --- */
        /* 수정됨: 홈 버튼 크기 2배 확대 */
        #home-btn {
            position: absolute; top: 20px; left: 20px; z-index: 200;
            background: rgba(0, 0, 0, 0.6); border: 2px solid #666;
            color: #fff; 
            font-size: 1rem; /* 크기 확대 */
            width: 40px; /* 크기 확대 */
            height: 40px; /* 크기 1확대 */
            border-radius: 50%; display: none; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s;
        }

        /* --- CENTER ALIGNMENT FIX --- */
        #game-area {
            display: flex; 
            width: 100%; 
            height: 100%; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 1s;
            justify-content: center; /* Horizontally Center */
            align-items: center;     /* Vertically Center */
        }

        .player-zone {
            display: flex; align-items: center; justify-content: center;
            position: relative; padding: 10px; gap: 15px; 
            flex: 1; /* Distribute space equally */
        }

        .turn-indicator {
            padding: 10px 20px; 
            border-radius: 20px; 
            background: #222;
            color: #666; border: 3px solid #333;
            display: flex; align-items: center; 
            gap: 15px;
            font-size: 1.5rem;
            box-shadow: inset 0 0 10px #000; z-index: 20;
            transition: all 0.2s;
            min-width: 140px; justify-content: center;
        }
        
        .active-turn { 
            background: #333;
            transform: scale(1.1); 
            color: #fff;
        }
        
        /* Player specific active styles */
        .active-turn.p1-turn { border-color: var(--p1-color); box-shadow: 0 0 20px var(--p1-color); }
        .active-turn.p2-turn { border-color: var(--p2-color); box-shadow: 0 0 20px var(--p2-color); }

        .player-icon { width: 50px; height: 50px; }
        .score-value { font-size: 1.8em; font-weight: 900; font-family: 'Jua', sans-serif; margin-left: 10px;}

        /* Hide text labels as requested */
        .player-label { display: none; }

        .undo-btn {
            background: #333; border: 1px solid #555; border-radius: 50%; width: 40px; height: 40px;
            font-size: 1.2rem; cursor: pointer; color: #888; transition: all 0.3s;
            display: flex; justify-content: center; align-items: center;
            margin-left: 10px;
        }
        .undo-active { color: #fff; border-color: #fff; background: #555; }

        /* --- 추가: 결과 텍스트 스타일 --- */
        .result-label {
            position: absolute;
            font-family: 'Jua', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            text-shadow: 0 0 20px #000, 0 0 10px #000;
            z-index: 150;
            display: none;
            pointer-events: none;
            width: 100%;
            text-align: center;
        }
        .win-label { color: var(--gold); text-shadow: 0 0 30px var(--gold); animation: pop 0.5s ease-out; }
        .lose-label { color: #888; font-size: 3rem; opacity: 0.8; }


        /* --- Board --- */
        #board-container {
            background-color: #1a1c2c; /* Deep Space */
            padding: 8px;
            border: 4px solid #555;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            flex-shrink: 0;
            z-index: 5;
            display: flex; justify-content: center; align-items: center;
            margin: auto; /* Key for centering */
        }

        #board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 3px;
            width: 100%; height: 100%;
            aspect-ratio: 1 / 1;
        }

        .cell {
            background-color: #2b2d42;
            border-radius: 8px;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        
        .cell.wall {
            background-color: #000;
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            box-shadow: none; border: 1px solid #333;
            pointer-events: none;
        }

        .cell.selected { background-color: #555; border: 2px solid #fff; }

        .cell.valid-clone {
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.3);
        }
        .cell.valid-clone::after {
            content: ''; display: block; width: 25%; height: 25%; background: #fff; border-radius: 50%; opacity: 0.5;
        }

        .cell.valid-jump {
            background-color: rgba(255, 215, 0, 0.1);
            box-shadow: inset 0 0 0 2px rgba(255, 215, 0, 0.5);
        }
        .cell.valid-jump::after {
            content: ''; display: block; width: 25%; height: 25%; background: var(--gold); border-radius: 50%; opacity: 0.6;
        }

        /* --- Pieces (SVG) --- */
        .bacteria {
            width: 85%; height: 85%;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.6));
            transition: transform 0.2s;
        }
        /* Increased size for Player 2, but fit within cell */
        .bacteria.p2-large { width: 95%; height: 95%; }
        
        .p1-fill { fill: var(--p1-color); }
        .p1-stroke { stroke: #008f4c; }
        .p2-fill { fill: var(--p2-color); }
        .p2-stroke { stroke: #800066; }

        /* Animations */
        @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes infect-anim { 0% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.3) rotate(15deg); filter: brightness(1.5); } 100% { transform: scale(1) rotate(0deg); } }
        
        /* New Breathing Animation for Turn */
        @keyframes breathe { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.1); filter: brightness(1.2); } 
            100% { transform: scale(1); } 
        }

        .appear { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .infecting { animation: infect-anim 0.5s ease-out forwards; z-index: 10; }
        .breathing { animation: breathe 1.5s infinite ease-in-out; }

        /* Pass/Win Message */
        .game-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: 900; color: #fff; font-family: 'Jua', sans-serif;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.85); padding: 20px 40px; border-radius: 20px;
            border: 3px solid var(--gold);
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.5s;
            white-space: nowrap;
        }

        /* Orientation & Layout */
        @media (orientation: portrait) {
            #game-area { flex-direction: column; }
            .player-zone { width: 100%; height: 15vh; flex: 1; } /* flex: 1 ensures balanced spacing */
            .player-top { transform: rotate(180deg); } /* Player 1 on Top */
            
            #board-container {
                width: 92vw; height: 92vw; /* Keep square */
                max-width: 55vh; max-height: 55vh;
                margin: 0; /* Center by flexbox */
            }
        }

        @media (orientation: landscape) {
            #game-area { flex-direction: row; gap: 20px; }
            .player-zone { height: 100vh; width: 25vw; flex-direction: column; flex: 1; }
            #board-container { height: 85vh; width: 85vh; margin: 0; }
            
            #zone-p1 { order: 1; justify-content: center; }
            #zone-p2 { order: 3; justify-content: center; }
            #board-container { order: 2; }
            
            /* Rotate UI for players sitting opposite */
             #zone-p1 .turn-indicator { transform: rotate(90deg); }
             #zone-p2 .turn-indicator { transform: rotate(-90deg); }
             #zone-p1 .undo-btn { transform: rotate(-90deg); }
             #zone-p2 .undo-btn { transform: rotate(90deg); }

             #zone-p1 .result-label { transform: rotate(90deg); }
             #zone-p2 .result-label { transform: rotate(-90deg); }
        }

        #restart-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200;
        }
        .win-text { font-size: 4rem; color: var(--gold); margin-bottom: 20px; font-family: 'Jua', sans-serif; text-shadow: 0 0 20px var(--gold);}

    </style>
</head>
<body>

    <div id="intro-screen">
        <a href="/" class="top-link" target="_blank">킹수학.com KingsMath.com</a>
        
        <h1 class="title-main">ATAXX KING</h1>
        <div class="title-korean">세 균 전 킹</div>
        <div class="mobile-tag">Mobile</div>
        
        <div id="qr-container">
            <img id="qr-code" src="" alt="QR Code" onclick="toggleQR()">
        </div>

        <button class="btn-start" onclick="startGameSequence()">Game Start</button>

        <a href="/" class="more-games-link" target="_blank">more math games</a>
    </div>

    <button id="home-btn" onclick="location.reload()" title="Home"><i class="fas fa-home"></i></button>

    <div id="game-area">
        <div id="zone-p1" class="player-zone player-top">
            <div id="result-p1" class="result-label"></div>
            
            <div id="indicator-p1" class="turn-indicator">
                <div style="display:flex; align-items:center; gap:10px;">
                    <div class="player-icon icon-holder-p1"></div>
                    <div style="display:flex; flex-direction:column; line-height:1;">
                        <span class="player-label" style="font-size:0.6em; opacity:0.7;">SLIME</span>
                        <span id="score-p1" class="score-value">2</span>
                    </div>
                </div>
                <button id="undo-p1" class="undo-btn" onclick="game.undo()"><i class="fas fa-undo"></i></button>
            </div>
        </div>

        <div id="board-container">
            <div id="board"></div>
            <div id="msg-overlay" class="game-msg">END</div>
        </div>

        <div id="zone-p2" class="player-zone player-bottom">
            <div id="result-p2" class="result-label"></div>

            <div id="indicator-p2" class="turn-indicator">
                <div style="display:flex; align-items:center; gap:10px;">
                    <div class="player-icon icon-holder-p2"></div>
                    <div style="display:flex; flex-direction:column; line-height:1;">
                        <span class="player-label" style="font-size:0.6em; opacity:0.7;">VIRUS</span>
                        <span id="score-p2" class="score-value">2</span>
                    </div>
                </div>
                <button id="undo-p2" class="undo-btn" onclick="game.undo()"><i class="fas fa-undo"></i></button>
            </div>
        </div>
    </div>

    <div id="restart-overlay">
        <div id="end-message" class="win-text">Winner!</div>
        <button class="btn-start" onclick="location.reload()">REPLAY</button>
    </div>

    <script>
        // --- QR Code Generator ---
        document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href)}`;
        
        function toggleQR() {
            document.getElementById('qr-code').classList.toggle('enlarged');
        }

        // --- SVG Icons Definition ---
        const slimeSVG = `
        <svg viewBox="0 0 100 100" class="bacteria">
            <path d="M50 15 C20 15, 10 40, 15 65 C20 90, 80 90, 85 65 C90 40, 80 15, 50 15 Z" class="p1-fill" stroke-width="3" class="p1-stroke"/>
            <circle cx="35" cy="45" r="5" fill="white"/> <circle cx="35" cy="45" r="2" fill="black"/>
            <circle cx="65" cy="45" r="5" fill="white"/> <circle cx="65" cy="45" r="2" fill="black"/>
            <path d="M45 60 Q50 65, 55 60" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
            <circle cx="20" cy="30" r="3" fill="rgba(255,255,255,0.4)"/>
        </svg>`;

        // Updated Virus SVG:
        // 1. Body is Scaled 1.2x from center (via transform on group)
        // 2. Eyes are moved slightly outward to match the new body, but Radius stays same (9 and 3)
        const virusSVG = `
        <svg viewBox="0 0 100 100" class="bacteria p2-large">
            <g transform="translate(50,50) scale(1.2) translate(-50,-50)">
                <path d="M50 20 L55 35 L70 30 L65 45 L80 50 L65 55 L70 70 L55 65 L50 80 L45 65 L30 70 L35 55 L20 50 L35 45 L30 30 L45 35 Z" class="p2-fill" stroke-width="3" class="p2-stroke" stroke-linejoin="round"/>
                <path d="M42 60 L58 60" stroke="black" stroke-width="2"/>
                <path d="M42 38 L35 32" stroke="black" stroke-width="2" stroke-linecap="round"/>
                <path d="M58 38 L65 32" stroke="black" stroke-width="2" stroke-linecap="round"/>
            </g>
            <circle cx="38" cy="44" r="9" fill="white"/> <circle cx="38" cy="44" r="3" fill="black"/>
            <circle cx="62" cy="44" r="9" fill="white"/> <circle cx="62" cy="44" r="3" fill="black"/>
        </svg>`;

        document.querySelectorAll('.icon-holder-p1').forEach(el => el.innerHTML = slimeSVG);
        document.querySelectorAll('.icon-holder-p2').forEach(el => el.innerHTML = virusSVG);

        // --- Audio Context ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'select') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(600, now+0.1);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.linearRampToValueAtTime(0, now+0.1);
                osc.start(now); osc.stop(now+0.1);
            } else if (type === 'move') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now+0.2);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now+0.2);
                osc.start(now); osc.stop(now+0.2);
            } else if (type === 'infect') {
                osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(50, now+0.3);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.linearRampToValueAtTime(0, now+0.3);
                osc.start(now); osc.stop(now+0.3);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now+0.2); osc.frequency.setValueAtTime(784, now+0.4);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now+2);
                osc.start(now); osc.stop(now+2);
            } else if (type === 'tick') {
                // Short tick for roulette
                osc.type = 'square'; osc.frequency.setValueAtTime(800, now); 
                gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now+0.05);
                osc.start(now); osc.stop(now+0.05);
            } else if (type === 'start') {
                // Success sound
                osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.linearRampToValueAtTime(880, now+0.2);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.linearRampToValueAtTime(0, now+0.5);
                osc.start(now); osc.stop(now+0.5);
            }
        }

        // --- Ataxx Logic ---
        class AtaxxGame {
            constructor() {
                this.rows = 7;
                this.cols = 7;
                this.board = [];
                this.turn = 1; 
                this.selected = null; 
                this.validMoves = []; 
                this.history = [];
                this.isAnimating = false;
                this.isLocked = true; // Lock during start animation
                
                // Map Patterns (0:Empty, 1:Wall)
                this.maps = [
                    [], // Map 0: Plain
                    [[3,3], [2,2], [4,4], [2,4], [4,2]], // Map 1: X center
                    [[1,1], [1,5], [5,1], [5,5], [3,3]], // Map 2: Corners + Center
                    [[0,3], [1,3], [5,3], [6,3], [3,0], [3,1], [3,5], [3,6]], // Map 3: Cross lines
                    [[3,2], [3,3], [3,4], [2,3], [4,3]], // Map 4: Center Plus
                    [[1,2], [1,4], [2,1], [2,5], [4,1], [4,5], [5,2], [5,4]] // Map 5: Diamond dots
                ];

                this.boardEl = document.getElementById('board');
                this.scoreP1El = document.getElementById('score-p1');
                this.scoreP2El = document.getElementById('score-p2');
                this.indP1 = document.getElementById('indicator-p1');
                this.indP2 = document.getElementById('indicator-p2');
                this.msgOverlay = document.getElementById('msg-overlay');
            }

            init() {
                // Random Map Selection
                const mapIdx = Math.floor(Math.random() * this.maps.length);
                const walls = this.maps[mapIdx];
                
                this.board = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
                
                // Set Walls
                walls.forEach(([r,c]) => this.board[r][c] = -1);

                // Initial Pieces
                if(this.board[0][0] !== -1) this.board[0][0] = 1;
                if(this.board[this.rows-1][this.cols-1] !== -1) this.board[this.rows-1][this.cols-1] = 1;
                
                if(this.board[0][this.cols-1] !== -1) this.board[0][this.cols-1] = 2;
                if(this.board[this.rows-1][0] !== -1) this.board[this.rows-1][0] = 2;

                this.turn = 1;
                this.history = [];
                this.selected = null;
                this.render();
                this.startRoulette(); // Start "DuDuDu" effect
            }

        

async startRoulette() {
                this.isLocked = true;
                this.indP1.classList.remove('active-turn', 'p1-turn');
                this.indP2.classList.remove('active-turn', 'p2-turn');

                let speed = 50;
                let jumps = 10;
                let current = 1;

                // Simple toggle animation
                for(let i=0; i<jumps; i++) {
                    playSound('tick');
                    current = current === 1 ? 2 : 1;
                    
                    if(current === 1) {
                        this.indP1.classList.add('active-turn', 'p1-turn');
                        this.indP2.classList.remove('active-turn', 'p2-turn');
                    } else {
                        this.indP2.classList.add('active-turn', 'p2-turn');
                        this.indP1.classList.remove('active-turn', 'p1-turn');
                    }
                    
                    await new Promise(r => setTimeout(r, speed));
                    speed += 20; // Slow down
                }

                // --- 🌟 여기서부터 수정된 부분입니다 🌟 ---
                // 50% 확률로 무작위 선공 결정
                this.turn = Math.random() < 0.5 ? 1 : 2;
                
                if (this.turn === 1) {
                    this.indP1.classList.add('active-turn', 'p1-turn');
                    this.indP2.classList.remove('active-turn', 'p2-turn');
                } else {
                    this.indP2.classList.add('active-turn', 'p2-turn');
                    this.indP1.classList.remove('active-turn', 'p1-turn');
                }
                // ---------------------------------------------

                playSound('start');
                
                this.isLocked = false;
                this.updateUI();
                this.render(); // Trigger breathing animation
            }


            render() {
                this.boardEl.innerHTML = '';
                for(let r=0; r<this.rows; r++) {
                    for(let c=0; c<this.cols; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.r = r;
                        cell.dataset.c = c;
                        
                        const val = this.board[r][c];
                        if (val === -1) {
                            cell.classList.add('wall');
                        } else if (val === 1) {
                            cell.innerHTML = slimeSVG;
                            cell.firstElementChild.classList.add('appear');
                            // Add breathing if it's my turn and not locked
                            if(this.turn === 1 && !this.isLocked) {
                                cell.firstElementChild.classList.add('breathing');
                            }
                        } else if (val === 2) {
                            cell.innerHTML = virusSVG;
                            cell.firstElementChild.classList.add('appear');
                            // Add breathing if it's my turn and not locked
                            if(this.turn === 2 && !this.isLocked) {
                                cell.firstElementChild.classList.add('breathing');
                            }
                        }

                        // Highlights
                        if (this.selected && this.selected.r === r && this.selected.c === c) {
                            cell.classList.add('selected');
                        }
                        
                        const move = this.validMoves.find(m => m.r === r && m.c === c);
                        if (move) {
                            cell.classList.add(move.type === 'clone' ? 'valid-clone' : 'valid-jump');
                        }

                        cell.onclick = () => this.handleInput(r, c);
                        this.boardEl.appendChild(cell);
                    }
                }
            }

            handleInput(r, c) {
                if (this.isAnimating || this.isLocked) return;
                const val = this.board[r][c];

                // 1. Select Own Piece
                if (val === this.turn) {
                    playSound('select');
                    this.selected = {r, c};
                    this.calculateValidMoves(r, c);
                    this.render();
                    return;
                }

                // 2. Click Valid Move
                const move = this.validMoves.find(m => m.r === r && m.c === c);
                if (move) {
                    this.executeMove(move);
                } else {
                    // Click elsewhere -> Deselect
                    this.selected = null;
                    this.validMoves = [];
                    this.render();
                }
            }

            calculateValidMoves(r, c) {
                this.validMoves = [];
                for (let i = -2; i <= 2; i++) {
                    for (let j = -2; j <= 2; j++) {
                        const nr = r + i;
                        const nc = c + j;
                        if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
                            if (this.board[nr][nc] === 0) { // Empty
                                const dist = Math.max(Math.abs(i), Math.abs(j));
                                if (dist === 1) this.validMoves.push({r: nr, c: nc, type: 'clone'});
                                else if (dist === 2) this.validMoves.push({r: nr, c: nc, type: 'jump'});
                            }
                        }
                    }
                }
            }

            async executeMove(move) {
                this.isAnimating = true;
                
                // Save History
                this.history.push({
                    board: JSON.parse(JSON.stringify(this.board)),
                    turn: this.turn
                });

                const fromR = this.selected.r;
                const fromC = this.selected.c;

                playSound('move');

                // Logic
                if (move.type === 'jump') {
                    this.board[fromR][fromC] = 0; // Remove from old
                }
                this.board[move.r][move.c] = this.turn; // Place new

                // Visual Update (Pre-infection)
                this.selected = null;
                this.validMoves = [];
                this.render();

                // Infection Phase
                await new Promise(r => setTimeout(r, 200));
                await this.infect(move.r, move.c);

                this.isAnimating = false;
                this.turn = this.turn === 1 ? 2 : 1;
                this.updateUI();
                this.render(); // Apply breathing to new turn player
                
                // Check Win/Pass
                this.checkGameState();
            }

            async infect(r, c) {
                let infected = false;
                const opponent = this.turn === 1 ? 2 : 1;
                
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        const nr = r + i;
                        const nc = c + j;
                        if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
                            if (this.board[nr][nc] === opponent) {
                                this.board[nr][nc] = this.turn;
                                infected = true;
                                
                                // Visual Effect
                                const cell = document.querySelector(`.cell[data-r="${nr}"][data-c="${nc}"]`);
                                if(cell) {
                                    // Change SVG
                                    cell.innerHTML = this.turn === 1 ? slimeSVG : virusSVG;
                                    cell.firstElementChild.classList.add('infecting');
                                }
                            }
                        }
                    }
                }
                if(infected) playSound('infect');
                await new Promise(resolve => setTimeout(resolve, 500)); 
            }

            updateUI() {
                if(this.isLocked) return;

                // Scores
                let p1 = 0, p2 = 0;
                this.board.forEach(row => row.forEach(v => {
                    if (v === 1) p1++;
                    else if (v === 2) p2++;
                }));
                this.scoreP1El.innerText = p1;
                this.scoreP2El.innerText = p2;

                // Turn Indicator
                this.indP1.classList.toggle('active-turn', this.turn === 1);
                this.indP1.classList.toggle('p1-turn', this.turn === 1);
                this.indP2.classList.toggle('active-turn', this.turn === 2);
                this.indP2.classList.toggle('p2-turn', this.turn === 2);

                // Undo Button State
                const canUndo = this.history.length > 0;
                document.getElementById('undo-p1').className = `undo-btn ${canUndo && this.turn===1 ? 'undo-active' : ''}`;
                document.getElementById('undo-p2').className = `undo-btn ${canUndo && this.turn===2 ? 'undo-active' : ''}`;
            }

            undo() {
                if (this.isAnimating || this.history.length === 0 || this.isLocked) return;
                const prev = this.history.pop();
                this.board = prev.board;
                this.turn = prev.turn;
                this.updateUI();
                this.render();
            }

            checkGameState() {
                // 1. Check if current player has moves
                if (!this.hasValidMoves(this.turn)) {
                    // Check if OTHER player has moves
                    const other = this.turn === 1 ? 2 : 1;
                    if (!this.hasValidMoves(other)) {
                        this.endGame(); // No one can move
                    } else {
                        this.showMsg("END");
                        this.turn = other;
                        this.updateUI();
                        this.render();
                    }
                }

                // 2. Check empty cells or wipeout
                let p1 = 0, p2 = 0, empty = 0;
                this.board.forEach(row => row.forEach(v => {
                    if(v===1) p1++; else if(v===2) p2++; else if(v===0) empty++;
                }));

                if (p1 === 0 || p2 === 0 || empty === 0) {
                    this.endGame();
                }
            }

            hasValidMoves(player) {
                for (let r=0; r<this.rows; r++) {
                    for (let c=0; c<this.cols; c++) {
                        if (this.board[r][c] === player) {
                            for (let i = -2; i <= 2; i++) {
                                for (let j = -2; j <= 2; j++) {
                                    const nr = r+i, nc = c+j;
                                    if (nr>=0 && nr<this.rows && nc>=0 && nc<this.cols && this.board[nr][nc] === 0) {
                                        return true;
                                    }
                                }
                            }
                        }
                    }
                }
                return false;
            }

            showMsg(text) {
                this.msgOverlay.innerText = text;
                this.msgOverlay.style.opacity = 1;
                setTimeout(() => this.msgOverlay.style.opacity = 0, 1500);
            }

            endGame() {
                playSound('win');
                let p1 = parseInt(this.scoreP1El.innerText);
                let p2 = parseInt(this.scoreP2El.innerText);
                
                const resP1 = document.getElementById('result-p1');
                const resP2 = document.getElementById('result-p2');

                if (p1 > p2) {
                    resP1.innerText = "WIN"; resP1.className = "result-label win-label";
                    resP2.innerText = "LOSE"; resP2.className = "result-label lose-label";
                } else if (p2 > p1) {
                    resP2.innerText = "WIN"; resP2.className = "result-label win-label";
                    resP1.innerText = "LOSE"; resP1.className = "result-label lose-label";
                } else {
                    resP1.innerText = "DRAW"; resP1.className = "result-label";
                    resP2.innerText = "DRAW"; resP2.className = "result-label";
                }

                // Show the text oriented to players
                resP1.style.display = 'block';
                resP2.style.display = 'block';

                // 기존 오버레이는 표시하지 않음
                // document.getElementById('restart-overlay').style.display = 'flex';
            }
        }

        const game = new AtaxxGame();

        function startGameSequence() {
            document.getElementById('intro-screen').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('game-area').style.opacity = 1;
                document.getElementById('game-area').style.pointerEvents = 'auto';
                document.getElementById('home-btn').style.display = 'flex';
                game.init();
            }, 500);
        }
    </script>
</body>
