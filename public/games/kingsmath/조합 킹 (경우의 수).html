        .instruction-box {

            justify-content: center;

        .diff-btn {

            transform: scale(0.95);

        .diff-btn.active {
            opacity: 1;
            transform: scale(1.1);

        .diff-mild { background-color: var(--mild-color); color: white; }
        .diff-normal { background-color: #2ecc71; color: white; }
        .diff-hard { background-color: #c0392b; color: white; border: 2px solid #e74c3c; }

        .player-select-container {

        .player-btn {

            box-shadow: 0 4px 0 #7f8c8d;

        .player-btn.active {
            background: var(--primary-color);
            color: #2c3e50;
            transform: translateY(-4px);
            box-shadow: 0 8px 0 #c29d0b;
        }

        .start-btn {
            background: #e67e22;
            color: white;
            font-size: 1.5rem;
            padding: 1rem 3rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 6px 0 #d35400;
            transition: transform 0.1s;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d35400;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .external-link {
            color: #f1c40f;
            font-size: 1.5rem;
            margin-top: 10px;
            text-decoration: underline;
            cursor: pointer;
        }

        .section-title {
            color: white;
            font-size: 1.3rem;
            margin-bottom: 10px;
            margin-top: 5px;
            text-align: center;
            opacity: 0.8;
        }

        /* 게임 영역 */
        #game-container {
            display: flex;
            width: 100%;
            height: calc(100% - 100px);
            overflow: hidden;
        }

        .player-column {
            flex: 1;
            border-right: 2px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            position: relative;
            background-color: var(--board-color);
            overflow: hidden;
            height: 100%;
        }

        .player-column:last-child { border-right: none; }

        .player-header {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 0;
            z-index: 1;
        }

        .bottom-control-area {
            flex: 0 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            background: rgba(0, 0, 0, 0.15);
            padding: 15px 5px 20px 5px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
            z-index: 2;
        }

        #draw-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            background: rgba(44, 62, 80, 0.95);
            z-index: 600;
            display: none;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-top: 3px solid #e74c3c;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            gap: 30px;
        }

        #draw-ui h2 {
            font-size: 2.5rem;
            color: #ffffff;
            margin: 0;
        }

        .winner-ui {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: auto;
            background: rgba(44, 62, 80, 0.9);
            z-index: 500;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-top: 3px solid var(--primary-color);
            backdrop-filter: blur(4px);
            animation: slideUp 0.5s ease-out;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .trophy {
            font-size: 5rem;
            margin-bottom: 10px;
            animation: bounce 1s infinite alternate;
            filter: drop-shadow(0 0 10px gold);
        }

        .win-btn {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 6px 0 #27ae60;
            transition: all 0.1s;
        }
        .win-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #27ae60; }

      .target-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; /* 라벨과 숫자 박스 사이 간격 확대 (기존 2px) */
            transform: scale(1.3); /* 전체적인 덩치를 조금 더 키움 (기존 1.2) */
            margin-bottom: 30px; /* 아래쪽 메시지 영역과의 간격 확대 */
        }

        .target-number {
            font-size: 3.5rem;
            color: var(--primary-color);
            background: rgba(0,0,0,0.3);
            padding: 5px 30px;
            border-radius: 15px;
            border: 4px solid var(--primary-color);
            margin-top: 5px;
            font-weight: bold;
        }

        .message-area {
            height: 25px;
            font-size: 1.1rem;
            color: #fff;
            margin-top: 5px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .slots-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            width: 95%;
            flex: 0 0 auto;
        }

        .slot {
            flex: 1;
            aspect-ratio: 1/1.3;
            min-width: 45px; 
            max-width: 80px; 
            background-color: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            position: relative;
            transition: border-color 0.3s;
            overflow: visible; 
        }

        .slot.filled {
            border-style: solid;
            border-color: rgba(255,255,255,0.6);
        }
        
        .slot.answer-reveal {
            border-color: var(--primary-color);
            background-color: rgba(241, 196, 15, 0.1);
        }

        .cards-container {
            display: grid;
            gap: 12px;
            width: fit-content; 
            max-width: 98%;
            margin-bottom: 15px;
            align-self: center;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            overflow: hidden;
            justify-content: center;
            align-content: center;
            flex-grow: 0;
        }

        .cards-container.diff-mild { min-height: 200px; }
        .cards-container.diff-normal { min-height: 300px; }
        .cards-container.diff-hard { min-height: 400px; }

        .cards-container.grid-3x3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .cards-container.grid-4x4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

        .card {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            min-width: 50px;
            aspect-ratio: 5/7; 
            background-color: #ffffff;
            color: #2d3436;
            border: 2px solid var(--card-border);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 800;
            box-shadow: 0 4px 0 #bdc3c7, 0 5px 5px rgba(0,0,0,0.1);
            cursor: grab;
            position: relative;
            z-index: 10;
            transition: transform 0.1s, box-shadow 0.1s;
            justify-self: center;
            align-self: center;
        }

        .card.long-text { font-size: 1.8rem; }
        .card:active { transform: translateY(4px); box-shadow: 0 1px 0 #bdc3c7; }
        .card.operator { background-color: #ffffff; color: #d35400; }
        
        .card.fly-in {
            position: absolute;
            animation: flyFromBottom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(200px) scale(0.5);
            pointer-events: none;
            width: auto;
            height: auto;       
            aspect-ratio: 5/7;
            max-width: 100%;
            max-height: 100%;
            top: 0; left: 0; right: 0; bottom: 0;
            margin: auto;
            box-shadow: 0 0 15px var(--primary-color);
            border: 3px solid var(--primary-color);
        }

        @keyframes flyFromBottom {
            0% { opacity: 0; transform: translateY(400px) scale(0.2) rotate(-20deg); }
            60% { opacity: 1; transform: translateY(-20px) scale(1.1) rotate(5deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        .card.winner-lock {
            animation: popLock 0.4s ease-out forwards;
            border: 4px solid var(--success-color);
            box-shadow: 0 0 20px var(--success-color);
            pointer-events: none;
        }

        @keyframes popLock {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .card.dragging {
            opacity: 0.9;
            cursor: grabbing;
            z-index: 1000;
            position: fixed;
            pointer-events: none;
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            width: 70px !important;
            height: 98px !important;
            border-color: var(--primary-color);
        }

        .controls {
            width: 90%;
            display: flex;
            justify-content: center;
            margin-bottom: 0;
            flex: 0 0 auto;
        }

        .btn-reset {
            width: 100%; 
            max-width: 160px;
            padding: 12px 0;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            background-color: #95a5a6;
            color: white;
            box-shadow: 0 4px 0 #7f8c8d;
        }
        .btn-reset:active { transform: translateY(4px); box-shadow: none; }

        @media (max-width: 1024px) {
            .card { font-size: 1.8rem; }
            .card.long-text { font-size: 1.4rem; }
            .target-number { font-size: 2.5rem; padding: 5px 20px; }
            h1 { font-size: 3rem; }
            #draw-ui h2 { font-size: 1.8rem; }
        }

        /* --- 언어 선택 모달 UI CSS --- */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }



/* [추가] 참가자(Player) 텍스트 크기 및 아래쪽 간격 확대 */
        .player-header h2 {
            font-size: 2.5rem; 
            margin-bottom: 20px; 
            margin-top: 0;
        }

/* 기존 h1 선택자를 .main-title로 변경 */
.main-title {
    font-size: 4rem;
    margin: 0 0 10px 0;
    color: var(--primary-color);
    text-shadow: 3px 3px 0px #000;
    text-align: center;
    white-space: nowrap;
}

/* 다국어 및 미디어 쿼리 부분도 함께 수정 */
body.lang-ru .main-title, body.lang-es .main-title, body.lang-fr .main-title, body.lang-de .main-title, body.lang-it .main-title, body.lang-pt-br .main-title, body.lang-id .main-title { font-size: 2.5rem; }

@media (max-width: 600px) {
    body:not(.lang-ko) .main-title { font-size: 2rem !important; }

    /* 기존 코드 생략 */

    </style>

        // --- 사운드 매니저 (AudioContext) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'drop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'remove') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.value = freq; g.gain.setValueAtTime(0.2, now + i*0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.3);
                    o.start(now + i*0.1); o.stop(now + i*0.1 + 0.3);
                });
            } else if (type === 'start') {
                osc.type = 'square'; osc.frequency.setValueAtTime(1500, now);
                osc.frequency.linearRampToValueAtTime(2000, now + 0.1);
                osc.frequency.linearRampToValueAtTime(1000, now + 0.5);
                gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'tick') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now);
                gainNode.gain.setValueAtTime(0.8, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'fly') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        function generateLevel() {
            let formula = [];
            let target = 0;
            let isValid = false;
            const mode = currentDifficulty;
            let numCount, maxNumber, poolSize;
            
            if (mode === 'mild') { numCount = 2; maxNumber = 9; poolSize = 6; } 
            else if (mode === 'normal') { numCount = 3; maxNumber = 9; poolSize = 9; } 
            else { maxNumber = 20; poolSize = 16; }

            const maxTarget = mode === 'hard' ? 500 : 100;
            const opSymbols = ['+', '-', '×'];

            while (!isValid) {
                let formulaItems = []; let expr = "";
                
                if (mode === 'mild') {
                    const n1 = Math.floor(Math.random() * maxNumber) + 1;
                    const n2 = Math.floor(Math.random() * maxNumber) + 1;
                    const op = opSymbols[Math.floor(Math.random() * opSymbols.length)];
                    formulaItems = [n1, op, n2]; expr = `${n1} ${op === '×' ? '*' : op} ${n2}`;
                } else if (mode === 'normal') {
                    const n1 = Math.floor(Math.random() * maxNumber) + 1; const n2 = Math.floor(Math.random() * maxNumber) + 1; const n3 = Math.floor(Math.random() * maxNumber) + 1;
                    const op1 = opSymbols[Math.floor(Math.random() * opSymbols.length)]; const op2 = opSymbols[Math.floor(Math.random() * opSymbols.length)];
                    formulaItems = [n1, op1, n2, op2, n3]; expr = `${n1} ${op1 === '×' ? '*' : op1} ${n2} ${op2 === '×' ? '*' : op2} ${n3}`;
                } else {
                    const useParen = Math.random() > 0.5;
                    if (useParen) {
                        const n1 = Math.floor(Math.random() * maxNumber) + 1; const n2 = Math.floor(Math.random() * maxNumber) + 1; const n3 = Math.floor(Math.random() * maxNumber) + 1;
                        const op1 = opSymbols[Math.floor(Math.random() * opSymbols.length)]; const op2 = opSymbols[Math.floor(Math.random() * opSymbols.length)];
                        formulaItems = ['(', n1, op1, n2, ')', op2, n3]; expr = `(${n1} ${op1 === '×' ? '*' : op1} ${n2}) ${op2 === '×' ? '*' : op2} ${n3}`;
                    } else {
                        const nums = []; for(let k=0; k<4; k++) nums.push(Math.floor(Math.random() * maxNumber) + 1);
                        const ops = []; for(let k=0; k<3; k++) ops.push(opSymbols[Math.floor(Math.random() * opSymbols.length)]);
                        formulaItems = [nums[0], ops[0], nums[1], ops[1], nums[2], ops[2], nums[3]];
                        expr = `${nums[0]} ${ops[0] === '×' ? '*' : ops[0]} ${nums[1]} ${ops[1] === '×' ? '*' : ops[1]} ${nums[2]} ${ops[2] === '×' ? '*' : ops[2]} ${nums[3]}`;
                    }
                }

                try {
                    target = eval(expr);
                    if (Number.isInteger(target) && target > 0 && target <= maxTarget) {
                        formula = formulaItems; isValid = true;
                    }
                } catch (e) { isValid = false; }
            }

            let pool = [...formula];
            const randomOps = ['+', '-', '×']; if(mode === 'hard') randomOps.push('(', ')');
            
            let maxSameNum, maxSameOp;
            if (mode === 'mild') { maxSameNum = 2; maxSameOp = 1; } 
            else if (mode === 'normal') { maxSameNum = 2; maxSameOp = 2; } 
            else { maxSameNum = 1; maxSameOp = 2; }

            let attempts = 0;
            while (pool.length < poolSize && attempts < 200) {
                attempts++; let candidate; let makeNumber = Math.random() > 0.5;

                if (makeNumber) {
                     const baseNum = formula.filter(x => typeof x === 'number');
                     if (Math.random() > 0.3 && baseNum.length > 0) {
                         const ref = baseNum[Math.floor(Math.random() * baseNum.length)];
                         candidate = ref + (Math.floor(Math.random() * 7) - 3);
                     } else { candidate = Math.floor(Math.random() * maxNumber) + 1; }
                     if (candidate < 1) candidate = 1; if (candidate > maxNumber) candidate = maxNumber;
                } else {
                    if (mode === 'hard') { candidate = ['+', '-', '×'][Math.floor(Math.random() * 3)]; } 
                    else { candidate = randomOps[Math.floor(Math.random() * randomOps.length)]; }
                    if ((candidate === '(' || candidate === ')') && pool.filter(x => x === candidate).length >= 1) continue;
                }

                const count = pool.filter(x => x === candidate).length;
                const limit = (typeof candidate === 'number') ? maxSameNum : maxSameOp;

                if (count < limit) pool.push(candidate);
            }
            while (pool.length < poolSize) { pool.push(Math.floor(Math.random() * maxNumber) + 1); }
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            return { target, pool, formula }; 
        }

        function renderCards(playerId, pool) {
            const cardContainer = document.getElementById(`cards-${playerId}`);
            cardContainer.innerHTML = '';
            
            pool.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = item;
                card.dataset.value = item;
                card.dataset.playerId = playerId;
                card.id = `p${playerId}-card-${idx}`; 
                
                if (typeof item === 'number' && item >= 10) card.classList.add('long-text');
                if (['+', '-', '×', '÷', '(', ')'].includes(item)) card.classList.add('operator');

                card.addEventListener('mousedown', handlePointerStart);
                card.addEventListener('touchstart', handlePointerStart, {passive: false});
                cardContainer.appendChild(card);
            });
        }

        // --- Unified Pointer Events ---
        function handlePointerStart(e) {
            if (!isGameActive) return;
            e.preventDefault();
            const target = e.target.closest('.card');
            if (!target || target.classList.contains('static')) return;

            let points = [];
            if (e.type === 'touchstart') { for (let i = 0; i < e.changedTouches.length; i++) points.push(e.changedTouches[i]); } 
            else { points.push(e); }

            points.forEach(point => {
                const id = point.identifier !== undefined ? point.identifier : 'mouse';
                const clone = target.cloneNode(true);
                clone.classList.add('dragging');
                document.body.appendChild(clone);

                const x = point.clientX; const y = point.clientY;
                clone.style.left = (x - 35) + 'px'; clone.style.top = (y - 49) + 'px';
                target.style.opacity = '0.3';
                playSound('drop');

                activeDrags[id] = { original: target, clone: clone, startX: x, startY: y };
            });

            if (Object.keys(activeDrags).length > 0) {
                if (e.type === 'mousedown') {
                    document.addEventListener('mousemove', handlePointerMove); document.addEventListener('mouseup', handlePointerEnd);
                } else {
                    document.addEventListener('touchmove', handlePointerMove, {passive: false});
                    document.addEventListener('touchend', handlePointerEnd); document.addEventListener('touchcancel', handlePointerEnd);
                }
            }
        }

        function handlePointerMove(e) {
            e.preventDefault();
            let points = [];
            if (e.type === 'touchmove') { for (let i = 0; i < e.changedTouches.length; i++) points.push(e.changedTouches[i]); } 
            else { points.push(e); }

            points.forEach(point => {
                const id = point.identifier !== undefined ? point.identifier : 'mouse';
                if (activeDrags[id]) {
                    const dragInfo = activeDrags[id];
                    dragInfo.clone.style.left = (point.clientX - 35) + 'px'; dragInfo.clone.style.top = (point.clientY - 49) + 'px';
                }
            });
        }

        function handlePointerEnd(e) {
            let points = [];
            if (e.type === 'touchend' || e.type === 'touchcancel') { for (let i = 0; i < e.changedTouches.length; i++) points.push(e.changedTouches[i]); } 
            else { points.push(e); }

            points.forEach(point => {
                const id = point.identifier !== undefined ? point.identifier : 'mouse';
                if (activeDrags[id]) {
                    const dragInfo = activeDrags[id]; const original = dragInfo.original; const clone = dragInfo.clone;
                    clone.style.display = 'none';
                    let elemBelow = document.elementFromPoint(point.clientX, point.clientY);
                    clone.style.display = 'block';

                    let slot = elemBelow ? elemBelow.closest('.slot') : null;
                    let cardsArea = elemBelow ? elemBelow.closest('.cards-container') : null;
                    const playerId = original.dataset.playerId;

                    if (slot && slot.closest(`#player-${playerId}`)) {
                        if (slot.children.length > 0) {
                            const existingCard = slot.children[0];
                            document.getElementById(`cards-${playerId}`).appendChild(existingCard);
                            slot.classList.remove('filled');
                        }
                        slot.appendChild(original); slot.classList.add('filled'); original.style.opacity = '1';
                        playSound('drop'); checkAutoWin(playerId);
                    } else if (cardsArea && cardsArea.id === `cards-${playerId}`) {
                        if(original.parentElement.classList.contains('slot')) original.parentElement.classList.remove('filled');
                        cardsArea.appendChild(original); original.style.opacity = '1';
                        document.getElementById(`msg-${playerId}`).textContent = "";
                        playSound('remove');
                    } else {
                        original.style.opacity = '1';
                    }

                    clone.remove(); delete activeDrags[id];
                }
            });

            if (Object.keys(activeDrags).length === 0) {
                document.removeEventListener('mousemove', handlePointerMove); document.removeEventListener('mouseup', handlePointerEnd);
                document.removeEventListener('touchmove', handlePointerMove); document.removeEventListener('touchend', handlePointerEnd); document.removeEventListener('touchcancel', handlePointerEnd);
            }
        }

        function resetBoard(playerId) {
            if (!isGameActive) return;
            const slots = document.getElementById(`slots-${playerId}`).querySelectorAll('.slot');
            const cardContainer = document.getElementById(`cards-${playerId}`);
            
            slots.forEach(slot => {
                slot.classList.remove('filled');
                if(slot.children.length > 0) cardContainer.appendChild(slot.children[0]);
            });
            document.getElementById(`msg-${playerId}`).textContent = "";
            playSound('remove');
        }

        function handleTimeOver(winnerId) {
            isGameActive = false; clearInterval(timerInterval);

            // 게임이 끝나면 다시 언어 선택기 노출
            document.getElementById('langTriggerContainer').style.display = 'block';

            if (winnerId === null) { document.getElementById('draw-ui').style.display = 'flex'; }

            for (let i = 1; i <= playerCount; i++) {
                const pid = i; const isWinner = (pid === winnerId);

                if (isWinner) {
                    const ui = document.getElementById(`win-ui-${pid}`); ui.style.display = 'flex'; playSound('win');
                    const slots = document.getElementById(`slots-${pid}`).querySelectorAll('.slot');
                    slots.forEach((slot, idx) => {
                        if(slot.firstChild) { slot.firstChild.classList.add('winner-lock'); slot.firstChild.style.animationDelay = `${idx * 0.1}s`; }
                    });
                } else {
                    revealAnswerWithAnimation(pid);
                }
            }
        }

        function revealAnswerWithAnimation(playerId) {
            const correctFormula = solutions[playerId];
            const slots = document.getElementById(`slots-${playerId}`).querySelectorAll('.slot');
            const msg = document.getElementById(`msg-${playerId}`);
            const cardPool = document.getElementById(`cards-${playerId}`);

            slots.forEach(slot => { slot.innerHTML = ''; slot.classList.remove('filled'); });

            msg.textContent = t('msgReveal'); msg.style.color = "#f1c40f"; playSound('fly');

            correctFormula.forEach((val, idx) => {
                if (idx < slots.length) {
                    const slot = slots[idx];
                    const cardInPool = Array.from(cardPool.children).find(c => c.dataset.value == val);
                    if (cardInPool) cardInPool.remove(); 
                    
                    const card = document.createElement('div');
                    card.className = 'card fly-in'; card.textContent = val;
                    if (typeof val === 'number' && val >= 10) card.classList.add('long-text');
                    if (['+', '-', '×', '÷', '(', ')'].includes(val)) card.classList.add('operator');
                    
                    card.style.animationDelay = `${idx * 0.1}s`;
                    slot.appendChild(card); slot.classList.add('filled', 'answer-reveal');
                }
            });
        }

        function checkAutoWin(playerId) {
            const playerCol = document.getElementById(`player-${playerId}`);
            const slots = playerCol.querySelectorAll('.slot');
            const msgEl = document.getElementById(`msg-${playerId}`);
            
            let filledCount = 0; slots.forEach(s => { if(s.children.length > 0) filledCount++; });
            if (filledCount < slots.length) { msgEl.textContent = ""; return; }

            const target = parseInt(playerCol.querySelector('.target-number').textContent);
            const values = []; slots.forEach(slot => values.push(slot.children[0].dataset.value));

            let formulaStr = "";
            for (let val of values) {
                const isNum = !isNaN(val);
                if (isNum) { formulaStr += (" " + val); } 
                else { const op = val === '×' ? '*' : (val === '÷' ? '/' : val); formulaStr += (" " + op + " "); }
            }

            try {
                const result = eval(formulaStr);
                if (result === target) {
                    handleTimeOver(parseInt(playerId));
                } else {
                    msgEl.textContent = t('msgWrong'); msgEl.style.color = "var(--fail-color)"; playSound('wrong');
                    slots.forEach(s => { s.style.borderColor = "var(--fail-color)"; setTimeout(() => s.style.borderColor = "", 500); });
                }
            } catch (e) {
                msgEl.textContent = t('msgInvalid'); msgEl.style.color = "var(--fail-color)"; playSound('wrong');
            }
        }

        // Initialize Language and List
        window.addEventListener('DOMContentLoaded', () => {
            const detected = detectLanguage();
            setLanguage(detected);
            renderLanguages();
        });
    </script>

</body>
