        const LANG_ARRAY = Object.values(TRANSLATIONS);

        // --- 사운드 유틸리티 ---
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const masterGain = ctx.createGain();
                masterGain.connect(ctx.destination);
                masterGain.gain.setValueAtTime(0.5, ctx.currentTime);

                const createOsc = (type, freq, start, dur, vol = 1) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0, start);
                    gain.gain.linearRampToValueAtTime(vol, start + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start(start);
                    osc.stop(start + dur);
                };

                const now = ctx.currentTime;
                if (type === 'step') createOsc('sine', 100, now, 0.05, 0.2);
                else if (type === 'count') createOsc('triangle', 600, now, 0.2, 0.1);
                else if (type === 'success') {
                    createOsc('triangle', 523.25, now, 0.2, 0.3);
                    createOsc('triangle', 659.25, now + 0.1, 0.2, 0.3);
                    createOsc('sine', 783.99, now + 0.2, 0.4, 0.3);
                    createOsc('sine', 1046.50, now + 0.2, 0.4, 0.2);
                } else if (type === 'gostart') createOsc('square', 440, now, 0.3, 0.1);
                else if (type === 'error') {
                    createOsc('sawtooth', 150, now, 0.3, 0.3);
                    createOsc('sawtooth', 140, now + 0.1, 0.3, 0.3);
                } else if (type === 'fanfare') {
                    [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50].forEach((f, i) => 
                        createOsc('square', f, now + [0, 0.15, 0.3, 0.45, 0.6, 0.75][i], 0.4, 0.2)
                    );
                }
            } catch (e) { console.error(e); }
        };

        // --- 팡빠레 ---
        const Confetti = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const particles = Array.from({length: 300}, () => ({
                    x: window.innerWidth/2, y: window.innerHeight/2,
                    vx: (Math.random()-0.5)*25, vy: (Math.random()-0.5)*25-5,
                    color: ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899'][Math.floor(Math.random()*6)],
                    size: Math.random()*12+4, rotation: Math.random()*360, drag: 0.96
                }));
                let animId;
                const animate = () => {
                    ctx.clearRect(0,0,canvas.width,canvas.height);
                    for(let i=particles.length-1; i>=0; i--){
                        const p = particles[i];
                        p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.vx*=p.drag; p.vy*=p.drag; p.rotation+=10;
                        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rotation*Math.PI/180);
                        ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore();
                        if(p.y>canvas.height+100) particles.splice(i,1);
                    }
                    if(particles.length>0) animId = requestAnimationFrame(animate);
                };
                playSound('fanfare');
                animate();
                return () => cancelAnimationFrame(animId);
            }, []);
            return <canvas ref={canvasRef} className="absolute inset-0 z-[60] pointer-events-none" />;
        };

        // --- 로직 데이터 ---
        const generateProblem = (difficulty, prevAns, round) => {
            if (round === 1) {
                const startNum = Math.floor(Math.random() * 20) + 10; 
                return { target: startNum, display: `${startNum}` };
            }
            let nextTarget, displayStr, operand;
            if (difficulty === 'easy') {
                if (prevAns > 150 || Math.random() > 0.5) {
                    const maxSub = prevAns; 
                    operand = maxSub <= 1 ? Math.floor(Math.random()*10)+1 : Math.floor(Math.random()*Math.min(20, maxSub))+1;
                    nextTarget = maxSub <= 1 ? prevAns + operand : prevAns - operand;
                    displayStr = maxSub <= 1 ? `${prevAns} + ${operand}` : `${prevAns} - ${operand}`;
                } else {
                    operand = Math.floor(Math.random() * 20) + 5;
                    nextTarget = prevAns + operand;
                    displayStr = `${prevAns} + ${operand}`;
                }
            } else if (difficulty === 'normal') {
                let divisors = [];
                for(let i=2; i<=10; i++) if(prevAns % i === 0) divisors.push(i);
                const type = Math.random();
                if ((type < 0.4 || prevAns > 150) && divisors.length > 0) {
                    operand = divisors[Math.floor(Math.random() * divisors.length)];
                    nextTarget = prevAns / operand;
                    displayStr = `${prevAns} ÷ ${operand}`;
                } else if (type < 0.6 && prevAns <= 150) {
                    operand = Math.floor(Math.random() * 3) + 2; 
                    nextTarget = prevAns * operand;
                    displayStr = `${prevAns} × ${operand}`;
                } else {
                    operand = Math.floor(Math.random() * 20) + 5;
                    if(Math.random()>0.5 || prevAns < 10) {
                        nextTarget = prevAns + operand;
                        displayStr = `${prevAns} + ${operand}`;
                    } else {
                        nextTarget = prevAns - Math.min(operand, prevAns-1);
                        displayStr = `${prevAns} - ${Math.min(operand, prevAns-1)}`;
                    }
                }
            } else { // Hard
                const a = Math.floor(Math.random() * 5) + 2;
                const b = Math.floor(Math.random() * 5) + 2;
                if(Math.random() > 0.5 && prevAns > a*b) {
                    nextTarget = prevAns - (a*b);
                    displayStr = `${prevAns} - (${a} × ${b})`;
                } else {
                    nextTarget = prevAns + (a*b);
                    displayStr = `${prevAns} + (${a} × ${b})`;
                }
            }
            return { target: nextTarget, display: displayStr };
        };

        // --- 플레이어 컴포넌트 ---
        const PlayerColumn = ({ id, difficulty, isPlaying, onUpdateScore, currentRank, skinTone, t }) => {
            const [totalScore, setTotalScore] = useState(0); 
            const [startOfRound, setStartOfRound] = useState(0); 
            const [currentVal, setCurrentVal] = useState(0);
            const [problem, setProblem] = useState({ target: 0, display: "Ready" });
            const [leftAnim, setLeftAnim] = useState(false);
            const [rightAnim, setRightAnim] = useState(false);
            const [status, setStatus] = useState('idle'); 
            const [countdownNum, setCountdownNum] = useState(null);
            
            const waitTimerRef = useRef(null);
            const countIntervalRef = useRef(null);
            const currentDist = Math.abs(currentVal - startOfRound);

            useEffect(() => {
                if (isPlaying) {
                    setTotalScore(0); setStartOfRound(0); setCurrentVal(0);
                    setProblem(generateProblem(difficulty, 0, 1));
                    resetTimers();
                }
            }, [isPlaying]);

            const resetTimers = () => {
                if (waitTimerRef.current) clearTimeout(waitTimerRef.current);
                if (countIntervalRef.current) clearInterval(countIntervalRef.current);
                setStatus('idle'); setCountdownNum(null);
            };

            useEffect(() => {
                if (!isPlaying) return;
                if (currentVal === problem.target) {
                    if (status === 'idle') {
                        setStatus('waiting');
                        waitTimerRef.current = setTimeout(startCountdown, 1000);
                    }
                } else {
                    if (status === 'waiting' || status === 'counting') resetTimers();
                }
            }, [currentVal, problem, isPlaying]);

            const startCountdown = () => {
                setStatus('counting');
                let count = 3;
                setCountdownNum(count);
                playSound('count');
                countIntervalRef.current = setInterval(() => {
                    count--;
                    if (count === 0) {
                        clearInterval(countIntervalRef.current);
                        handleSuccess();
                    } else {
                        setCountdownNum(count);
                        playSound('count');
                    }
                }, 1000);
            };

            const handleSuccess = () => {
                setStatus('success');
                playSound('success');
                const scoreGained = Math.abs(problem.target - startOfRound);
                const newTotal = totalScore + scoreGained;
                setTotalScore(newTotal);
                onUpdateScore(id, newTotal); 
                const nextStart = problem.target;
                setStartOfRound(nextStart); 
                setTimeout(() => {
                    resetTimers();
                    setProblem(generateProblem(difficulty, nextStart, newTotal + 2)); 
                }, 500);
            };

            const handleTap = (delta) => {
                if (!isPlaying || status === 'success') return;
                playSound('step');
                if (delta > 0) setRightAnim(p => !p); else setLeftAnim(p => !p);
                setCurrentVal(p => Math.max(0, p + delta));
            };

            const themes = ["border-blue-500 bg-gradient-to-b from-blue-900/30 to-blue-900/10", "border-red-500 bg-gradient-to-b from-red-900/30 to-red-900/10", "border-green-500 bg-gradient-to-b from-green-900/30 to-green-900/10", "border-yellow-500 bg-gradient-to-b from-yellow-900/30 to-yellow-900/10"];

            return (
                <div className={`player-col h-full flex flex-col relative ${themes[id]} ${status === 'success' ? 'flash' : ''}`}>
                    <div className="p-2 flex flex-col items-center border-b border-white/10 bg-black/20">
                        <div className="flex items-center gap-2 w-full justify-between px-2">
                            <div className="flex flex-col items-center">
                                <span className="text-3xl">{skinTone}</span>
                                <span className="text-xs text-gray-400">P{id+1}</span>
                            </div>
                            <div className="flex flex-col items-end">
                                <span className="text-2xl text-yellow-400">{currentRank === 1 ? '🥇' : currentRank === 2 ? '🥈' : currentRank === 3 ? '🥉' : ''}</span>
                                <span className="text-2xl text-white tabular-nums">{totalScore}m</span>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col items-center justify-center p-2 relative">
                        <div className="text-5xl bg-black/50 px-4 py-3 rounded-xl border border-white/10 w-full text-center mb-6">
                            {problem.display === "준비" || problem.display === "Ready" ? (t.code === 'ko' ? "준비" : "Ready") : problem.display}
                        </div>
                        <div className="relative w-full flex justify-center items-center h-32">
                            {status === 'counting' && <div className="absolute inset-0 flex items-center justify-center z-20"><span className="text-9xl text-yellow-300 drop-shadow-[0_0_10px_rgba(0,0,0,0.8)] anim-pop">{countdownNum}</span></div>}
                            <span className="text-7xl md:text-8xl text-white">{currentVal}</span>
                        </div>
                    </div>
                    <div className="w-full text-center pb-2 flex flex-col items-center gap-2">
                        <div className="bg-gray-800/80 px-5 py-2 rounded-lg border border-gray-600">
                            <span className="text-gray-400 text-lg mr-2">{t.distance}</span>
                            <span className="text-white text-2xl">{currentDist}m</span>
                        </div>
                        <span className="text-lg text-yellow-200/90 bg-black/50 px-4 py-1 rounded-full animate-pulse border border-yellow-500/30">{t.stopMsg}</span>
                    </div>
                    <div className="h-48 p-2 pb-6 grid grid-cols-2 gap-2">
                        <button className="bg-gray-700 rounded-xl shadow-[0_4px_0_rgb(55,65,81)] btn-tap flex flex-col items-center justify-center overflow-hidden relative group" onPointerDown={(e) => { e.preventDefault(); handleTap(-1); }}>
                            <span className="text-6xl filter-white transition-all duration-75">{leftAnim ? '🏃' : '🚶'}</span>
                            <span className="absolute bottom-2 text-4xl text-white/50">-</span>
                        </button>
                        <button className="bg-gray-700 rounded-xl shadow-[0_4px_0_rgb(55,65,81)] btn-tap flex flex-col items-center justify-center overflow-hidden relative group" onPointerDown={(e) => { e.preventDefault(); handleTap(1); }}>
                            <span className="text-6xl filter-red transition-all duration-75">{rightAnim ? '🏃‍♂️' : '🚶‍♂️'}</span>
                            <span className="absolute bottom-2 text-4xl text-red-300">+</span>
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState(getInitialLang);
            const t = TRANSLATIONS[lang]; 

            const [gameState, setGameState] = useState('menu'); 
            const [startCount, setStartCount] = useState(null);
            const [difficulty, setDifficulty] = useState('easy');
            const [playerCount, setPlayerCount] = useState(4); 
            const [timeLeft, setTimeLeft] = useState(60);
            const [scores, setScores] = useState([0,0,0,0]);
            const [ranks, setRanks] = useState([1,1,1,1]);
            const skinTones = ['🏃🏻', '🏃🏼', '🏃🏾', '🏃🏿'];
            const timerRef = useRef(null);

            // 언어 변경 함수
            const changeLang = (newLang) => {
                setLang(newLang);
                localStorage.setItem('kingsmath_lang', newLang);
                const url = new URL(window.location);
                url.searchParams.set('lang', newLang);
                window.history.pushState({}, '', url);
            };

            // 메타데이터 업데이트
            useEffect(() => {
                updateMetadata(lang);
            }, [lang]);

            const toggleFullScreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch((err) => console.log(err));
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            };
            
            // 🏠 전체화면 대응 홈버튼 로직
            const goHome = () => {
                if (document.fullscreenElement) {
                    if (timerRef.current) clearInterval(timerRef.current);
                    setGameState('menu');
                    playSound('click');
                } else {
                    window.location.reload();
                }
            };

            const handleScoreUpdate = (id, newScore) => {
                setScores(prev => {
                    const newScores = [...prev];
                    newScores[id] = newScore;
                    const activeScores = newScores.slice(0, playerCount);
                    const sorted = activeScores.map((s, i) => ({s, i})).sort((a,b) => b.s - a.s);
                    const newRanks = [...prev];
                    let currentRank = 1;
                    for(let i=0; i<sorted.length; i++) {
                        if (i > 0 && sorted[i].s < sorted[i-1].s) currentRank = i + 1;
                        newRanks[sorted[i].i] = currentRank;
                    }
                    setRanks(newRanks);
                    return newScores;
                });
            };

            const prepareGame = () => {
                setGameState('starting');
                let count = 3;
                setStartCount(count);
                playSound('gostart');
                const startInterval = setInterval(() => {
                    count--;
                    if (count === 0) {
                        setStartCount("GO!"); playSound('gostart');
                    } else if (count < 0) {
                        clearInterval(startInterval); startGame();
                    } else {
                        setStartCount(count); playSound('gostart');
                    }
                }, 1000);
            };

            const startGame = () => {
                setGameState('playing');
                setTimeLeft(60);
                setScores(new Array(4).fill(0));
                setRanks(new Array(4).fill(1));
                if (timerRef.current) clearInterval(timerRef.current);
                timerRef.current = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) { clearInterval(timerRef.current); setGameState('result'); return 0; }
                        return prev - 1;
                    });
                }, 1000);
            };

            return (
                <div id="game-container" className="w-full h-screen flex flex-col bg-gray-900 overflow-hidden relative">
                    
                    {/* 상단 다국어 선택기 연동 (메인 화면에서만 노출) */}
                    <LanguageSelectorUI currentLang={lang} onSelectLang={changeLang} isVisible={gameState === 'menu'} />

                    {/* 상단 배너 */}
                    <a href="/" target="_self" className="w-full bg-indigo-600 text-white text-center py-2 text-base hover:bg-indigo-500 transition-colors z-50 shrink-0 shadow-md">
                        {t.banner}
                    </a>

                    {/* 플로팅 버튼들 (메뉴 화면에서는 홈 버튼 숨김) */}
                    {gameState !== 'menu' && (
                        <button 
                            onClick={goHome} 
                            className="fixed left-4 top-1/2 -translate-y-1/2 z-[100] bg-gray-700/80 p-4 rounded-full shadow-xl hover:bg-gray-600 border-2 border-white/20 backdrop-blur-sm transition-all hover:scale-110"
                            title={t.homeBtn}
                        >
                            <span className="text-3xl">🏠</span>
                        </button>
                    )}
                    
                    <button 
                        onClick={toggleFullScreen} 
                        className="fixed right-4 top-1/2 -translate-y-1/2 z-[100] bg-gray-700/80 p-4 rounded-full shadow-xl hover:bg-gray-600 border-2 border-white/20 backdrop-blur-sm transition-all hover:scale-110"
                        title="FullScreen"
                    >
                        <span className="text-3xl">⛶</span>
                    </button>

                    {/* 게임 헤더 (타이머만 중앙 정렬) */}
                    {(gameState === 'playing' || gameState === 'starting') && (
                        <div className="w-full h-14 bg-gray-800 flex items-center justify-center px-4 border-b border-gray-700 shrink-0 z-40">
                            <div className={`text-4xl font-bold tracking-widest ${timeLeft <= 10 ? 'text-red-500 animate-pulse' : 'text-white'}`}>
                                ⏰ {timeLeft}
                            </div>
                        </div>
                    )}

                    {/* 시작 카운트다운 */}
                    {gameState === 'starting' && (
                        <div className="absolute inset-0 z-40 flex items-center justify-center bg-black/80 backdrop-blur-sm top-0">
                            <div className="text-[12rem] text-yellow-400 animate-bounce">{startCount}</div>
                        </div>
                    )}

                    {/* 게임 영역 */}
                    {(gameState === 'playing' || gameState === 'starting') && (
                        <div className="flex-1 w-full flex overflow-hidden pt-2">
                            {Array.from({ length: playerCount }).map((_, i) => (
                                <div key={i} className="flex-1 h-full">
                                    <PlayerColumn id={i} difficulty={difficulty} isPlaying={gameState === 'playing'} onUpdateScore={handleScoreUpdate} currentRank={ranks[i]} skinTone={skinTones[i]} t={t} />
                                </div>
                            ))}
                        </div>
                    )}

                    {/* 메뉴 화면 */}
                    {gameState === 'menu' && (
                        <div className="flex-1 flex flex-col items-center justify-center space-y-4 bg-gray-900 p-4 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                                <div className="absolute top-10 left-10 text-9xl">🏃</div>
                                <div className="absolute bottom-10 right-10 text-9xl">🏃‍♂️</div>
                                <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[20rem]">👑</div>
                            </div>
                            <div className="z-10 text-center space-y-1 mt-4">
                                <h1 className="text-6xl md:text-8xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 italic transform -skew-x-12 px-4 leading-tight">{t.title}</h1>
                                <p className="text-xl md:text-2xl text-gray-300 tracking-widest">{t.subtitle}</p>
                            </div>
                            
                            <div className="z-10 w-full max-w-2xl bg-gray-800/90 backdrop-blur-md p-6 md:p-8 rounded-3xl shadow-2xl border border-gray-700 flex flex-col items-center gap-6">
                                <div className="text-gray-200 text-center text-lg bg-black/40 px-6 py-4 rounded-xl leading-relaxed border border-gray-600/50">
                                    <p className="font-bold text-yellow-300 mb-1">{t.howToTitle}</p>
                                    <span dangerouslySetInnerHTML={{__html: t.howToDesc1}}></span><br/>
                                    <span dangerouslySetInnerHTML={{__html: t.howToDesc2}}></span><br/>
                                    <span dangerouslySetInnerHTML={{__html: t.howToDesc3}}></span><br/>
                                    <span className="text-sm text-gray-400 mt-2 block">{t.howToTip}</span>
                                </div>

                                <div className="w-full">
                                    <label className="block text-lg text-gray-300 mb-2 text-center">{t.players}</label>
                                    <div className="flex gap-3 justify-center">
                                        {[1, 2, 3, 4].map(num => (
                                            <button key={num} onClick={() => setPlayerCount(num)} className={`w-16 h-16 rounded-xl text-2xl transition-all ${playerCount === num ? 'bg-blue-600 text-white ring-4 ring-blue-900 scale-110' : 'bg-gray-700 text-gray-500 hover:bg-gray-600'}`}>{num}{t.unitPerson}</button>
                                        ))}
                                    </div>
                                </div>
                                <div className="w-full">
                                    <label className="block text-lg text-gray-300 mb-2 text-center">{t.difficulty}</label>
                                    <div className="flex justify-center gap-3 flex-wrap">
                                        <button onClick={() => setDifficulty('easy')} className={`px-4 py-3 rounded-lg text-sm transition-all ${difficulty === 'easy' ? 'bg-green-600 text-white ring-2 ring-green-900 scale-105' : 'bg-gray-700 text-gray-400'}`}>{t.diffEasy}</button>
                                        <button onClick={() => setDifficulty('normal')} className={`px-4 py-3 rounded-lg text-sm transition-all ${difficulty === 'normal' ? 'bg-yellow-600 text-white ring-2 ring-yellow-900 scale-105' : 'bg-gray-700 text-gray-400'}`}>{t.diffNormal}</button>
                                        <button onClick={() => setDifficulty('hard')} className={`px-4 py-3 rounded-lg text-sm transition-all ${difficulty === 'hard' ? 'bg-red-600 text-white ring-2 ring-red-900 scale-105' : 'bg-gray-700 text-gray-400'}`}>{t.diffHard}</button>
                                    </div>
                                </div>
                                <button onClick={prepareGame} className="px-20 w-auto py-5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-3xl rounded-2xl hover:scale-105 active:scale-95 transition-all shadow-lg whitespace-nowrap">{t.startBtn}</button>
                                <a href="/" target="_self" className="text-gray-400 hover:text-white transition-colors flex items-center gap-2 text-sm bg-gray-700/50 px-4 py-2 rounded-full hover:bg-gray-700"><span>{t.moreGames}</span></a>
                            </div>
                        </div>
                    )}

                    {/* 결과 화면 */}
                    {gameState === 'result' && (
                        <div className="flex-1 flex flex-col items-center justify-center bg-black/95 p-10 z-50">
                            <Confetti />
                            <h2 className="text-6xl text-yellow-400 mb-12 animate-bounce z-50">{t.resultTitle}</h2>
                            <div className="flex flex-wrap justify-center gap-6 w-full max-w-6xl z-50">
                                {Array.from({length: playerCount}).map((_, idx) => {
                                    const rank = ranks[idx];
                                    const isWinner = rank === 1;
                                    return (
                                        <div key={idx} className={`p-8 rounded-3xl flex flex-col items-center justify-center relative min-w-[200px] ${isWinner ? 'bg-gradient-to-b from-yellow-500 to-orange-600 scale-110 z-10 shadow-[0_0_50px_rgba(255,215,0,0.5)]' : 'bg-gray-800'}`}>
                                            {isWinner && <div className="text-6xl absolute -top-10 animate-bounce">👑</div>}
                                            <div className="text-5xl mb-2">{skinTones[idx]}</div>
                                            <div className="text-2xl mb-2 text-white/80">P{idx+1}</div>
                                            <div className="text-6xl text-white mb-2">{scores[idx]}m</div>
                                            <div className="text-3xl text-white/90">{rank}{t.rankSuffix}</div>
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="mt-16 flex flex-col items-center gap-4 z-50">
                                <button onClick={goHome} className="px-12 py-4 bg-white text-gray-900 text-2xl rounded-full hover:bg-gray-200 transition-colors shadow-xl">{t.homeBtn}</button>
                                <a href="/" target="_self" className="text-gray-400 hover:text-white transition-colors">{t.moreGames} ➡</a>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
