    <style>
        /* --- 기본 설정 --- */
        :root {
            --bg-color: #2b2b2b;
            --card-bg: #3a3a3a;
            --text-color: #f0f0f0;
            --accent-color: #FFD93D;
            --btn-active: #6c5ce7;
            
            /* Team Colors */
            --p0-main: #e74c3c; --p0-light: #ff7675; /* Red/Pink */
            --p1-main: #3498db; --p1-light: #74b9ff; /* Blue */
            --p2-main: #9b59b6; --p2-light: #a29bfe; /* Purple */
            --p3-main: #2ecc71; --p3-light: #55efc4; /* Green */

            --zone-a-color: #ff6b6b; /* Left Zone Color */
            --zone-b-color: #48dbfb; /* Right Zone Color */
        }

        body {
            margin: 0; padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            
            /* --- 전자칠판 최적화 --- */
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
            
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }
        
        .top-link {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 5px;
            transition: color 0.3s;
            text-align: center;
            display: block;
            margin-top: -10px;
        }
        .top-link:hover { color: #fff; text-decoration: underline; }

        .bottom-link {
            margin-top: 20px;
            font-size: 1.3rem;
            color: #81ecec;
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
        }
        .bottom-link:hover { transform: scale(1.05); color: #fff; text-decoration: underline; }

        /* --- 헤더 --- */
        header {
            background-color: #1e1e1e;
            color: var(--accent-color);
            padding: 0 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
            height: 70px;
            position: relative;
        }
        header h1 {
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 1px 1px 0 #000;
            cursor: pointer;
            position: absolute;
            left: 30px;
        }

        /* 타이머 */
        #header-info {
            display: none;
            align-items: center;
            gap: 20px;
        }
        #timer-display {
            font-size: 2.5rem;
            color: #fff;
            background: #444;
            padding: 5px 20px;
            border-radius: 15px;
            border: 2px solid #666;
            min-width: 80px;
            text-align: center;
            box-shadow: inset 0 0 10px #000;
        }
        #timer-display.urgent {
            background: #c0392b;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }

        /* --- 메인 컨테이너 --- */
        #app-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: calc(100% - 70px);
        }

        /* --- 설정 화면 --- */
        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: var(--card-bg);
            padding: 30px 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 3px solid #444;
            max-height: 90vh;
            overflow-y: auto;
            min-width: 360px;
            z-index: 20;
        }

        .screen-title { 
            font-size: 4rem;
            color: #fff; 
            text-shadow: 3px 3px 0 #000; 
            margin-bottom: 10px; 
            line-height: 1.2;
            text-align: center;
        }
        .option-section { width: 100%; text-align: center; margin-bottom: 10px; }
        .label-text { color: #aaa; margin-bottom: 8px; font-size: 1.3rem; }
        .option-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        
        .btn-option {
            padding: 15px 25px; font-size: 1.3rem; border: 2px solid #555; background: #222;
            color: #aaa; border-radius: 20px; cursor: pointer; transition: all 0.2s;
            touch-action: none; 
        }
        .btn-option.selected {
            background-color: var(--btn-active); color: white; border-color: var(--btn-active);
            box-shadow: 0 0 10px var(--btn-active); transform: translateY(-2px);
        }

        #btn-start {
            margin-top: 10px; padding: 15px 70px; font-size: 2.2rem;
            background-color: #ff7675; color: white; border: none; border-radius: 50px;
            box-shadow: 0 6px 0 #d63031; font-family: inherit; cursor: pointer;
            transition: transform 0.1s;
            touch-action: none;
        }
        #btn-start:active { transform: translateY(6px); box-shadow: none; }

        /* --- 게임 보드 --- */
        #game-board {
            display: none; width: 100%; height: 100%; padding: 10px; padding-bottom: 20px;
            box-sizing: border-box; flex-direction: row; justify-content: center;
            align-items: stretch; gap: 15px;
        }

        /* 플레이어 카드 */
        .team-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 3px solid #666;
            flex: 0 0 23%; 
            min-width: 250px; 
            max-width: 400px; 
            transition: all 0.3s;
        }

        .team-0 { border-color: var(--p0-main); }
        .team-0 .player-label { color: var(--p0-light); }
        .team-1 { border-color: var(--p1-main); }
        .team-1 .player-label { color: var(--p1-light); }
        .team-2 { border-color: var(--p2-main); }
        .team-2 .player-label { color: var(--p2-light); }
        .team-3 { border-color: var(--p3-main); }
        .team-3 .player-label { color: var(--p3-light); }

        .crown-icon {
            position: absolute; top: -40px; left: 50%; transform: translateX(-50%) scale(0.5);
            font-size: 3rem; opacity: 0; transition: all 0.4s; z-index: 9990; pointer-events: none;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .crown-icon.show { opacity: 1; transform: translateX(-50%) scale(1); }

        .player-label {
            font-size: 1.8rem; margin-bottom: 5px; text-shadow: 1px 1px 0 #000; text-align: center;
        }

        .prob-display {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 5px;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 10px;
        }
        .prob-bar-container {
            width: 100%; height: 15px; background: #222; border-radius: 10px;
            overflow: hidden; margin-bottom: 10px; border: 1px solid #555;
        }
        .prob-bar-fill {
            height: 100%; width: 0%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .team-0 .prob-bar-fill { background-color: var(--p0-main); }
        .team-1 .prob-bar-fill { background-color: var(--p1-main); }
        .team-2 .prob-bar-fill { background-color: var(--p2-main); }
        .team-3 .prob-bar-fill { background-color: var(--p3-main); }

        /* 문제 영역 */
        .problem-area {
            flex: 1; width: 100%; display: flex; flex-direction: column;
            gap: 5px; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px; box-sizing: border-box;
        }

        .vs-container {
            display: flex; width: 100%; gap: 5px; flex: 1;
        }
        .option-box {
            flex: 1; display: flex; flex-direction: column; justify-content: start; align-items: center;
            border-radius: 10px; padding: 5px; text-align: center; position: relative;
            word-break: keep-all; font-size: 1.1rem; line-height: 1.3;
            border: 2px solid transparent;
            transition: border-color 0.2s, background 0.2s;
        }
        .option-a { background: rgba(255, 107, 107, 0.15); color: #ffadad; border-color: rgba(255, 107, 107, 0.3); }
        .option-b { background: rgba(72, 219, 251, 0.15); color: #7efff5; border-color: rgba(72, 219, 251, 0.3); }
        
        .option-box.reveal { border-width: 3px; background: rgba(0,0,0,0.6); }
        
        .option-title { font-size: 0.9rem; opacity: 0.8; margin-bottom: 5px; }
        .option-content { flex: 1; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }

        .answer-placeholder {
            height: 40px; width: 100%; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5); border-radius: 5px; margin-top: 5px;
            font-size: 2.2rem;
            color: var(--accent-color);
            visibility: hidden;
            transition: opacity 0.3s;
            text-shadow: 2px 2px 0 #000;
        }
        .answer-placeholder.show {
            visibility: visible;
            animation: fadeIn 0.3s forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .gauge-wrapper {
            width: 100%; height: 40px; position: relative; margin: 5px 0;
            border-radius: 25px; overflow: hidden; border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .gauge-bg {
            display: flex; width: 100%; height: 100%;
        }
        .zone-a { width: 50%; height: 100%; background: var(--zone-a-color); display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,0.3); font-size: 1.2rem; }
        .zone-b { width: 50%; height: 100%; background: var(--zone-b-color); display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,0.3); font-size: 1.2rem; }
        
        .needle {
            position: absolute; top: 0; bottom: 0; width: 6px; background: #fff;
            left: 50%; transform: translateX(-50%);
            box-shadow: 0 0 10px #000; z-index: 5;
            border-radius: 3px;
        }

        .stop-btn {
            width: 100%; padding: 12px 0; margin-top: 5px;
            font-size: 2rem; border-radius: 15px; border: none;
            background: linear-gradient(to bottom, #f1c40f, #f39c12);
            color: #fff; font-family: inherit;
            box-shadow: 0 6px 0 #d35400; cursor: pointer;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
            touch-action: none;
        }
        .stop-btn:active { transform: translateY(6px); box-shadow: none; }
        .stop-btn:disabled { background: #555; color: #888; box-shadow: none; transform: none; cursor: not-allowed; }

        .instruction-text {
            color: #aaa; font-size: 0.9rem; text-align: center;
            margin: 30px 0;
            word-break: keep-all;
        }

        .feedback {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 6rem; z-index: 30; text-shadow: 0 0 20px rgba(0,0,0,1);
            pointer-events: none; opacity: 0;
        }
        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        #countdown-overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 15rem; color: #ff7675; z-index: 100;
            text-shadow: 0 0 50px rgba(255, 0, 0, 0.5); display: none;
            pointer-events: none; font-family: inherit;
            animation: pulseCount 0.8s infinite;
        }
        @keyframes pulseCount {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .win-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            border-radius: 15px; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50;
            backdrop-filter: blur(5px); animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .rank-medal { font-size: 5rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        .rank-text { font-size: 3rem; color: var(--accent-color); margin-bottom: 10px; }
        .final-score { font-size: 1.5rem; color: #fff; margin-bottom: 20px; }

        .floating-btn {
            position: fixed; bottom: 20px; width: 50px; height: 50px;
            border-radius: 50%; background: #444; color: white; display: flex;
            justify-content: center; align-items: center; font-size: 1.5rem;
            z-index: 60; border: 2px solid #666; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer; touch-action: none;
        }
        .floating-btn:active { transform: scale(0.9); }
        #btn-home { left: 20px; }
        #btn-fullscreen { right: 20px; }
        
        #confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 100; }
        .confetti { position: absolute; width: 10px; height: 10px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

        #game-over-controls {
            display: none; position: absolute; bottom: 10%; left: 50%;
            transform: translateX(-50%); z-index: 200;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #btn-restart {
            padding: 15px 50px; font-size: 2.2rem; font-family: inherit;
            background: linear-gradient(to bottom, #00b894, #00cec9);
            color: white; border: 4px solid #fff; border-radius: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 6px 0 #006266;
            cursor: pointer; text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s; pointer-events: auto;
            touch-action: none;
        }
        #btn-restart:hover { filter: brightness(1.1); transform: scale(1.05); }
        #btn-restart:active { transform: scale(0.95) translateY(6px); box-shadow: 0 4px 0 #006266; }

        /* --- UI CSS 시작 --- */
        /* 폰트어썸 아이콘 깨짐 방지용 예외 처리 */
        i[class^="fa-"] {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay {
            opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .toast {
            transform: translateY(100%); opacity: 0; transition: all 0.3s ease;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        
        /* 텍스트 자동 조절 클래스 */
        .auto-resize {
            transition: font-size 0.2s;
        }
    </style>
</head>

        // 다국어 헬퍼 함수
        function t(key, params = {}) {
            let str = TRANSLATIONS[currentLang][key] || TRANSLATIONS['en'][key] || key;
            for (const [k, v] of Object.entries(params)) {
                str = str.replace(`{${k}}`, v);
            }

        const triggerBtn = document.getElementById('langTriggerBtn');
        const modal = document.getElementById('langModal');

        function renderLanguages(filterText = '') {
            grid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            
            const filteredLangs = languages.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                grid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                noResult.classList.add('hidden');
                noResult.classList.remove('flex');

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden text-left";
                    const stateClasses = isSelected 
                        ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                        : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                    const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;

                    btn.innerHTML = `
                        <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                            <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col items-start">
                            <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                            <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                    `;
                    btn.addEventListener('click', () => selectLanguage(lang));
                    grid.appendChild(btn);
                });
            }
        }

        function selectLanguage(lang) {
            currentLang = lang.code;
            localStorage.setItem('kingsmath_lang', lang.code);
            
            // Update URL
            const url = new URL(window.location);
            url.searchParams.set('lang', lang.code);
            window.history.pushState({}, '', url);

            closeModal();
            showToast(lang.name, lang.code);
            renderLanguages(searchInput.value);
            applyLanguage();
        }

        function openModal() {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(() => searchInput.focus(), 100);
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function showToast(langName, langCode) {
            const toastMsg = toastTranslations[langCode] || toastTranslations['en'];
            document.getElementById('ui-toast').textContent = toastMsg;
            toastLangName.textContent = langName;
            
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);

        triggerBtn.addEventListener('click', openModal);

        // 언어 초기화
        function initLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            const storedLang = localStorage.getItem('kingsmath_lang');
            const browserLang = navigator.language.substring(0, 2);

            if (langParam && TRANSLATIONS[langParam]) { currentLang = langParam; } 
            else if (storedLang && TRANSLATIONS[storedLang]) { currentLang = storedLang; } 
            else if (TRANSLATIONS[browserLang]) { currentLang = browserLang; } 
            else { currentLang = 'en'; }
            
            renderLanguages();
            applyLanguage();
        }

        function autoResizeText() {
            setTimeout(() => {
                const elements = document.querySelectorAll('.auto-resize');
                elements.forEach(el => {
                    let fontSize = 100; // percent
                    el.style.fontSize = ''; // reset first
                    if (!el.dataset.baseFontSize) {
                        el.dataset.baseFontSize = window.getComputedStyle(el).fontSize;
                    }
                    el.style.fontSize = el.dataset.baseFontSize;
                    
                    while ((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && fontSize > 50) {
                        fontSize -= 5;
                        el.style.fontSize = `calc(${el.dataset.baseFontSize} * ${fontSize / 100})`;
                    }
                });
            }, 50);
        }

        // --- 1. 오디오 시스템 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'correct') {
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(440, now); 
                osc.frequency.setValueAtTime(880, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'countdown') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.2);
                gainNode.gain.setValueAtTime(0.3, now); 
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'end') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(523, now); osc.frequency.linearRampToValueAtTime(1046, now + 0.5);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 1.0);
                osc.start(now); osc.stop(now + 1.0);
            }
        }

        // --- 2. 문제 생성 로직 ---
        function gcd(a, b) { return b == 0 ? a : gcd(b, a % b); }

        const ProblemGenerator = {
            tools: {
                coin: (n) => { return { type: 'coin', n: n, total: Math.pow(2, n), name: t('coinName', {n: n}) }; },
                dice: (n) => { return { type: 'dice', n: n, total: Math.pow(6, n), name: t('diceName', {n: n}) }; },
                bag: (total) => { return { type: 'bag', total: total, name: t('bagName', {n: total}) }; },
                rps: () => { return { type: 'rps', total: 3, name: t('rpsName') }; }
            },

            createEvent: function(toolObj) {
                let desc = "";
                let numerator = 0;
                let denominator = toolObj.total;

                switch(toolObj.type) {
                    case 'coin':
                        if(toolObj.n === 1) {
                            desc = Math.random() < 0.5 ? t('coinHead') : t('coinTail');
                            numerator = 1;
                        } else if(toolObj.n === 2) {
                            const r = Math.random();
                            if(r < 0.33) { desc = t('coinAllHead'); numerator = 1; }
                            else if(r < 0.66) { desc = t('coinAllTail'); numerator = 1; }
                            else { desc = t('coinDiff'); numerator = 2; }
                        } else {
                            const r = Math.random();
                            if(r < 0.2) { desc = t('coinAllHead'); numerator = 1; }
                            else if(r < 0.4) { desc = t('coinAllTail'); numerator = 1; }
                            else if(r < 0.7) { desc = t('coinHead1'); numerator = 3; } 
                            else { desc = t('coinTailAtLeast1'); numerator = 7; }
                        }
                        break;
                    case 'dice':
                        if(toolObj.n === 1) {
                            const r = Math.random();
                            if(r < 0.3) { desc = t('diceEven'); numerator = 3; }
                            else if(r < 0.6) { desc = t('diceMul3'); numerator = 2; }
                            else if(r < 0.8) { desc = t('diceOver5'); numerator = 2; }
                            else { desc = t('dice1'); numerator = 1; }
                        } else {
                            const r = Math.random();
                            if(r < 0.3) { desc = t('diceSum7'); numerator = 6; }
                            else if(r < 0.6) { desc = t('diceSumEven'); numerator = 18; }
                            else if(r < 0.8) { desc = t('diceSame'); numerator = 6; }
                            else { desc = t('diceSum12'); numerator = 1; }
                        }
                        break;
                    case 'bag':
                        numerator = Math.floor(Math.random() * (toolObj.total - 1)) + 1;
                        const other = toolObj.total - numerator;
                        desc = t('bagDesc', {r: numerator, b: other});
                        break;
                    case 'rps':
                        const r = Math.random();
                        if(r < 0.33) { desc = t('rpsWin'); numerator = 1; }
                        else if(r < 0.66) { desc = t('rpsDraw'); numerator = 1; }
                        else { desc = t('rpsLose'); numerator = 1; }
                        break;
                }

                const probVal = numerator / denominator;
                const percent = (probVal * 100).toFixed(1);

                return {
                    text: `[${toolObj.name}]\n${desc}`,
                    prob: probVal,
                    display: `${percent}%`
                };
            },

            getProblem: function() {
                const toolsPool = [
                    this.tools.coin(1), this.tools.coin(2), this.tools.coin(3),
                    this.tools.dice(1), this.tools.dice(2),
                    this.tools.bag(5), this.tools.bag(8), this.tools.bag(10),
                    this.tools.rps()
                ];

                let A, B;
                let limit = 0;
                do {
                    const toolA = toolsPool[Math.floor(Math.random() * toolsPool.length)];
                    const toolB = toolsPool[Math.floor(Math.random() * toolsPool.length)];
                    A = this.createEvent(toolA);
                    B = this.createEvent(toolB);
                    limit++;
                } while( (Math.abs(A.prob - B.prob) < 0.01) && limit < 10 );

                if(A.prob === B.prob) { B.prob = 0; B.display = "0%"; }
                return { A, B };
            }
        };

        // --- 3. 게임 변수 및 설정 ---
        const GOAL_SCORE = 10;
        const TIME_LIMIT = 60;
        let playerCount = 4;
        let teams = [];
        let isGameActive = false;
        let timeLeft = TIME_LIMIT;
        let timerInterval = null;

        // --- 4. Team Class ---
        class Team {
            constructor(index) {
                this.index = index;
                this.score = 0;
                this.currentProblem = null;
                this.needlePos = 50;
                this.needleDir = 1;
                this.baseSpeed = 1.0; 
                this.isStopped = false;
                this.animId = null;

                this.element = this.createElement();
            }

            createElement() {
                const div = document.createElement('div');
                div.className = `team-card team-${this.index}`;
                
                const playerName = t(`animal${this.index}`);
                const winRateText = t('winRate');
                const optA = t('optionA');
                const optB = t('optionB');
                const btnText = t('stopBtn');
                const instruct = t('instruction');

                div.innerHTML = `
                    <div class="crown-icon" id="crown-${this.index}">👑</div>
                    <div class="player-label auto-resize">${playerName}</div>
                    
                    <div class="prob-display auto-resize">${winRateText}: 0%</div>
                    <div class="prob-bar-container">
                        <div class="prob-bar-fill" style="width: 0%"></div>
                    </div>

                    <div class="problem-area">
                        <div class="vs-container">
                            <div class="option-box option-a" id="box-a-${this.index}">
                                <div class="option-title auto-resize">${optA}</div>
                                <div class="option-content auto-resize" id="text-a-${this.index}">-</div>
                                <div class="answer-placeholder auto-resize" id="ans-a-${this.index}"></div>
                            </div>
                            <div class="option-box option-b" id="box-b-${this.index}">
                                <div class="option-title auto-resize">${optB}</div>
                                <div class="option-content auto-resize" id="text-b-${this.index}">-</div>
                                <div class="answer-placeholder auto-resize" id="ans-b-${this.index}"></div>
                            </div>
                        </div>

                        <div class="gauge-wrapper">
                            <div class="gauge-bg">
                                <div class="zone-a">A</div>
                                <div class="zone-b">B</div>
                            </div>
                            <div class="needle" style="left: 50%"></div>
                        </div>

                        <button class="stop-btn auto-resize">${btnText}</button>
                        <div class="instruction-text auto-resize">${instruct}</div>
                    </div>

                    <div class="feedback"></div>

                    <div class="win-overlay" id="overlay-${this.index}">
                        <div class="rank-medal"></div>
                        <div class="rank-text auto-resize"></div>
                        <div class="final-score auto-resize"></div>
                    </div>
                `;

                this.ui = {
                    probText: div.querySelector('.prob-display'),
                    probFill: div.querySelector('.prob-bar-fill'),
                    boxA: div.querySelector(`#box-a-${this.index}`),
                    boxB: div.querySelector(`#box-b-${this.index}`),
                    textA: div.querySelector(`#text-a-${this.index}`),
                    textB: div.querySelector(`#text-b-${this.index}`),
                    ansA: div.querySelector(`#ans-a-${this.index}`),
                    ansB: div.querySelector(`#ans-b-${this.index}`),
                    needle: div.querySelector('.needle'),
                    stopBtn: div.querySelector('.stop-btn'),
                    feedback: div.querySelector('.feedback'),
                    overlay: div.querySelector('.win-overlay'),
                    medal: div.querySelector('.rank-medal'),
                    rankText: div.querySelector('.rank-text'),
                    finalScore: div.querySelector('.final-score')
                };

                const stopHandler = (e) => {
                    e.preventDefault();
                    if(!isGameActive || this.isStopped) return;
                    this.checkAnswer();
                };
                this.ui.stopBtn.addEventListener('pointerdown', stopHandler);

                return div;
            }

            newProblem() {
                const p = ProblemGenerator.getProblem();
                this.currentProblem = p;
                
                this.ui.textA.innerText = `${p.A.text}`;
                this.ui.textB.innerText = `${p.B.text}`;

                this.ui.ansA.innerText = `${p.A.display}`;
                this.ui.ansB.innerText = `${p.B.display}`;
                this.ui.ansA.classList.remove('show');
                this.ui.ansB.classList.remove('show');

                this.ui.boxA.classList.remove('reveal');
                this.ui.boxB.classList.remove('reveal');

                this.isStopped = false;
                this.ui.stopBtn.disabled = false;
                this.ui.stopBtn.innerText = t('stopBtn');
                
                this.baseSpeed = 1.2 + (this.score * 0.25);
                this.needlePos = 50;
                this.needleDir = Math.random() < 0.5 ? 1 : -1;
                
                this.startNeedle();
                autoResizeText();
            }

            startNeedle() {
                if(this.animId) cancelAnimationFrame(this.animId);
                
                const animate = () => {
                    if(!isGameActive || this.isStopped) return;
                    this.needlePos += this.baseSpeed * this.needleDir;

                    if(this.needlePos >= 100) {
                        this.needlePos = 100; this.needleDir = -1;
                    } else if (this.needlePos <= 0) {
                        this.needlePos = 0; this.needleDir = 1;
                    }

                    this.ui.needle.style.left = `${this.needlePos}%`;
                    this.animId = requestAnimationFrame(animate);
                };
                this.animId = requestAnimationFrame(animate);
            }

            checkAnswer() {
                this.isStopped = true;
                cancelAnimationFrame(this.animId);
                this.ui.stopBtn.disabled = true;

                this.ui.ansA.classList.add('show');
                this.ui.ansB.classList.add('show');
                
                this.ui.boxA.classList.add('reveal');
                this.ui.boxB.classList.add('reveal');

                const isAWin = this.currentProblem.A.prob > this.currentProblem.B.prob;
                let isCorrect = false;
                if (isAWin && this.needlePos < 50) isCorrect = true;
                else if (!isAWin && this.needlePos >= 50) isCorrect = true;

                if (isCorrect) {
                    playSound('correct');
                    this.showFeedback("⭕");
                    this.score++;
                    this.updateScoreUI();
                } else {
                    playSound('wrong');
                    this.showFeedback("❌");
                    this.score = Math.max(0, this.score - 1);
                    this.updateScoreUI();
                }

                if(this.score >= GOAL_SCORE) {
                    finishGame();
                } else {
                    setTimeout(() => {
                        if(isGameActive) this.newProblem();
                    }, 3000); 
                }
                updateCurrentLeader();
            }

            showFeedback(emoji) {
                this.ui.feedback.innerText = emoji;
                this.ui.feedback.style.animation = 'none';
                this.ui.feedback.offsetHeight; 
                this.ui.feedback.style.animation = 'feedbackPop 0.8s forwards';
            }

            updateScoreUI() {
                const percent = this.score * 10;
                this.ui.probText.innerText = `${t('winRate')}: ${percent}%`;
                this.ui.probFill.style.width = `${percent}%`;
            }

            showResult(rank) {
                let medal = '';
                let text = '';
                
                if (rank === 1) { medal = '🥇'; text = t('win'); }
                else if (rank === 2) { medal = '🥈'; text = t('rank2'); }
                else if (rank === 3) { medal = '🥉'; text = t('rank3'); }
                else { medal = ''; text = t('rank4'); }

                this.ui.medal.innerText = medal;
                this.ui.rankText.innerText = text;
                this.ui.finalScore.innerText = `${t('finalScore')}: ${this.score * 10}%`;
                this.ui.overlay.style.display = 'flex';
                
                if(rank === 1) createConfetti();
                autoResizeText();
            }
        }

        // --- 5. 게임 관리 ---
        function updateCurrentLeader() {
            let maxScore = -1;
            teams.forEach(t => { if (t.score > maxScore) maxScore = t.score; });

            teams.forEach(t => {
                const crown = document.getElementById(`crown-${t.index}`);
                if (maxScore > 0 && t.score === maxScore) crown.classList.add('show');
                else crown.classList.remove('show');
            });
        }

        function startGame() {
            isGameActive = true;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('langSelectorContainer').style.display = 'none'; // 게임 시작 시 언어 선택기 숨김
            document.getElementById('header-info').style.display = 'flex';
            
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            board.style.display = 'flex';
            
            teams = [];
            for (let i = 0; i < playerCount; i++) {
                const team = new Team(i);
                teams.push(team);
                board.appendChild(team.element);
                team.newProblem();
            }
            
            startTimer();
        }

        function startTimer() {
            timeLeft = TIME_LIMIT;
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.innerText = timeLeft;
            timerDisplay.classList.remove('urgent');

            if(timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;

                if (timeLeft <= 5 && timeLeft > 0) {
                    const cdOverlay = document.getElementById('countdown-overlay');
                    cdOverlay.innerText = timeLeft;
                    cdOverlay.style.display = 'block';
                    playSound('countdown');
                } else if (timeLeft <= 0) {
                    document.getElementById('countdown-overlay').style.display = 'none';
                    finishGame();
                }
            }, 1000);
        }

        function finishGame() {
            if(!isGameActive) return;
            isGameActive = false;
            clearInterval(timerInterval);
            document.getElementById('countdown-overlay').style.display = 'none';
            playSound('end');

            let sortedTeams = [...teams].sort((a, b) => b.score - a.score);
            
            let currentRank = 1;
            for (let i = 0; i < sortedTeams.length; i++) {
                if (i > 0 && sortedTeams[i].score < sortedTeams[i-1].score) {
                    currentRank = i + 1;
                }
                sortedTeams[i].showResult(currentRank);
                if(sortedTeams[i].animId) cancelAnimationFrame(sortedTeams[i].animId);
            }

            document.getElementById('game-over-controls').style.display = 'block';
        }

        // --- 6. 이벤트 핸들러 ---
        const playerOptionBtns = document.querySelectorAll('#player-options .btn-option');
        playerOptionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                playerOptionBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                playerCount = parseInt(btn.dataset.value);
                playSound('click');
            });
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            playSound('click');
            startGame();
        });

        // 홈 이모지 전체 화면 지체 없이 첫화면 가는 소스
        document.getElementById('btn-home').addEventListener('click', () => {
            // 1. 만약 전체 화면 모드라면
            if (document.fullscreenElement) {
                // 새로고침 대신 화면 초기화 로직 실행 (전체 화면 유지)
                isGameActive = false;
                clearInterval(timerInterval);
                teams.forEach(t => {
                    t.isStopped = true;
                    if(t.animId) cancelAnimationFrame(t.animId);
                });
                
                document.getElementById('langSelectorContainer').style.display = 'block';
                document.getElementById('game-board').style.display = 'none';
                document.getElementById('header-info').style.display = 'none';
                document.getElementById('game-over-controls').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'flex';
                
                if(window.playSound) window.playSound('click');
            } else {
                // 2. 전체 화면이 아니라면 그냥 새로고침
                location.reload();
            }
        });
        
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
            else if (document.exitFullscreen) document.exitFullscreen();
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            playSound('click');
            setTimeout(() => location.reload(), 200);
        });

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];
            for (let i = 0; i < 150; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.opacity = Math.random();
                container.appendChild(conf);
            }
        }

        // --- 7. 전자칠판 최적화 ---
        document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });
        document.addEventListener('touchmove', function(event) { event.preventDefault(); }, { passive: false });
        document.addEventListener('touchstart', function(event) { if (event.touches.length > 1) { event.preventDefault(); } }, { passive: false });

        // --- 8. 초기화 실행 ---
        window.addEventListener('resize', autoResizeText);
        initLanguage();

    </script>
</body>
</html>
