.title-area { margin: 30px 0 20px 0; }

#setupArea { width: 500px; max-width: 95vw; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.setup-group { text-align: left; }
.setup-label { font-size: 1.3rem; color: var(--dark); margin-bottom: 8px; display: block; font-weight: normal; }

.custom-select {

.btn-large {

.side-btn {

.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-width: 260px; flex: 1; align-content: center; padding-bottom: 10px; }
.choice-btn { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 12px; color: var(--dark); font-size: 1.5rem; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(0,0,0,0.1); transition: 0.1s; word-break: break-all; padding: 10px; min-height: 60px; font-weight: normal; }

.choice-btn.selected { background: #339af0; color: white; border-color: #1c7ed6; }
.choice-btn.correct { background: var(--correct); color: #fff; border-color: #40c057; animation: bounce 0.5s; }
.choice-btn.wrong { background: var(--wrong); color: #fff; border-color: #fa5252; opacity: 0.5; }

/* Feedback Overlay */
.feedback-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; flex-direction: column; font-size: 5rem; z-index: 20; border-radius: 0; }
.feedback-overlay.secret { background: #000000 !important; opacity: 1; display: flex; color: white; transition: none; animation: none; }
.feedback-overlay.show-result { display: flex; animation: none; }

.final-status p { margin: 5px 0 0 0; font-size: 1.8rem; color: #ffd43b; font-weight: normal; line-height: 1.2;}

#countdownLayer { position: fixed; inset: 0; background: #000000; z-index: 2000; display: none; align-items: center; justify-content: center; }

function detectLanguage() {
    const params = new URLSearchParams(window.location.search);
    const urlLang = params.get('lang');
    if (urlLang && STRINGS[urlLang]) return urlLang;

    const saved = localStorage.getItem('kingsmath_lang');
    if (saved && STRINGS[saved]) return saved;

    const navLang = navigator.language.slice(0, 2);
    if (STRINGS[navLang]) return navLang;

    return 'en';
}

function renderLanguages(filterText = '') {
    grid.innerHTML = '';
    const lowerFilter = filterText.toLowerCase();
    
    const filteredLangs = languages.filter(lang => 
        lang.name.toLowerCase().includes(lowerFilter) || 
        lang.enName.toLowerCase().includes(lowerFilter) ||
        lang.code.toLowerCase().includes(lowerFilter)
    );

    if (filteredLangs.length === 0) {
        grid.classList.add('hidden');
        noResult.classList.remove('hidden');
        noResult.classList.add('flex');
    } else {
        grid.classList.remove('hidden');
        noResult.classList.add('hidden');
        noResult.classList.remove('flex');

        filteredLangs.forEach(lang => {
            const isSelected = lang.code === currentLang;
            const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
            const stateClasses = isSelected ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
            const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
            const dirAttr = lang.dir === 'rtl' ? 'dir="rtl"' : '';

            const btn = document.createElement('div');
            btn.className = `${baseClasses} ${stateClasses}`;
            btn.innerHTML = `
                <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                    <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                </div>
                <div class="flex-1 min-w-0 flex flex-col items-start" ${dirAttr}>
                    <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                    <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                </div>
                ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
            `;
            btn.addEventListener('click', () => selectLanguage(lang));
            grid.appendChild(btn);
        });
    }
}

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(type) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const t = audioCtx.currentTime;

    if (type === 'start') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(440, t); osc.frequency.linearRampToValueAtTime(880, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.5);
    } else if (type === 'count') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'click') {
        osc.type = 'square'; osc.frequency.setValueAtTime(1200, t);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.05);
    } else if (type === 'correct') {
        const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
        osc.frequency.setValueAtTime(523.25, t); osc2.frequency.setValueAtTime(659.25, t + 0.1);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.4);
        gain2.gain.setValueAtTime(0, t); gain2.gain.linearRampToValueAtTime(0.3, t + 0.1); gain2.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.4); osc2.start(t); osc2.stop(t + 0.5);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(100, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);
    } else if (type === 'end') {
        const freqs = [523.25, 659.25, 783.99, 1046.50];
        freqs.forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.value = f;
            g.gain.setValueAtTime(0.2, t + i*0.1); g.gain.linearRampToValueAtTime(0, t + i*0.1 + 0.5);
            o.connect(g); g.connect(audioCtx.destination); o.start(t + i*0.1); o.stop(t + i*0.1 + 0.5);
        });
    }
}

   PROBLEM GENERATOR
   ========================================= */
function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function lcm(a, b) { return (a * b) / gcd(a, b); }

function generateProblem(diff, qNum, lastType) {
    let scale = 1;
    const currentMode = document.getElementById('gameMode') ? document.getElementById('gameMode').value : 'challenge';

    if (currentMode === 'survival') {
        const stage = Math.floor((qNum - 1) / 3);
        scale = Math.pow(2, stage);
    }

    const r = (min, max) => getRandomInt(min * scale, max * scale);

    let pool = [];
    const easyPool = ['calc_basic', 'calc_gap', 'op_find', 'calc_rev', 'seq_arith', 'compare_sign'];
    const normalPool = ['calc_mid', 'calc_div', 'calc_mix', 'seq_geo', 'seq_center', 'logic_fruit', 'compare_sign'];
    const hardPool = ['seq_fib', 'seq_jump', 'logic_emoji', 'logic_set', 'math_gcd', 'math_lcm', 'geom_angle', 'calc_paren_sub', 'calc_paren_add', 'compare_sign'];

    if (diff === 'easy') pool = easyPool;
    else if (diff === 'normal') pool = normalPool;
    else if (diff === 'hard') pool = hardPool;
    else pool = [...easyPool, ...normalPool, ...hardPool]; 

    let type = pool[getRandomInt(0, pool.length-1)];
    if (pool.length > 1 && type === lastType) {
        type = pool[getRandomInt(0, pool.length-1)];
    }

    let q = "", a = 0, dist = [];
    let options = [];

    if (type === 'compare_sign') {
        let leftVal, rightVal, leftStr, rightStr;
        if (diff === 'easy') {
            leftVal = r(5, 50); rightVal = r(5, 50);
            if (Math.random() < 0.2) rightVal = leftVal;
            leftStr = leftVal; rightStr = rightVal;
        } 
        else if (diff === 'normal') {
            const n1 = r(2, 9); const n2 = r(2, 9);
            leftVal = n1 + n2; leftStr = `${n1} + ${n2}`;
            rightVal = leftVal + r(-2, 2); rightStr = rightVal;
        } 
        else {
            const n1 = r(3, 9); const n2 = r(3, 9);
            leftVal = n1 * n2; leftStr = `${n1} × ${n2}`;
            const n3 = r(2, 5);
            if (Math.random() > 0.5) {
                const target = leftVal + getRandomInt(-5 * scale, 5 * scale); 
                rightVal = target; rightStr = `${target * n3} ÷ ${n3}`;
            } else {
                rightVal = r(10, 80); const sub = r(1, 10);
                rightStr = `${rightVal + sub} - ${sub}`;
            }
        }
        q = `${leftStr}  □  ${rightStr}`;
        if (leftVal > rightVal) a = '>';
        else if (leftVal < rightVal) a = '<';
        else a = '=';
        options = ['>', '<', '='];
        options.sort(() => Math.random() - 0.5);
        return { q, a, options, type };
    }
    else if (type === 'calc_basic') {
        const n1 = r(2, 9); const n2 = r(2, 9);
        if(Math.random() > 0.5) { q = `${n1} + ${n2} = □`; a = n1+n2; }
        else { q = `${n1+n2} - ${n2} = □`; a = n1; }
    }
    else if (type === 'calc_gap') {
        const n1 = r(2, 9); const total = r(n1/scale + 2, 20); 
        q = `${n1} + □ = ${total}`; a = total - n1;
    }
    else if (type === 'op_find') {
        const halfScale = Math.max(1, Math.floor(scale / 2));
        const n1 = getRandomInt(2 * halfScale, 5 * halfScale);
        const n2 = getRandomInt(2 * halfScale, 5 * halfScale);
        const ops = ['+', '×']; const op = ops[getRandomInt(0, 1)];
        if (op === '+') { a = '+'; q = `${n1} □ ${n2} = ${n1+n2}`; dist=['-', '×', '÷']; }
        else { a = '×'; q = `${n1} □ ${n2} = ${n1*n2}`; dist=['+', '-', '÷']; }
    }
    else if (type === 'calc_rev') {
        const total = r(10, 20); const n1 = r(1, 9);
        const realTotal = Math.max(total, n1) + getRandomInt(1, 5 * scale);
        q = `${realTotal} = □ + ${n1}`; a = realTotal - n1;
    }
    else if (type === 'seq_arith') {
        const start = r(1, 10); const d = r(2, 5);
        q = `${start}, ${start+d}, ${start+d*2}, □`; a = start+d*3;
    }
    else if (type === 'calc_mid') {
        const n1 = r(11, 19); const n2 = r(2, 5);
        q = `${n1} × ${n2} = □`; a = n1*n2;
    }
    else if (type === 'calc_div') {
        const n2 = r(2, 9); const ans = r(4, 12);
        q = `${n2*ans} ÷ ${n2} = □`; a = ans;
    }
    else if (type === 'calc_mix') {
        const n1 = r(2, 5); const n2 = r(2, 5); const n3 = r(1, 9);
        q = `${n1} × ${n2} + ${n3} = □`; a = n1*n2 + n3;
    }
    else if (type === 'seq_geo') {
        const start = r(1, 3); const ratio = getRandomInt(2, 3); 
        q = `${start}, ${start*ratio}, ${start*ratio*ratio}, □`; a = start*Math.pow(ratio, 3);
    }
    else if (type === 'seq_center') {
        const n1 = r(10, 50); const n3 = n1 + r(2, 10)*2;
        q = `${n1}, □, ${n3}`; a = (n1+n3)/2;
    }
    else if (type === 'logic_fruit') {
        const val = r(3, 9);
        q = `🍎 + 🍎 = ${val*2},  🍎 = □`; a = val;
    }
    else if (type === 'calc_paren_sub') {
        const n1 = r(3, 9); const n2 = r(3, 9);
        const big = (n1 * n2); const s = getRandomInt(1, big - 1); 
        q = `(${n1} × ${n2}) - ${s} = □`; a = (n1 * n2) - s;
    }
    else if (type === 'calc_paren_add') {
        const n1 = r(5, 30); const n2 = r(3, 9); const n3 = r(3, 9);
        q = `${n1} + (${n2} × ${n3}) = □`; a = n1 + (n2 * n3);
    }
    else if (type === 'seq_fib') {
        const s1 = r(1, 5); const s2 = r(1, 5);
        q = `${s1}, ${s2}, ${s1+s2}, ${s1+s2*2}, ${s1*2+s2*3}, □`; a = s1*3 + s2*5; 
    }
    else if (type === 'seq_jump') {
        const start1 = r(5, 10); const start2 = r(1, 5); const d1 = r(5, 10); const d2 = r(1, 3);
        q = `${start1}, ${start2}, ${start1+d1}, ${start2+d2}, ${start1+d1*2}, □`; a = start2 + d2*2;
    }
    else if (type === 'logic_emoji') {
        const s = r(4, 9); const m = r(2, 8);
        q = `☀️+☀️=${s*2}, ☀️+🌙=${s+m}, 🌙=?`; a = m;
    }
    else if (type === 'logic_set') {
        const limitScale = Math.floor(Math.sqrt(scale)); 
        const targets = [6, 8, 10, 12, 15, 18, 20, 24, 30, 36, 40, 48, 60].map(x => x * limitScale);
        const t = targets[getRandomInt(0, targets.length-1)];
        let count = 0; for(let i=1; i<=t; i++) if(t%i===0) count++;
        q = `Divisors of ${t} (Count)?`; 
        if(currentLang === 'ko') q = `${t}의 약수 개수?`;
        else if(currentLang === 'zh') q = `${t}的约数个数?`;
        else if(currentLang === 'ja') q = `${t}の約数の数?`;
        a = count;
    }
    else if (type === 'math_gcd') {
        const g = r(2, 6); const m1 = getRandomInt(2, 5); const m2 = getRandomInt(6, 9);
        const v1 = g*m1; const v2 = g*m2; const realGcd = gcd(v1, v2);
        q = `GCD (${v1}, ${v2})?`;
        if(currentLang === 'ko') q = `${v1}, ${v2}의 최대공약수?`;
        a = realGcd;
    }
    else if (type === 'math_lcm') {
        const sSmall = Math.max(1, Math.floor(scale/1.5));
        const n1 = getRandomInt(2 * sSmall, 5 * sSmall); const n2 = getRandomInt(6 * sSmall, 9 * sSmall);
        q = `LCM (${n1}, ${n2})?`;
        if(currentLang === 'ko') q = `${n1}, ${n2}의 최소공배수?`;
        a = lcm(n1, n2);
    }
    else if (type === 'geom_angle') {
        const maxShape = Math.min(8, 5 + Math.floor(Math.log2(scale))); 
        const n = getRandomInt(3, maxShape); 
        const shapes_ko = {3: '삼각형', 4: '사각형', 5: '오각형', 6:'육각형', 7:'칠각형', 8:'팔각형'};
        const shapes_en = {3: 'Triangle', 4: 'Square', 5: 'Pentagon', 6:'Hexagon', 7:'Heptagon', 8:'Octagon'};
        let shapeName = shapes_en[n] || `${n}-gon`;
        if(currentLang === 'ko') shapeName = shapes_ko[n] || `${n}각형`;
        if(currentLang === 'zh') shapeName = `${n}边形`;
        if(currentLang === 'ja') shapeName = `${n}角形`;

        q = `Sum of angles (${shapeName})?`;
        if(currentLang === 'ko') q = `정${shapeName}의 내각의 합?`;
        a = (n-2) * 180;
        
        if (n===3) dist=[90, 360, 120]; else if (n===4) dist=[180, 270, 540]; else dist=[360, 720, 180];
    }

    if (dist.length === 0) {
        if (typeof a === 'number') {
            const set = new Set(); let loopCount = 0;
            set.add(a); 
            while(set.size < 4 && loopCount < 20) {
                loopCount++; let d; const seed = Math.random();
                const errorMargin = getRandomInt(1, 5) * scale;
                if(seed < 0.4) d = a + errorMargin;
                else if(seed < 0.8) d = a - errorMargin;
                else d = a + getRandomInt(5, 10) * scale;
                if(d !== a && d >= 0) set.add(d); 
            }
            dist = Array.from(set).filter(v => v !== a);
            while (dist.length < 3) { dist.push(a + (dist.length + 1) * scale); }
        } else { dist = ['?', '??', '???']; }
    }
    
    if (type === 'geom_angle') {
        options = [a + '°', ...dist.map(d => d + '°')];
        a = a + '°';
    } else {
        options = [a, ...dist];
    }

    options.sort(() => Math.random() - 0.5);
    return { q, a, options, type };
}

/* =========================================
   Game Lifecycle
   ========================================= */

function initGame() {
    initAudio();
    const pCount = parseInt(document.getElementById('playerCount').value);
    state.difficulty = document.getElementById('difficulty').value;
    state.mode = document.getElementById('gameMode').value;
    state.currentQ = 0;
    state.lastProblemType = null;
    state.players = [];

    const arena = document.getElementById('arena');
    arena.innerHTML = '';
    const txt = STRINGS[currentLang];

    for(let i=0; i<pCount; i++) {
        const initScoreTxt = state.mode === 'challenge' ? `0${txt.score_pt}` : txt.survived_count.replace('문제', '0'); 
        state.players.push({ ...TEAM_DATA[i], score: 0, survived: 0, alive: true, answered: false, selected: null, answerTime: 0 });
        const col = document.createElement('div');
        col.className = `player-col ${state.players[i].color}`;
        col.id = `p-${i}`;
        col.innerHTML = `
            <div class="p-header">
                <span class="p-emoji">${state.players[i].icon}</span>
                <span class="p-name">${state.players[i].name}</span>
                <div class="p-info" id="p-info-${i}">${state.mode==='challenge' ? '0' : '0'}${state.mode==='challenge' ? txt.score_pt : ''}</div>
            </div>
            <div class="mini-question" id="p-q-${i}">...</div>
            <div class="choice-grid" id="p-choices-${i}"></div>
            <div class="feedback-overlay" id="p-fb-${i}"></div>
            <div class="final-status" id="p-final-${i}"></div>
        `;
        arena.appendChild(col);
    }

    document.getElementById('overlay').style.display = 'none';
    document.getElementById('resultPopup').style.display = 'none';
    
    // 언어 선택기 게임 중 숨김 (몰입도 향상)
    document.getElementById('langTriggerContainer').style.display = 'none';

    playSound('start');
    nextTurn();
}

async function nextTurn() {
    const aliveCount = state.players.filter(p=>p.alive).length;
    if (state.mode === 'survival' && aliveCount <= 1 && state.players.length > 1) { endGame(); return; }
    if (state.mode === 'survival' && aliveCount === 0) { endGame(); return; }
    if (state.mode === 'challenge' && state.currentQ >= 10) { endGame(); return; }

    state.currentQ++;
    state.phase = 'counting';
    state.players.forEach((p, idx) => {
        if(p.alive) {
            p.answered = false; p.selected = null; p.answerTime = 0; // 제출 시간 초기화
            const fb = document.getElementById(`p-fb-${idx}`);
            fb.className = 'feedback-overlay'; fb.innerHTML = '';
            const mq = document.getElementById(`p-q-${idx}`);
            mq.innerText = '';
        }
    });

    state.problem = generateProblem(state.difficulty, state.currentQ, state.lastProblemType);
    state.lastProblemType = state.problem.type;
    
    const maxQText = state.mode==='challenge' ? '10' : '∞';
    const txt = STRINGS[currentLang];
    
    document.getElementById('qNumber').innerText = `${txt.q_num} ${state.currentQ} / ${maxQText}`;
    document.getElementById('bigQuestion').innerText = txt.ready;
    
    await runCountdown();

    state.phase = 'playing';
    document.getElementById('bigQuestion').innerHTML = state.problem.q.replace(/\n/g, '<br>');

    state.players.forEach((p, idx) => {
        if(p.alive) document.getElementById(`p-q-${idx}`).innerHTML = state.problem.q.replace(/\n/g, ' ');
    });
    
    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const grid = document.getElementById(`p-choices-${idx}`);
        grid.innerHTML = '';
        const myOptions = [...state.problem.options].sort(() => Math.random() - 0.5);
        myOptions.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'choice-btn';
            btn.innerText = opt;
            btn.onpointerdown = (e) => { e.preventDefault(); handleAnswer(idx, opt, btn); };
            grid.appendChild(btn);
        });
    });
    startTimer();
}

async function runCountdown() {
    const layer = document.getElementById('countdownLayer');
    const txt = document.getElementById('countdownText');
    layer.style.display = 'flex';
    
    for(let i=3; i>0; i--) {
        txt.innerText = i; 
        txt.classList.remove('count-animate');
        void txt.offsetWidth; 
        txt.classList.add('count-animate');
        playSound('count'); 
        await new Promise(r => setTimeout(r, 1000));
    }
    layer.style.display = 'none';
}

function startTimer() {
    state.timer = 30;
    const tBox = document.getElementById('mainTimer');
    tBox.innerText = 30; tBox.classList.remove('timer-urgent');
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
        state.timer--; tBox.innerText = state.timer;
        if(state.timer <= 5) { tBox.classList.add('timer-urgent'); playSound('count'); }
        if(state.timer <= 0) finishRound();
    }, 1000);
}

function handleAnswer(pIdx, val, btnElem) {
    if(state.phase !== 'playing') return;
    const p = state.players[pIdx];
    if(p.answered || !p.alive) return;

    playSound('click');
    p.answered = true; p.selected = val;
    p.answerTime = Date.now(); // 선착순 처리를 위한 정확한 제출 시간 기록
    
    const allBtns = document.getElementById(`p-choices-${pIdx}`).children;
    for(let b of allBtns) b.style.opacity = '0.5';
    btnElem.style.opacity = '1'; btnElem.classList.add('selected');

    const fb = document.getElementById(`p-fb-${pIdx}`);
    const txt = STRINGS[currentLang];
    fb.innerHTML = `
        <div style="font-size:3rem; margin-bottom:10px;">🔒</div>
        <div class="submitted-text">${txt.submitted}</div>
    `;
    fb.classList.add('secret'); 
    
    const living = state.players.filter(pl => pl.alive);
    if(living.every(pl => pl.answered)) finishRound();
}

function finishRound() {
    clearInterval(state.timerInterval);
    state.phase = 'result';
    const correctAns = state.problem.a;
    let someoneWrong = false;
    const txt = STRINGS[currentLang];

    // --- 추가된 로직: 정답자 선착순 가산점 계산 ---
    let correctPlayers = state.players.filter(p => p.alive && p.selected == correctAns);
    correctPlayers.sort((a, b) => a.answerTime - b.answerTime);
    correctPlayers.forEach((p, index) => {
        // 기본 100점 + 1등 50점, 2등 30점, 3등 10점, 4등 이하 0점
        const bonusList = [50, 30, 10];
        p.currentRoundScore = 100 + (bonusList[index] || 0);
    });
    // ----------------------------------------

    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const fb = document.getElementById(`p-fb-${idx}`);
        const info = document.getElementById(`p-info-${idx}`);
        const choices = document.getElementById(`p-choices-${idx}`).children;

        fb.classList.remove('secret'); fb.innerHTML = '';
        
        for(let btn of choices) {
            if(btn.innerText == correctAns) btn.classList.add('correct');
            else if(p.selected == btn.innerText) btn.classList.add('wrong');
        }

        if(p.selected == correctAns) {
            fb.innerHTML = '<span style="color:#69db7c">⭕</span>'; 
            if(state.mode === 'challenge') { 
                p.score += p.currentRoundScore; 
                info.innerText = `${p.score}${txt.score_pt}`; 
                // 시각적으로 획득한 점수를 보여주는 연출 추가
                fb.innerHTML += `<div style="font-size:1.5rem; color:#ffd43b; margin-top:10px; font-weight:bold; font-family:'Jua', sans-serif;">+${p.currentRoundScore}</div>`;
            } else { 
                if(currentLang === 'ko') info.innerText = `${p.survived}문제 생존`; 
                else info.innerText = `${p.survived} ${txt.survived_count}`;
            }
            fb.classList.add('show-result');
            p.survived++;
        } else {
            someoneWrong = true;
            fb.innerHTML = '<span style="color:#ff6b6b">❌</span>'; fb.classList.add('show-result');
            if(state.mode === 'survival') {
                p.alive = false;
                setTimeout(() => {
                    document.getElementById(`p-${idx}`).classList.add('eliminated');
                    info.innerText = `${txt.eliminated} (${p.survived})`;
                }, 1500);
            }
        }
    });
    if(!someoneWrong) playSound('correct'); else playSound('wrong');
    setTimeout(() => nextTurn(), 3000);
}

function endGame() {
    clearInterval(state.timerInterval);
    state.phase = 'gameover';
    playSound('end');
    
    const popup = document.getElementById('resultPopup');
    const list = document.getElementById('finalResultList');
    popup.style.display = 'flex'; list.innerHTML = '';
    
    const txt = STRINGS[currentLang];

    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`);
        finalDiv.style.display = 'block';
        if (state.mode === 'challenge') { 
            finalDiv.innerHTML = `<h3>${txt.final_score}</h3><p>${p.score}${txt.score_pt}</p>`; 
        }
        else { 
            const survText = currentLang === 'ko' ? `${p.survived}문제` : `${p.survived}`;
            finalDiv.innerHTML = p.alive ? `<h3>${txt.record}</h3><p>${txt.winner}</p>` : `<h3>${txt.record}</h3><p>${survText}</p>`; 
            if(p.alive) finalDiv.style.border = "4px solid #ffd43b"; 
        }
    });

    let ranked = [...state.players];
    if(state.mode === 'challenge') ranked.sort((a,b) => b.score - a.score);
    else ranked.sort((a,b) => { if (a.alive && !b.alive) return -1; if (!a.alive && b.alive) return 1; return b.survived - a.survived; });

    let currentRank = 1;
    ranked.forEach((p, i) => {
        if (i > 0) {
            const prev = ranked[i-1];
            let isTie = false;
            
            if (state.mode === 'challenge') {
                if (p.score === prev.score) isTie = true;
            } else {
                if (p.alive && prev.alive) isTie = true;
                else if (!p.alive && !prev.alive && p.survived === prev.survived) isTie = true;
            }
            
            if (!isTie) currentRank = i + 1;
        } else {
            currentRank = 1;
        }

        const li = document.createElement('li');
        li.className = `result-item ${currentRank===1 ? 'rank-1' : ''}`;
        
        let status;
        if (state.mode === 'challenge') status = `${p.score}${txt.score_pt}`;
        else status = p.alive ? txt.winner : `${p.survived}`;

        let rankStr = `${currentRank}${txt.rank}`;
        if(currentLang === 'zh') rankStr = `第${currentRank}名`;
        else if(currentLang === 'ru') rankStr = `${currentRank} место`;

        li.innerHTML = `<span>${rankStr} ${p.icon} ${p.name}</span><span>${status}</span>`;
        list.appendChild(li);
    });
}

document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            console.log(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
        });
    } else {
        document.exitFullscreen();
    }
});

});

window.addEventListener('DOMContentLoaded', () => {
    currentLang = detectLanguage();
    renderLanguages();
    changeLanguage(currentLang);
});

    if (document.fullscreenElement) {
        clearInterval(state.timerInterval);
        state.phase = 'setup';
        
        document.getElementById('resultPopup').style.display = 'none';
        document.getElementById('countdownLayer').style.display = 'none';
        document.getElementById('arena').innerHTML = '';
        document.getElementById('mainTimer').innerText = '30';

        document.getElementById('bigQuestion').innerText = STRINGS[currentLang].ready;

        // 게임 초기화 화면과 함께 언어 선택기 다시 보이기

        document.getElementById('langTriggerContainer').style.display = 'block';

        if(window.playSound) window.playSound('click');
    } else {

    }
});
