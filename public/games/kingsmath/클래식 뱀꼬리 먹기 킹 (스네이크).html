            if (urlLang && translations[urlLang]) return urlLang;

            const savedLang = localStorage.getItem('kingsmath_lang');
            if (savedLang && translations[savedLang]) return savedLang;

            const browserLang = navigator.language.split('-')[0].toLowerCase();
            const fullBrowserLang = navigator.language.toLowerCase();
            if (fullBrowserLang === 'pt-br' && translations['pt-br']) return 'pt-br';
            if (translations[browserLang]) return browserLang;

            return 'en';
        }

                    el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) - 1) + 'px';

            });
        }

        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        
        // 모바일 버전의 사운드 출력 함수 이식
        function playTone(freq, type, duration, vol=0.1, time=0) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; 
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + time);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime + time);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + time + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + time); 
            osc.stop(audioCtx.currentTime + time + duration);
        }
        
        // 모바일 버전의 게임 시작 사운드 이식
        function playArabianSnakeMelody() {
            if (!audioCtx) return;
            const baseTime = 0.12; 
            playTone(329.63, 'square', 0.1, 0.1, 0); 
            playTone(349.23, 'square', 0.1, 0.1, baseTime * 1); 
            playTone(415.30, 'square', 0.1, 0.1, baseTime * 2); 
            playTone(349.23, 'square', 0.1, 0.1, baseTime * 3); 
            playTone(329.63, 'square', 0.1, 0.1, baseTime * 4); 
            playTone(293.66, 'square', 0.1, 0.1, baseTime * 5); 
            playTone(329.63, 'square', 0.6, 0.15, baseTime * 6); 
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 0.5 + 0.2;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.life = 1.0; this.decay = Math.random() * 0.02 + 0.11;
                this.size = Math.random() * 5 + 2;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; return this.life > 0; }
            draw(ctx) { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1.0; }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x; this.y = y; this.text = text; this.color = color;
                this.life = 1.0; this.vy = -1.5; 
            }
            update() { this.y += this.vy; this.life -= 0.11; return this.life > 0; }
            draw(ctx) {
                ctx.globalAlpha = this.life; ctx.fillStyle = this.color; 
                ctx.font = "bold 24px Arial, sans-serif"; 
                ctx.textAlign = "center"; ctx.shadowColor = "black"; ctx.shadowBlur = 4;
                ctx.fillText(this.text, this.x, this.y); ctx.shadowBlur = 0; ctx.globalAlpha = 1.0;
            }
        }

                col.querySelector('.btn-down').onclick = (e) => { e.preventDefault(); this.changeDir(0, 1); };
                col.querySelector('.btn-left').onclick = (e) => { e.preventDefault(); this.changeDir(-1, 0); };
                col.querySelector('.btn-right').onclick = (e) => { e.preventDefault(); this.changeDir(1, 0); };
            }

            updateText() {
                this.missionLabel.innerText = getText('goal');
                this.scoreLabel.innerText = getText('score');
                adjustTextSizes();
            }

            resize() {
                const wrapper = this.canvas.parentElement;
                const size = Math.min(wrapper.clientWidth, wrapper.clientHeight) - 10;
                this.canvas.width = size; this.canvas.height = size;
                this.GRID_SIZE = size / this.TILE_COUNT;
                this.draw(1); 
            }

            reset() {
                const startX = Math.floor(this.TILE_COUNT / 2); const startY = this.TILE_COUNT - 5;
                this.snake = [];
                for(let i=0; i<this.baseLen; i++) { this.snake.push({x: startX, y: startY+i, prevX: startX, prevY: startY+i}); }
                this.dx = 0; this.dy = -1; this.items = []; this.eatenItems = [];
                this.dyingTail = null; this.particles = []; this.floatTexts = [];
                this.genMission(); this.maintainItems(); this.updateUI();
            }

            changeDir(ndx, ndy) {
                if (this.hasTurned) return;
                if (ndx === -this.dx && ndy === -this.dy) return;
                this.dx = ndx; this.dy = ndy; this.hasTurned = true; sfx.turn();
            }

            genMission() {
                let n1 = Math.floor(Math.random()*9)+1; let n2 = Math.floor(Math.random()*9)+1; let op = OPS[Math.floor(Math.random()*3)];
                if(op==='-' && n1<n2) [n1, n2] = [n2, n1];
                this.missionTarget = op==='+'?n1+n2 : op==='-'?n1-n2 : n1*n2;
                this.missionEl.innerText = this.missionTarget;
                adjustTextSizes();
            }

            spawnParticles(x, y, color, count=10) {
                const pixelX = x * this.GRID_SIZE + this.GRID_SIZE/2;
                const pixelY = y * this.GRID_SIZE + this.GRID_SIZE/2;
                for(let i=0; i<count; i++) this.particles.push(new Particle(pixelX, pixelY, color));
            }

            showFloatText(x, y, text, color, offsetY = 0) {
                const pixelX = x * this.GRID_SIZE + this.GRID_SIZE/2;
                const pixelY = y * this.GRID_SIZE + offsetY;
                this.floatTexts.push(new FloatingText(pixelX, pixelY, text, color));
            }

            update() {
                if (this.headScale > 1.0) this.headScale -= 0.05;
                this.particles = this.particles.filter(p => p.update());
                this.floatTexts = this.floatTexts.filter(t => t.update());

                for (let p of this.snake) { p.prevX = p.x; p.prevY = p.y; }

                const headX = this.snake[0].x + this.dx;
                const headY = this.snake[0].y + this.dy;

                if (headX < 0 || headX >= this.TILE_COUNT || headY < 0 || headY >= this.TILE_COUNT) { this.die(); return; }
                for(let p of this.snake) { if(p.x === headX && p.y === headY) { this.die(); return; } }

                const newHead = {x: headX, y: headY, prevX: this.snake[0].x, prevY: this.snake[0].y};
                this.snake.unshift(newHead);

                // 2x2 사이즈 큼직한 아이템 충돌 판정 적용
                let ateIdx = this.items.findIndex(it => 
                    headX >= it.x && headX <= it.x + 1 &&
                    headY >= it.y && headY <= it.y + 1
                );

                if (ateIdx !== -1) {
                    const item = this.items[ateIdx];
                    this.items.splice(ateIdx, 1);
                    sfx.eat(); this.score += 2; this.eatenItems.push(item.val);
                    
                    this.headScale = 1.3;
                    this.spawnParticles(headX, headY, item.type==='num'?'#0ea5e9':'#d946ef', 8);
                    this.showFloatText(headX, headY, "+2", "#fbbf24");

                    if(this.eatenItems.length === 3) this.checkMath();
                    setTimeout(() => this.maintainItems(), 500);
                } else {
                    const tail = this.snake.pop(); this.dyingTail = tail; 
                }
                
                this.hasTurned = false; this.updateUI();
            }

            checkMath() {
                const [v1, op, v2] = this.eatenItems;
                let res = null;
                if (typeof v1==='number' && typeof op==='string' && typeof v2==='number') {
                    if (op==='+') res = v1+v2; if (op==='-') res = v1-v2; if (op==='×') res = v1*v2;
                    if (op==='÷') res = (v2!==0 && v1%v2===0) ? v1/v2 : -999;
                }

                const head = this.snake[0];

                if (res === this.missionTarget) {
                    sfx.correct(); this.score += 100; this.effectTimer = 10; 
                    
                    // 정답 시 시간 10초 증가 (공용 글로벌 타이머)
                    timer += 10;
                    document.getElementById('global-timer').innerText = timer;
                    document.getElementById('global-timer').style.color = '#10b981';

                    // 뱀 길이 2 증가
                    this.snake.push({...this.snake[this.snake.length-1]});
                    this.snake.push({...this.snake[this.snake.length-1]});
                    this.baseLen = this.snake.length;

                    this.spawnParticles(head.x, head.y, "#fbbf24", 30);
                    this.showFloatText(head.x, head.y, "+100! Time +10s!", "#10b981", -this.GRID_SIZE * 0.8);
                    this.genMission();
                } else {
                    this.die();
                }
                this.eatenItems = [];
            }

            die() {
                sfx.wrong(); this.score = Math.max(0, this.score - 5); this.shakeTimer = 5;
                this.showFloatText(this.snake[0].x, this.snake[0].y, "-5 Oops", "#f43f5e");
                this.reset();
            }

            maintainItems() {
                if(!isPlaying) return;
                const existing = this.items.map(i => i.val);
                FULL_SET.forEach(v => {
                    if (!existing.includes(v)) {
                        let valid = false, x, y; let attempts = 0;
                        while(!valid && attempts < 200) {
                            attempts++;
                            // 2x2 사이즈 고려 범위 0 ~ TILE_COUNT - 2
                            x = Math.floor(Math.random() * (this.TILE_COUNT - 1)); 
                            y = Math.floor(Math.random() * (this.TILE_COUNT - 1));
                            
                            // 뱀의 몸통과 2x2 영역이 겹치는지 확인
                            let hitSnake = this.snake.some(p => 
                                p.x >= x && p.x <= x + 1 && p.y >= y && p.y <= y + 1
                            );
                            
                            // 다른 아이템과 최소 4칸 이상 거리 유지
                            let tooClose = this.items.some(i => Math.abs(i.x - x) < 4 && Math.abs(i.y - y) < 4);
                            
                            valid = !hitSnake && !tooClose;
                        }
                        if(valid) this.items.push({x, y, val: v, type: typeof v==='number'?'num':'op'});
                    }
                });
            }

            draw(progress) {
                this.ctx.fillStyle = '#1e293b'; this.ctx.fillRect(0,0, this.canvas.width, this.canvas.height);

                this.ctx.save();
                if (this.shakeTimer > 0) {
                    const sx = (Math.random()-0.5)*5; const sy = (Math.random()-0.5)*5;
                    this.ctx.translate(sx, sy); if (progress > 0.9) this.shakeTimer--;
                }

                this.ctx.fillStyle = 'rgba(255,255,255,0.03)';
                const pulse = Math.sin(Date.now() / 500) * 0.5 + 0.5; 
                for(let y=0; y<this.TILE_COUNT; y++) {
                    for(let x=0; x<this.TILE_COUNT; x++) {
                        if((x+y)%2===0) {
                            this.ctx.globalAlpha = 0.5 + (pulse * 0.2); 
                            this.ctx.fillRect(x*this.GRID_SIZE, y*this.GRID_SIZE, this.GRID_SIZE, this.GRID_SIZE);
                            this.ctx.globalAlpha = 1.0;
                        }
                    }
                }

                if (this.effectTimer > 0) {
                    this.ctx.fillStyle = `rgba(16, 185, 129, ${this.effectTimer/20})`;
                    this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
                    if(progress > 0.9) this.effectTimer--;
                }

                // 모바일 방식의 2x2 크기로 고정 렌더링 적용 (움직임 효과 제거)
                this.items.forEach(it => {
                    const cx = it.x * this.GRID_SIZE + this.GRID_SIZE; // 0~2칸 중심 1칸
                    const cy = it.y * this.GRID_SIZE + this.GRID_SIZE;
                    
                    this.ctx.save();
                    this.ctx.translate(cx, cy);
                    this.ctx.shadowColor = it.type === 'num' ? '#0ea5e9' : '#d946ef'; 
                    this.ctx.shadowBlur = 15;
                    this.ctx.fillStyle = it.type === 'num' ? '#0284c7' : '#a21caf';

                    this.ctx.beginPath();
                    if (it.type==='num') this.ctx.arc(0, 0, this.GRID_SIZE*0.8, 0, Math.PI*2);
                    else {
                        if(this.ctx.roundRect) this.ctx.roundRect(-this.GRID_SIZE*0.8, -this.GRID_SIZE*0.8, this.GRID_SIZE*1.6, this.GRID_SIZE*1.6, 10);
                        else this.ctx.rect(-this.GRID_SIZE*0.8, -this.GRID_SIZE*0.8, this.GRID_SIZE*1.6, this.GRID_SIZE*1.6);
                    }
                    this.ctx.fill();

                    this.ctx.shadowBlur = 0;
                    this.ctx.fillStyle = 'white';
                    this.ctx.font = `bold ${this.GRID_SIZE*1.2}px Poppins, sans-serif`; 
                    this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(it.val, 0, this.GRID_SIZE*0.1);
                    this.ctx.restore();
                });

                this.snake.forEach((p, i) => {
                    let prevP = (i < this.snake.length - 1) ? this.snake[i+1] : (this.dyingTail || p);
                    const renderX = (prevP.x + (p.x - prevP.x) * progress) * this.GRID_SIZE;
                    const renderY = (prevP.y + (p.y - prevP.y) * progress) * this.GRID_SIZE;
                    const centerX = renderX + this.GRID_SIZE / 2; const centerY = renderY + this.GRID_SIZE / 2;

                    let currentScale = 1.0;
                    if (i === 0) currentScale = this.headScale; 

                    const size = (this.GRID_SIZE - 2) * currentScale;
                    this.ctx.fillStyle = this.config.color;

                    if (i === 0) {
                        this.ctx.beginPath();
                        if(this.ctx.roundRect) this.ctx.roundRect(centerX - size/2, centerY - size/2, size, size, 10);
                        else this.ctx.rect(centerX - size/2, centerY - size/2, size, size);
                        this.ctx.fill();

                        const eyeOffsetX = this.dx * (size * 0.15); const eyeOffsetY = this.dy * (size * 0.15);
                        const eyeSize = size * 0.25; const pupilSize = eyeSize * 0.5; 

                        this.ctx.fillStyle = 'white';
                        this.ctx.beginPath(); this.ctx.arc(centerX - size*0.2 + eyeOffsetX*0.5, centerY - size*0.1 + eyeOffsetY*0.5, eyeSize/2, 0, Math.PI*2); this.ctx.fill();
                        this.ctx.beginPath(); this.ctx.arc(centerX + size*0.2 + eyeOffsetX*0.5, centerY - size*0.1 + eyeOffsetY*0.5, eyeSize/2, 0, Math.PI*2); this.ctx.fill();

                        this.ctx.fillStyle = '#0f172a';
                        this.ctx.beginPath(); this.ctx.arc(centerX - size*0.2 + eyeOffsetX, centerY - size*0.1 + eyeOffsetY, pupilSize/2, 0, Math.PI*2); this.ctx.fill();
                        this.ctx.beginPath(); this.ctx.arc(centerX + size*0.2 + eyeOffsetX, centerY - size*0.1 + eyeOffsetY, pupilSize/2, 0, Math.PI*2); this.ctx.fill();
                        this.ctx.fillStyle = this.config.color;
                    } else {
                        this.ctx.beginPath();
                        if(this.ctx.roundRect) this.ctx.roundRect(centerX - size/2, centerY - size/2, size, size, 8);
                        else this.ctx.rect(centerX - size/2, centerY - size/2, size, size);
                        this.ctx.fill();
                    }

                    if (i > 0) {
                        const idx = this.eatenItems.length - i;
                        if (idx >= 0) {
                            this.ctx.fillStyle = 'white';
                            this.ctx.font = `bold ${this.GRID_SIZE*0.5}px Arial, sans-serif`; 
                            this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
                            this.ctx.fillText(this.eatenItems[idx], centerX, centerY + this.GRID_SIZE*0.05);
                            this.ctx.fillStyle = this.config.color;
                        }
                    }
                });

                if (this.dyingTail) {
                    const last = this.snake[this.snake.length-1];
                    const dx = last.x - this.dyingTail.x; const dy = last.y - this.dyingTail.y;
                    const tailX = (this.dyingTail.x + dx * progress) * this.GRID_SIZE;
                    const tailY = (this.dyingTail.y + dy * progress) * this.GRID_SIZE;
                    this.ctx.beginPath();
                    if(this.ctx.roundRect) this.ctx.roundRect(tailX+1, tailY+1, this.GRID_SIZE-2, this.GRID_SIZE-2, 8);
                    else this.ctx.rect(tailX+1, tailY+1, this.GRID_SIZE-2, this.GRID_SIZE-2);
                    this.ctx.fill();
                }

                this.particles.forEach(p => p.draw(this.ctx));
                this.floatTexts.forEach(t => t.draw(this.ctx));
                this.ctx.restore();
            }

            updateUI() {
                this.scoreEl.innerText = this.score;
            }
        }

        let instances = [];
        let timer = 60;
        let isPlaying = false;
        let timerInterval, loopId;
        let lastTime = 0;
        let accumulator = 0;

        function setupGame(count) {
            initAudio();
            const container = document.getElementById('game-container');
            container.innerHTML = '';
            instances = [];
            
            for(let i=0; i<count; i++) {
                instances.push(new GameInstance(PLAYERS_CONFIG[i], container));
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('langTriggerBtn').style.display = 'none'; // 몰입을 위해 플레이중 언어선택 숨김
            resizeAll();
            startCountdown();
        }

        function resizeAll() {
            instances.forEach(ins => ins.resize());
        }
        window.addEventListener('resize', resizeAll);

        function startCountdown() {
            const screen = document.getElementById('countdown-screen');
            const txt = document.getElementById('countdown-text');
            screen.classList.remove('hidden');
            
            let cnt = 3;
            txt.innerText = cnt;
            sfx.count();
            
            const intv = setInterval(() => {
                cnt--;
                if(cnt > 0) {
                    txt.innerText = cnt;
                    sfx.count();
                } else {
                    txt.innerText = getText('go');
                    sfx.go(); 
                    sfx.charmer(); // 모바일 뱀 사운드 재생
                    clearInterval(intv);
                    setTimeout(() => {
                        screen.classList.add('hidden');
                        startGame();
                    }, 800);
                }
            }, 1000);
        }

        function startGame() {
            timer = 60;
            document.getElementById('global-timer').innerText = timer;
            document.getElementById('global-timer').style.color = '#10b981';
            isPlaying = true;
            lastTime = performance.now();
            accumulator = 0;
            
            instances.forEach(ins => {
                ins.reset();
                ins.rankEl.style.display = 'none';
            });

            timerInterval = setInterval(() => {
                timer--;
                const tEl = document.getElementById('global-timer');
                tEl.innerText = timer;
                if(timer <= 10 && timer > 0) tEl.style.color = '#f43f5e';
                else tEl.style.color = '#10b981';

                if(timer > 0 && timer <= 5) sfx.tick();
                
                if (timer <= 0) endGame();
            }, 1000);

            loopId = requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if(!isPlaying) return;
            loopId = requestAnimationFrame(gameLoop);
            
            let dt = timestamp - lastTime;
            lastTime = timestamp;
            accumulator += dt;

            while (accumulator >= LOGIC_INTERVAL) {
                instances.forEach(ins => ins.update());
                accumulator -= LOGIC_INTERVAL;
            }

            const alpha = accumulator / LOGIC_INTERVAL;
            instances.forEach(ins => ins.draw(alpha));
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            cancelAnimationFrame(loopId);
            sfx.gameOver();
            
            document.getElementById('langTriggerBtn').style.display = 'flex'; // 게임 종료 시 다시 보이기
            
            let sorted = [...instances].sort((a,b) => b.score - a.score);
            let topHTML = "";
            let detailsHTML = "";
            
            sorted.forEach((ins, idx) => {
                const rank = idx + 1;
                if (rank <= 3) {
                    const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : "🥉";
                    topHTML += `
                        <div class="winner-card rank-${rank}">
                            <div class="winner-avatar">${ins.config.emoji}</div>
                            <div class="winner-rank">${medal}</div>
                        </div>
                    `;
                }
            });

            instances.forEach((ins) => {
                const myRank = sorted.indexOf(ins) + 1;
                const medal = myRank === 1 ? "🥇" : myRank === 2 ? "🥈" : myRank === 3 ? "🥉" : `${myRank}th`;
                
                detailsHTML += `
                    <div class="go-col">
                        <div style="font-size:3rem;">${ins.config.emoji}</div>
                        <div class="detail-row" style="color:#94a3b8; font-size:1.2rem;">${getText(ins.config.nameKey)}</div>
                        <div class="detail-score">${ins.score}</div>
                        <div class="detail-row">${medal}</div>
                    </div>
                `;
            });

            document.getElementById('go-ranking').innerHTML = topHTML;
            document.getElementById('go-details').innerHTML = detailsHTML;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // 초기 구동: 언어 자동감지 및 첫 렌더링
        window.onload = () => {
            renderLanguages();
            const initLang = detectLanguage();
            changeLang(initLang);
        };
    </script>
