        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * { box-sizing: border-box; }

        /* 우측 상단 레이아웃 (언어 선택 버튼을 넣기 위해 flex 로만 변경) */

        #open-settings:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }

        #settings-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 99; }
        #settings-panel { display: none; background: #1e293b; color: #ffffff; padding: 35px 45px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; width: 850px; max-width: 95vw; border: 1px solid rgba(255, 255, 255, 0.1); }
        #settings-panel.active, #settings-overlay.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -45%); } to { opacity: 1; transform: translate(-50%, -50%); } }
        #settings-panel h2 { text-align: center; font-size: 2.2rem; margin-top: 0; color: #38bdf8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; margin-bottom: 25px; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 25px; }

        .settings-col h3 { margin-top: 0; font-size: 1.4rem; color: #f8fafc; text-align: center; margin-bottom: 15px; }
        .task-input-group { display: flex; flex-direction: column; gap: 12px; }
        input[type="text"], textarea { width: 100%; padding: 14px; font-size: 1.1rem; font-family: inherit; font-weight: 600; background: rgba(15, 23, 42, 0.6); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus, textarea:focus { border-color: #38bdf8; background: rgba(15, 23, 42, 0.9); }
        textarea { resize: none; height: 190px; line-height: 1.5; }
        .help-text { font-size: 0.95rem; color: #94a3b8; text-align: center; margin-bottom: 15px; line-height: 1.4; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        button.action-btn, button.small-btn { font-family: inherit; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        button.small-btn { padding: 10px 18px; font-size: 1rem; background: rgba(255, 255, 255, 0.1); color: #cbd5e1; }
        button.small-btn:hover { background: rgba(255, 255, 255, 0.2); }
        button.action-btn { padding: 15px 35px; font-size: 1.25rem; color: white; background: linear-gradient(135deg, #0ea5e9, #2563eb); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        button.action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
        button.reset-btn { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        button.reset-btn:hover { background: linear-gradient(135deg, #dc2626, #991b1b); }
        button.close-btn { background: #475569; }
        button.close-btn:hover { background: #334155; }
        .settings-footer { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        #celebration { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); color: #fff; justify-content: center; align-items: center; flex-direction: column; z-index: 200; font-size: 4.5rem; text-shadow: 0 0 30px rgba(56, 189, 248, 0.5); text-align: center; backdrop-filter: blur(10px); }

        /* =========================================
           [신규 다국어 모달 전용 독립 CSS]

        .lang-toast {

<body>

    <div id="top-section">
        <div id="top-left">
            <div class="timer-container">
                <div class="timer-main">
                    <button class="timer-btn-adjust" onclick="adjustTime(-1)">-</button>
                    <div id="timer-display">00:00</div>
                    <button class="timer-btn-adjust" onclick="adjustTime(1)">+</button>
                </div>
                <div class="timer-controls-bottom">
                    <button class="timer-btn-small" id="ui-min1" onclick="adjustTime(1)">1분</button>
                    <button class="timer-btn-small" id="ui-min5" onclick="adjustTime(5)">5분</button>
                    <button class="timer-btn-small" id="ui-min10" onclick="adjustTime(10)">10분</button>
                    <button class="timer-btn-small btn-start" onclick="toggleTimer()" id="timer-toggle-btn">시작</button>
                    <button class="timer-btn-small btn-reset" id="ui-reset" onclick="resetTimer()">초기화</button>
                </div>
            </div>
        </div>
        
        <div id="top-center">
            <h1 id="ui-header-title">완료한 학생은 체크해 주세요.</h1>
            <div id="task-list"></div>
        </div>

        <div id="top-right">
            <button id="langTriggerBtn">
                <i class="fa-solid fa-globe"></i>

    <script>
        /* =========================================
           [1] 다국어 지원 데이터 및 로직 (KingsMath i18n)

            // 기본 한국어 폰트 외에는 폰트 리셋 (영문/다국어 대응)
            if(currentLang === 'ko') {
                document.body.style.fontFamily = "'Pretendard', sans-serif";
            } else {
                document.body.style.fontFamily = "sans-serif";
            }

            // SEO & Head
            document.getElementById('meta-title').innerText = t.metaTitle;
            document.getElementById('meta-desc').setAttribute("content", t.metaDesc);
            document.getElementById('meta-keys').setAttribute("content", t.metaKeys);

            // Main UI
            document.getElementById('ui-header-title').innerText = t.headerTitle;
            document.getElementById('ui-min1').innerText = t.min1;
            document.getElementById('ui-min5').innerText = t.min5;
            document.getElementById('ui-min10').innerText = t.min10;
            
            const timerBtn = document.getElementById('timer-toggle-btn');
            if(!isTimerRunning) timerBtn.innerText = t.start;
            else timerBtn.innerText = t.stop;

            document.getElementById('ui-reset').innerText = t.reset;
            document.getElementById('ui-settings-btn').innerText = t.settingsBtn;

            // Celebration
            document.getElementById('ui-celeb-text').innerHTML = t.celebText;
            document.getElementById('ui-celeb-close').innerText = t.celebClose;

            // Settings
            document.getElementById('ui-set-title').innerText = t.setTitle;
            document.getElementById('ui-set-task').innerText = t.setTask;
            document.getElementById('ui-set-clear-task').innerText = t.clearTask;
            document.getElementById('ui-set-student').innerText = t.setStudent;
            document.getElementById('ui-set-help').innerHTML = t.setHelp;
            document.getElementById('ui-set-clear-student').innerText = t.clearStudent;
            document.getElementById('ui-set-save').innerText = t.setSave;
            document.getElementById('ui-set-reset-chk').innerText = t.setResetChk;
            document.getElementById('ui-set-close').innerText = t.setClose;
        }

        // 언어 변경 실행 함수
        function changeLanguage(langCode, saveHistory = true) {
            currentLang = langCode;
            localStorage.setItem('kingsmath_lang', langCode);
            
            if (saveHistory) {
                const url = new URL(window.location);
                url.searchParams.set('lang', langCode);
                window.history.pushState({}, '', url);
            }

            const langObj = languagesData.find(l => l.code === langCode);
            if(langObj) {
                document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${langObj.country}.png`;
                document.getElementById('currentLangName').innerText = langObj.name;
            }

            applyLanguageText();
            renderBoard(); // 학생 목록 렌더링 시 "번" 처리 등을 위해
            renderLanguages(document.getElementById('langSearchInput').value); // 모달 내부 체크 업데이트
        }

        /* =========================================
           [2] 다국어 선택 모달 로직 
           ========================================= */
        const langModal = document.getElementById('langModal');
        const langGrid = document.getElementById('langGrid');
        const searchInput = document.getElementById('langSearchInput');
        let toastTimeout;

        function renderLanguages(filterText = '') {
            langGrid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            const filteredLangs = languagesData.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                langGrid.style.display = 'none';
                document.getElementById('langNoResult').style.display = 'flex';
            } else {
                langGrid.style.display = 'grid';
                document.getElementById('langNoResult').style.display = 'none';

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const btn = document.createElement('div');
                    btn.className = `lang-item-btn ${isSelected ? 'selected' : ''}`;
                    
                    btn.innerHTML = `
                        <img src="https://flagcdn.com/w40/${lang.country}.png" alt="${lang.country}">
                        <div class="lang-item-texts">
                            <span class="lang-item-name ${isSelected ? 'selected' : ''}">${lang.name}</span>
                            <span class="lang-item-enname">${lang.enName}</span>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check" style="color:#eab308; margin-left:auto;"></i>' : ''}
                    `;

                    btn.onclick = () => {
                        changeLanguage(lang.code);
                        closeLangModal();
                        
                        // Toast 알림
                        const toastMsgStr = translations[lang.code] ? translations[lang.code].toast : translations['en'].toast;
                        document.getElementById('toastMsg').innerText = toastMsgStr;
                        document.getElementById('toastLangName').innerText = lang.name;
                        const toast = document.getElementById('langToast');
                        toast.classList.add('show');
                        clearTimeout(toastTimeout);
                        toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
                    };
                    langGrid.appendChild(btn);
                });
            }
        }

        document.getElementById('langTriggerBtn').onclick = () => {
            langModal.classList.add('active');
            renderLanguages(searchInput.value);
        };
        
        function closeLangModal() { langModal.classList.remove('active'); }
        document.getElementById('closeModalBtn').onclick = closeLangModal;
        
        langModal.addEventListener('click', (e) => {
            if (e.target === langModal) closeLangModal();
        });
        
        searchInput.addEventListener('input', (e) => renderLanguages(e.target.value));

        /* =========================================
           [3] 기존 게임 로직 원형 유지 
           ========================================= */
        const STORAGE_KEY = 'wanryoKingDataV9'; 
        let appData = { tasks: [], students: [] };

        let timerInterval;
        let timeLeft = 0; 
        let isTimerRunning = false;

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timer-display').innerText =
                String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function adjustTime(minutes) {
            timeLeft += minutes * 60;
            if (timeLeft < 0) timeLeft = 0;
            updateTimerDisplay();
        }

        function toggleTimer() {
            const toggleBtn = document.getElementById('timer-toggle-btn');
            const t = translations[currentLang] || translations['en'];
            
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                toggleBtn.innerText = t.start;
                toggleBtn.style.background = 'rgba(16, 185, 129, 0.2)';
                toggleBtn.style.color = '#34d399';
                toggleBtn.style.borderColor = 'rgba(16, 185, 129, 0.3)';
            } else {
                if (timeLeft > 0) {
                    isTimerRunning = true;
                    toggleBtn.innerText = t.stop;
                    toggleBtn.style.background = 'rgba(245, 158, 11, 0.2)';
                    toggleBtn.style.color = '#fbbf24';
                    toggleBtn.style.borderColor = 'rgba(245, 158, 11, 0.3)';
                    timerInterval = setInterval(() => {
                        timeLeft--;
                        if (timeLeft <= 0) {
                            timeLeft = 0;
                            clearInterval(timerInterval);
                            isTimerRunning = false;
                            toggleBtn.innerText = t.start;
                            toggleBtn.style.background = 'rgba(16, 185, 129, 0.2)';
                            toggleBtn.style.color = '#34d399';
                            toggleBtn.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                        }
                        updateTimerDisplay();
                    }, 1000);
                }
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timeLeft = 0;
            const toggleBtn = document.getElementById('timer-toggle-btn');
            const t = translations[currentLang] || translations['en'];
            toggleBtn.innerText = t.start;
            toggleBtn.style.background = 'rgba(16, 185, 129, 0.2)';
            toggleBtn.style.color = '#34d399';
            toggleBtn.style.borderColor = 'rgba(16, 185, 129, 0.3)';
            updateTimerDisplay();
        }

        // 학생 목록 포맷팅 헬퍼 (외국어일 경우 "번" 제거 표시)
        function formatStudentName(name) {
            if(currentLang !== 'ko' && /^\d+번$/.test(name)) {
                return name.replace('번', ''); // 외국어 모드일 때 숫자만 표시
            }
            return name;
        }

        function renderBoard() {
            const t = translations[currentLang] || translations['en'];
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';
            
            const activeTasks = appData.tasks.filter(t => t.trim() !== "");
            
            if (activeTasks.length === 0) {
                taskList.innerHTML = `<span class="task-badge" style="color:#f87171; border-color:rgba(239, 68, 68, 0.3); background:rgba(239, 68, 68, 0.1);">${t.emptyTask}</span>`;
            } else {
                activeTasks.forEach((task, taskIndex) => {
                    const badge = document.createElement('span');
                    badge.className = 'task-badge';
                    const isTaskAllDone = appData.students.length > 0 && appData.students.every(student => student.checks[taskIndex]);
                    if (isTaskAllDone) {
                        badge.classList.add('all-done-badge');
                        badge.innerText = `✔ ${taskIndex + 1}. ${task}`;
                    } else {
                        badge.innerText = `${taskIndex + 1}. ${task}`;
                    }
                    taskList.appendChild(badge);
                });
            }

            const grid = document.getElementById('student-grid');
            grid.innerHTML = '';
            const studentCount = appData.students.length;
            let cols = 8; 
            if (studentCount >= 28) cols = 10;
            else if (studentCount >= 25) cols = 9;
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            appData.students.forEach((student, studentIndex) => {
                const box = document.createElement('div');
                box.className = 'student-box';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'student-name';
                // 언어 상태에 따라 이름 변환하여 표시 (저장 데이터는 건드리지 않음)
                nameDiv.innerText = formatStudentName(student.name);
                box.appendChild(nameDiv);

                const tasksContainer = document.createElement('div');
                tasksContainer.className = 'student-tasks';
                let allDone = true;

                activeTasks.forEach((taskName, taskIndex) => {
                    const taskRow = document.createElement('div');
                    taskRow.className = 'student-task-row';
                    if (student.checks[taskIndex]) taskRow.classList.add('done');
                    else allDone = false;

                    const taskText = document.createElement('span');
                    taskText.className = 'task-text';
                    taskText.innerText = taskName;
                    taskRow.onclick = () => toggleCheck(studentIndex, taskIndex);
                    taskRow.appendChild(taskText);
                    tasksContainer.appendChild(taskRow);
                });

                if (activeTasks.length > 0 && allDone) {
                    box.classList.add('all-done');
                    const crown = document.createElement('span');
                    crown.className = 'crown-badge';
                    crown.innerText = '👑';
                    nameDiv.appendChild(crown);
                }
                box.appendChild(tasksContainer);
                grid.appendChild(box);
            });
        }

        function toggleCheck(studentIndex, taskIndex) {
            appData.students[studentIndex].checks[taskIndex] = !appData.students[studentIndex].checks[taskIndex];
            saveData();
            renderBoard();
            checkAllCompleted();
        }

        function checkAllCompleted() {
            if (appData.students.length === 0) return;
            const activeTasksCount = appData.tasks.filter(t => t.trim() !== "").length;
            if (activeTasksCount === 0) return;

            const allChecked = appData.students.every(student => {
                for(let i=0; i<activeTasksCount; i++) {
                    if(!student.checks[i]) return false;
                }
                return true;
            });
            
            if (allChecked) {
                setTimeout(() => {
                    document.getElementById('celebration').style.display = 'flex';
                }, 400);
            }
        }

        function closeCelebration() {
            document.getElementById('celebration').style.display = 'none';
        }

        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }

        document.getElementById('open-settings').onclick = () => {
            for(let i=0; i<4; i++) {
                document.getElementById(`task-${i+1}`).value = appData.tasks[i] || "";
            }
            // 저장된 데이터가 숫자번("1번") 형태고, 현재가 외국어면 입력창에서도 번을 제거해서 보여줌
            document.getElementById('input-names').value = appData.students.map(s => formatStudentName(s.name)).join('\n');
            document.getElementById('settings-panel').classList.add('active');
            document.getElementById('settings-overlay').classList.add('active');
        };

        function closeSettings() {
            document.getElementById('settings-panel').classList.remove('active');
            document.getElementById('settings-overlay').classList.remove('active');
        }

        function saveSettings() {
            const newTasks = [];
            for(let i=1; i<=4; i++) {
                newTasks.push(document.getElementById(`task-${i}`).value.trim());
            }

            const namesInput = document.getElementById('input-names').value.trim();
            let nameList = [];

            if (/^\d+$/.test(namesInput)) {
                const maxNum = parseInt(namesInput, 10);
                for(let i=1; i<=maxNum; i++) {
                    // 저장 시에는 원본 포맷 유지성 보장을 위해 '번'을 붙여 저장하고, 화면에서만 언어에 맞춰서 빼줌
                    nameList.push(`${i}번`); 
                }
            } else {
                nameList = namesInput.split(/,|\n/).map(name => name.trim()).filter(name => name !== '');
                // 만약 사용자가 외국어 모드에서 1, 2, 3 을 입력했다면 내부적으로 "1번"으로 치환저장
                nameList = nameList.map(name => /^\d+$/.test(name) ? `${name}번` : name);
            }

            const newStudents = nameList.map(name => {
                const existing = appData.students.find(s => s.name === name);
                return existing ? existing : { name: name, checks: [false, false, false, false] };
            });

            appData.tasks = newTasks;
            appData.students = newStudents;
            saveData();
            renderBoard();
            closeSettings();
        }

        function clearTasks() { for(let i=1; i<=4; i++) { document.getElementById(`task-${i}`).value = ''; } }
        function clearStudents() { document.getElementById('input-names').value = ''; }
        function resetChecks() {
            if(confirm("모든 학생의 '체크 표시'를 전부 초기화하시겠습니까?")) { // 번역 생략(기존 Confirm)
                appData.students.forEach(student => { student.checks = [false, false, false, false]; });
                saveData(); renderBoard(); closeSettings();
            }
        }

        /* =========================================
           [4] 홈 버튼 및 전체 화면 로직 (요청 반영)
           ========================================= */
        document.getElementById('btn-home').addEventListener('click', () => {
            if (document.fullscreenElement) {
                // 기존 소스에 state나 playSound가 없을 수 있으므로 try-catch 또는 typeof 검사로 보호
                try {
                    if(typeof state !== 'undefined') {
                        state.isPlaying = false;
                        clearInterval(state.timerInterval);
                        cancelAnimationFrame(state.animationId);
                    }
                    if(document.getElementById('langSelectorContainer')) document.getElementById('langSelectorContainer').style.display = 'block';
                    if(document.getElementById('game-board')) document.getElementById('game-board').style.display = 'none';
                    if(document.getElementById('header-info')) document.getElementById('header-info').style.display = 'none';
                    if(document.getElementById('game-over-controls')) document.getElementById('game-over-controls').style.display = 'none';
                    if(document.getElementById('setup-screen')) document.getElementById('setup-screen').style.display = 'flex';
                    if(window.playSound) window.playSound('click');
                } catch(e) {}
            } else {
                location.reload();
            }
        });

        // 초기화
        function init() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                appData = JSON.parse(savedData);
            } else {
                appData.tasks = ["동의서 제출", "숙제 제출", "", ""];
                const defaultCelebs = ["유재석", "아이유", "박보검", "수지", "강호동", "김수현", "차은우", "한소희", "마동석", "박보영", "송중기", "김지원", "공유", "김고은", "이도현", "신세경", "박서준", "이성경", "남주혁", "정호연", "이정재", "손석구", "전지현", "조인성"];
                appData.students = defaultCelebs.map(name => ({
                    name: name, checks: [false, false, false, false]
                }));
            }
            
            // 다국어 초기 세팅
            const langToLoad = detectLanguage();
            changeLanguage(langToLoad, false); // 초기에는 history push 안함
            
            renderLanguages(); // 빈 문자열로 전체 목록 렌더링 호출
        }

        init();
    </script>
</body>
</html>
