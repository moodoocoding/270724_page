        tailwind.config = { corePlugins: { preflight: false } }
    </script>

    <style>
        /* 폰트어썸 아이콘 깨짐 방지용 예외 처리 */
        i[class^="fa-"] {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
        }

        /* [전자칠판 최적화 및 기본 게임 스타일 유지] */
        * {
            box-sizing: border-box;
            user-select: none; -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        :root {
            --bg-color: #2b2b2b;
            --card-bg: #3a3a3a;
            --text-color: #f0f0f0;
            --accent-color: #FFD93D;
            --btn-active: #6c5ce7;
            
            --p0-main: #2980b9; --p0-light: #85c1e9; --p0-accent: #00ffff;
            --p1-main: #d35400; --p1-light: #f5b041; --p1-accent: #ffff00;
            --p2-main: #c2185b; --p2-light: #f8bbd0; --p2-accent: #FF1493;
            --p3-main: #27ae60; --p3-light: #a5d6a7; --p3-accent: #00FF00;
        }

        body {
            margin: 0; padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            font-weight: 400;
            touch-action: manipulation; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }
        
        .top-link {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 5px;
            transition: color 0.3s;
            text-align: center;
            cursor: pointer;
        }
        .top-link:hover { color: #fff; text-decoration: underline; }

        .bottom-link {
            margin-top: 20px;
            font-size: 1.3rem;
            color: #81ecec;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .bottom-link:hover { transform: scale(1.05); color: #fff; }

        /* 헤더 */
        header {
            background-color: #1e1e1e;
            color: var(--accent-color);
            padding: 0 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
            height: 70px;
            position: relative;
        }
        header h1 {
            font-size: 1.6rem;
            margin: 0;
            text-shadow: 1px 1px 0 #000;
            cursor: pointer;
            position: absolute;
            left: 30px;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }

        #header-info {
            display: none;
            align-items: center;
            gap: 20px;
        }

        #timer-display {
            font-size: 2.5rem;
            color: #fff;
            background: #444;
            padding: 5px 20px;
            border-radius: 15px;
            border: 2px solid #666;
            min-width: 100px;
            text-align: center;
            box-shadow: inset 0 0 10px #000;
            font-family: 'Jua', sans-serif;
            font-weight: 400;
        }
        #timer-display.urgent {
            background: #c0392b;
            color: #fff;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }

        /* 메인 컨테이너 */
        #app-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: calc(100% - 60px);
        }

        /* 설정 화면 */
        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 3px solid #444;
            max-height: 90vh;
            overflow-y: auto;
            min-width: 500px;
            max-width: 95vw;
            z-index: 20;
        }

        .screen-title { 
            font-size: 3rem; 
            color: #fff; 
            text-shadow: 2px 2px 0 #000; 
            margin-bottom: 5px; 
            line-height: 1.2;
            font-weight: 400;
            text-align: center;
            word-break: keep-all;
            /* 동적 크기 조절을 위한 클래스 */
            transition: font-size 0.2s;
        }
        .screen-desc {
            font-size: 1.2rem;
            color: #ccc;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #555;
            font-weight: 400;
            word-break: keep-all;
        }
        .highlight { color: #ff7675; font-weight: 400; }

        .option-section { 
            display: flex;
            flex-direction: row;    
            justify-content: center; 
            align-items: center;      
            gap: 20px;              
            margin-bottom: 20px;    
            width: 100%;
            flex-wrap: wrap;
        }
        
        .label-text { 
            margin-bottom: 0;        
            font-weight: bold;
            white-space: nowrap;    
            min-width: 80px;        
            text-align: right;      
            color: #aaa; 
            font-size: 1.3rem; 
        }
        
        .option-group { 
            display: flex;
            gap: 10px;
            flex-wrap: wrap; 
            justify-content: center;
        }
        
        .btn-option {
            padding: 10px 20px; font-size: 1.1rem; border: 2px solid #555; background: #222;
            color: #aaa; border-radius: 20px; cursor: pointer; transition: all 0.2s;
            touch-action: manipulation;
            font-weight: 400;
            white-space: nowrap;
        }
        .btn-option.selected {
            background-color: var(--btn-active); color: white; border-color: var(--btn-active);
            box-shadow: 0 0 10px var(--btn-active); transform: translateY(-2px);
        }

        #btn-start {
            margin-top: 10px; padding: 12px 60px; font-size: 2rem;
            background-color: #ff7675; color: white; border: none; border-radius: 50px;
            box-shadow: 0 6px 0 #d63031; font-family: 'Jua', sans-serif; cursor: pointer;
            transition: transform 0.1s;
            touch-action: manipulation;
            font-weight: 400;
            white-space: nowrap;
        }
        #btn-start:active { transform: translateY(6px); box-shadow: none; }

        /* 게임 화면 */
        #game-board {
            display: none; width: 100%; height: 100%; padding: 10px; padding-bottom: 20px;
            box-sizing: border-box; flex-direction: row; justify-content: center;
            align-items: center; gap: 15px; flex-wrap: nowrap;
        }

        .team-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 3px solid #666;
            height: 95%; 
            width: 23%;
            min-width: 200px;
            max-width: 400px;
            transition: all 0.3s;
            overflow: hidden; 
        }

        .team-0 { border-color: var(--p0-main); }
        .team-0 .player-label { color: var(--p0-accent); }
        .team-0 .target-box { border-color: var(--p0-main); color: var(--p0-accent); }
        
        .team-1 { border-color: var(--p1-main); }
        .team-1 .player-label { color: var(--p1-accent); }
        .team-1 .target-box { border-color: var(--p1-main); color: var(--p1-accent); }

        .team-2 { border-color: var(--p2-main); }
        .team-2 .player-label { color: var(--p2-accent); }
        .team-2 .target-box { border-color: var(--p2-main); color: var(--p2-accent); }

        .team-3 { border-color: var(--p3-main); }
        .team-3 .player-label { color: var(--p3-accent); }
        .team-3 .target-box { border-color: var(--p3-main); color: var(--p3-accent); }

        .header-section {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        .crown-icon {
            position: absolute; top: 10px; left: 10px; 
            font-size: 2rem; opacity: 0; transition: all 0.4s; z-index: 10;
        }
        .crown-icon.show { opacity: 1; transform: scale(1.2) rotate(-15deg); }

        .player-label {
            font-size: 1.5rem;
            margin-bottom: 2px;
            text-shadow: 2px 2px 0 #000;
            font-weight: 400;
        }

        .score-text {
            font-size: 1.3rem;
            color: #fff;
            font-weight: 400;
        }

        .balloon-area {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            background: linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px),
                        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            touch-action: none;
        }

        .mission-area {
            width: 100%;
            padding: 5px;
            background: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: row; 
            justify-content: center;
            align-items: center;
            border-top: 2px solid #555;
            z-index: 5;
            height: 80px; 
            gap: 15px; 
        }
        
        .mission-label { 
            font-size: 1.5rem; 
            color: #fff; 
            margin-bottom: 0; 
            font-weight: 400;
            white-space: nowrap;
        }

        .target-box {
            font-size: 1.8rem;
            font-weight: 400;
            padding: 5px 20px;
            border-radius: 10px;
            border: 3px solid #fff;
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            text-align: center;
            white-space: nowrap;
        }
        .target-box.pulse { transform: scale(1.2); }

        /* 풍선 스타일 */
        .balloon {
            position: absolute;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 20%),
                        var(--bg-color);
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1), 
                        5px 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            
            cursor: pointer;
            user-select: none;
            touch-action: none;
            will-change: transform, bottom, left; 
            border: none;
        }

        .balloon svg {
            width: 70%;
            height: 70%;
            fill: none;
            stroke: #2d3436;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(2px 2px 0px rgba(255,255,255,0.5));
            pointer-events: none;
        }
        .balloon svg.fill-shape { fill: rgba(255,255,255,0.4); }

        .balloon.color-1 { --bg-color: #ff7675; } 
        .balloon.color-2 { --bg-color: #74b9ff; } 
        .balloon.color-3 { --bg-color: #55efc4; } 
        .balloon.color-4 { --bg-color: #a29bfe; } 
        .balloon.color-5 { --bg-color: #fdcb6e; } 
        .balloon.color-6 { --bg-color: #e17055; } 
        .balloon.color-7 { --bg-color: #00cec9; } 
        
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid var(--bg-color);
            border-radius: 20%;
        }

        .balloon::before {
            content: '';
            position: absolute;
            top: 100%; 
            left: 50%;
            width: 10px; 
            height: 70px; 
            background: transparent; 
            border-left: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%; 
            transform-origin: top left;
            animation: stringSway 1.5s ease-in-out infinite alternate;
            z-index: -1; 
            pointer-events: none;
        }

        @keyframes stringSway {
            0% { transform: rotate(-5deg); border-radius: 50%; }
            100% { transform: rotate(10deg) scaleY(0.95); border-radius: 40%; }
        }
        
        /* 오답 효과 */
        .balloon.wrong {
            --bg-color: #636e72;
            animation: shake 0.4s ease-in-out;
            opacity: 0.8;
            pointer-events: none;
            transform: scale(0.9);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }

        /* 결과 화면 오버레이 */
        .win-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            border-radius: 17px; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50;
            backdrop-filter: blur(5px); animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .rank-medal { font-size: 5rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        .rank-text { font-size: 3rem; color: var(--accent-color); margin-bottom: 20px; font-weight: 400; }
        .final-score { font-size: 1.5rem; color: #fff; margin-bottom: 20px; font-weight: 400; }

        .floating-btn {
            position: fixed; bottom: 20px; width: 50px; height: 50px;
            border-radius: 50%; background: #444; color: white; display: flex;
            justify-content: center; align-items: center; font-size: 1.5rem;
            z-index: 60; border: 2px solid #666; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer; touch-action: manipulation;
        }
        .floating-btn:active { transform: scale(0.9); }
        #btn-home { left: 20px; }
        #btn-fullscreen { right: 20px; }
        
        #confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 100; }
        .confetti { position: absolute; width: 10px; height: 10px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

        /* 다시하기 버튼 */
        #game-over-controls {
            display: none;
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #btn-restart {
            padding: 15px 50px;
            font-size: 2.2rem;
            font-family: 'Jua', sans-serif;
            background: linear-gradient(to bottom, #00b894, #00cec9);
            color: white;
            border: 4px solid #fff;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 6px 0 #006266;
            cursor: pointer;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            pointer-events: auto;
            font-weight: 400;
        }
        #btn-restart:hover { filter: brightness(1.1); transform: scale(1.05); }
        #btn-restart:active { transform: scale(0.95) translateY(6px); box-shadow: 0 4px 0 #006266; }

        /* [추가] 모달 UI 관련 스타일 */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay {
            opacity: 0; visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            transform: scale(0.95) translateY(-10px);
            opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .toast {
            transform: translateY(100%); opacity: 0; transition: all 0.3s ease;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="langSelectorContainer" class="absolute top-4 right-4 sm:top-6 sm:right-6 z-[99999]">

            <i class="fa-solid fa-globe text-gray-400"></i>
            <img id="currentFlag" src="https://flagcdn.com/w40/kr.png" alt="KR" class="w-5 h-auto rounded-[2px] shadow-sm">

        <div class="modal-content bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden text-gray-100">

    <div id="toastNotification" class="toast fixed bottom-6 right-6 bg-gray-800 border border-gray-700 shadow-lg rounded-xl p-4 flex items-center gap-3 z-[99999]" style="font-family: 'Noto Sans KR', sans-serif;">
        <div class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center text-green-400">
            <i class="fa-solid fa-check"></i>
        </div>
        <div>
            <p id="ui-toast" class="text-sm font-medium text-white">언어가 변경되었습니다.</p>
            <p id="toastLangName" class="text-xs text-gray-400">Korean</p>
        </div>
    </div>


    <header>
        <h1 onclick="location.reload()" id="header-title">🎈 도형킹! 풍선 터트리기</h1>
        <div id="header-info">
            <div style="font-size:1.5rem; color:#aaa;" data-i18n="time_label">남은 시간</div>
            <div id="timer-display">60</div>
        </div>
    </header>

    <div id="app-container">

        function updateUIText(langCode) {
            const t = uiTranslations[langCode] || uiTranslations['en'];
            document.getElementById('ui-title').textContent = t.title;
            document.getElementById('ui-desc').textContent = t.desc;
            document.getElementById('searchInput').placeholder = t.search;
            document.getElementById('ui-empty').textContent = t.empty;
            document.getElementById('ui-toast').textContent = t.toast;
        }

        function renderLanguages(filterText = '') {
            grid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            const filteredLangs = languages.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                grid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                noResult.classList.add('hidden');
                noResult.classList.remove('flex');

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                    const stateClasses = isSelected 
                        ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                        : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                    const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;

                    btn.innerHTML = `
                        <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                            <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col items-start">
                            <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                            <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                    `;
                    btn.addEventListener('click', () => selectLanguage(lang));
                    grid.appendChild(btn);
                });
            }
        }

        function selectLanguage(lang) {
            currentLang = lang.code;
            currentFlagImg.src = `https://flagcdn.com/w40/${lang.country}.png`;
            currentLangSpan.textContent = lang.name;
            updateUIText(lang.code);
            closeModal();
            showToast(lang.name);
            renderLanguages(searchInput.value);
            
            // 실제 게임 언어 적용 및 저장 (URL, 로컬스토리지)
            changeLanguage(currentLang);
        }

        function openModal() {
            modal.classList.add('active');
            // 게임 내 영향 방지를 위해 스크롤 제어 생략 또는 안전한 클래스로 추가
            setTimeout(() => searchInput.focus(), 100);
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function showToast(langName) {
            toastLangName.textContent = langName;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        triggerBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
        searchInput.addEventListener('input', (e) => renderLanguages(e.target.value));


        // --- 언어 감지 및 설정 (순위: URL > LocalStorage > Browser > Default) ---
        function initLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            const savedLang = localStorage.getItem('kingsmath_lang');
            const browserLang = navigator.language.slice(0, 2);

            if (langParam && i18n[langParam]) {
                currentLang = langParam;
            } else if (savedLang && i18n[savedLang]) {
                currentLang = savedLang;
            } else if (i18n[browserLang]) {
                currentLang = browserLang;
            } else {
                currentLang = 'en'; // 기본값
            }

            // 초기 UI 갱신
            const langObj = languages.find(l => l.code === currentLang) || languages[1];
            currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;
            currentLangSpan.textContent = langObj.name;
            updateUIText(currentLang);
            renderLanguages();

            applyLanguage();
        }

        function changeLanguage(lang) {
            localStorage.setItem('kingsmath_lang', lang);
            
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', lang);
            window.history.pushState({}, '', newUrl);
            
            applyLanguage();
            if(window.playSound) window.playSound('click');
        }

        function applyDynamicFontSize() {
            // 버튼이나 영역을 벗어나지 않도록 동적으로 폰트 조절
            const elements = document.querySelectorAll('.dynamic-text, .btn-option, .screen-title');
            elements.forEach(el => {
                el.style.fontSize = ''; // 초기화
                let currentSize = parseFloat(window.getComputedStyle(el).fontSize);
                while(el.scrollWidth > el.clientWidth && currentSize > 12) {
                    currentSize -= 1;
                    el.style.fontSize = currentSize + 'px';
                }
            });
        }

        function applyLanguage() {
            const t = i18n[currentLang];
            document.documentElement.lang = currentLang;

            // Meta & Title (SEO 강화)
            document.title = t.title;
            document.getElementById('header-title').innerText = t.title;
            document.getElementById('meta-desc').content = t.meta_desc;
            document.getElementById('meta-keywords').content = t.meta_keywords;
            document.getElementById('og-title').content = t.title;
            document.getElementById('og-desc').content = t.meta_desc;
            document.getElementById('og-site-name').content = t.domain_name;
            document.getElementById('og-url').content = `/?lang=${currentLang}`;

            // DOM Elements Text Update
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) el.innerHTML = t[key];
            });

            // Player Names Update
            if(!state.isPlaying) {
                PLAYERS[0].name = "🐶 " + t.team_0;
                PLAYERS[1].name = "🐱 " + t.team_1;
                PLAYERS[2].name = "🐰 " + t.team_2;
                PLAYERS[3].name = "🐹 " + t.team_3;
            }

            // 텍스트 길이 변경에 따른 폰트 자동 리사이징
            setTimeout(applyDynamicFontSize, 50);
        }

        // --- 1. 오디오 시스템 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'mission') {
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(500, now); 
                osc.frequency.setValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'end') {
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.linearRampToValueAtTime(440, now + 0.5);
                gainNode.gain.setValueAtTime(0.3, now); 
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        // --- 2. 게임 데이터 ---
        const PLAYERS = [
            { name: '🐶 강아지', theme: 'team-0' },
            { name: '🐱 고양이', theme: 'team-1' },
            { name: '🐰 토끼', theme: 'team-2' },
            { name: '🐹 햄스터', theme: 'team-3' }
        ];

        let config = {
            playerCount: 4,
            topic: 'all', 
            gameTime: 60,
            spawnRate: 1000, 
            bubbleSpeed: 0.5 
        };

        let state = {
            isPlaying: false,
            startTime: 0,
            timeLeft: 60,
            timerInterval: null,
            teams: [],
            lastSpawnTime: 0,
            animationId: null,
            shapesDB: []
        };

        // --- 3. 클래스 정의 ---
        class Team {
            constructor(index) {
                this.index = index;
                this.score = 0;
                this.currentMissionTag = null; 
                this.balloons = [];
                this.element = this.createElement();
            }

            createElement() {
                const div = document.createElement('div');
                div.className = `team-card ${PLAYERS[this.index].theme}`;
                
                const t = i18n[currentLang];
                
                div.innerHTML = `
                    <div class="crown-icon" id="crown-${this.index}">👑</div>
                    
                    <div class="header-section">
                        <div class="player-label">${PLAYERS[this.index].name}</div>
                        <div class="score-text">0${t.score_unit}</div>
                    </div>

                    <div class="balloon-area" id="lane-${this.index}"></div>

                    <div class="mission-area">
                        <div class="mission-label">${t.mission_label}</div>
                        <div class="target-box" style="font-size:1.5rem;">?</div>
                    </div>

                    <div class="win-overlay">
                        <div class="rank-medal"></div>
                        <div class="rank-text"></div>
                        <div class="final-score"></div>
                    </div>
                `;
                
                this.ui = {
                    scoreText: div.querySelector('.score-text'),
                    balloonArea: div.querySelector('.balloon-area'),
                    targetBox: div.querySelector('.target-box'),
                    overlay: div.querySelector('.win-overlay'),
                    medal: div.querySelector('.rank-medal'),
                    rankText: div.querySelector('.rank-text'),
                    finalScore: div.querySelector('.final-score')
                };
                return div;
            }

            setTarget() {
                const t = i18n[currentLang];
                
                let possibleTags = new Set();
                state.shapesDB.forEach(shape => {
                    shape.tags.forEach(tag => possibleTags.add(tag));
                });
                const tagList = Array.from(possibleTags);
                
                this.currentMissionTag = tagList[Math.floor(Math.random() * tagList.length)];
                
                let missionText = t.mission_fmt.replace('{name}', this.currentMissionTag);
                
                if(missionText.length > 15) {
                    this.ui.targetBox.style.fontSize = '1.2rem';
                } else {
                    this.ui.targetBox.style.fontSize = '1.5rem';
                }

                this.ui.targetBox.innerHTML = missionText;
                
                this.ui.targetBox.classList.add('pulse');
                setTimeout(() => this.ui.targetBox.classList.remove('pulse'), 300);
            }

            updateScore(points) {
                this.score = Math.max(0, this.score + points);
                const t = i18n[currentLang];
                this.ui.scoreText.innerText = `${this.score}${t.score_unit}`;
                updateCurrentLeader();
            }

            spawnBalloon() {
                const isCorrect = Math.random() > 0.4;
                let shapeData;
                const t = i18n[currentLang];
                
                if (isCorrect) {
                    let candidates = state.shapesDB.filter(s => {
                        const hasTag = s.tags.includes(this.currentMissionTag);
                        if (this.currentMissionTag === t.poly) {
                            return hasTag && !s.tags.includes(t.circle) && !s.tags.includes(t.oval);
                        }
                        return hasTag;
                    });
                    
                    if (candidates.length === 0) candidates = state.shapesDB;
                    shapeData = candidates[Math.floor(Math.random() * candidates.length)];
                } else {
                    let candidates = state.shapesDB.filter(s => {
                        const hasTag = s.tags.includes(this.currentMissionTag);
                        if (this.currentMissionTag === t.poly) {
                            return !hasTag || s.tags.includes(t.circle) || s.tags.includes(t.oval);
                        }
                        return !hasTag;
                    });
                     if (candidates.length === 0) candidates = state.shapesDB;
                    shapeData = candidates[Math.floor(Math.random() * candidates.length)];
                }

                const balloon = document.createElement('div');
                const colorIdx = Math.floor(Math.random() * 7) + 1;
                balloon.className = `balloon color-${colorIdx}`;
                
                balloon.innerHTML = `<svg viewBox="0 0 100 100">${shapeData.svg}</svg>`;
                
                const width = Math.floor(Math.random() * 30) + 70; 
                const height = width * 1.2;
                
                balloon.style.width = `${width}px`;
                balloon.style.height = `${height}px`;

                balloon.dataset.shapeTags = JSON.stringify(shapeData.tags);
                balloon.dataset.teamIndex = this.index;
                
                const elapsedTime = (performance.now() - state.startTime) / 1000;
                const progress = Math.min(elapsedTime / config.gameTime, 1);
                const speedBoost = progress * 2.5; 
                
                balloon.dataset.speed = (config.bubbleSpeed + speedBoost) + (Math.random() * 0.9);
                
                const initialLeft = Math.random() * 60 + 10;
                balloon.dataset.initialLeft = initialLeft;
                balloon.dataset.swayPhase = Math.random() * Math.PI * 2; 
                balloon.dataset.swaySpeed = 0.002 + Math.random() * 0.002; 
                
                balloon.style.left = initialLeft + '%';
                balloon.style.bottom = '-120px';

                this.ui.balloonArea.appendChild(balloon);
                this.balloons.push(balloon);
            }

            updateBalloons() {
                const areaHeight = this.ui.balloonArea.clientHeight;
                const now = performance.now();

                for (let i = this.balloons.length - 1; i >= 0; i--) {
                    const b = this.balloons[i];
                    
                    if(b.classList.contains('wrong')) continue; 

                    let currentBottom = parseFloat(b.style.bottom) || -120;
                    currentBottom += parseFloat(b.dataset.speed);
                    b.style.bottom = `${currentBottom}px`;

                    const initialLeft = parseFloat(b.dataset.initialLeft);
                    const phase = parseFloat(b.dataset.swayPhase);
                    const swaySpeed = parseFloat(b.dataset.swaySpeed);
                    const sway = Math.sin(now * swaySpeed + phase) * 5; 
                    b.style.left = (initialLeft + sway) + '%';

                    if (currentBottom > areaHeight) {
                        b.remove();
                        this.balloons.splice(i, 1);
                    }
                }
            }
            
            showResult(rank) {
                let medal = '';
                let text = '';
                const t = i18n[currentLang];
                
                if (rank === 1) { medal = '🥇'; text = t.rank_1; }
                else if (rank === 2) { medal = '🥈'; text = t.rank_2; }
                else if (rank === 3) { medal = '🥉'; text = t.rank_3; }
                else { medal = ''; text = t.rank_4; } 

                this.ui.medal.innerText = medal;
                this.ui.rankText.innerText = text;
                this.ui.finalScore.innerText = `${this.score}${t.score_unit}`;
                this.ui.overlay.style.display = 'flex';
                
                if(rank === 1) createConfetti();
            }
        }

        // --- 4. 게임 관리 로직 ---
        function updateCurrentLeader() {
            let maxScore = -1;
            state.teams.forEach(t => { if (t.score > maxScore) maxScore = t.score; });

            state.teams.forEach(t => {
                const crown = document.getElementById(`crown-${t.index}`);
                if (maxScore > 0 && t.score === maxScore) crown.classList.add('show');
                else crown.classList.remove('show');
            });
        }

        function prepareData() {
            const db = getShapesDB();
            if (config.topic === 'all') state.shapesDB = [...db];
            else if (config.topic === 'tri') state.shapesDB = db.filter(s => s.cat === 'tri');
            else if (config.topic === 'quad') state.shapesDB = db.filter(s => s.cat === 'quad');
        }

        function startGame() {
            state.isPlaying = true;
            prepareData(); 

            // 시작과 동시에 언어 선택기 숨김 처리 (요구사항)
            document.getElementById('langSelectorContainer').style.display = 'none';

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('header-info').style.display = 'flex';
            
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            board.style.display = 'flex';
            
            board.removeEventListener('pointerdown', handleGlobalTouch);
            board.addEventListener('pointerdown', handleGlobalTouch);

            state.teams = [];
            for (let i = 0; i < config.playerCount; i++) {
                const team = new Team(i);
                state.teams.push(team);
                board.appendChild(team.element);
                team.setTarget(); 
            }
            
            state.timeLeft = config.gameTime;
            state.startTime = performance.now();
            state.lastSpawnTime = state.startTime;

            startTimer();
            gameLoop();
        }

        function handleGlobalTouch(e) {
            if(!state.isPlaying) return;

            const elements = document.elementsFromPoint(e.clientX, e.clientY);
            const hitBalloons = elements.filter(el => el.classList.contains('balloon') && !el.classList.contains('popped') && !el.classList.contains('wrong'));
            
            if (hitBalloons.length === 0) return;

            let targetBalloon = hitBalloons[0];

            const teamIndex = parseInt(targetBalloon.dataset.teamIndex);
            const team = state.teams[teamIndex];
            
            const tags = JSON.parse(targetBalloon.dataset.shapeTags);
            const mission = team.currentMissionTag;
            const t = i18n[currentLang];
            
            let isCorrect = false;
            if (tags.includes(mission)) {
                isCorrect = true;
            } else if (mission === t.poly) {
                if (!tags.includes(t.circle) && !tags.includes(t.oval)) isCorrect = true;
            }

            if(isCorrect) {
                playSound('pop');
                team.updateScore(10);
                targetBalloon.classList.add('popped');
                createMiniExplosion(e.clientX, e.clientY);
                targetBalloon.remove();
                team.balloons = team.balloons.filter(b => b !== targetBalloon);
            } else {
                playSound('wrong');
                team.updateScore(-5);
                targetBalloon.classList.add('wrong'); 
                setTimeout(() => {
                    if(targetBalloon.parentElement) {
                        targetBalloon.remove();
                        team.balloons = team.balloons.filter(b => b !== targetBalloon);
                    }
                }, 1000);
            }
        }

        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.innerText = state.timeLeft;
            timerDisplay.classList.remove('urgent');

            if(state.timerInterval) clearInterval(state.timerInterval);
            
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                timerDisplay.innerText = state.timeLeft;

                if(state.timeLeft % 10 === 0 && state.timeLeft > 0) {
                     state.teams.forEach(t => {
                         t.setTarget();
                         playSound('mission');
                     });
                }

                if (state.timeLeft <= 10) timerDisplay.classList.add('urgent');
                
                if (state.timeLeft <= 0) {
                    finishGame();
                }
            }, 1000);
        }

        function gameLoop(timestamp) {
            if(!state.isPlaying) return;

            if(timestamp - state.lastSpawnTime > config.spawnRate) {
                state.teams.forEach(team => {
                    const elapsedTime = (timestamp - state.startTime) / 1000;
                    
                    const baseChance = 0.4 + (elapsedTime / config.gameTime) * 0.4;
                    const spawnChance = Math.min(baseChance, 0.95); 
                    
                    if(Math.random() < spawnChance) team.spawnBalloon();
                });
                state.lastSpawnTime = timestamp;
            }

            state.teams.forEach(team => team.updateBalloons());
            state.animationId = requestAnimationFrame(gameLoop);
        }

        function finishGame() {
            if(!state.isPlaying) return;
            state.isPlaying = false;
            clearInterval(state.timerInterval);
            cancelAnimationFrame(state.animationId);
            playSound('end');

            const board = document.getElementById('game-board');
            board.removeEventListener('pointerdown', handleGlobalTouch);

            let sortedTeams = [...state.teams].sort((a, b) => b.score - a.score);
            let currentRank = 1;
            for (let i = 0; i < sortedTeams.length; i++) {
                if (i > 0 && sortedTeams[i].score < sortedTeams[i-1].score) {
                    currentRank = i + 1;
                }
                sortedTeams[i].showResult(currentRank);
            }

            document.getElementById('game-over-controls').style.display = 'block';
        }

        function createMiniExplosion(x, y) {
            for(let i=0; i<8; i++) {
                const p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.width = '6px';
                p.style.height = '6px';
                p.style.background = '#fff';
                p.style.borderRadius = '50%';
                p.style.pointerEvents = 'none';
                p.style.zIndex = 100;
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const vel = Math.random() * 50 + 20;
                const tx = Math.cos(angle) * vel;
                const ty = Math.sin(angle) * vel;

                p.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 500,
                    easing: 'ease-out'
                }).onfinish = () => p.remove();
            }
        }

        // --- 5. 이벤트 핸들러 ---
        const playerBtns = document.querySelectorAll('#player-options .btn-option');
        playerBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                playerBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                config.playerCount = parseInt(btn.dataset.value);
                playSound('click');
            });
        });

        const modeBtns = document.querySelectorAll('#mode-options .btn-option');
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                config.topic = btn.dataset.value;
                playSound('click');
            });
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            playSound('click');
            startGame();
        });

        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
            else if (document.exitFullscreen) document.exitFullscreen();
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            playSound('click');
            setTimeout(() => location.reload(), 200);
        });

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];
            for (let i = 0; i < 150; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.opacity = Math.random();
                container.appendChild(conf);
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            window.addEventListener('resize', applyDynamicFontSize);
        });
        document.addEventListener('contextmenu', event => event.preventDefault()); 
        document.addEventListener('dragstart', event => event.preventDefault());    
        document.addEventListener('touchmove', function(event) {
            if (event.scale !== 1) { event.preventDefault(); }
        }, { passive: false });

document.getElementById('btn-home').addEventListener('click', () => {
    // 1. 만약 전체 화면 모드라면
    if (document.fullscreenElement) {
        // 새로고침 대신 화면 초기화 로직 실행 (전체 화면 유지)
        state.isPlaying = false;
        clearInterval(state.timerInterval);
        cancelAnimationFrame(state.animationId);
        
        document.getElementById('langSelectorContainer').style.display = 'block';
        document.getElementById('game-board').style.display = 'none';
        document.getElementById('header-info').style.display = 'none';
        document.getElementById('game-over-controls').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'flex';
        
        if(window.playSound) window.playSound('click');
    } else {
        // 2. 전체 화면이 아니라면 그냥 새로고침
        location.reload();
    }
});
    </script>
</body>
</html>
