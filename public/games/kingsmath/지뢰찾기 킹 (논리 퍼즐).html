<!DOCTYPE html>
<html lang="ko">
<head>
   
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>
    <script>

      function gtag(){dataLayer.push(arguments);}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="meta-title">지뢰찾기 킹 - 킹수학</title>
    <meta id="meta-desc" name="description" content="제한시간 60초! 지뢰를 찾아 생존하라. 두뇌 서바이벌 지뢰찾기 킹.">
    <meta id="meta-keywords" name="keywords" content="킹수학, KingsMath, 지뢰찾기, Minesweeper, 두뇌 훈련, 수학 게임, 교육용 게임">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'DosMyungjo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_eight@1.0/DOSMyungjo.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --win-gray: #c0c0c0;
            --win-white: #ffffff;
            --win-dark: #808080;
            --win-black: #000000;
            --win-blue: #000080;
            --led-red: #ff0000;
        }

        /* 폰트어썸 아이콘 깨짐 방지용 예외 처리 */
        i[class^="fa-"] {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
        }

        /* 모달창 내부 박스 사이징 강제 보정 */
        #langModal, #langModal * {
            box-sizing: border-box !important;
        }

        * { box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        
        body {
            margin: 0; padding: 0; 
            background-color: #000;
            font-family: 'DosMyungjo', 'Courier New', Courier, monospace, sans-serif; 
            height: 100vh; display: flex; justify-content: center; overflow: hidden;
            color: var(--win-black);
        }

        .bevel-out {
            border-top: 3px solid var(--win-white);
            border-left: 3px solid var(--win-white);
            border-right: 3px solid var(--win-dark);
            border-bottom: 3px solid var(--win-dark);
            background-color: var(--win-gray);
        }
        .bevel-in {
            border-top: 3px solid var(--win-dark);
            border-left: 3px solid var(--win-dark);
            border-right: 3px solid var(--win-white);
            border-bottom: 3px solid var(--win-white);
            background-color: var(--win-gray);
        }
        .bevel-field {
            border-top: 3px solid var(--win-dark);
            border-left: 3px solid var(--win-dark);
            border-right: 3px solid var(--win-white);
            border-bottom: 3px solid var(--win-white);
            background-color: var(--win-gray);
        }

        #app-wrapper {
            width: 100%; height: 100%;
            background-color: #000;
            display: flex; flex-direction: column; position: relative; 
        }

        /* --- 다국어 UI 애니메이션 및 스크롤바 --- */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay {
            opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* 시작 화면 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; color: #c0c0c0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; font-size: 1.5rem;
        }
        
        .dos-container {
            width: 80%; max-width: 800px; border: 2px solid #c0c0c0; padding: 20px;
            background: #000080; box-shadow: 10px 10px 0px #444; text-align: center;
        }

        .main-title { 
            font-size: 3.5rem; color: #FFFF00; text-align: center; margin: 10px 0; 
            text-shadow: 4px 4px 0 #000; letter-spacing: 2px; line-height: 1.2;
            word-break: keep-all; font-weight: normal; 
        }
        .title-sub { 
            font-size: 1.5rem; color: #fff; display: block; margin-top: 10px; 
            border-bottom: 2px dashed #fff; padding-bottom: 10px; word-break: keep-all;
        }

        .player-select-row { display: flex; gap: 20px; justify-content: center; margin: 30px 0; flex-wrap: wrap; }
        
        .btn-player-cnt {
            background: #000; color: #0f0; border: 2px solid #0f0;
            font-family: 'DosMyungjo', monospace; font-size: 2rem;
            padding: 5px 15px; cursor: pointer; white-space: nowrap;
        }
        .btn-player-cnt:hover, .btn-player-cnt.active { background: #0f0; color: #000; }

        .btn-start {
            background: #c0c0c0; color: #000; border: 4px solid #fff;
            font-size: 2.5rem; padding: 10px 60px; 
            font-family: 'DosMyungjo', monospace; cursor: pointer;
            box-shadow: 5px 5px 0 #000; display: block; margin: 0 auto;
            white-space: nowrap;
        }
        .btn-start:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 #000; }

        /* 게임 화면 */
        #game-screen { display: none; width: 100%; height: 100%; flex-direction: column; background: #000; position: relative; }

        .global-header {
            background: var(--win-blue); color: white;
            padding: 5px 10px; font-size: 1.2rem; display: flex; align-items: center; justify-content: space-between;
            height: 60px; border-bottom: 2px solid #444;
        }
        
        .global-timer-box {
            background: #000; border: 2px solid #fff;
            color: #ff0000; font-size: 2.5rem; padding: 0 15px;
            font-family: 'DosMyungjo'; box-shadow: inset 0 0 10px #000;
        }

        #multi-player-container {
            flex: 1; display: flex; width: 100%; height: 100%; overflow: hidden; background: #000;
        }

        .player-section {
            flex: 1; border-right: 1px solid #333; border-left: none;
            display: flex; flex-direction: column; background: #000; position: relative; padding: 5px;
        }
        .player-section:last-child { border-right: none; }
        
        .player-header-panel {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--win-gray); border-top: 3px solid var(--win-white); border-left: 3px solid var(--win-white);
            border-right: 3px solid var(--win-dark); border-bottom: none; 
            padding: 8px 10px; margin-bottom: 0; width: 100%; box-sizing: border-box;
        }
        
        .digital-display {
            background: #000; color: var(--led-red);
            font-family: 'DosMyungjo', monospace; font-size: 2.2rem;
            padding: 0 5px; border: 2px solid #808080;
            min-width: 70px; text-align: right; line-height: 1;
            border-top: 2px solid #444; border-left: 2px solid #444;
            border-right: 2px solid #fff; border-bottom: 2px solid #fff;
        }
        .time-counter { min-width: 90px; color: #0f0; }

        .face-btn { width: 45px; height: 45px; font-size: 2rem; display: flex; justify-content: center; align-items: center; cursor: pointer; padding-bottom: 3px; }

        /* [최적화] 게임 바디 정렬 및 간격 */
        .game-body { 
            flex: 1; display: flex; align-items: center; justify-content: center; /* flex-end 제거, 중앙 정렬 */
            padding: 10px 5px; gap: 15px; background: #000; width: 100%; overflow: hidden;
        }
        /* [최적화] 우측 스택 너비 유연하게 조정 */
        .right-stack { 
            display: flex; flex-direction: column; align-items: center; 
            width: 100%; max-width: 400px; flex: 1; 
        }
        .left-controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 0; flex-shrink: 0; }

        .control-btn { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 2rem; cursor: pointer; }
        .control-btn.selected {
            border-top: 3px solid var(--win-dark); border-left: 3px solid var(--win-dark);
            border-right: 3px solid var(--win-white); border-bottom: 3px solid var(--win-white); background: #ddd;
        }

        .grid-container { padding: 0; background: var(--win-gray); width: 100%; }

        /* [최적화] 보드 그리드 비율 기반 축소 (고정폭 제거) */
        .minesweeper-grid {
            display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
            width: 100%; height: auto; aspect-ratio: 1/1; max-width: 100%; max-height: 100%;
        }

        .cell {
            border-top: 3px solid var(--win-white); border-left: 3px solid var(--win-white);
            border-right: 3px solid var(--win-dark); border-bottom: 3px solid var(--win-dark);
            background: var(--win-gray); display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; font-weight: bold; cursor: pointer; position: relative;
        }
        .cell.revealed { border: 1px solid #808080; background: var(--win-gray); }
        .cell.pressing {
            background-color: var(--win-gray);
            border-top: 3px solid var(--win-dark) !important; border-left: 3px solid var(--win-dark) !important;
            border-right: 3px solid var(--win-gray) !important; border-bottom: 3px solid var(--win-gray) !important;
        }
        .cell.revealed.pressing { background: #999; box-shadow: inset 3px 3px 0px #444; border: 1px solid #808080; }
        .cell.bomb { background: #ff0000; }
        .cell.wrong-flag { background: #ffaaaa; }
        
        .c-1 { color: #0000ff; } .c-2 { color: #008000; } .c-3 { color: #ff0000; } .c-4 { color: #000080; }
        .c-5 { color: #800000; } .c-6 { color: #008080; } .c-7 { color: #000000; } .c-8 { color: #808080; }

        /* 결과 오버레이 */
        .p-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 10;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }
        .win-95-msgbox { background: var(--win-gray); border: 2px solid var(--win-white); box-shadow: 4px 4px 0 #000; padding: 2px; width: 85%; }
        .msg-header { background: var(--win-blue); color: white; padding: 2px 5px; font-size: 1rem; display: flex; justify-content: space-between; }
        .msg-body {
            padding: 15px; text-align: center; border-top: 2px solid var(--win-white); border-left: 2px solid var(--win-white);
            border-right: 2px solid var(--win-dark); border-bottom: 2px solid var(--win-dark);
        }
        .p-result-txt { font-size: 2rem; color: #000; margin-bottom: 5px; word-break: keep-all; }
        .p-rank-txt { font-size: 3rem; color: #000080; font-weight: bold; margin-bottom: 10px; }
        .p-record-detail { font-size: 1.2rem; color: #333; margin-bottom: 10px; line-height: 1.4; word-break: keep-all; }

        /* 카운트다운 오버레이 */
        #countdown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 5000; display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; 
        }
        #countdown-text {
            font-size: 10rem; color: #FFFF00; text-shadow: 5px 5px 0 #FF0000, -2px -2px 0 #fff;
            font-weight: bold; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); white-space: pre-wrap; text-align: center;
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        #global-controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 2000; display: none; }
        .btn-home {
            background: var(--win-gray); border-top: 3px solid var(--win-white); border-left: 3px solid var(--win-white);
            border-right: 3px solid var(--win-dark); border-bottom: 3px solid var(--win-dark);
            padding: 5px 20px; font-family: 'DosMyungjo'; font-size: 1.5rem; cursor: pointer;
        }

        /* 홈 버튼 및 플로팅 버튼 */
        .floating-btn {
            position: fixed; top: 50%; transform: translateY(-50%); width: 60px; height: 60px;
            background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            color: white; font-size: 30px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s; text-decoration: none;
        }
        .floating-btn:hover { background: rgba(0,0,0,0.9); transform: translateY(-50%) scale(1.1); }
        .floating-left { left: 10px; }
        .floating-right { right: 10px; }
        .auto-resize { transition: font-size 0.2s ease; display: inline-block; }

        /* ========================================= */
        /* [최적화] 해상도 맞춤형 미디어 쿼리 구간 추가 */
        /* ========================================= */
        @media (max-width: 1400px), (max-height: 850px) {
            .global-header { height: 45px; font-size: 1rem; padding: 2px 10px; }
            .global-timer-box { font-size: 1.8rem; padding: 0 10px; }
            .window-icon { font-size: 1.2rem !important; }
            
            .game-body { padding: 5px; gap: 8px; }
            .left-controls { gap: 8px; }
            
            .control-btn { width: 45px; height: 45px; font-size: 1.5rem; }
            .control-btn.selected { border-width: 2px; }
            
            .player-header-panel { padding: 5px; border-width: 2px; }
            .digital-display { font-size: 1.4rem; min-width: 45px; padding: 0 3px; border-width: 2px; }
            .time-counter { min-width: 55px; }
            .face-btn { width: 35px; height: 35px; font-size: 1.5rem; padding-bottom: 0; }
            
            .cell { font-size: 1.2rem; border-width: 2px; }
            .cell.pressing { border-width: 2px !important; }
            
            .bevel-out, .bevel-in, .bevel-field { border-width: 2px; }
            
            .msg-body { padding: 10px; }
            .p-result-txt { font-size: 1.5rem; margin-bottom: 2px; }
            .p-rank-txt { font-size: 2.2rem; margin-bottom: 5px; }
            .p-record-detail { font-size: 1rem; line-height: 1.2; }
            .win-95-msgbox { width: 95%; }
        }

        /* [최적화] 1280x800(가로 4분할 시 매우 협소) 완벽 대응 초소형 모드 */
        @media (max-width: 1280px) {
            .game-body { padding: 3px; gap: 4px; }
            .left-controls { gap: 4px; }
            .control-btn { width: 36px; height: 36px; font-size: 1.2rem; border-width: 2px; }
            
            .player-header-panel { padding: 3px; }
            .digital-display { font-size: 1.2rem; min-width: 38px; }
            .time-counter { min-width: 48px; }
            .face-btn { width: 30px; height: 30px; font-size: 1.2rem; }
            
            .cell { font-size: 1rem; border-width: 1px; } /* 공간 확보를 위해 내부 보더 최소화 */
            .cell.pressing { border-width: 1px !important; }
            .bevel-out, .bevel-in, .bevel-field { border-width: 2px; }
        }
    </style>
</head>
<body>

<div id="langSelectorContainer" class="absolute top-4 right-4 sm:top-6 sm:right-6" style="z-index: 99999 !important;">
    <button id="langTriggerBtn" class="flex items-center gap-2 bg-gray-700/50 hover:bg-gray-700 border border-gray-600 rounded-full px-4 py-2 transition-all duration-200 text-sm font-medium shadow-lg text-gray-100" style="font-family: sans-serif;">
        <i class="fa-solid fa-globe text-gray-400"></i>
        <img id="currentFlag" src="https://flagcdn.com/w40/kr.png" alt="KR" class="w-5 h-auto rounded-[2px] shadow-sm">
        <span id="currentLangName">한국어</span>
        <i class="fa-solid fa-chevron-down text-gray-400 ml-1 text-xs"></i>
    </button>
</div>

<div id="langModal" class="modal-overlay fixed inset-0 flex items-start sm:items-center justify-center bg-black/60 backdrop-blur-sm pt-16 sm:pt-0 px-4" style="z-index: 99999 !important; font-family: sans-serif;">
    <div class="modal-content bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden text-gray-100">
        <div class="flex items-center justify-between p-5 border-b border-gray-800 bg-gray-900/95 sticky top-0 z-10">
            <div>
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-language text-yellow-500"></i>
                    <span>Language / 언어</span>
                </h2>
            </div>
            <button id="closeModalBtn" class="w-10 h-10 rounded-full bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="p-5 pb-2 bg-gray-900">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search / 검색 ..." 
                    class="w-full bg-gray-800 border border-gray-700 text-white text-sm rounded-xl focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 block pl-11 p-3.5 outline-none transition-all placeholder-gray-500">
            </div>
        </div>
        <div class="p-5 overflow-y-auto custom-scrollbar flex-1">
            <div id="languageGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
            <div id="noResult" class="hidden flex-col items-center justify-center py-12 text-gray-500">
                <i class="fa-regular fa-face-frown-open text-4xl mb-3"></i>
                <p>No results / 검색 결과 없음</p>
            </div>
        </div>
    </div>
</div>

<div id="toastNotification" class="toast fixed bottom-6 right-6 bg-gray-800 border border-gray-700 shadow-lg rounded-xl p-4 flex items-center gap-3" style="z-index: 99999 !important; font-family: sans-serif;">
    <div class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center text-green-400">
        <i class="fa-solid fa-check"></i>
    </div>
    <div>
        <p id="ui-toast" class="text-sm font-medium text-white">언어가 변경되었습니다.</p>
        <p id="toastLangName" class="text-xs text-gray-400">Korean</p>
    </div>
</div>

<div id="app-wrapper">
    <div id="btn-home" class="floating-btn floating-left" style="cursor:pointer; z-index: 99999 !important;">🏠</div>
    
    <div id="start-screen">
        <div class="dos-container">
            <div style="text-align:left; border-bottom: 1px dashed #aaa; margin-bottom: 20px;">C:\> KINGSMATH_MINESWEEPER.EXE</div>
            <h1 class="main-title" data-lang="title_main">지뢰찾기 킹</h1>
            <span class="title-sub" data-lang="title_sub">제한시간 60초 | 무한 재도전 | 점수 대결</span>
            <div style="margin-top:30px; font-size:1.5rem; color:#0f0;" data-lang="select_player_cnt">플레이어 수 선택:</div>
            <div class="player-select-row">
                <div class="btn-player-cnt" onclick="selectPlayerCount(1)"><span data-lang="player_1" class="auto-resize">1인</span></div>
                <div class="btn-player-cnt" onclick="selectPlayerCount(2)"><span data-lang="player_2" class="auto-resize">2인</span></div>
                <div class="btn-player-cnt" onclick="selectPlayerCount(3)"><span data-lang="player_3" class="auto-resize">3인</span></div>
                <div class="btn-player-cnt active" onclick="selectPlayerCount(4)"><span data-lang="player_4" class="auto-resize">4인</span></div>
            </div>
            <button class="btn-start" onclick="initGameSequence()"><span data-lang="btn_start" class="auto-resize">매치 시작</span></button>
            <div style="margin-top:20px; font-size:1.2rem;">
                <a href="/" target="_self" style="color:#0f0; text-decoration:none; border-bottom: 1px dashed #0f0;" data-lang="link_other">게임으로 수학의 킹이 되어라. 킹수학.com</a>
            </div>
        </div>
    </div>

    <div id="game-screen">
        <div class="global-header">
            <span class="window-icon" style="font-size:1.5rem;" data-lang="header_mode">💣 배틀 모드</span>
            <div class="global-timer-box" id="global-timer-display">60</div>
            <span style="width:100px;"></span>
        </div>
        <div id="multi-player-container"></div>
        
        <div id="countdown-overlay">
            <div id="countdown-text">3</div>
        </div>
    </div>

    <div id="global-controls">
        <button class="btn-home" onclick="goHome()" data-lang="btn_home">처음으로</button>
    </div>
</div>

<script>
    /* ========================================================= */
    /* 1. 다국어 지원 (16개국) 및 번역 데이터 세팅               */
    /* ========================================================= */
    const toastTranslations = {
        'ko': '언어가 변경되었습니다.', 'en': 'Language changed.', 'zh': '语言已更改。', 'ja': '言語が変更されました。',

    /* ========================================================= */
    function detectLanguage() {
        // 1순위: URL 파라미터 (?lang=fr)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('lang')) {
            const lang = urlParams.get('lang').toLowerCase();
            if (TRANSLATIONS[lang]) return lang;
        }
        // 2순위: 저장된 설정 (localStorage)
        const stored = localStorage.getItem('kingsmath_lang');
        if (stored && TRANSLATIONS[stored]) return stored;
        
        // 3순위: 기기 언어 설정
        const browserLang = navigator.language.toLowerCase();
        if (TRANSLATIONS[browserLang]) return browserLang;
        const prefix = browserLang.split('-')[0];
        if (TRANSLATIONS[prefix]) return prefix;

        // 기본값: 영어
        return 'en';
    }

    function renderLanguages(filterText = '') {
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languagesList.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;

    function adjustFontSize() {
        document.querySelectorAll('.auto-resize').forEach(el => {
            el.style.fontSize = ''; // 초기화
            const parentWidth = el.parentElement.clientWidth - 10;
            const elWidth = el.scrollWidth;
            
            if(elWidth > parentWidth && parentWidth > 0) {
                const ratio = parentWidth / elWidth;
                const currentSize = parseFloat(window.getComputedStyle(el.parentElement).fontSize);
                el.style.fontSize = (currentSize * ratio * 0.95) + 'px';
            }
        });
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'count') { 
            osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(); osc.stop(now + 0.1);
        } else if (type === 'start') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.linearRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.start(); osc.stop(now + 0.4);
        } else if (type === 'click') { 
            osc.type = 'square'; osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
            osc.start(); osc.stop(now + 0.03);
        } else if (type === 'flag') { 
            osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(500, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(); osc.stop(now + 0.1);
        } else if (type === 'boom') { 
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(); osc.stop(now + 0.5);
        } else if (type === 'win') { 
            const notes = [523, 659, 784, 1046];
            notes.forEach((freq, i) => {
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.type = 'square'; o.frequency.value = freq;
                g.gain.setValueAtTime(0.05, now + i*0.1); g.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.2);
                o.start(now + i*0.1); o.stop(now + i*0.1 + 0.2);
            });
        }
    }

    function updateGlobalTimer() {
        if (!isMatchActive) return;
        const now = Date.now();
        const elapsed = (now - matchStartTime) / 1000;
        let remaining = MATCH_TIME_LIMIT - elapsed;

        if (remaining <= 0) {
            remaining = 0;
            endMatch(); 
        }

        const timerEl = document.getElementById('global-timer-display');
        timerEl.innerText = Math.ceil(remaining);
        
        if (remaining <= 10) {
            timerEl.style.color = 'yellow';
            timerEl.style.backgroundColor = 'red';
        }
    }

    function endMatch() {
        isMatchActive = false;
        clearInterval(globalTimerInterval);
        document.getElementById('global-controls').style.display = 'block';

        let results = [];
        games.forEach(game => {
            game.stopInteraction(); 
            
            let status = 'fail';
            let clearTime = 9999;
            let score = 0;

            if (game.isCleared) {
                status = 'clear';
                clearTime = game.finalClearTime;
                score = 100;
            } else {
                let correctFlags = 0;
                let wrongFlags = 0;
                for(let i=0; i < game.rows * game.cols; i++) {
                    if (game.state[i] === 2) { 
                        if (game.grid[i] === -1) correctFlags++;
                        else wrongFlags++;
                    }
                }
                score = correctFlags - wrongFlags;
            }

            results.push({ id: game.id, status: status, time: clearTime, score: score });
        });

        results.sort((a, b) => {
            if (a.status === 'clear' && b.status !== 'clear') return -1;
            if (a.status !== 'clear' && b.status === 'clear') return 1;
            if (a.status === 'clear' && b.status === 'clear') return a.time - b.time;
            return b.score - a.score;
        });

        let currentRank = 1;
        results.forEach((res, index) => {
            if (index > 0) {
                const prev = results[index - 1];
                const isTie = (prev.status === res.status) && 
                              (Math.abs(prev.time - res.time) < 0.01) && 
                              (prev.score === res.score);
                
                if (!isTie) {
                    currentRank = index + 1;
                }
            } else {
                currentRank = 1;
            }
            games[res.id].showFinalResult(currentRank, res);
        });
    }


    /* --- 개별 게임 로직 클래스 --- */
    class MinesweeperGame {
        constructor(id, rows, cols, bombs) {
            this.id = id;
            this.rows = rows;
            this.cols = cols;
            this.totalBombs = bombs;
            
            this.gridElement = document.getElementById(`grid-${id}`);
            this.bombCountEl = document.querySelector(`#p-section-${id} .bomb-counter`);
            this.timeEl = document.querySelector(`#p-section-${id} .time-counter`);
            this.faceBtn = document.getElementById(`face-${id}`);
            this.overlay = document.getElementById(`overlay-${id}`);
            
            this.resTxt = document.getElementById(`res-txt-${id}`);
            this.rankTxt = document.getElementById(`rank-txt-${id}`);
            this.recDetail = document.getElementById(`rec-detail-${id}`);
            this.msgGameoverTxt = document.querySelector(`#p-section-${id} .msg-gameover-txt`);

            this.mode = 'dig';
            this.grid = []; 
            this.state = []; 
            
            this.personalStartTime = 0;
            this.personalInterval = null;
            this.hasStarted = false;
            
            this.isCleared = false;
            this.finalClearTime = 0;
            this.isFrozen = false; 
            
            this.init();
        }

        init() {
            this.gridElement.innerHTML = '';
            this.grid = Array(this.rows * this.cols).fill(0);
            this.state = Array(this.rows * this.cols).fill(0); 
            
            this.hasStarted = false;
            this.isCleared = false;
            this.isFrozen = false;
            this.finalClearTime = 0;
            
            if (this.personalInterval) clearInterval(this.personalInterval);
            this.timeEl.innerText = "0.00";
            this.updateCounter(this.totalBombs);
            this.faceBtn.innerText = "🙂";
            this.overlay.style.display = 'none';

            if (this.msgGameoverTxt) this.msgGameoverTxt.innerText = TRANSLATIONS[currentLang].msg_gameover;

            for(let i=0; i<this.rows * this.cols; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.idx = i;
                this.addInteraction(cell, i);
                this.gridElement.appendChild(cell);
            }
        }

        manualReset() {
            if (!isMatchActive) return; 
            this.init();
        }

        addInteraction(element, idx) {
            let pressTimer = null;
            let isLongPress = false;

            const setNeighborPressing = (isPressing) => {
                if (this.state[idx] === 1 && this.grid[idx] > 0) {
                    const neighbors = this.getNeighbors(idx);
                    neighbors.forEach(n => {
                        if (this.state[n] === 0) {
                            const neighborCell = this.gridElement.children[n];
                            if (isPressing) neighborCell.classList.add('pressing');
                            else neighborCell.classList.remove('pressing');
                        }
                    });
                }
            };

            const startPress = (e) => {
                if(this.isFrozen || !isMatchActive) return;
                isLongPress = false;
                
                if(this.state[idx] !== 2) {
                    element.classList.add('pressing');
                    this.faceBtn.innerText = "😮";
                }

                setNeighborPressing(true);

                pressTimer = setTimeout(() => {
                    isLongPress = true;
                    setNeighborPressing(false);
                    element.classList.remove('pressing');
                    this.toggleFlag(idx);
                    this.faceBtn.innerText = "🙂";
                    if(navigator.vibrate) navigator.vibrate(50);
                }, 300); 
            };

            const endPress = (e) => {
                if(pressTimer) clearTimeout(pressTimer); 
                
                if(this.isFrozen || !isMatchActive) return;
                
                element.classList.remove('pressing');
                setNeighborPressing(false); 

                if(!this.isFrozen) this.faceBtn.innerText = "🙂";

                if (!isLongPress) {
                    if (e.cancelable) e.preventDefault(); 
                    this.handleClick(idx);
                }
            };

            element.onmousedown = (e) => { if(e.button !== 0) return; startPress(e); };
            element.onmouseup = (e) => { if(e.button !== 0) return; endPress(e); };
            element.onmouseleave = () => {
                if(pressTimer) clearTimeout(pressTimer);
                element.classList.remove('pressing');
                setNeighborPressing(false); 
                if(!this.isFrozen) this.faceBtn.innerText = "🙂";
            };

            element.ontouchstart = (e) => { startPress(e); };
            element.ontouchend = (e) => { endPress(e); };
            element.oncontextmenu = (e) => { e.preventDefault(); return false; };
        }

        handleClick(idx) {
            if (!this.hasStarted) {
                this.startPersonalTimer();
                this.placeBombs(idx);
                this.hasStarted = true;
            }

            if (this.state[idx] === 1 && this.grid[idx] > 0) {
                this.chordReveal(idx);
                return;
            }
            
            if (this.state[idx] === 2) return;

            if (this.state[idx] === 0) {
                if (this.mode === 'dig') {
                    this.reveal(idx);
                } else {
                    this.toggleFlag(idx);
                }
            }
        }

        startPersonalTimer() {
            this.personalStartTime = Date.now();
            this.personalInterval = setInterval(() => {
                const now = Date.now();
                const elapsed = (now - this.personalStartTime) / 1000;
                this.timeEl.innerText = elapsed.toFixed(2);
            }, 50);
        }

        reveal(idx) {
            if (this.state[idx] !== 0) return;

            if (this.grid[idx] === -1) {
                this.triggerBoom(idx);
                return;
            }

            this.state[idx] = 1;
            const cell = this.gridElement.children[idx];
            cell.classList.add('revealed');
            
            if (this.grid[idx] > 0) {
                cell.innerText = this.grid[idx];
                cell.classList.add(`c-${this.grid[idx]}`);
            }

            playSound('click');

            if (this.grid[idx] === 0) {
                const neighbors = this.getNeighbors(idx);
                neighbors.forEach(n => this.reveal(n));
            }

            this.checkClear();
        }

        triggerBoom(idx) {
            this.isFrozen = true; 
            this.faceBtn.innerText = "😵";
            playSound('boom');
            
            const cell = this.gridElement.children[idx];
            cell.classList.add('revealed', 'bomb');
            cell.innerText = '💣';

            setTimeout(() => {
                if (isMatchActive) {
                    this.init(); 
                }
            }, 1000);
        }

        toggleFlag(idx) {
            if (this.state[idx] === 1) return; 
            
            const cell = this.gridElement.children[idx];
            
            if (this.state[idx] === 2) {
                this.state[idx] = 0;
                cell.classList.remove('flagged');
                cell.innerText = '';
            } 
            else if (this.state[idx] === 0) {
                this.state[idx] = 2;
                cell.classList.add('flagged');
                cell.innerText = '🚩';
                cell.style.color = 'red';
                playSound('flag');
            }
            this.updateFlagCounter();
        }

        chordReveal(idx) {
            const neighbors = this.getNeighbors(idx);
            let flags = 0;
            neighbors.forEach(n => { if(this.state[n]===2) flags++; });
            
            if (flags === this.grid[idx]) {
                neighbors.forEach(n => { if(this.state[n]===0) this.reveal(n); });
            }
        }

        checkClear() {
            let revealed = 0;
            this.state.forEach(s => { if(s===1) revealed++; });
            
            if (revealed === (this.rows * this.cols - this.totalBombs)) {
                this.handleClear();
            }
        }

        handleClear() {
            this.isCleared = true;
            this.isFrozen = true; 
            clearInterval(this.personalInterval);
            
            this.finalClearTime = parseFloat(this.timeEl.innerText);
            this.faceBtn.innerText = "😎";
            playSound('win');
            
            this.grid.forEach((v, i) => {
                if (v === -1 && this.state[i] !== 2) {
                    this.state[i] = 2;
                    this.gridElement.children[i].innerText = '🚩';
                }
            });
            this.updateFlagCounter();
            
            const t = TRANSLATIONS[currentLang];
            this.overlay.style.display = 'flex';
            this.msgGameoverTxt.innerText = t.msg_gameover;
            this.resTxt.innerText = t.msg_cleared;
            this.rankTxt.innerText = t.msg_waiting;
            this.recDetail.innerText = `${t.msg_record_prefix}${this.finalClearTime}${t.msg_record_suffix}\n${t.msg_calculating}`;
        }

        stopInteraction() {
            this.isFrozen = true;
            clearInterval(this.personalInterval);
        }

        showFinalResult(rank, data) {
            this.overlay.style.display = 'flex';
            const colors = ['#FFD700', '#C0C0C0', '#CD7F32']; 
            const rankColor = rank <= 3 ? colors[rank-1] : '#000';
            const t = TRANSLATIONS[currentLang];
            
            this.msgGameoverTxt.innerText = t.msg_gameover;
            this.rankTxt.innerText = getRankString(rank);
            this.rankTxt.style.color = rankColor;

            if (data.status === 'clear') {
                this.resTxt.innerText = t.msg_mission_success;
                this.recDetail.innerHTML = `${t.msg_record_prefix}<br><span style="font-size:1.8rem; color:blue;">${data.time}${t.msg_record_suffix}</span>`;
            } else {
                this.resTxt.innerText = t.msg_time_over;
                this.recDetail.innerHTML = `${t.msg_score_prefix}<span style="font-size:1.5rem; color:red;">${data.score}${t.msg_score_suffix}</span><br><span style="font-size:0.8rem; color:#666;">${t.msg_score_detail}</span>`;
                
                this.grid.forEach((v, i) => {
                    if (this.state[i] === 2 && v !== -1) {
                        this.gridElement.children[i].classList.add('wrong-flag');
                        this.gridElement.children[i].innerText = '❌';
                    } else if (v === -1 && this.state[i] !== 2) {
                        this.gridElement.children[i].classList.add('revealed', 'bomb');
                        this.gridElement.children[i].innerText = '💣';
                    }
                });
            }
        }

        updateFlagCounter() {
            let flags = 0;
            this.state.forEach(s => { if(s===2) flags++; });
            this.updateCounter(this.totalBombs - flags);
        }
        
        updateCounter(num) {
            this.bombCountEl.innerText = num.toString().padStart(3, '0');
        }

        placeBombs(firstIdx) {
            let placed = 0;
            const safe = [firstIdx, ...this.getNeighbors(firstIdx)];
            while(placed < this.totalBombs) {
                const r = Math.floor(Math.random() * (this.rows * this.cols));
                if(!safe.includes(r) && this.grid[r] !== -1) {
                    this.grid[r] = -1;
                    placed++;
                }
            }
            for(let i=0; i<this.grid.length; i++) {
                if(this.grid[i] === -1) continue;
                let cnt = 0;
                this.getNeighbors(i).forEach(n => { if(this.grid[n] === -1) cnt++; });
                this.grid[i] = cnt;
            }
        }

        getNeighbors(idx) {
            const arr = [];
            const r = Math.floor(idx / this.cols);
            const c = idx % this.cols;
            for(let dr=-1; dr<=1; dr++) {
                for(let dc=-1; dc<=1; dc++) {
                    if(dr===0 && dc===0) continue;
                    const nr = r+dr, nc = c+dc;
                    if(nr>=0 && nr<this.rows && nc>=0 && nc<this.cols) arr.push(nr*this.cols + nc);
                }
            }
            return arr;
        }
        
        setMode(m) {
            this.mode = m;
            const digBtn = document.getElementById(`btn-dig-${this.id}`);
            const flagBtn = document.getElementById(`btn-flag-${this.id}`);
            if (m === 'dig') {
                digBtn.classList.add('selected');
                flagBtn.classList.remove('selected');
            } else {
                digBtn.classList.remove('selected');
                flagBtn.classList.add('selected');
            }
        }
    }
</script>
