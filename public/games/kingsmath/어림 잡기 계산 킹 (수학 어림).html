        function initLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            const savedLang = localStorage.getItem('kingsmath_lang');
            const browserLang = navigator.language.slice(0, 2);
            const supportedLangs = Object.keys(translations);

            if (langParam && supportedLangs.includes(langParam)) { currentLang = langParam; }
            else if (savedLang && supportedLangs.includes(savedLang)) { currentLang = savedLang; }
            else if (supportedLangs.includes(browserLang)) { currentLang = browserLang; }
            else { currentLang = 'en'; }

            applyLanguage(currentLang);
            updateHeaderLangUI(currentLang);
        }

        function updateHeaderLangUI(langCode) {
            const langObj = languages.find(l => l.code === langCode);
            if(langObj) {
                currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;
                currentLangSpan.textContent = langObj.name;
            }
        }

        function changeLanguage(langCode) {
            applyLanguage(langCode);
            updateHeaderLangUI(langCode);
            
            const url = new URL(window.location);
            url.searchParams.set('lang', langCode);
            window.history.pushState({}, '', url);
        }

        function applyLanguage(lang) {
            currentLang = lang;
            t = translations[lang];
            localStorage.setItem('kingsmath_lang', lang);
            document.documentElement.lang = lang;
            
            if (lang === 'ko') {
                document.body.style.fontFamily = "'Jua', 'Noto Sans SC', 'Noto Sans JP', sans-serif";
            } else {
                document.body.style.fontFamily = "'Noto Sans', Arial, sans-serif";
            }

            updateDOM();
            adjustFontSize();
            updateMeta();
            if(typeof draw === 'function' && gameState !== 'PLAYING') draw(); 
        }

        // 동적 폰트 조절 로직 (글자 길이에 따라 축소)
        function adjustFontSize() {
            const elements = document.querySelectorAll('.btn, h1');
            elements.forEach(el => {
                el.style.fontSize = ''; // 초기화
                let size = parseFloat(window.getComputedStyle(el).fontSize);
                while (el.scrollWidth > el.clientWidth && size > 12) {
                    size -= 1;
                    el.style.fontSize = size + 'px';
                }
            });
        }

            document.title = t.pageTitle;
            
            const domainLink = t.domain;
            document.querySelectorAll('.top-link').forEach(el => { el.innerText = t.topLink; el.href = domainLink; });

        // --- 모달 렌더링 로직 ---
        function renderLanguages(filterText = '') {
            grid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            const filteredLangs = languages.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                grid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                noResult.classList.add('hidden');
                noResult.classList.remove('flex');

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                    const stateClasses = isSelected 
                        ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                        : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;
                    btn.innerHTML = `
                        <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                            <img src="https://flagcdn.com/w40/${lang.country}.png" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col items-start">
                            <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                            <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                    `;
                    btn.addEventListener('click', () => {
                        if(window.Sound) Sound.play('click');
                        changeLanguage(lang.code);
                        closeModal();
                        showToast(lang.name, lang.code);
                        renderLanguages(searchInput.value);
                    });
                    grid.appendChild(btn);
                });
            }
        }

        function openModal() { modal.classList.add('active'); setTimeout(() => searchInput.focus(), 100); }
        function closeModal() { modal.classList.remove('active'); }
        
        function showToast(langName, langCode) {
            const toastMsg = toastTranslations[langCode] || toastTranslations['en'];
            document.getElementById('ui-toast').textContent = toastMsg;
            toastLangName.textContent = langName;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        triggerBtn.addEventListener('click', openModal);

        /**
         * 게임 로직 원본 그대로 유지 (일부 연동부만 수정)
         */
        const Sound = {
            ctx: null,
            init: function() {
                if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            },
            play: function(type) {
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'submit') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'finish') {
                    this.playTone(523.25, now, 0.4); this.playTone(659.25, now + 0.1, 0.4); this.playTone(783.99, now + 0.2, 0.8); 
                } else if (type === 'king') {
                    this.playTone(523.25, now, 0.15); this.playTone(659.25, now + 0.15, 0.15); this.playTone(783.99, now + 0.30, 0.15); 
                    this.playTone(1046.50, now + 0.45, 0.6); this.playTone(523.25, now + 0.45, 0.6);  
                } else if (type === 'tick') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                }
            },
            playTone: function(freq, time, duration) {
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine'; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, time); gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                osc.start(time); osc.stop(time + duration);
            }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        let gameState = 'MENU';
        let playerCount = 1;
        let gameMode = 'normal';
        let timeLeft = 20; 
        let lastTime = 0;
        let pulseTime = 0;
        let lastTickTime = 0;
        let gameLoopId = null;

        const colors = [ '#FF6B6B', '#4ECDC4', '#FFE66D', '#C7F464' ];
        let problem = { start: 0, end: 100, target: 37, targetText: "37", type: 'int' };
        let players = [];
        let isTouching = false; 

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            if(gameState !== 'PLAYING') draw();
        }
        window.addEventListener('resize', resize);
        
        // 초기 렌더링 세팅
        initLanguage();
        renderLanguages();
        resize();

        function goHomeConfirm() {
            const confirmMsg = currentLang === 'ko' ? "게임을 중단하고 처음 화면으로 돌아가시겠습니까?" : "Return to menu?";
            if(gameState === 'PLAYING') {
                if(confirm(confirmMsg)) resetToMenu();
            } else {
                resetToMenu();
            }
        }

        function resetToMenu() {
            gameState = 'MENU';
            document.getElementById('start-screen').classList.add('active');
            document.getElementById('end-screen').classList.remove('active');
            triggerContainer.style.display = 'block'; // 게임 종료/홈 이동 시 모달 UI 활성화
            draw();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // 전체화면 시 지체없이 초기화 적용 (요청사항 4)
        document.getElementById('btn-home').addEventListener('click', () => {
            if (document.fullscreenElement) {
                gameState = 'MENU';
                if(gameLoopId) cancelAnimationFrame(gameLoopId);
                triggerContainer.style.display = 'block';
                document.getElementById('start-screen').classList.add('active');
                document.getElementById('end-screen').classList.remove('active');
                if(window.Sound) Sound.play('click');
                draw();
            } else {
                location.reload();
            }
        });

        function selectPlayers(num) {
            Sound.init(); Sound.play('click');
            playerCount = num;
            updateButtons('#player-select', num - 1);
        }

        function selectMode(mode) {
            Sound.init(); Sound.play('click');
            gameMode = mode;
            const buttons = document.querySelectorAll('#mode-select .btn');
            buttons.forEach(btn => {
                if(btn.getAttribute('id') === `m-${mode}`) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });
        }

        function updateButtons(parentId, selectedIndex) {
            const buttons = document.querySelectorAll(`${parentId} .btn`);
            buttons.forEach((b, i) => {
                if(i === selectedIndex) b.classList.add('selected');
                else b.classList.remove('selected');
            });
        }

        function startGame() {
            Sound.init(); Sound.play('click');
            triggerContainer.style.display = 'none'; // 몰입을 위해 플레이 중 언어 선택기 숨김

            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('end-screen').classList.remove('active');
            
            players = [];
            for(let i=0; i<playerCount; i++) {
                players.push({
                    id: i, score: 0, currentPos: 0.5, submitted: false,
                    lastResult: null, color: colors[i % colors.length]
                });
            }

            generateProblem();
            timeLeft = 20;
            gameState = 'PLAYING';
            lastTime = performance.now();
            
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function generateProblem() {
            let mode = gameMode;
            if (mode === 'random') {
                const modes = ['normal', 'large', 'decimal', 'fraction'];
                mode = modes[Math.floor(Math.random() * modes.length)];
            }

            let start, end, target, targetText, type = 'int';

            if (mode === 'normal') {
                start = 0; end = 100; target = Math.floor(Math.random() * 98) + 1;
                targetText = target.toString(); type = 'int';
            } else if (mode === 'large') {
                let base = Math.floor(Math.random() * 5) + 1;
                start = base * 1000;
                let gap = (Math.floor(Math.random() * 4) + 1) * 1000;
                end = start + gap;
                target = Math.floor(Math.random() * (end - start - 100)) + start + 50;
                targetText = target.toLocaleString(); type = 'int';
            } else if (mode === 'decimal') {
                start = Math.floor(Math.random() * 10);
                let gap = Math.random() * 2 + 0.5;
                if (gap > 3) gap = 3;
                end = parseFloat((start + gap).toFixed(2));
                target = start + (Math.random() * (end - start) * 0.8) + (end-start)*0.1;
                target = parseFloat(target.toFixed(2));
                targetText = target.toFixed(2); type = 'float';
            } else if (mode === 'fraction') {
                let startInt = Math.floor(Math.random() * 5) + 1;
                let gap = Math.floor(Math.random() * 3) + 1;
                start = startInt; end = startInt + gap;
                let denom = Math.floor(Math.random() * 7) + 2;
                let minNum = start * denom;
                let maxNum = end * denom;
                let targetNum = Math.floor(Math.random() * (maxNum - minNum - 1)) + minNum + 1;
                target = targetNum / denom;
                
                let whole = Math.floor(targetNum / denom);
                let rem = targetNum % denom;
                const gcd = (a, b) => b ? gcd(b, a%b) : a;
                let div = gcd(rem, denom);
                rem /= div; let finalDenom = denom / div;

                if (rem === 0) targetText = whole.toString();
                else if (whole === 0) targetText = `${rem}/${finalDenom}`;
                else {
                    if (currentLang === 'ko') targetText = `${whole}와 ${rem}/${finalDenom}`;
                    else targetText = `${whole}  ${rem}/${finalDenom}`;
                }
                type = 'fraction';
            }
            problem = { start, end, target, targetText, type };
        }

        function finishGame() {
            triggerContainer.style.display = 'block'; // 종료 시 모달 선택기 다시 표시
            const range = problem.end - problem.start;
            const targetRatio = (problem.target - problem.start) / range;
            let hasKing = false; 

            players.forEach(p => {
                let diffRatio = Math.abs(p.currentPos - targetRatio);
                let rank = t.canvas.rankBad; 
                
                let userVal = problem.start + (range * p.currentPos);
                let userValText = ""; let diffVal = Math.abs(userVal - problem.target); let diffText = "";

                if (problem.type === 'int') {
                    let userValInt = Math.round(userVal); let diffValInt = Math.round(diffVal);
                    userValText = userValInt.toLocaleString(); diffText = diffValInt.toLocaleString();
                } else {
                    userValText = userVal.toFixed(2); diffText = diffVal.toFixed(2);
                }

                if (diffRatio < 0.03) { rank = t.canvas.rankKing; hasKing = true; }
                else if (diffRatio < 0.08) rank = t.canvas.rankGood;
                else if (diffRatio < 0.15) rank = t.canvas.rankOkay;
                
                p.lastResult = { rank, targetRatio, userValText, diffText };
            });

            if (hasKing) Sound.play('king');
            else Sound.play('finish');

            gameState = 'FINISHED'; draw();

            const screen = document.getElementById('end-screen');
            setTimeout(() => { screen.classList.add('active'); }, 1500);
        }

        function handleInput(x, y, type) {
            if (gameState !== 'PLAYING') return;

            const colWidth = width / playerCount;
            const playerIdx = Math.floor(x / colWidth);

            if (playerIdx >= 0 && playerIdx < playerCount) {
                const p = players[playerIdx];
                if (p.submitted) return; 

                const btnY = height * 0.88; const btnH = height * 0.08;
                const btnMargin = colWidth * 0.1; const btnW = colWidth * 0.8;
                const btnX = (playerIdx * colWidth) + btnMargin;

                if (type === 'click' && x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
                    p.submitted = true;
                    Sound.play('submit');
                    if (players.every(pl => pl.submitted)) { finishGame(); }
                    return;
                }

                const laneX = playerIdx * colWidth;
                const margin = colWidth * 0.1; 
                const lineWidth = colWidth * 0.8;
                
                let relativeX = x - laneX - margin;
                let pos = relativeX / lineWidth;

                if (pos < 0) pos = 0;
                if (pos > 1) pos = 1;
                p.currentPos = pos;
            }
        }

        canvas.addEventListener('mousedown', e => { isTouching = true; handleInput(e.clientX, e.clientY, 'click'); });
        canvas.addEventListener('mousemove', e => { if(isTouching || (e.buttons === 1)) handleInput(e.clientX, e.clientY, 'move'); });
        canvas.addEventListener('mouseup', () => isTouching = false);
        canvas.addEventListener('mouseleave', () => isTouching = false);
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault(); 
            for (let i = 0; i < e.changedTouches.length; i++) { handleInput(e.changedTouches[i].clientX, e.changedTouches[i].clientY, 'click'); }
        }, {passive: false});

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) { handleInput(e.changedTouches[i].clientX, e.changedTouches[i].clientY, 'move'); }
        }, {passive: false});

        function drawFraction(ctx, x, y, text, mainFontSize, color) {
            ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const gameFont = currentLang === 'ko' ? '"Jua"' : 'sans-serif';
            
            if (!text.includes('/')) {
                ctx.font = `bold ${mainFontSize}px ${gameFont}`;
                ctx.fillText(text, x, y); return;
            }

            let whole = ""; let numerator = ""; let denominator = "";
            
            if (text.includes('와')) {
                const parts = text.split('와'); whole = parts[0].trim();
                const fracParts = parts[1].trim().split('/');
                numerator = fracParts[0]; denominator = fracParts[1];
            } else if (text.includes('  ')) { 
                const parts = text.split('  '); whole = parts[0].trim();
                const fracParts = parts[1].trim().split('/');
                numerator = fracParts[0]; denominator = fracParts[1];
            } else {
                const parts = text.split('/');
                numerator = parts[0]; denominator = parts[1];
            }

            const wholeFontSize = mainFontSize; const fracFontSize = mainFontSize * 0.7;
            
            ctx.font = `bold ${wholeFontSize}px ${gameFont}`;
            const wholeWidth = whole ? ctx.measureText(whole).width : 0;
            
            ctx.font = `bold ${fracFontSize}px ${gameFont}`;
            const numWidth = ctx.measureText(numerator).width;
            const denWidth = ctx.measureText(denominator).width;
            const fracWidth = Math.max(numWidth, denWidth);

            const spacing = 10;
            const totalWidth = wholeWidth + (whole ? spacing : 0) + fracWidth;
            let currentX = x - totalWidth / 2;

            if (whole) {
                ctx.font = `bold ${wholeFontSize}px ${gameFont}`;
                ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.fillText(whole, currentX, y); currentX += wholeWidth + spacing;
            }

            const midX = currentX + fracWidth / 2;
            ctx.beginPath(); ctx.moveTo(currentX, y); ctx.lineTo(currentX + fracWidth, y);
            ctx.lineWidth = Math.max(2, mainFontSize * 0.08); ctx.strokeStyle = color; ctx.stroke();
            ctx.font = `bold ${fracFontSize}px ${gameFont}`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(numerator, midX, y - 5);
            ctx.textBaseline = 'top'; ctx.fillText(denominator, midX, y + 5);
        }

        function draw() {
            ctx.fillStyle = '#1a202c';
            ctx.fillRect(0, 0, width, height);
            if (gameState === 'MENU' && players.length === 0) return;

            const colWidth = width / playerCount;
            const gameFont = currentLang === 'ko' ? '"Jua"' : 'sans-serif';

            players.forEach((p, idx) => {
                const x = idx * colWidth; const y = 0; const w = colWidth; const h = height;
                
                if (idx % 2 === 1) { ctx.fillStyle = 'rgba(255,255,255,0.02)'; ctx.fillRect(x, y, w, h); }
                if (idx < playerCount - 1) {
                    ctx.strokeStyle = '#4a5568'; ctx.lineWidth = 2; ctx.beginPath();
                    ctx.moveTo(x + w, 0); ctx.lineTo(x + w, h); ctx.stroke();
                }

                const margin = w * 0.1; const lineWidth = w * 0.8;
                const lineY = h * 0.75; const missionY = h * 0.55; const resultY = h * 0.25;

                ctx.fillStyle = '#e2e8f0'; ctx.font = `bold 24px ${gameFont}`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(t.canvas.mission, x + w/2, missionY - 35);
                
                if (problem.type === 'fraction') {
                      drawFraction(ctx, x + w/2, missionY + 20, problem.targetText, 40, '#4fd1c5');
                } else {
                    ctx.fillStyle = '#4fd1c5'; ctx.font = `bold 40px ${gameFont}`;
                    ctx.shadowColor = "#4fd1c5"; ctx.shadowBlur = 10; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(problem.targetText, x + w/2, missionY + 20); ctx.shadowBlur = 0;
                }

                ctx.strokeStyle = '#a0aec0'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
                ctx.moveTo(x + margin, lineY); ctx.lineTo(x + margin + lineWidth, lineY); ctx.stroke();

                drawTick(ctx, x + margin, lineY, problem.start);
                drawTick(ctx, x + margin + lineWidth, lineY, problem.end);

                let arrowScale = 1.0; 
                const arrowX = x + margin + (lineWidth * p.currentPos);
                const arrowColor = p.submitted ? '#718096' : p.color;
                
                drawArrow(ctx, arrowX, lineY - 2, arrowColor, arrowScale);
                
                if (p.submitted && gameState === 'PLAYING') {
                    ctx.fillStyle = '#cbd5e0'; ctx.font = `bold 20px ${gameFont}`; ctx.textBaseline = 'alphabetic';
                    ctx.fillText(t.canvas.submitted, x + w/2, lineY - 60);
                }

                if (gameState === 'PLAYING' && !p.submitted) {
                    const btnY = h * 0.88; const btnH = h * 0.08; const btnX = x + margin;
                    
                    ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 10;
                    roundRect(ctx, btnX, btnY, lineWidth, btnH, 15); ctx.fill(); ctx.shadowBlur = 0;

                    ctx.fillStyle = '#1a202c'; ctx.font = `bold 24px ${gameFont}`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(t.canvas.submit, x + w/2, btnY + btnH/2);
                }

                if (gameState === 'FINISHED' && p.lastResult) {
                    const correctX = x + margin + (lineWidth * p.lastResult.targetRatio);
                    drawFlag(ctx, correctX, lineY, '#718096');

                    ctx.fillStyle = p.color;
                    ctx.font = `bold 36px ${gameFont}`; 
                    ctx.shadowColor = p.color; ctx.shadowBlur = 20; ctx.textBaseline = 'alphabetic';
                    ctx.fillText(p.lastResult.rank, x + w/2, resultY); ctx.shadowBlur = 0;

                    ctx.fillStyle = '#fff'; ctx.font = `18px ${gameFont}`;
                    ctx.fillText(`${t.canvas.myChoice} ${p.lastResult.userValText}`, x + w/2, resultY + 50);
                    
                    ctx.fillStyle = '#fbbf24';
                    ctx.fillText(`(${t.canvas.diff} ${p.lastResult.diffText})`, x + w/2, resultY + 80);
                }
            });

            if (gameState === 'PLAYING') {
                ctx.font = `bold 80px ${gameFont}`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                ctx.fillStyle = timeLeft <= 5 ? '#fc8181' : '#63b3ed'; 
                ctx.strokeStyle = '#1a202c'; ctx.lineWidth = 4;
                ctx.strokeText(Math.ceil(timeLeft), width/2, 10);
                ctx.fillText(Math.ceil(timeLeft), width/2, 10);
            }
        }

        function drawTick(ctx, x, y, label) {
            ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10);
            ctx.strokeStyle = '#cbd5e0'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#cbd5e0'; 
            ctx.font = currentLang === 'ko' ? '16px "Jua"' : '16px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            ctx.fillText(label, x, y + 15);
        }

        function drawArrow(ctx, x, y, color, scale) {
            ctx.save(); ctx.translate(x, y - 2); ctx.scale(scale, scale);
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-15, -25); ctx.lineTo(15, -25); ctx.closePath();
            ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 15; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.shadowBlur = 0; ctx.stroke();
            ctx.restore();
        }

        function drawFlag(ctx, x, y, color) {
            ctx.save(); ctx.translate(x, y);
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -50);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.setLineDash([4, 2]); ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(20, -40); ctx.lineTo(0, -30);
            ctx.fillStyle = '#f56565'; ctx.fill();
            ctx.fillStyle = '#fff'; 
            ctx.font = currentLang === 'ko' ? '14px "Jua"' : '14px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
            ctx.fillText(t.canvas.targetCorrect, 0, -65);
            ctx.restore();
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath(); ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius); ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height); ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius); ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y); ctx.closePath();
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            const dt = timestamp - lastTime;
            lastTime = timestamp; pulseTime += dt;
            timeLeft -= dt / 1000;

            if (timeLeft <= 5 && timeLeft > 0) {
                if (Math.floor(timeLeft) !== lastTickTime) {
                    lastTickTime = Math.floor(timeLeft);
                    Sound.play('tick');
                }
            }

            if (timeLeft <= 0) {
                timeLeft = 0;
                finishGame(); return;
            }

            draw();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

    </script>
