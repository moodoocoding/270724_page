<!DOCTYPE html>
<html lang="ko">
<head>
   
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5YW0T2C109');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16성격 검사 킹 / 16 Personality Test King</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* 공통 스타일 (Dark Mode 기본) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { background-color: #121212; color: #E0E0E0; padding: 20px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; position: relative; }
        
        /* 상단 헤더 & 언어선택 & 톱니바퀴 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        h1 { color: #FFFFFF; font-weight: 800; font-size: 1.8em; margin: 0; }
        
        .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .lang-select-wrapper { display: flex; flex-direction: column; font-size: 0.8em; color: #A0A0A0; }
        .lang-select { background: #1E1E1E; color: #FFF; border: 1px solid #444; padding: 6px 10px; border-radius: 6px; outline: none; font-size: 1rem; cursor: pointer; }
        .lang-select:focus { border-color: #3B82F6; }

        .teacher-mode-btn { background: none; border: none; font-size: 1.8em; cursor: pointer; color: #888; transition: transform 0.3s, color 0.3s; margin-left: 5px; }
        .teacher-mode-btn:hover { color: #3B82F6; transform: rotate(90deg); }

        .lang2-text { color: #FCD34D; font-size: 1em; display: block; margin-top: 6px; opacity: 0.9; font-weight: 500; }
        .btn-lang2-text { color: #FCD34D; font-size: 0.85em; display: block; margin-top: 2px; font-weight: normal; }

        /* 문항 버튼 네비게이션 */
        #button-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 10px; scrollbar-width: thin; scrollbar-color: #333 #121212;    justify-content: center; }
        .question-btn { background-color: #1E1E1E; border: 1px solid #333; color: #A0A0A0; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; font-weight: 600; }
        .question-btn:hover { background-color: #2C2C2C; color: #FFF; }
        .question-btn.active { background-color: #3B82F6; color: #FFF; border-color: #3B82F6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .question-btn.completed { background-color: #10B981; color: #FFF; border-color: #059669; }
        .question-btn.active.completed { box-shadow: 0 0 10px rgba(16, 185, 129, 0.6); border-color: #FFF; }

        /* 전체보기 전용 보라색 버튼 */
        #btn-view-all { background-color: #8B5CF6; color: white; border-color: #8B5CF6; }
        #btn-view-all:hover { background-color: #7C3AED; }
        #btn-view-all.active { box-shadow: 0 0 12px rgba(139, 92, 246, 0.6); border-color: #FFF; }

        /* 문항 표시부 */
        #question-display { background: linear-gradient(145deg, #1A1A1A, #252525); padding: 40px 30px; border-radius: 12px; margin-bottom: 10px; font-size: 1.4em; font-weight: bold; text-align: center; color: #FFF; border: 1px solid #333; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; word-break: keep-all; line-height: 1.5; }
        
        /* 평균바 스타일 */
        #average-display { text-align: center; margin-bottom: 20px; min-height: 45px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .avg-bar-wrapper { width: 100%; max-width: 400px; margin: 15px auto 5px auto; position: relative; }
        .avg-bar-bg { height: 12px; background: linear-gradient(to right, #EF4444, #D946EF, #A855F7, #6366F1, #3B82F6); border-radius: 10px; position: relative; border: 1px solid #444; }
        .avg-marker { position: absolute; top: -6px; bottom: -6px; width: 4px; background: #FFF; box-shadow: 0 0 5px rgba(0,0,0,0.8); border-radius: 2px; transition: left 0.3s ease; }
        .avg-marker-label { position: absolute; top: -25px; transform: translateX(-50%); background: #FFF; color: #000; font-size: 0.8em; padding: 2px 6px; border-radius: 4px; font-weight: bold; white-space: nowrap; transition: left 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .avg-marker-label::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); border-width: 4px 4px 0; border-style: solid; border-color: #FFF transparent transparent transparent; }
        .avg-text-info { font-size: 0.9em; color: #10B981; font-weight: bold; margin-top: 8px; }

        /* 학생 리스트 Grid */
        #student-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 12px; }
        .student-card { background-color: #1E1E1E; border: 1px solid #2A2A2A; border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .student-card:hover { transform: translateY(-3px); background-color: #252525; border-color: #444; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .student-avatar { width: 50px; height: 50px; border-radius: 50%; background-color: #2C2C2C; margin-bottom: 8px; object-fit: cover; border: 2px solid #333; }
        .student-name { font-weight: bold; font-size: 1.05em; color: #FFF; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .status-badge { font-size: 0.75em; font-weight: bold; padding: 4px 6px; border-radius: 10px; background-color: #333; color: #888; }
        .status-badge.completed { background-color: #10B981; color: #FFF; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }

        /* ---------------- 양자택일형 색상 버튼 스타일 ---------------- */
        .balance-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 15px; margin: 25px 0; }
        .balance-text { flex: 1; text-align: center; font-size: 1.2em; word-break: keep-all; line-height: 1.4; font-weight: bold; }
        .balance-text.left-text { text-align: right; color: #FCA5A5; }
        .balance-text.right-text { text-align: left; color: #93C5FD; }
        
        .scale-group { flex: 0 0 auto; display: flex; gap: 10px; justify-content: center; align-items: center; }
        .scale-btn { width: 35px; height: 35px; border-radius: 50%; border: 3px solid #222; cursor: pointer; transition: all 0.2s ease; outline: none; padding: 0; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        .scale-btn:hover { transform: scale(1.1); border-color: #FFF; }
        .scale-btn.selected { border-color: #FFF; box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); transform: scale(1.15); }

        /* 스펙트럼 색상 정의 */
        .scale-color-1 { background-color: #EF4444; } /* 빨강 */
        .scale-color-2 { background-color: #D946EF; } /* 자주 */
        .scale-color-3 { background-color: #A855F7; } /* 보라 */
        .scale-color-4 { background-color: #6366F1; } /* 남색 */
        .scale-color-5 { background-color: #3B82F6; } /* 파랑 */

        /* 모바일 최적화 */
        @media (max-width: 650px) {
            .balance-row { flex-direction: column; margin: 15px 0; gap: 12px; }
            .balance-text.left-text, .balance-text.right-text { text-align: center; font-size: 1.1em; }
            .scale-btn { width: 30px; height: 30px; }
        }

        /* ---------------- MBTI 전체 보기 뷰 (5단계 구조) ---------------- */
        #mbti-view { display: none; margin-top: 10px; animation: fadeIn 0.4s ease; }
        .mbti-nav { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .mbti-nav-btn { background: #1E1E1E; border: 2px solid #444; color: #A0A0A0; font-size: 1.1em; font-weight: bold; padding: 10px 20px; border-radius: 30px; cursor: pointer; transition: 0.3s; }
        .mbti-nav-btn:hover { border-color: #8B5CF6; color: #FFF; }
        .mbti-nav-btn.active { background: #8B5CF6; color: #FFF; border-color: #8B5CF6; box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); }
        
        .mbti-desc-container { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 20px; flex-wrap: wrap; }
        .mbti-desc-box { flex: 1; min-width: 250px; background: #252525; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 1.05em; color: #FCD34D; word-break: keep-all; border: 1px solid #444; }

        .mbti-arena { display: flex; gap: 10px; width: 100%; overflow-x: auto; padding-bottom: 15px; flex-wrap: nowrap; scrollbar-width: thin; }
        .mbti-col { flex: 1 0 120px; background: #1A1A1A; border: 1px solid #333; border-radius: 12px; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; }
        .mbti-col-header { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #333; width: 100%; text-align: center; }
        .mbti-col-students { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; align-content: flex-start; flex-grow: 1; min-height: 150px; }

        .col-1-header { color: #EF4444; border-bottom-color: #EF4444; }
        .col-2-header { color: #FCA5A5; border-bottom-color: #FCA5A5; }
        .col-3-header { color: #A855F7; border-bottom-color: #A855F7; }
        .col-4-header { color: #93C5FD; border-bottom-color: #93C5FD; }
        .col-5-header { color: #3B82F6; border-bottom-color: #3B82F6; }
        
        .mbti-st-card { background: #252525; border: 1px solid #444; border-radius: 8px; padding: 8px; width: 80px; text-align: center; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .mbti-st-card img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #8B5CF6; margin-bottom: 5px; }
        .mbti-st-type { color: #8B5CF6; font-weight: 900; font-size: 0.9em; margin-top: 3px; background: rgba(139, 92, 246, 0.1); border-radius: 5px; padding: 2px 0; }

        @keyframes popIn { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .mbti-result-big { text-align: center; font-size: 4em; font-weight: 900; letter-spacing: 5px; background: -webkit-linear-gradient(#8B5CF6, #3B82F6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 20px 0; }
        
        /* ---------------- 기존 모달/버튼 스타일 ---------------- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 1000; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-content { background-color: #1E1E1E; width: 95%; max-width: 800px; max-height: 90vh; overflow-y: auto; border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #333; position: relative; transform: translateY(20px); transition: transform 0.3s ease; }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-content.large { max-width: 900px; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.8em; color: #888; cursor: pointer; border: none; background: none; line-height: 1; }
        .close-btn:hover { color: #FFF; }

        .btn-block { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-primary { background-color: #3B82F6; color: white; }
        .btn-primary:hover { background-color: #2563EB; }
        .btn-success { background-color: #10B981; color: white; }
        .btn-success:hover { background-color: #059669; }
        .btn-warning { background-color: #F59E0B; color: white; }
        .btn-warning:hover { background-color: #D97706; }
        .btn-danger { background-color: #EF4444; color: white; }
        .btn-danger:hover { background-color: #DC2626; }
        .btn-dark { background-color: #333; color: white; }
        .btn-dark:hover { background-color: #444; }

        .tab-container { display: flex; border-bottom: 1px solid #333; margin-bottom: 20px; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: none; border: none; color: #888; padding: 10px 15px; font-size: 1.1em; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; transition: 0.2s; white-space: nowrap; }
        .tab-btn.active { color: #FFF; border-bottom-color: #3B82F6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group input[type="text"], .input-group select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: #FFF; font-size: 1em; min-width: 200px; }
        .list-group { list-style: none; max-height: 300px; overflow-y: auto; padding-right: 5px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #252525; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #333; }
        
        .backup-card { background: #252525; border: 1px solid #333; padding: 20px; border-radius: 10px; margin-bottom: 15px; }
        
        table.result-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #FFF; color: #000; border-radius: 8px; overflow: hidden; font-size: 0.95em; }
        table.result-table th, table.result-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        table.result-table th { background-color: #f4f7f6; font-weight: bold; }
        table.result-table td.text-left { text-align: left; }
        
        #ind-detail-table-wrapper { margin-top: 25px; max-height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; }
        #ind-detail-table-wrapper table { margin-top: 0; border-radius: 0; }
        #ind-detail-table-wrapper th { position: sticky; top: 0; z-index: 10; border-top: none; }
        
        .mt-2 { margin-top: 15px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="ui-title">👑 16성격 검사 킹</h1>
        <div class="header-controls">
            <div class="lang-select-wrapper">
                <label for="lang1" id="ui-label-lang1">1언어 (기본)</label>
                <select id="lang1" class="lang-select" onchange="changeLanguage()"></select>
            </div>
            <div class="lang-select-wrapper">
                <label for="lang2" id="ui-label-lang2">2언어 (다문화용)</label>
                <select id="lang2" class="lang-select" onchange="changeLanguage()">
                    <option value="none" id="ui-opt-none">선택 안함</option>
                </select>
            </div>
            <button class="teacher-mode-btn" onclick="openTeacherModal()" title="Settings">⚙️</button>
        </div>
    </div>

    <div id="button-container"></div>

    <div id="normal-view-wrapper">
        <div id="question-display">
            <div id="qd-lang1"></div>
            <div id="qd-lang2" class="lang2-text" style="font-size: 1em; margin-top:15px; text-align:center;"></div>
        </div>
        <div id="average-display"></div>
        <div id="student-list"></div>
    </div>

    <div id="mbti-view">
        <div class="mbti-nav">
            <button class="mbti-nav-btn active" onclick="renderMBTIArena('EI')">E vs I (에너지 방향)</button>
            <button class="mbti-nav-btn" onclick="renderMBTIArena('SN')">S vs N (인식 방식)</button>
            <button class="mbti-nav-btn" onclick="renderMBTIArena('TF')">T vs F (판단 방식)</button>
            <button class="mbti-nav-btn" onclick="renderMBTIArena('JP')">J vs P (생활 양식)</button>
        </div>
        
        <div class="mbti-desc-container">
            <div class="mbti-desc-box" id="mbti-desc-left" style="border-left: 4px solid #EF4444;"></div>
            <div class="mbti-desc-box" id="mbti-desc-right" style="border-right: 4px solid #3B82F6;"></div>
        </div>

        <div class="mbti-arena">
            <div class="mbti-col">
                <div class="mbti-col-header col-1-header" id="arena-col-1-title">매우 E</div>
                <div class="mbti-col-students" id="arena-col-1-students"></div>
            </div>
            <div class="mbti-col">
                <div class="mbti-col-header col-2-header" id="arena-col-2-title">조금 E</div>
                <div class="mbti-col-students" id="arena-col-2-students"></div>
            </div>
            <div class="mbti-col">
                <div class="mbti-col-header col-3-header" id="arena-col-3-title">반반</div>
                <div class="mbti-col-students" id="arena-col-3-students"></div>
            </div>
            <div class="mbti-col">
                <div class="mbti-col-header col-4-header" id="arena-col-4-title">조금 I</div>
                <div class="mbti-col-students" id="arena-col-4-students"></div>
            </div>
            <div class="mbti-col">
                <div class="mbti-col-header col-5-header" id="arena-col-5-title">매우 I</div>
                <div class="mbti-col-students" id="arena-col-5-students"></div>
            </div>
        </div>

        <div id="mbti-disclaimer" style="margin-top: 30px; padding: 20px; text-align: center; color: #A0A0A0; font-size: 0.9em; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid #333; word-break: keep-all; line-height: 1.6;">
        </div>
    </div>

    <div id="footer-warning" style="text-align: center; color: #888; font-size: 0.9em; margin-top: 40px; padding-top: 20px; border-top: 1px dashed #333; line-height: 1.6;">
    </div>

    <div style="margin-top: 50px; margin-bottom: 100px; text-align: center;">
        <a href="/" id="btn-other-games" class="btn-block" style="text-decoration: none; background: linear-gradient(135deg, #6366F1, #A855F7); color: white; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);">
            <span id="ui-other-games-text" style="font-size: 1.2em;">다른 게임 고르기</span>
            <span style="font-size: 0.8em; opacity: 0.8;">kingsmath.com</span>
        </a>
    </div>
</div>

<div id="student-input-modal" class="modal-overlay">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal('student-input-modal')">&times;</button>
        <h2 id="modal-student-name" style="color: #3B82F6; text-align: center; margin-bottom: 20px; font-size: 1.5em;"></h2>
        
        <div id="single-input-view">
            <div style="text-align:center; color:#A0A0A0; font-size:0.9em; margin-bottom:10px;"><span id="ui-mq-num"></span></div>
            
            <div class="balance-row">
                <div class="balance-text left-text">
                    <div id="mq-left-lang1"></div>
                    <div id="mq-left-lang2" class="lang2-text"></div>
                </div>
                <div class="scale-group">
                    <button class="scale-btn scale-color-1" data-score="1" onclick="selectScore(1)" title="매우 왼쪽"></button>
                    <button class="scale-btn scale-color-2" data-score="2" onclick="selectScore(2)" title="조금 왼쪽"></button>
                    <button class="scale-btn scale-color-3" data-score="3" onclick="selectScore(3)" title="가운데"></button>
                    <button class="scale-btn scale-color-4" data-score="4" onclick="selectScore(4)" title="조금 오른쪽"></button>
                    <button class="scale-btn scale-color-5" data-score="5" onclick="selectScore(5)" title="매우 오른쪽"></button>
                </div>
                <div class="balance-text right-text">
                    <div id="mq-right-lang1"></div>
                    <div id="mq-right-lang2" class="lang2-text"></div>
                </div>
            </div>
            
            <button class="btn-block btn-success" onclick="saveSingleData()">
                <span id="ui-btn-save">저장 후 닫기</span>
                <span id="ui-btn-save-l2" class="btn-lang2-text"></span>
            </button>
            <hr style="border-color: #333; margin: 20px 0;">
            <button class="btn-block btn-dark" onclick="toggleBulkInputView()">
                <span id="ui-btn-batch">이 학생 12문항 일괄 입력하기 ➡️</span>
                <span id="ui-btn-batch-l2" class="btn-lang2-text"></span>
            </button>
        </div>

        <div id="bulk-input-view" style="display: none;">
            <p style="text-align: center; color: #A0A0A0; margin-bottom: 15px;">
                <span id="ui-msg-score">어느 쪽 성향에 더 가까운지 색깔 버튼을 선택하세요.</span><br>
                <span id="ui-msg-score-l2" class="lang2-text"></span>
            </p>
            <div id="bulk-questions-container" style="max-height: 55vh; overflow-y: auto; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 15px; background: #121212; overflow-x: hidden;">
            </div>
            <div style="display: flex; gap: 10px;">

    function initLanguages() {
        const sel1 = document.getElementById('lang1');
        const sel2 = document.getElementById('lang2');
        sel1.innerHTML = "";
        for (const [code, data] of Object.entries(dict)) {
            sel1.add(new Option(data.name, code));
            sel2.add(new Option(data.name, code));
        }
        sel1.value = 'ko';
        sel2.value = 'none';
    }

    function changeLanguage() {
        currentLang1 = document.getElementById('lang1').value;
        currentLang2 = document.getElementById('lang2').value;
        updateGlobalUI();
        
        if(isViewAllMode) {
            renderMBTIArena(document.querySelector('.mbti-nav-btn.active').innerText.substring(0,2).replace(" ",""));
            document.querySelector('.mbti-nav-btn.active').click();
        } else {
            selectQuestion(currentQuestionId);
            renderStudents();
            updateAverageDisplay(currentQuestionId);
        }
        
        if(document.getElementById('student-input-modal').classList.contains('show')) updateModalUI();
        updateStudentSelectbox();
        renderIndividualResult(); 
        renderAllResultTable();
    }

    function getQText(lang, qId) { return dict[lang].q[qId]; }
    function getUIText(lang, key) { return dict[lang].ui[key]; }
    function getDescText(lang, letter) { return dict[lang].desc[letter]; }

    function loadFromCache() {
        const savedStudents = localStorage.getItem('mbtiStudents');
        const savedData = localStorage.getItem('mbtiSurveyData');
        students = savedStudents ? JSON.parse(savedStudents) : [];
        surveyData = savedData ? JSON.parse(savedData) : {};
    }

    function saveToCache() {
        localStorage.setItem('mbtiStudents', JSON.stringify(students));
        localStorage.setItem('mbtiSurveyData', JSON.stringify(surveyData));
    }

    function renderButtons() {
        const container = document.getElementById("button-container");
        container.innerHTML = "";
        for(let i = 1; i <= TOTAL_QUESTIONS; i++) {
            const btn = document.createElement("button");
            btn.className = "question-btn";
            btn.id = "btn-" + i;
            btn.innerText = "Q " + i;
            if (students.length > 0) {
                const allAnswered = students.every(st => surveyData[st] && surveyData[st][i]);
                if (allAnswered) btn.classList.add('completed');
            }
            btn.onclick = () => selectQuestion(i);
            container.appendChild(btn);
        }
        
        const viewAllBtn = document.createElement("button");
        viewAllBtn.className = "question-btn";
        viewAllBtn.id = "btn-view-all";
        viewAllBtn.innerText = "🌟 " + (currentLang1 === 'ko' ? "전체 보기" : "View All");
        viewAllBtn.onclick = () => showMBTIView();
        container.appendChild(viewAllBtn);

        if(isViewAllMode) {
            document.getElementById("btn-view-all").classList.add('active');
        } else {
            const activeBtn = document.getElementById("btn-" + currentQuestionId);
            if(activeBtn) activeBtn.classList.add('active');
        }
    }

    function selectQuestion(id) {
        isViewAllMode = false;
        currentQuestionId = id;
        document.getElementById("normal-view-wrapper").style.display = "block";
        document.getElementById("mbti-view").style.display = "none";
        
        document.querySelectorAll('.question-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById("btn-" + id);
        if(btn) btn.classList.add('active');
        
        const qTexts = getQText(currentLang1, id);
        document.getElementById("qd-lang1").innerHTML = `<span style="color:#A0A0A0; font-size:0.6em; vertical-align:super; margin-right:8px;">${id}.</span> <span style="color:#FCA5A5;">${qTexts[0]}</span> <span style="color:#888; font-size:0.8em; margin: 0 15px;">VS</span> <span style="color:#93C5FD;">${qTexts[1]}</span>`;
        
        const qdLang2 = document.getElementById("qd-lang2");
        if(currentLang2 !== 'none' && currentLang2 !== currentLang1) {
            const qTexts2 = getQText(currentLang2, id);
            qdLang2.innerHTML = `<span style="color:#FCA5A5;">${qTexts2[0]}</span> <span style="color:#888; margin: 0 10px;">vs</span> <span style="color:#93C5FD;">${qTexts2[1]}</span>`;
            qdLang2.style.display = 'block';
        } else {
            qdLang2.style.display = 'none';
        }

        renderStudents();
        updateAverageDisplay(id);
    }

    function getAvatarUrl(seedName) {
        return `https://api.dicebear.com/9.x/thumbs/svg?seed=${encodeURIComponent(seedName)}&backgroundColor=transparent`;
    }

    function renderStudents() {
        const container = document.getElementById("student-list");
        container.innerHTML = ""; 
        students.forEach(student => {
            const card = document.createElement("div");
            card.className = "student-card";
            card.onclick = () => openStudentModal(student);

            const hasAnswered = surveyData[student] && surveyData[student][currentQuestionId];
            const isAllCompleted = surveyData[student] && Object.keys(surveyData[student]).length === TOTAL_QUESTIONS;

            let badgeText = getUIText(currentLang1, 'wait'); let badgeClass = "status-badge";
            if (isAllCompleted) { badgeText = getUIText(currentLang1, 'completed'); badgeClass = "status-badge completed"; } 
            else if (hasAnswered) { badgeText = getUIText(currentLang1, 'entered'); badgeClass = "status-badge completed"; }

            card.innerHTML = `<img src="${getAvatarUrl(student)}" alt="avatar" class="student-avatar" loading="lazy">
                <div class="student-name" title="${student}">${student}</div>
                <div class="${badgeClass}">${badgeText}</div>`;
            container.appendChild(card);
        });
    }

    function updateAverageDisplay(questionId) {
        const avgContainer = document.getElementById("average-display");
        const ui = dict[currentLang1].ui;
        let sum = 0, count = 0;
        
        students.forEach(student => {
            if (surveyData[student] && surveyData[student][questionId]) {
                sum += parseInt(surveyData[student][questionId]);
                count++;
            }
        });
        
        if (students.length === 0) {
            avgContainer.innerText = ui.noData;
        } else if (count === students.length) {
            const avg = sum / count;
            const percent = ((avg - 1) / 4) * 100;
            
            avgContainer.innerHTML = `
                <div class="avg-bar-wrapper">
                    <div class="avg-bar-bg">
                        <div class="avg-marker" style="left: ${percent}%;"></div>
                        <div class="avg-marker-label" style="left: ${percent}%;">${avg.toFixed(2)}</div>
                    </div>
                </div>
                <div class="avg-text-info">${ui.completed} (${ui.avgPrefix} ${avg.toFixed(2)})</div>
            `;
        } else {
            let msg = currentLang1 === 'ko' ?
                `현재 <strong style="color:#FFF;">${count} / ${students.length}</strong> 명 참여 완료<br><span style="font-size: 0.8em; color: #888; font-weight: normal;">(우리 반 학생이 모두 참여하면 평균이 표시됩니다.)</span>` :
                `<strong style="color:#FFF;">${count} / ${students.length}</strong> ${ui.entered}<br><span style="font-size: 0.8em; color: #888; font-weight: normal;">(Average will be shown when everyone completes it.)</span>`;
            avgContainer.innerHTML = `<div style="color:#A0A0A0; font-size:0.95em; margin-top:10px; text-align: center;">${msg}</div>`;
        }
    }

    function calculateMBTI(dataObj) {
        if(!dataObj || Object.keys(dataObj).length < TOTAL_QUESTIONS) return null;
        let type = "";
        let sumEI = parseInt(dataObj[1]) + parseInt(dataObj[5]) + parseInt(dataObj[9]);
        type += (sumEI / 3 > 3.0) ? "I" : "E"; 
        let sumSN = parseInt(dataObj[2]) + parseInt(dataObj[6]) + parseInt(dataObj[10]);
        type += (sumSN / 3 > 3.0) ? "N" : "S";
        let sumTF = parseInt(dataObj[3]) + parseInt(dataObj[7]) + parseInt(dataObj[11]);
        type += (sumTF / 3 > 3.0) ? "F" : "T";
        let sumJP = parseInt(dataObj[4]) + parseInt(dataObj[8]) + parseInt(dataObj[12]);
        type += (sumJP / 3 > 3.0) ? "P" : "J";
        return type;
    }

    function showMBTIView() {
        isViewAllMode = true;
        document.getElementById("normal-view-wrapper").style.display = "none";
        document.getElementById("mbti-view").style.display = "block";
        document.querySelectorAll('.question-btn').forEach(b => b.classList.remove('active'));
        document.getElementById("btn-view-all").classList.add('active');
        renderMBTIArena('EI');
    }

    function renderMBTIArena(indicatorKey) {
        const ui = dict[currentLang1].ui;
        document.querySelectorAll('.mbti-nav-btn').forEach(b => b.classList.remove('active'));
        const btnIdx = ['EI','SN','TF','JP'].indexOf(indicatorKey);
        
        const navBtns = document.querySelectorAll('.mbti-nav-btn');
        navBtns[0].innerText = `E vs I (${ui.vEnergy})`;
        navBtns[1].innerText = `S vs N (${ui.vRecognize})`;
        navBtns[2].innerText = `T vs F (${ui.vJudge})`;
        navBtns[3].innerText = `J vs P (${ui.vLife})`;
        navBtns[btnIdx].classList.add('active');

        const leftLetter = indicatorKey[0];
        const rightLetter = indicatorKey[1];
        
        document.getElementById("mbti-desc-left").innerText = `"${getDescText(currentLang1, leftLetter)}"`;
        document.getElementById("mbti-desc-right").innerText = `"${getDescText(currentLang1, rightLetter)}"`;

        document.getElementById("arena-col-1-title").innerText = ui.vVery + " " + leftLetter;
        document.getElementById("arena-col-2-title").innerText = ui.vLittle + " " + leftLetter;
        document.getElementById("arena-col-3-title").innerText = ui.vHalf;
        document.getElementById("arena-col-4-title").innerText = ui.vLittle + " " + rightLetter;
        document.getElementById("arena-col-5-title").innerText = ui.vVery + " " + rightLetter;

        const containers = [];
        for(let i = 1; i <= 5; i++) {
            containers[i] = document.getElementById(`arena-col-${i}-students`);
            containers[i].innerHTML = "";
        }

        const qNums = traitsMap[indicatorKey];

        students.forEach(st => {
            const data = surveyData[st];
            if(data && data[qNums[0]] && data[qNums[1]] && data[qNums[2]]) {
                const avg = (parseInt(data[qNums[0]]) + parseInt(data[qNums[1]]) + parseInt(data[qNums[2]])) / 3;
                let colIdx = 3;
                if(avg <= 1.8) colIdx = 1;
                else if(avg <= 2.6) colIdx = 2;
                else if(avg < 3.4) colIdx = 3;
                else if(avg < 4.2) colIdx = 4;
                else colIdx = 5;

                const fullType = calculateMBTI(data) || "-";
                const cardHtml = `<div class="mbti-st-card">
                    <img src="${getAvatarUrl(st)}" alt="avatar">
                    <div style="color: #FFF; font-size: 0.85em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${st}</div>
                    <div class="mbti-st-type">${fullType}</div>
                </div>`;
                containers[colIdx].innerHTML += cardHtml;
            }
        });
        
        for(let i = 1; i <= 5; i++) {
            if(containers[i].innerHTML === "") {
                containers[i].innerHTML = `<div style="color:#555; margin-top:20px; font-size: 0.85em;">-</div>`;
            }
        }
    }

    function openStudentModal(studentName) {
        activeStudent = studentName;
        selectedScore = null;
        document.getElementById("modal-student-name").innerHTML = `<img src="${getAvatarUrl(studentName)}" style="width:40px; height:40px; border-radius:50%; vertical-align:middle; margin-right:10px;">${studentName}`;
        const existingScore = surveyData[studentName] && surveyData[studentName][currentQuestionId];
        document.querySelectorAll('#single-input-view .scale-btn').forEach((btn, idx) => {
            btn.classList.remove('selected');
            if(existingScore && idx + 1 == existingScore) btn.classList.add('selected');
        });
        bulkAnswers = surveyData[studentName] ? {...surveyData[studentName]} : {};
        updateModalUI();
        document.getElementById("single-input-view").style.display = "block";
        document.getElementById("bulk-input-view").style.display = "none";
        document.getElementById("student-input-modal").classList.add("show");
    }

    function updateModalUI() {
        const ui = dict[currentLang1].ui;
        document.getElementById("ui-mq-num").innerText = `${currentQuestionId}${ui.qNum}`;
        const qTexts = getQText(currentLang1, currentQuestionId);
        document.getElementById("mq-left-lang1").innerText = qTexts[0];
        document.getElementById("mq-right-lang1").innerText = qTexts[1];

        const mqLeftLang2 = document.getElementById("mq-left-lang2");
        const mqRightLang2 = document.getElementById("mq-right-lang2");

        if(currentLang2 !== 'none' && currentLang2 !== currentLang1) {
            const qTexts2 = getQText(currentLang2, currentQuestionId);
            mqLeftLang2.innerText = qTexts2[0]; mqLeftLang2.style.display = 'block';
            mqRightLang2.innerText = qTexts2[1]; mqRightLang2.style.display = 'block';
        } else {
            mqLeftLang2.style.display = 'none';
            mqRightLang2.style.display = 'none';
        }

        const setBtnText = (id1, id2, key) => {
            document.getElementById(id1).innerText = ui[key];
            const el2 = document.getElementById(id2);
            if(currentLang2 !== 'none' && currentLang2 !== currentLang1) {
                el2.innerText = dict[currentLang2].ui[key]; el2.style.display = 'block';
            } else { el2.style.display = 'none'; }
        };

        setBtnText("ui-btn-save", "ui-btn-save-l2", "saveClose");
        setBtnText("ui-btn-batch", "ui-btn-batch-l2", "batchInput");
        setBtnText("ui-msg-score", "ui-msg-score-l2", "selectScore");
        setBtnText("ui-btn-cancel", "ui-btn-cancel-l2", "cancel");
        setBtnText("ui-btn-batch-save", "ui-btn-batch-save-l2", "batchSave");

        renderBulkQuestions();
    }

    function toggleBulkInputView() {
        const single = document.getElementById("single-input-view");
        const bulk = document.getElementById("bulk-input-view");
        if(single.style.display === "none") {
            single.style.display = "block"; bulk.style.display = "none";
        } else {
            single.style.display = "none"; bulk.style.display = "block";
        }
    }

    function selectScore(score) {
        selectedScore = score;
        const btns = document.getElementById("single-input-view").querySelectorAll('.scale-btn');
        btns.forEach(btn => btn.classList.remove('selected'));
        btns[score - 1].classList.add('selected');
    }

    function saveSingleData() {
        if (!selectedScore) {
            const activeBtn = document.querySelector('#single-input-view .scale-btn.selected');
            if(activeBtn) selectedScore = parseInt(activeBtn.dataset.score);
            else { return; }
        }
        if (!surveyData[activeStudent]) surveyData[activeStudent] = {};
        surveyData[activeStudent][currentQuestionId] = selectedScore;
        saveToCache(); closeModal('student-input-modal'); renderButtons(); selectQuestion(currentQuestionId);
    }

    function getTraitKeyForQuestion(qId) {
        for (const [key, qNums] of Object.entries(traitsMap)) {
            if (qNums.includes(qId)) return key;
        }
        return "";
    }

    function renderBulkQuestions() {
        const container = document.getElementById('bulk-questions-container');
        const ui = dict[currentLang1].ui;
        container.innerHTML = "";
        for(let i = 1; i <= TOTAL_QUESTIONS; i++) {
            let div = document.createElement('div');
            div.style.marginBottom = "20px"; div.style.borderBottom = "1px solid #333"; div.style.paddingBottom = "15px";
            let qTexts = getQText(currentLang1, i);

            let html = `<div style="color:#FFF; margin-bottom:5px; text-align:center;">
                            <strong>${i}${ui.qNum}</strong>
                        </div>
                        <div class="balance-row" id="bulk-q-${i}" style="margin: 10px 0;">
                            <div class="balance-text left-text">${qTexts[0]}</div>
                            <div class="scale-group">`;
            for(let s=1; s<=5; s++) {
                let isSel = bulkAnswers[i] == s ? "selected" : "";
                html += `<button class="scale-btn scale-color-${s} ${isSel}" data-score="${s}" onclick="setBulkScore(${i}, ${s})"></button>`;
            }
            html += `           </div>
                            <div class="balance-text right-text">${qTexts[1]}</div>
                        </div>`;

            if(currentLang2 !== 'none' && currentLang2 !== currentLang1) {
                let qTexts2 = getQText(currentLang2, i);
                html += `<div class="balance-row" style="margin: -5px 0 10px 0; opacity: 0.8; font-size: 0.85em;">
                            <div class="balance-text left-text" style="color:#FCD34D;">${qTexts2[0]}</div>
                            <div style="width: 220px;"></div>
                            <div class="balance-text right-text" style="color:#FCD34D;">${qTexts2[1]}</div>
                         </div>`;
            }
            div.innerHTML = html;
            container.appendChild(div);
        }
    }

    function setBulkScore(qId, score) {
        bulkAnswers[qId] = score;
        const group = document.getElementById(`bulk-q-${qId}`);
        group.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
        group.querySelectorAll('.scale-btn')[score-1].classList.add('selected');
    }

    function saveBulkData() {
        if (!surveyData[activeStudent]) surveyData[activeStudent] = {};
        surveyData[activeStudent] = {...bulkAnswers};
        saveToCache();
        closeModal('student-input-modal'); renderButtons(); selectQuestion(currentQuestionId);
    }

    function closeModal(id) { document.getElementById(id).classList.remove("show"); }

    function openTeacherModal() {
        document.getElementById("teacher-modal").classList.add("show");
        renderManageList(); updateStudentSelectbox(); renderAllResultTable(); switchTab('tab-guide');
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        const activeBtn = document.querySelector(`.tab-btn[onclick="switchTab('${tabId}')"]`);
        if(activeBtn) activeBtn.classList.add('active');
        document.getElementById(tabId).classList.add('active');
        if (tabId === 'tab-result-ind') updateStudentSelectbox();
        if (tabId === 'tab-result-all') renderAllResultTable();
    }

    function renderManageList() {
        const list = document.getElementById("manage-student-list");
        list.innerHTML = "";
        students.forEach((student, index) => {
            const li = document.createElement("li"); li.className = "list-item";
            li.innerHTML = `<div style="display:flex; align-items:center;">
                    <img src="${getAvatarUrl(student)}" style="width:30px; height:30px; border-radius:50%; margin-right:10px;">
                    <span style="color: #FFF;">${student}</span>
                </div>
                <button class="btn-danger" style="padding: 5px 10px; border:none; border-radius:5px;" onclick="removeStudent(${index})">${getUIText(currentLang1, 'del')}</button>`;
            list.appendChild(li);
        });
    }

    function addStudent() {
        const input = document.getElementById("new-student-input");
        const newName = input.value.trim();
        if(!newName) return;
        if(students.includes(newName)) return;
        students.push(newName);
        saveToCache(); renderManageList(); input.value = ""; renderButtons(); 
        if(!isViewAllMode) renderStudents();
    }

    function removeStudent(index) {
        if(confirm(getUIText(currentLang1, 'alertDel'))) {
            delete surveyData[students[index]]; students.splice(index, 1);
            saveToCache(); renderManageList(); renderButtons(); 
            if(!isViewAllMode) renderStudents(); else renderMBTIArena('EI');
        }
    }

    function updateStudentSelectbox() {
        const select = document.getElementById("student-select");
        select.innerHTML = `<option value="">${getUIText(currentLang1, 'selTarget')}</option>`;
        students.forEach(st => { select.innerHTML += `<option value="${st}">${st}</option>`; });
        document.getElementById("ind-result-area").style.display = "none";
    }

    function renderIndividualResult() {
        const stName = document.getElementById("student-select").value;
        const area = document.getElementById("ind-result-area");
        const ui = dict[currentLang1].ui;
        if(!stName) { area.style.display = "none"; return; }
        const data = surveyData[stName];
        if(!data || Object.keys(data).length === 0) { alert(ui.alertNoData); area.style.display = "none"; return; }

        area.style.display = "block";
        const mbtiType = calculateMBTI(data);
        if(mbtiType) {
            document.getElementById("ind-mbti-display").innerText = mbtiType;
            document.getElementById("ind-scores-display").innerHTML = ui.completed;
        } else {
            document.getElementById("ind-mbti-display").innerText = ui.wait;
            document.getElementById("ind-scores-display").innerHTML = `<span style='color:red;'>${ui.noResp}</span>`;
        }

        let detailHtml = `<table class="result-table"><thead><tr><th width="10%">${ui.noCol}</th><th width="15%">${ui.traitCol}</th><th width="60%">${ui.qCol}</th><th width="15%">${ui.scoreCol}</th></tr></thead><tbody>`;
        for(let i = 1; i <= TOTAL_QUESTIONS; i++) {
            let traitKey = getTraitKeyForQuestion(i);
            let scoreStr = data[i] ? `<b>${data[i]}</b>` : `<span style="color:red">${ui.noResp}</span>`;
            let qTexts = getQText(currentLang1, i);
            let combinedQText = `<span style="color:#F87171">${qTexts[0]}</span> <br><span style="color:#888;font-size:0.8em;">VS</span><br> <span style="color:#60A5FA">${qTexts[1]}</span>`;
            detailHtml += `<tr><td>${i}</td><td style="color:#8B5CF6; font-weight:bold;">${traitKey[0]} vs ${traitKey[1]}</td><td class="text-left">${combinedQText}</td><td>${scoreStr}</td></tr>`;
        }
        detailHtml += `</tbody></table>`;
        document.getElementById("ind-detail-table-wrapper").innerHTML = detailHtml;
    }

    function copyIndividualResult() {
        const stName = document.getElementById("student-select").value;
        const ui = dict[currentLang1].ui;
        if(!stName) { alert(ui.alertNoSt); return; }
        const data = surveyData[stName];
        if(!data || Object.keys(data).length === 0) return;

        const mbtiType = calculateMBTI(data) || ui.wait;
        let textToCopy = `[ ${stName} - ${ui.title} ]\n\n`;
        textToCopy += `■ ${ui.sumTitle}: ${mbtiType}\n\n`;
        textToCopy += `■ ${ui.detailTitle}\n`;
        for(let i = 1; i <= TOTAL_QUESTIONS; i++) {
            let traitKey = getTraitKeyForQuestion(i);
            let scoreStr = data[i] ? `${data[i]}` : ui.noResp;
            let qTexts = getQText(currentLang1, i);
            textToCopy += `${i}. [${traitKey[0]} vs ${traitKey[1]}] ${qTexts[0]} VS ${qTexts[1]} : ${scoreStr}\n`;
        }

        const textarea = document.createElement("textarea");
        textarea.value = textToCopy;
        document.body.appendChild(textarea); textarea.select();
        try { document.execCommand('copy'); alert(ui.alertCopyOk); } 
        catch (err) { }
        document.body.removeChild(textarea);
    }

    function downloadTXT(text, filename) {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function exportIndividualTXT() {
        const stName = document.getElementById("student-select").value;
        const ui = dict[currentLang1].ui;
        if(!stName) { alert(ui.alertNoSt); return; }
        const data = surveyData[stName];
        if(!data || Object.keys(data).length === 0) return;

        const mbtiType = calculateMBTI(data) || ui.wait;
        let text = `[ ${stName} - ${ui.title} ]\n\n`;
        text += `■ ${ui.sumTitle}: ${mbtiType}\n\n`;
        text += `■ ${ui.detailTitle}\n`;
        for(let i = 1; i <= TOTAL_QUESTIONS; i++) {
            let traitKey = getTraitKeyForQuestion(i);
            let scoreStr = data[i] ? `${data[i]}` : ui.noResp;
            let qTexts = getQText(currentLang1, i);
            text += `${i}. [${traitKey[0]} vs ${traitKey[1]}] ${qTexts[0]} VS ${qTexts[1]} : ${scoreStr}\n`;
        }
        downloadTXT(text, `${stName}_MBTI.txt`);
    }

    function exportAllTXT() {
        const ui = dict[currentLang1].ui;
        let text = `[ ${ui.title} - ${ui.allRes} ]\n\n`;
        students.forEach(st => {
            text += `--------------------------------------------------\n`;
            text += `👤 ${ui.nameCol}: ${st}\n`;
            const data = surveyData[st];
            if(data && Object.keys(data).length > 0) {
                const type = calculateMBTI(data);
                text += `${ui.sumTitle}: ${type || ui.wait}\n`;
            } else {
                text += `${ui.noResp}\n`;
            }
        });
        downloadTXT(text, `All_Students_MBTI.txt`);
    }

    function renderAllResultTable() {
        const ui = dict[currentLang1].ui;
        let html = `<table class="result-table"><thead><tr><th width="30%">${ui.nameCol}</th><th width="70%">${ui.sumTitle}</th></tr></thead><tbody>`;
        students.forEach(st => {
            const data = surveyData[st];
            if(data && Object.keys(data).length === TOTAL_QUESTIONS) {
                const mbti = calculateMBTI(data);
                html += `<tr><td><div style="display:flex; align-items:center; justify-content:center;"><img src="${getAvatarUrl(st)}" style="width:24px; height:24px; border-radius:50%; margin-right:5px;"><b>${st}</b></div></td>
                            <td style="color:#8B5CF6; font-weight:bold; font-size:1.2em;">${mbti}</td></tr>`;
            } else {
                html += `<tr><td><div style="display:flex; align-items:center; justify-content:center;"><img src="${getAvatarUrl(st)}" style="width:24px; height:24px; border-radius:50%; margin-right:5px;"><b>${st}</b></div></td><td style="color:#aaa;">${ui.wait} / ${ui.noResp}</td></tr>`;
            }
        });
        html += `</tbody></table>`;
        document.getElementById("all-result-table-container").innerHTML = html;
    }

    function exportBackupData() {
        const exportObj = { students: students, surveyData: surveyData, exportDate: new Date().toLocaleString() };
        const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url;
        a.download = `mbti_backup_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function importBackupData() {
        const fileInput = document.getElementById("backup-file-input");
        if(fileInput.files.length === 0) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const obj = JSON.parse(e.target.result);
                if(obj.students && obj.surveyData) {
                    students = obj.students; surveyData = obj.surveyData; saveToCache();
                    alert(getUIText(currentLang1, 'alertBkOk')); closeModal('teacher-modal'); renderButtons(); 
                    if(!isViewAllMode) { renderStudents(); selectQuestion(currentQuestionId); } else { renderMBTIArena('EI'); }
                }
            } catch(err) { }
        };
        reader.readAsText(fileInput.files[0]);
    }

    function clearAllData() {
        if(confirm(getUIText(currentLang1, 'alertInit'))) {
            localStorage.removeItem('mbtiStudents'); localStorage.removeItem('mbtiSurveyData');
            students = []; surveyData = {}; 
            renderManageList(); renderButtons(); 
            if(!isViewAllMode) renderStudents();
            document.getElementById("ind-result-area").style.display="none"; renderAllResultTable();
        }
    }
</script>
</body>
</html>
