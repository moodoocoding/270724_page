        const languages = [

        /* =========================================
           UI 로직 (모달, 토스트, 버튼)
           ========================================= */
        let currentLang = 'en';
        
        const langBtnContainer = document.getElementById('langBtnContainer');
        const triggerBtn = document.getElementById('langTriggerBtn');
        const modal = document.getElementById('langModal');
        const closeBtn = document.getElementById('closeModalBtn');
        const searchInput = document.getElementById('searchInput');
        const grid = document.getElementById('languageGrid');
        const noResult = document.getElementById('noResult');
        const currentFlagImg = document.getElementById('currentFlag');
        const currentLangSpan = document.getElementById('currentLangName');
        
        const toast = document.getElementById('toastNotification');
        const toastLangName = document.getElementById('toastLangName');
        let toastTimeout;

        // 글자 수 기반 폰트 리사이징 함수 (텍스트가 영역을 넘어가면 폰트 축소)
        function autoResizeText() {
            const elements = document.querySelectorAll('.auto-resize-text');
            elements.forEach(el => {
                if(!el) return;
                el.style.fontSize = ''; // CSS 기본값으로 초기화
                let currentSize = parseFloat(window.getComputedStyle(el).fontSize);
                // 스크롤 너비가 실제 클라이언트 너비보다 크면 폰트를 1px씩 줄임 (최소 12px)
                while (el.scrollWidth > el.clientWidth && currentSize > 12) {
                    currentSize -= 1;
                    el.style.fontSize = currentSize + 'px';
                }
            });
        }

        // 초기 언어 가져오기 (1. URL -> 2. localStorage -> 3. Device -> 4. Base)
        function getInitialLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const queryLang = urlParams.get('lang');
            if (queryLang && translations[queryLang]) return queryLang;

            const savedLang = localStorage.getItem('kingsmath_lang');
            if (savedLang && translations[savedLang]) return savedLang;

            const navLang = navigator.language.toLowerCase().slice(0, 2);
            if (translations[navLang]) return navLang;
            
            // 브라질 포르투갈어 등 세부 매칭
            if (navigator.language.toLowerCase() === 'pt-br' && translations['pt-br']) return 'pt-br';

            return 'en';
        }

        function renderLanguages(filterText = '') {
            grid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            
            const filteredLangs = languages.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                grid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                noResult.classList.add('hidden');
                noResult.classList.remove('flex');

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                    const stateClasses = isSelected 
                        ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                        : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                    const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;

                    btn.innerHTML = `
                        <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                            <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col items-start">
                            <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                            <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                    `;
                    btn.addEventListener('click', () => changeLanguage(lang.code, lang));
                    grid.appendChild(btn);
                });
            }
        }

        function changeLanguage(langCode, langObj = null) {

        // 창 크기가 변경될 때도 폰트 자동 조절

        triggerBtn.addEventListener('click', openModal);

        searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });

        // 초기화
        changeLanguage(getInitialLanguage());


        /* =========================================
           게임 기존 로직 (수정 및 삭제 금지)
           ========================================= */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerDisplay = document.getElementById('timerDisplay');
        const startScreen = document.getElementById('start-screen');
        const gameContainer = document.getElementById('game-container');
        const endOverlay = document.getElementById('endOverlay');
        
        window.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('dragstart', e => e.preventDefault());
        window.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();

        }, false);

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            if (type === 'move') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'rotate') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'flip') {
                osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'start') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(600, now + 0.1); osc.frequency.linearRampToValueAtTime(900, now + 0.2);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.2, now + 0.2); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'win') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.15); osc.frequency.setValueAtTime(783.99, now + 0.3); osc.frequency.setValueAtTime(1046.50, now + 0.45);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.2, now + 0.6); gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2); osc.start(now); osc.stop(now + 1.2);
            } else if (type === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
            }
        }

        const GRID_W = 35, GRID_H = 18;
        const CELL_SIZE = canvas.width / GRID_W;
        let timeLeft = 60, isGameOver = false, isGameStarted = false;
        let obstacles = [], timerInterval = null, particles = [], isWinSequence = false;
        let p1 = { points: [], pos: {x:0,y:0}, vPos: {x:0,y:0}, rotation: 0, vRot: 0, flipH: 1, flipV: 1, vFlipH: 1, vFlipV: 1, color: '#3b82f6', glow: '#60a5fa' };
        let p2 = { points: [], pos: {x:0,y:0}, vPos: {x:0,y:0}, rotation: 0, vRot: 0, flipH: 1, flipV: 1, vFlipH: 1, vFlipV: 1, color: '#f43f5e', glow: '#fb7185' };
        let target = { points: [], pos: {x:0,y:0}, rotation: 0, flipH: 1, flipV: 1, color: '#1e293b' };

        function generateRandomShape() {
            const blocks = []; const count = Math.floor(Math.random() * 6) + 3;
            while (blocks.length < count) {
                const x = Math.floor(Math.random() * 3), y = Math.floor(Math.random() * 3);
                if (!blocks.some(b => b[0] === x && b[1] === y)) blocks.push([x, y]);
            }
            return blocks;
        }

        function initLevel() {
            let solvable = false; let attempts = 0; isWinSequence = false; particles = [];
            while (!solvable) {
                attempts++; const baseShape = generateRandomShape();
                const getNormKey = (r, fh, fv) => { const pts = getTransformedPoints(baseShape, {x:0, y:0}, r, fh, fv); return pts.map(p => `${Math.round(p[0])},${Math.round(p[1])}`).sort().join('|'); };
                const startKey = getNormKey(0, 1, 1); const isSymmetric = (startKey === getNormKey(90, 1, 1));
                p1.points = JSON.parse(JSON.stringify(baseShape)); p2.points = JSON.parse(JSON.stringify(baseShape)); target.points = JSON.parse(JSON.stringify(baseShape));
                p1.pos = { x: 3, y: Math.floor(GRID_H / 2) - 1 }; p2.pos = { x: GRID_W - 6, y: Math.floor(GRID_H / 2) - 1 };
                p1.vPos = { ...p1.pos }; p1.rotation = 0; p1.vRot = 0; p1.flipH = 1; p1.flipV = 1; p1.vFlipH = 1; p1.vFlipV = 1;
                p2.vPos = { ...p2.pos }; p2.rotation = 0; p2.vRot = 0; p2.flipH = 1; p2.flipV = 1; p2.vFlipH = 1; p2.vFlipV = 1;
                const centerCol = Math.floor(GRID_W / 2); const targetX = centerCol - 1; const ty = Math.floor(Math.random() * (GRID_H - 6)) + 3;
                target.pos = { x: targetX, y: ty };
                let distinctFound = false; let tTry = 0;
                while(!distinctFound && tTry < 20) {
                    tTry++; const rots = [0, 90, 180, 270]; target.rotation = rots[Math.floor(Math.random() * rots.length)];
                    target.flipH = Math.random() > 0.5 ? 1 : -1; target.flipV = Math.random() > 0.5 ? 1 : -1;
                    if (isSymmetric) { distinctFound = true; } else { const tKey = getNormKey(target.rotation, target.flipH, target.flipV); if (tKey !== startKey) distinctFound = true; }
                }
                const occupied = new Set();
                const addOccupied = (obj) => { const pts = getTransformedPoints(obj.points, obj.pos, obj.rotation, obj.flipH, obj.flipV); pts.forEach(p => occupied.add(`${Math.round(p[0])},${Math.round(p[1])}`)); };
                addOccupied(p1); addOccupied(target);
                obstacles = []; const obsCount = 28; 
                for (let i = 0; i < obsCount; i++) {
                    const ox = Math.floor(Math.random() * (centerCol - 1)), oy = Math.floor(Math.random() * GRID_H);
                    const distP1 = Math.abs(ox - p1.pos.x) + Math.abs(oy - p1.pos.y), distT = Math.abs(ox - target.pos.x) + Math.abs(oy - target.pos.y);
                    if (distP1 > 3 && distT > 3) { if (!occupied.has(`${ox},${oy}`) && !occupied.has(`${(GRID_W - 1) - ox},${oy}`)) { obstacles.push(`${ox},${oy}`); obstacles.push(`${(GRID_W - 1) - ox},${oy}`); } }
                }
                const solutionMask = checkSolvable(p1, target);
                if (solutionMask !== null) { const hasAll = (solutionMask & 1) && (solutionMask & 2) && (solutionMask & 4) && (solutionMask & 8); if (hasAll) { solvable = true; } else if (attempts > 50) { solvable = true; } }
            }
        }

        function checkSolvable(startObj, targetObj) {
            const queue = []; const visited = new Set();
            const startState = { x: startObj.pos.x, y: startObj.pos.y, r: startObj.rotation, fh: startObj.flipH, fv: startObj.flipV, mask: 0 };
            queue.push(startState); visited.add(`${startState.x},${startState.y},${startState.r},${startState.fh},${startState.fv}`);
            let nodes = 0;
            while(queue.length > 0) {
                const curr = queue.shift(); nodes++; if(nodes > 3500) return null; 
                if(curr.x === targetObj.pos.x && curr.y === targetObj.pos.y && curr.r === targetObj.rotation && curr.fh === targetObj.flipH && curr.fv === targetObj.flipV) { return curr.mask; }
                const moves = [ {dx:0, dy:-1, bit:1}, {dx:0, dy:1, bit:2}, {dx:-1, dy:0, bit:4}, {dx:1, dy:0, bit:8}, {dr:-90}, {dr:90}, {dfh:-1}, {dfv:-1} ];
                for(let i=0; i<moves.length; i++) {
                    const m = moves[i];
                    const next = { x: curr.x + (m.dx||0), y: curr.y + (m.dy||0), r: (curr.r + (m.dr||0) + 360)%360, fh: curr.fh*(m.dfh||1), fv: curr.fv*(m.dfv||1), mask: curr.mask | (m.bit || 0) };
                    if(isValidState(next, startObj.points)) {
                        const key = `${next.x},${next.y},${next.r},${next.fh},${next.fv}`;
                        if(!visited.has(key)) { visited.add(key); queue.push(next); }
                    }
                }
            }
            return null; 
        }

        function isValidState(state, points) {
            const pts = points.map(p => {
                let x = p[0]-1, y = p[1]-1;
                const rad = (state.r * Math.PI) / 180;
                const cos = Math.round(Math.cos(rad)), sin = Math.round(Math.sin(rad));
                let nx = x*cos - y*sin, ny = x*sin + y*cos;
                nx *= state.fh; ny *= state.fv;
                return [nx+1 + state.x, ny+1 + state.y];
            });
            for (let p of pts) {
                if (p[0] < 0 || p[0] >= GRID_W || p[1] < 0 || p[1] >= GRID_H) return false;
                if (obstacles.includes(`${p[0]},${p[1]}`)) return false;
            }
            return true;
        }
        
        function getTransformedPoints(points, pos, rot, fh, fv) {
            return points.map(p => {
                let x = p[0] - 1, y = p[1] - 1;
                const rad = (rot * Math.PI) / 180;
                const cos = Math.cos(rad), sin = Math.sin(rad); 
                let nx = x * cos - y * sin, ny = x * sin + y * cos;
                nx *= fh; ny *= fv;
                return [nx + 1 + pos.x, ny + 1 + pos.y];
            });
        }

        function lerp(start, end, t) { return start * (1 - t) + end * t; }

        function gameLoop() {
            const moveSpeed = 0.2; const actionSpeed = 0.15; 
            [p1, p2].forEach(p => {
                p.vPos.x = lerp(p.vPos.x, p.pos.x, moveSpeed); p.vPos.y = lerp(p.vPos.y, p.pos.y, moveSpeed);
                let diff = p.rotation - p.vRot;
                while (diff < -180) diff += 360; while (diff > 180) diff -= 360;
                p.vRot += diff * actionSpeed;
                p.vFlipH = lerp(p.vFlipH, p.flipH, actionSpeed); p.vFlipV = lerp(p.vFlipV, p.flipV, actionSpeed);
            });
            updateParticles(); draw();
            if (isGameStarted) requestAnimationFrame(gameLoop);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 60; i++) { particles.push({ x: x * CELL_SIZE + CELL_SIZE/2, y: y * CELL_SIZE + CELL_SIZE/2, vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15, life: 1.0, color: color, size: Math.random() * 8 + 4 }); }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.02; p.size *= 0.95; if (p.life <= 0) particles.splice(i, 1); }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_W; i++) { ctx.beginPath(); ctx.moveTo(i * CELL_SIZE, 0); ctx.lineTo(i * CELL_SIZE, canvas.height); ctx.stroke(); }
            for (let i = 0; i <= GRID_H; i++) { ctx.beginPath(); ctx.moveTo(0, i * CELL_SIZE); ctx.lineTo(canvas.width, i * CELL_SIZE); ctx.stroke(); }

            obstacles.forEach(o => { const [ox, oy] = o.split(',').map(Number); drawBlock(ox, oy, '#1e1b4b', '#6366f1', true); });
            const targetPts = getTransformedPoints(target.points, target.pos, target.rotation, target.flipH, target.flipV);
            targetPts.forEach(p => drawBlock(p[0], p[1], '#1e293b', '#475569', false, true));

            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); });
            ctx.globalAlpha = 1.0;

            const drawPlayer = (p) => {
                const pts = getTransformedPoints(p.points, p.vPos, p.vRot, p.vFlipH, p.vFlipV);
                ctx.fillStyle = p.color; ctx.shadowBlur = 12; ctx.shadowColor = p.glow;
                pts.forEach(pt => { ctx.beginPath(); ctx.roundRect(pt[0] * CELL_SIZE + 4, pt[1] * CELL_SIZE + 4, CELL_SIZE - 8, CELL_SIZE - 8, 8); ctx.fill(); });
                ctx.shadowBlur = 0;
            };

            drawPlayer(p1);
            ctx.globalCompositeOperation = 'lighten'; drawPlayer(p2); ctx.globalCompositeOperation = 'source-over'; 
            checkWin();
        }

        function drawBlock(gx, gy, color, glow, isNeon, isTarget = false) {
            ctx.fillStyle = color; if (isNeon) { ctx.shadowBlur = 12; ctx.shadowColor = glow; }
            if (isTarget) ctx.globalAlpha = 0.8;
            ctx.beginPath(); ctx.roundRect(gx * CELL_SIZE + 4, gy * CELL_SIZE + 4, CELL_SIZE - 8, CELL_SIZE - 8, 8);
            ctx.fill(); ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
        }

        function isColliding(shape, dx, dy, dr=0, dfh=1, dfv=1) {
            const temp = { points: shape.points, pos: {x: shape.pos.x+dx, y:shape.pos.y+dy}, rotation: (shape.rotation+dr+360)%360, flipH: shape.flipH*dfh, flipV: shape.flipV*dfv };
            const pts = shape.points.map(p => {
                let x = p[0]-1, y = p[1]-1;
                const rad = (temp.rotation * Math.PI) / 180;
                const cos = Math.round(Math.cos(rad)), sin = Math.round(Math.sin(rad));
                let nx = x*cos - y*sin, ny = x*sin + y*cos;
                nx *= temp.flipH; ny *= temp.flipV;
                return [nx+1 + temp.pos.x, ny+1 + temp.pos.y];
            });

            for (let p of pts) {
                if (p[0]<0 || p[0]>=GRID_W || p[1]<0 || p[1]>=GRID_H) return true;
                if (obstacles.includes(`${p[0]},${p[1]}`)) return true;
            }
            return false;
        }

        function executeAction(p, type) {
            if (isGameOver || !isGameStarted || isWinSequence) return; 
            switch(type) {
                case 'up': if(!isColliding(p,0,-1)) { p.pos.y--; playSound('move'); } else { playSound('error'); } break;
                case 'down': if(!isColliding(p,0,1)) { p.pos.y++; playSound('move'); } else { playSound('error'); } break;
                case 'left': if(!isColliding(p,-1,0)) { p.pos.x--; playSound('move'); } else { playSound('error'); } break;
                case 'right': if(!isColliding(p,1,0)) { p.pos.x++; playSound('move'); } else { playSound('error'); } break;
                case 'rotL': if(!isColliding(p,0,0,-90)) { p.rotation = (p.rotation-90+360)%360; playSound('rotate'); } else { playSound('error'); } break;
                case 'rotR': if(!isColliding(p,0,0,90)) { p.rotation = (p.rotation+90)%360; playSound('rotate'); } else { playSound('error'); } break;
                case 'flipV': if(!isColliding(p,0,0,0,1,-1)) { p.flipV *= -1; playSound('flip'); } else { playSound('error'); } break;
                case 'flipH': if(!isColliding(p,0,0,0,-1,1)) { p.flipH *= -1; playSound('flip'); } else { playSound('error'); } break;
            }
        }

        function triggerWinEffect(winner, color) {
            if(isWinSequence) return;
            isWinSequence = true; playSound('win');
            const targetPts = getTransformedPoints(target.points, target.pos, target.rotation, target.flipH, target.flipV);
            targetPts.forEach(p => { createExplosion(p[0], p[1], color); });
            setTimeout(() => { endGame(winner); }, 1500);
        }

        function checkWin() {
            if (isGameOver || !isGameStarted || isWinSequence) return;
            const getLogicPoints = (obj) => {
                return obj.points.map(p => {
                    let x = p[0]-1, y = p[1]-1;
                    const rad = (obj.rotation * Math.PI) / 180;
                    const cos = Math.round(Math.cos(rad)), sin = Math.round(Math.sin(rad));
                    let nx = x*cos - y*sin, ny = x*sin + y*cos;
                    nx *= obj.flipH; ny *= obj.flipV;
                    return [nx+1 + obj.pos.x, ny+1 + obj.pos.y];
                });
            };
            const tKey = getLogicPoints(target).map(p=>`${p[0]},${p[1]}`).sort().join('|');
            const p1Key = getLogicPoints(p1).map(p=>`${p[0]},${p[1]}`).sort().join('|');
            const p2Key = getLogicPoints(p2).map(p=>`${p[0]},${p[1]}`).sort().join('|');

            if (p1Key === tKey) triggerWinEffect('P1', '#3b82f6');
            else if (p2Key === tKey) triggerWinEffect('P2', '#f43f5e');
        }

        function endGame(winner) {
            isGameOver = true; isGameStarted = false; isWinSequence = false;
            clearInterval(timerInterval);
            const wTxt = document.getElementById('winnerText');
            const descTxt = document.getElementById('resultDesc');
            const wIcon = document.getElementById('winnerIcon');
            const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7" /></svg>`;
            
            const t = translations[currentLang];

            if (winner === 'P1') {
                wTxt.innerText = t.winP1; wTxt.className = "text-8xl font-black text-blue-500 mb-6 italic drop-shadow-2xl leading-none text-center auto-resize-text w-[90%] flex justify-center";
                descTxt.innerText = t.winDescP1;
                wIcon.className = "w-32 h-32 rounded-[2rem] flex items-center justify-center mb-6 bg-blue-600 shadow-blue-500/50 shadow-2xl";
                wIcon.innerHTML = iconSvg;
            } else if (winner === 'P2') {
                wTxt.innerText = t.winP2; wTxt.className = "text-8xl font-black text-rose-500 mb-6 italic drop-shadow-2xl leading-none text-center auto-resize-text w-[90%] flex justify-center";
                descTxt.innerText = t.winDescP2;
                wIcon.className = "w-32 h-32 rounded-[2rem] flex items-center justify-center mb-6 bg-rose-600 shadow-rose-500/50 shadow-2xl";
                wIcon.innerHTML = iconSvg;
            } else {
                wTxt.innerText = t.draw; wTxt.className = "text-8xl font-black text-slate-400 mb-6 italic drop-shadow-2xl leading-none text-center auto-resize-text w-[90%] flex justify-center";
                descTxt.innerText = t.drawDesc;
                wIcon.className = "w-32 h-32 rounded-[2rem] flex items-center justify-center mb-6 bg-slate-600 shadow-2xl";
                wIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            }
            document.getElementById('endOverlay').classList.remove('hidden');
            setTimeout(autoResizeText, 50); // 결과창 뜬 후 폰트 사이즈 조정
        }

        function startTimer() {
            timeLeft = 60; document.getElementById('timerDisplay').innerText = 60;
            timerInterval = setInterval(() => {
                if(isWinSequence) return;
                timeLeft--; document.getElementById('timerDisplay').innerText = timeLeft;
                if (timeLeft <= 0) endGame('DRAW');
            }, 1000);
        }

        const inputs = [
            ['p1-up', p1, 'up'], ['p1-down', p1, 'down'], ['p1-left', p1, 'left'], ['p1-right', p1, 'right'],
            ['p1-rotL', p1, 'rotL'], ['p1-rotR', p1, 'rotR'], ['p1-flipV', p1, 'flipV'], ['p1-flipH', p1, 'flipH'],
            ['p2-up', p2, 'up'], ['p2-down', p2, 'down'], ['p2-left', p2, 'left'], ['p2-right', p2, 'right'],
            ['p2-rotL', p2, 'rotL'], ['p2-rotR', p2, 'rotR'], ['p2-flipV', p2, 'flipV'], ['p2-flipH', p2, 'flipH']
        ];
        inputs.forEach(([id, p, a]) => document.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); executeAction(p, a); }));

        document.getElementById('startGameBtn').addEventListener('pointerdown', () => {
            playSound('start'); 
            langBtnContainer.classList.add('hidden'); // 게임 시작 시 언어 선택기 숨김
            startScreen.classList.add('hidden');
            gameContainer.classList.remove('hidden');
            gameContainer.classList.add('flex');
            isGameStarted = true; isGameOver = false;
            initLevel(); startTimer();
            gameLoop();
            setTimeout(autoResizeText, 50);
        });
        document.getElementById('restartBtn').addEventListener('pointerdown', () => {
            playSound('start'); 
            endOverlay.classList.add('hidden'); isGameStarted = true; isGameOver = false;
            initLevel(); startTimer();
            gameLoop(); 
            setTimeout(autoResizeText, 50);
        });
        document.getElementById('homeBtn').addEventListener('pointerdown', () => {
            endOverlay.classList.add('hidden');
            gameContainer.classList.add('hidden');
            gameContainer.classList.remove('flex');
            startScreen.classList.remove('hidden');
            langBtnContainer.classList.remove('hidden'); // 메인 화면으로 돌아가면 다시 보이게
            isGameStarted = false;
            clearInterval(timerInterval);
            setTimeout(autoResizeText, 50);
        });
        document.getElementById('fullScreenBtn').addEventListener('pointerdown', () => {
            if(!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) document.exitFullscreen().catch(e => console.log(e));
            }
        });

        window.onload = () => { initLevel(); draw(); setTimeout(autoResizeText, 50); };
    </script>

</body>
</html>
