        .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }

            const now = audioCtx.currentTime;
            [523, 659, 783, 1046].forEach((f, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'triangle'; o.frequency.value = f;
                g.gain.setValueAtTime(0.1, now + i*0.1);
                g.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.3);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(now + i*0.1); o.stop(now + i*0.1 + 0.3);
            });
        }

        function startGame() {
            // 실행화면에서 언어 선택UI 숨김
            document.getElementById('langTriggerContainer').style.display = 'none';

            scores = new Array(playerCount).fill(0);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            const area = document.getElementById('players-area');
            area.innerHTML = '';
            for(let i=0; i<playerCount; i++) {
                const char = characters[i]; 
                const col = document.createElement('div');
                col.className = `player-column theme-${i}`;
                col.id = `p-col-${i}`;
                
                // [전자칠판 다중 터치 극강 최적화]
                // 브라우저의 마우스/터치 충돌을 막고 모든 개별 손가락 터치를 즉시, 독립적으로 감지합니다.
                col.addEventListener('pointerdown', (e) => {
                    if(e.cancelable) e.preventDefault(); // 슬라이드 등 기본 동작 완전 차단
                    handleTap(i, e);
                });
                
                col.innerHTML = `
                    <div class="p-score" id="score-${i}">0${langData.win_suffix}</div>
                    <div class="p-emoji">${char.emoji}</div>
                    <div class="p-name-text auto-resize-text">${char.name}</div>
                    <div class="p-rank-area" id="rank-area-${i}"></div>
                    
                    <div class="col-result-overlay" id="res-overlay-${i}">
                        <div class="res-status" id="res-status-${i}">WIN</div>
                        <div class="res-count" id="res-count-${i}">10</div>
                    </div>
                `;
                area.appendChild(col);
            }
            prepareRound();
        }

        function generateProblem(r) {
            let val=0, str="";
            while(true) {
                if(r===1) { let a=rand(1,9), b=rand(1,9); if(Math.random()>0.5) { val=a+b; str=`${a} + ${b}`; } else { val=a-b; str=`${a} - ${b}`; } if(val>=1 && val<=10) break; } 
                else if(r===2) { let a=rand(10,25), b=rand(1,9); if(Math.random()>0.5) { val=a+b; str=`${a} + ${b}`; } else { val=a-b; str=`${a} - ${b}`; } if(val>=10 && val<=20) break; } 
                else if(r===3) { let a=rand(2,9), b=rand(2,9); val=a*b; str=`${a} × ${b}`; if(val>=15 && val<=50) break; } 
                else if(r===4) { let a=rand(10,40), b=rand(10,40); val=a+b; str=`${a} + ${b}`; if(val>=30 && val<=60) break; } 
                else { val=50; str="50"; break; }
            }
            return { val, str };
        }
        function rand(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }

        function prepareRound() {
            isPlaying = false;
            taps = new Array(playerCount).fill(0); 
            for(let i=0; i<playerCount; i++) { document.getElementById(`res-overlay-${i}`).classList.remove('show'); }

            const problem = generateProblem(round);
            targetTaps = problem.val;
            
            document.getElementById('hud-round').innerText = `${round} / ${TOTAL_ROUNDS}`;
            
            let problemText = ""; let subText = langData.sub_tap;
            if(round === 5) { problemText = "50"; subText = langData.sub_speed; } 
            else { problemText = problem.str; }

            document.getElementById('hud-problem').innerText = problemText;
            document.getElementById('hud-subtext').innerText = subText;
            document.getElementById('hud-status').innerText = langData.status_wait;
            document.getElementById('timer-bar').style.width = '0%';

            const overlay = document.getElementById('round-overlay');
            const cdText = document.getElementById('overlay-countdown');
            
            document.getElementById('overlay-round-text').innerText = `${langData.hud_round} ${round}`;
            document.getElementById('overlay-target-text').innerText = (round===5) ? langData.speed_mode : `${problemText} = ?`;

            overlay.style.display = 'flex';
            setTimeout(adjustFontSize, 50); // 글자 크기 동적 조절
            
            let count = 3;
            cdText.innerText = count;
            playTone(800, 'triangle');

            if(countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                count--;
                if(count > 0) {
                    cdText.innerText = count;
                    playTone(800, 'triangle');
                    cdText.style.animation = 'none'; cdText.offsetHeight; 
                    cdText.style.animation = 'pop 0.5s ease-in-out';
                } else if(count === 0) {
                    cdText.innerText = "START!";
                    playTone(1200, 'square');
                } else {
                    clearInterval(countdownInterval);
                    overlay.style.display = 'none';
                    startRound();
                }
            }, 1000);
        }

        function startRound() {
            isPlaying = true;
            document.getElementById('hud-status').innerText = langData.status_go;
            
            if(round === 5) {
                document.getElementById('timer-bar').style.width = '100%';
                document.getElementById('timer-bar').style.background = '#ff0000';
            } else {
                let startTime = Date.now();
                document.getElementById('timer-bar').style.background = '#FF6B6B';
                timerInterval = setInterval(() => {
                    let elapsed = Date.now() - startTime;
                    let pct = (elapsed / ROUND_TIME) * 100;
                    if(pct >= 100) { pct = 100; clearInterval(timerInterval); endRound(); }
                    document.getElementById('timer-bar').style.width = pct + '%';
                }, 16);
            }
        }

        function handleTap(idx, e) {
            if(!isPlaying) return;
            taps[idx]++;
            
            const col = document.getElementById(`p-col-${idx}`);
            col.classList.add('flash'); setTimeout(() => col.classList.remove('flash'), 50);
            
            const notes = [261, 293, 329, 349, 392, 440];
            playTone(notes[idx % 6], 'square');

            if(round === 5 && taps[idx] >= 50) { endRound(); }
        }

        function endRound() {
            isPlaying = false;
            clearInterval(timerInterval);
            playWinSound();
            document.getElementById('hud-status').innerText = langData.status_end;

            let winners = [];
            if(round === 5) {
                let maxVal = -1;
                for(let i=0; i<playerCount; i++) { if(taps[i] > maxVal) maxVal = taps[i]; }
                for(let i=0; i<playerCount; i++) { if(taps[i] === maxVal) winners.push(i); }
            } else {
                let minDiff = 9999; let diffs = [];
                for(let i=0; i<playerCount; i++) {
                    let d = Math.abs(targetTaps - taps[i]);
                    diffs.push(d); if(d < minDiff) minDiff = d;
                }
                for(let i=0; i<playerCount; i++) { if(diffs[i] === minDiff) winners.push(i); }
            }

            winners.forEach(wIdx => {
                scores[wIdx]++;
                document.getElementById(`score-${wIdx}`).innerText = scores[wIdx] + langData.win_suffix;
            });

            for(let i=0; i<playerCount; i++) {
                const overlay = document.getElementById(`res-overlay-${i}`);
                const status = document.getElementById(`res-status-${i}`);
                const count = document.getElementById(`res-count-${i}`);
                
                overlay.classList.add('show'); count.innerText = taps[i];
                if(winners.includes(i)) { status.innerText = langData.win_msg; status.style.color = "#ffd700"; } 
                else { status.innerText = ""; }
            }

            setTimeout(() => {
                if(round < TOTAL_ROUNDS) { round++; prepareRound(); } 
                else { showFinalResult(); }
            }, 5000); 
        }

        function showFinalResult() {
            for(let i=0; i<playerCount; i++) { document.getElementById(`res-overlay-${i}`).classList.remove('show'); }
            playWinSound();

            let indices = [];
            for(let i=0; i<playerCount; i++) { indices.push({ id: i, score: scores[i] }); }
            indices.sort((a, b) => b.score - a.score);

            let ranks = new Array(playerCount); 
            let currentRank = 1;
            for(let i=0; i<indices.length; i++) {
                if(i > 0 && indices[i].score < indices[i-1].score) { currentRank = i + 1; }
                ranks[indices[i].id] = currentRank;
            }

            let firstPlaceNames = [];
            indices.forEach(item => { if(ranks[item.id] === 1) firstPlaceNames.push(characters[item.id].name); });
            
            const hudLabel = document.getElementById('hud-label-center');
            const hudProb = document.getElementById('hud-problem');
            const hudSub = document.getElementById('hud-subtext');

            hudLabel.innerText = langData.winner_title;
            hudLabel.style.color = "gold";
            
            let winnerText = firstPlaceNames.join(', ') + langData.winner_msg;
            hudProb.innerText = winnerText;
            hudSub.style.display = 'none'; 
            document.getElementById('hud-status').innerText = langData.status_win;
            setTimeout(adjustFontSize, 50);

            for(let i=0; i<playerCount; i++) {
                const rank = ranks[i];
                const rankArea = document.getElementById(`rank-area-${i}`);
                
                let icon = ""; let className = "final-rank-badge";
                if(rank === 1) icon = "🥇"; else if(rank === 2) icon = "🥈"; else if(rank === 3) icon = "🥉";
                else if(rank === 4) { icon = "4️⃣"; className += " rank-small"; } else if(rank === 5) { icon = "5️⃣"; className += " rank-small"; } else if(rank === 6) { icon = "6️⃣"; className += " rank-small"; }
                
                rankArea.innerHTML = `<div class="${className}">${icon}</div>`;
            }

            document.getElementById('home-btn-container').style.display = 'block';
        }

        // --- 초기화 ---
        initLanguage();
        renderLanguages();

    </script>
