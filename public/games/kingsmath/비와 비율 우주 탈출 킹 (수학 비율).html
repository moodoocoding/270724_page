    .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }

    #message-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;

        };

        let currentLang = 'en'; // Default
        
        // ==========================================
        // 다국어 모달 및 언어 선택기 로직
        // ==========================================
        const triggerBtn = document.getElementById('langTriggerBtn');
        const modal = document.getElementById('langModal');
        const closeBtn = document.getElementById('closeModalBtn');
        const searchInput = document.getElementById('searchInput');
        const grid = document.getElementById('languageGrid');
        const noResult = document.getElementById('noResult');
        const currentFlagImg = document.getElementById('currentFlag');
        const currentLangSpan = document.getElementById('currentLangName');
        const toast = document.getElementById('toastNotification');
        const toastLangName = document.getElementById('toastLangName');
        let toastTimeout;

        // 우선순위에 따른 초기 언어 감지
        function getInitialLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            if (langParam && gameTranslations[langParam]) return langParam;

            const storedLang = localStorage.getItem('kingsmath_lang');
            if (storedLang && gameTranslations[storedLang]) return storedLang;

            const browserLang = navigator.language.slice(0, 2);
            if (gameTranslations[browserLang]) return browserLang;

            return 'en';
        }

        // 언어 목록 렌더링
        function renderLanguages(filterText = '') {
            grid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            const filteredLangs = languagesData.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                grid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                noResult.classList.add('hidden');
                noResult.classList.remove('flex');

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                    const stateClasses = isSelected 
                        ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                        : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

                    const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;

                    btn.innerHTML = `
                        <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                            <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col items-start">
                            <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                            <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                    `;
                    btn.addEventListener('click', () => selectLanguage(lang));
                    grid.appendChild(btn);
                });
            }
        }

        function selectLanguage(langObj) {
            currentLang = langObj.code;
            
            // 상태 저장
            localStorage.setItem('kingsmath_lang', currentLang);
            
            // URL 파라미터 업데이트 (새로고침 없이)
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', currentLang);
            window.history.pushState({}, '', newUrl);

            // 상단 버튼 UI 업데이트
            currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;
            currentLangSpan.textContent = langObj.name;
            
            closeModal();
            showToast(langObj.name, langObj.code);
            updateContent();
            renderLanguages(searchInput.value);
        }

        function openModal() {
            modal.classList.add('active');
            setTimeout(() => searchInput.focus(), 100);
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function showToast(langName, langCode) {
            const toastMsg = toastTranslations[langCode] || toastTranslations['en'];
            document.getElementById('ui-toast').textContent = toastMsg;
            toastLangName.textContent = langName;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        triggerBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
        searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });

        // 인게임 텍스트 갱신 함수
        function updateContent() {
            const t = gameTranslations[currentLang];
            if (!t) return;
            
            // SEO & 메타 업데이트
            document.title = t.title;
            document.querySelector('meta[name="description"]').setAttribute("content", t.seo_desc);
            document.querySelector('meta[name="keywords"]').setAttribute("content", t.seo_keywords);
            document.querySelector('meta[property="og:title"]').setAttribute("content", t.title);
            document.querySelector('meta[property="og:description"]').setAttribute("content", t.seo_desc);
            document.querySelector('meta[property="og:site_name"]').setAttribute("content", currentLang === 'ko' ? '킹수학' : 'KingsMath');

            // 한국어일 때만 Jua 폰트 유지, 그 외 국가는 범용 폰트로 강제 보정
            if (currentLang === 'ko') document.body.classList.remove('lang-generic');
            else document.body.classList.add('lang-generic');

            // 화면 텍스트
            document.getElementById('title-text').innerText = t.title;
            document.getElementById('promo-text').innerText = t.promo;
            document.getElementById('promo-domain').innerText = t.domain_txt;
            document.getElementById('rules-content').innerHTML = t.rules_html;
            document.getElementById('btn-easy').innerText = t.btn_easy;
            document.getElementById('btn-hard').innerText = t.btn_hard;
            document.getElementById('other-games-link').innerText = t.btn_other;
            document.getElementById('replay-btn').innerText = t.btn_replay;

            // 도메인 링크 하드코딩 (현재 창)
            const promoLink = document.getElementById('promo-link');
            promoLink.href = "/";
            promoLink.target = "_self";
            const otherLink = document.getElementById('other-games-link');
            otherLink.href = "/";
            otherLink.target = "_self";
            
            // 버튼 텍스트
            const leftBtn = document.getElementById('btn-left');
            const rightBtn = document.getElementById('btn-right');
            if (!leftBtn.classList.contains('locked')) leftBtn.innerText = t.btn_submit;
            else leftBtn.innerText = t.btn_wait;
            if (!rightBtn.classList.contains('locked')) rightBtn.innerText = t.btn_submit;
            else rightBtn.innerText = t.btn_wait;
        }

        // ==========================================
        // 🏠 홈 이모지 - 전체 화면 지체 없이 첫 화면 로직
        // ==========================================
        document.getElementById('btn-home').addEventListener('click', () => {
            if (document.fullscreenElement) {
                // 게임 데이터 초기화
                gameState = 'ready';
                if (timerInterval) clearInterval(timerInterval);
                cancelAnimationFrame(animationId);
                
                // 화면 초기화 (메인 오버레이 다시 노출, 다국어 버튼 노출)
                document.getElementById('langSelectorContainer').style.display = 'block';
                document.getElementById('overlay').style.display = 'flex';
                document.getElementById('message-overlay').style.display = 'none';
                document.getElementById('replay-btn').style.display = 'none';
                
                if(window.playCutePopSound) window.playCutePopSound();
            } else {
                location.reload();
            }
        });

        // ==========================================
        // 기존 게임 로직 원형
        // ==========================================
        let gameDifficulty = 'easy';
        const imgP1 = new Image(); imgP1.src = "http://11ukul.com/wp-content/uploads/2025/12/1.png";
        const imgP2 = new Image(); imgP2.src = "http://11ukul.com/wp-content/uploads/2025/12/2.png";

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function playSlideSound() { playTone(100 + Math.random()*50, 'sawtooth', 0.1, 0.05); }
        function playLockSound() { playTone(600, 'square', 0.1, 0.2); setTimeout(() => playTone(1000, 'square', 0.1, 0.2), 100); }
        function playWinSound() { 
            setTimeout(() => playTone(400, 'sine', 0.1), 0);
            setTimeout(() => playTone(500, 'sine', 0.1), 100);
            setTimeout(() => playTone(600, 'sine', 0.1), 200);
            setTimeout(() => playTone(800, 'square', 0.4), 300);
        }
        function playFailSound() { playTone(200, 'sawtooth', 0.3); setTimeout(()=>playTone(150, 'sawtooth', 0.3), 200); }
        function playTick() { playTone(1000, 'sine', 0.05); }
        function playThrustSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; 
            osc.frequency.setValueAtTime(100, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1.0);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); 
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.0);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 1.0);
        }
        function playGameStartSound() {
            setTimeout(() => playTone(400, 'sine', 0.1, 0.3), 0);
            setTimeout(() => playTone(600, 'sine', 0.1, 0.3), 200);
            setTimeout(() => playTone(800, 'sine', 0.3, 0.3), 400);
        }
        function playCutePopSound() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, t);
            osc.frequency.exponentialRampToValueAtTime(1600, t + 0.1);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(t + 0.3);
        }

        let gameState = 'ready';
        let currentRound = 1;
        let timeLeft = 20;
        let timerInterval;
        let animationId;
        let p1Wins = 0; let p2Wins = 0;
        let targetRatio = 0.5;
        
        const redEmojis = ['🟥','🔴','🔺','🔻','♥️','♦️','☎️','🧰','🧨','🩸','🎈','🧧','🏮','📕','📌','📍','👹','👺','😡','🤬','🥵','👄','🫦','👅','❤️'];
        const blueEmojis = ['🟦','🔵','🔷','🔹','💙','🩵','🌐','🌀','💠','🥶','🫐','🧢','👕','👖','🧿','🪬','🧊','💧','💦','🌊','🦋','🐟','🐬','🐳','🪼'];
        
        const p1 = { id: 'left', canvasBg: null, ctxBg: null, canvasFg: null, ctxFg: null, ratio: 0.5, isDragging: false, locked: false, score: 0, particles: [], img: imgP1, anim: { active: false, state: '', yOffset: 0, shake: 0 } };
        const p2 = { id: 'right', canvasBg: null, ctxBg: null, canvasFg: null, ctxFg: null, ratio: 0.5, isDragging: false, locked: false, score: 0, particles: [], img: imgP2, anim: { active: false, state: '', yOffset: 0, shake: 0 } };

        window.onload = () => { 
            // 다국어 초기 세팅 적용
            const initLang = getInitialLanguage();
            const langObj = languagesData.find(l => l.code === initLang) || languagesData.find(l => l.code === 'en');
            currentLang = langObj.code;
            currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;
            currentLangSpan.textContent = langObj.name;
            renderLanguages(); // 목록 렌더링
            updateContent();

            initPlayer(p1, 'left'); 
            initPlayer(p2, 'right'); 
            window.addEventListener('resize', resizeAll); 
            resizeAll(); 
            animate(); 
        };
        
        function initPlayer(p, side) {
            p.canvasBg = document.getElementById(`canvas-${side}-bg`);
            p.ctxBg = p.canvasBg.getContext('2d');
            p.canvasFg = document.getElementById(`canvas-${side}-fg`);
            p.ctxFg = p.canvasFg.getContext('2d');
            
            p.canvasFg.addEventListener('pointerdown', (e) => startDrag(e, p));
            p.canvasFg.addEventListener('pointermove', (e) => moveDrag(e, p));
            p.canvasFg.addEventListener('pointerup', (e) => endDrag(e, p));
            p.canvasFg.addEventListener('pointercancel', (e) => endDrag(e, p));
            p.canvasFg.addEventListener('pointerout', (e) => endDrag(e, p));
        }

        function resizeAll() { resizeCanvas(p1); resizeCanvas(p2); }
        function resizeCanvas(p) { 
            const rect = p.canvasFg.parentElement.getBoundingClientRect();
            p.canvasBg.width = rect.width; p.canvasBg.height = rect.height;
            p.canvasFg.width = rect.width; p.canvasFg.height = rect.height;
            drawStatic(p);
        }
        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); }

        function initAudioAndStart(diff) { 
            gameDifficulty = diff;
            initAudio(); 
            startGame(); 
        }
        
        function replayGame() {
            document.getElementById('replay-btn').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
            startGame();
        }
        
        function startGame() { 
            document.getElementById('overlay').style.display = 'none'; 
            document.getElementById('replay-btn').style.display = 'none'; 
            document.getElementById('message-overlay').style.display = 'none'; 
            
            // 게임 시작 시 몰입을 위해 언어 선택기 숨김
            document.getElementById('langSelectorContainer').style.display = 'none';

            p1Wins = 0; p2Wins = 0; currentRound = 0; 
            
            const t = gameTranslations[currentLang];
            showMsgAndNext(`START!<br>${t.msg_adjust}`, 1);
        }
        
        function startRound(roundNum) {
            currentRound = roundNum; 
            gameState = 'playing'; 
            timeLeft = 20.0;
            generateProblem();
            resetPlayerRound(p1); resetPlayerRound(p2); 
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(gameLoop, 100);
            playGameStartSound();
        }

        function generateProblem() {
            let A, B;
            if (gameDifficulty === 'easy') {
                A = Math.floor(Math.random() * 9) + 1;
                B = Math.floor(Math.random() * 9) + 1;
                if (A===B) { B = A + 1; }
            } else {
                if (Math.random() < 0.6) {
                    A = Math.floor(Math.random() * 89) + 11;
                    B = Math.floor(Math.random() * 89) + 11;
                } else {
                    A = (Math.random() * 9 + 1).toFixed(1);
                    B = (Math.random() * 9 + 1).toFixed(1);
                }
            }
            const rEmoji = redEmojis[Math.floor(Math.random() * redEmojis.length)];
            const bEmoji = blueEmojis[Math.floor(Math.random() * blueEmojis.length)];
            const missionHtml = `${rEmoji} <span style="color:#ff4757; margin:0 5px;">${A}</span> <span style="color:white">:</span> <span style="color:#1e90ff; margin:0 5px;">${B}</span> ${bEmoji}`;
            document.getElementById('mission-target').innerHTML = missionHtml;
            targetRatio = parseFloat(A) / (parseFloat(A) + parseFloat(B));
        }

        function resetPlayerRound(p) {
            p.ratio = 0.5; p.locked = false; p.score = 0; p.particles = []; 
            p.anim = { active: false, state: '', yOffset: 0, shake: 0 };
            
            const btn = document.getElementById(`btn-${p.id}`); 
            btn.classList.remove('locked'); 
            btn.innerText = gameTranslations[currentLang].btn_submit; 
            btn.style.display = 'block';
            
            document.getElementById(`crown-${p.id}`).style.transform = 'translateX(-50%) scale(0)';
            document.getElementById(`result-${p.id}`).style.opacity = 0;
            drawStatic(p);
        }

        function gameLoop() {
            timeLeft -= 0.1;
            if (timeLeft <= 5.0 && timeLeft > 0 && Math.abs(timeLeft % 1) < 0.1) playTick();
            if (timeLeft <= 0) { timeLeft = 0; endRound(); }
            updateTimerUI();
        }

        function updateTimerUI() {
            const dt = Math.ceil(timeLeft), timerEl = document.getElementById('timer-text'), bg = document.getElementById('timer-bg');
            timerEl.innerText = dt;
            if (timeLeft <= 5) { 
                bg.style.background = '#ff0000'; 
                bg.style.animation = 'none';
                bg.style.transform = `translateX(-50%) scale(${1 + (timeLeft%1)*0.3})`; 
            } else { 
                bg.style.background = '#ff4757'; 
                bg.style.transform = ''; 
                bg.style.animation = 'pulse 1s infinite'; 
            }
        }

        function startDrag(e, p) {
            if (gameState !== 'playing' || p.locked) return; 
            p.isDragging = true;
            e.preventDefault(); 
            e.target.setPointerCapture(e.pointerId);
            updateRatioFromInput(e, p);
        }
        function moveDrag(e, p) {
            if (!p.isDragging || p.locked) return;
            e.preventDefault(); 
            updateRatioFromInput(e, p);
            if(Math.random() > 0.8) playSlideSound();
        }
        function endDrag(e, p) {
            p.isDragging = false;
            e.target.releasePointerCapture(e.pointerId);
        }
        function updateRatioFromInput(e, p) {
            const rect = p.canvasFg.getBoundingClientRect();
            let x = e.clientX - rect.left;
            const margin = rect.width * 0.1;
            const barWidth = rect.width - margin * 2;
            let r = (x - margin) / barWidth;
            if (r < 0) r = 0; if (r > 1) r = 1;
            p.ratio = r;
        }

        function lockPlayer(p) {
            if (gameState !== 'playing' || p.locked) return;
            playLockSound(); p.locked = true;
            const btn = document.getElementById(`btn-${p.id}`); 
            btn.classList.add('locked'); 
            btn.innerText = gameTranslations[currentLang].btn_wait;
            
            if (p1.locked && p2.locked) endRound();
            else if (timeLeft > 5) { timeLeft = 5.0; playTick(); }
        }

        function endRound() {
            clearInterval(timerInterval); 
            gameState = 'round_end';
            document.getElementById('btn-left').style.display = 'none'; 
            document.getElementById('btn-right').style.display = 'none';
            
            [p1, p2].forEach(p => {
                let diff = Math.abs(p.ratio - targetRatio);
                p.score = (diff * 100).toFixed(1);
            });
            
            let p1Score = parseFloat(p1.score);
            let p2Score = parseFloat(p2.score);
            
            let winner = null;
            if (p1Score < p2Score) winner = p1;
            else if (p2Score < p1Score) winner = p2;

            showResult(p1); showResult(p2);
            
            if (winner) {
                if (winner === p1) p1Wins++; else p2Wins++;
                triggerWin(winner); triggerLose(winner === p1 ? p2 : p1);
            } else {
                triggerLose(p1); triggerLose(p2);
            }
            setTimeout(() => finishMatch(), 2000); 
        }

        function showResult(p) {
            const el = document.getElementById(`result-${p.id}`);
            const t = gameTranslations[currentLang];
            el.innerHTML = `${p.score}${t.msg_error}`; 
            
            if (p.score < 5) el.style.color = "#39FF14"; 
            else if (p.score < 15) el.style.color = "#FFFF33"; 
            else el.style.color = "#FF00FF"; 
            el.style.opacity = 1;
        }

        function triggerWin(p) {
            const t = gameTranslations[currentLang];
            const crown = document.getElementById(`crown-${p.id}`);
            crown.innerText = t.msg_win;
            crown.style.transform = 'translateX(-50%) scale(1)';
            p.anim.active = true; p.anim.state = 'win';
            playThrustSound(); playWinSound();
        }

        function triggerLose(p) { p.anim.active = true; p.anim.state = 'lose'; playFailSound(); }

        function showMsgAndNext(t, n) { 
            const o = document.getElementById('message-overlay'); 
            const m = document.getElementById('msg-text'); 
            m.innerHTML = t; o.style.display = 'flex'; 
            playCutePopSound(); 
            setTimeout(() => { o.style.display = 'none'; startRound(n); }, 2500); 
        }
        
        function finishMatch() { 
            gameState = 'match_end'; 
            setTimeout(() => { document.getElementById('replay-btn').style.display = 'block'; }, 1000); 
        }

        function animate() {
            [p1, p2].forEach(p => {
                if (p.anim.active) {
                    if (p.anim.state === 'win') {
                        p.anim.yOffset -= 4; 
                        const rect = p.canvasFg.getBoundingClientRect();
                        const margin = rect.width * 0.1; const barW = rect.width - margin*2;
                        const shipX = margin + barW * p.ratio;
                        const shipY = p.canvasFg.height * 0.6 + 50 + p.anim.yOffset + 180; 
                        createThrustParticles(p, shipX, shipY, '#FFD700');
                        createThrustParticles(p, shipX, shipY, '#ff4757');
                    } else if (p.anim.state === 'lose') {
                        p.anim.shake = (Math.random() - 0.5) * 10;
                        const rect = p.canvasFg.getBoundingClientRect();
                        const margin = rect.width * 0.1; const barW = rect.width - margin*2;
                        const shipX = margin + barW * p.ratio;
                        const shipY = p.canvasFg.height * 0.6 + 50;
                        if(Math.random() > 0.5) createSmokeParticles(p, shipX, shipY);
                    }
                }
            });
            drawDynamic(p1); drawDynamic(p2); 
            updateParticles(p1); updateParticles(p2); 
            animationId = requestAnimationFrame(animate); 
        }
        
        function drawStatic(p) {
             if (!p.ctxBg) return;
             const w = p.canvasBg.width, h = p.canvasBg.height;
             p.ctxBg.clearRect(0,0,w,h);
        }

        function drawDynamic(p) {
            if (!p.ctxFg) return;
            const ctx = p.ctxFg;
            const w = p.canvasFg.width, h = p.canvasFg.height;
            ctx.clearRect(0, 0, w, h);
            
            const margin = w * 0.1; const barW = w - margin * 2;
            const barH = 40; const barY = h * 0.6; 
            
            ctx.fillStyle = '#ff4757'; ctx.fillRect(margin, barY, barW * p.ratio, barH);
            ctx.fillStyle = '#1e90ff'; ctx.fillRect(margin + barW * p.ratio, barY, barW * (1 - p.ratio), barH);
            ctx.strokeStyle = 'white'; ctx.lineWidth = 4; ctx.strokeRect(margin, barY, barW, barH);
            
            if (gameState === 'round_end' || gameState === 'match_end') {
                ctx.fillStyle = "white"; ctx.font = "bold 20px Jua"; ctx.textAlign = "center";
                if(p.ratio > 0.1) ctx.fillText((p.ratio*100).toFixed(0)+"%", margin + (barW*p.ratio)/2, barY + 28);
                if(p.ratio < 0.9) ctx.fillText(((1-p.ratio)*100).toFixed(0)+"%", margin + barW*p.ratio + (barW*(1-p.ratio))/2, barY + 28);

                const targetX = margin + barW * targetRatio;
                ctx.beginPath(); ctx.moveTo(targetX, barY - 30); ctx.lineTo(targetX, barY + barH + 30);
                ctx.strokeStyle = "#39FF14"; ctx.lineWidth = 4; ctx.setLineDash([5, 5]); ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = "#39FF14"; ctx.font = "bold 16px Jua"; ctx.fillText("Answer", targetX, barY - 35);
            }

            let shipSize = 120; 
            if (p.anim.active && p.anim.state === 'win') { shipSize = 200; }
            const shipX = margin + barW * p.ratio;
            const shipY = barY + barH + 10 + p.anim.yOffset; 
            
            ctx.save();
            ctx.translate(shipX + p.anim.shake, shipY);
            if (p.img && p.img.complete) {
                ctx.drawImage(p.img, -shipSize/2, 0, shipSize, shipSize);
            } else {
                ctx.fillStyle = "#FFD700"; ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(20, 60); ctx.lineTo(-20, 60); ctx.fill();
            }
            if (p.isDragging && !p.locked) {
                ctx.strokeStyle = "rgba(255, 255, 0, 0.5)"; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -h); ctx.stroke(); ctx.setLineDash([]);
            }
            ctx.restore();
            drawParticles(ctx, p.particles);
        }

        function createThrustParticles(p, x, y, c) { 
            for(let i=0; i<3; i++) {
                p.particles.push({ 
                    x: x+(Math.random()-0.5)*20, y: y, 
                    vx: (Math.random()-0.5)*5, vy: Math.random()*10 + 5, 
                    life: 1.0, color: c, size: Math.random()*8+4, type: 'fire'
                }); 
            }
        }
        function createSmokeParticles(p, x, y) {
            p.particles.push({
                x: x + (Math.random()-0.5)*30, y: y,
                vx: (Math.random()-0.5)*2, vy: -Math.random()*2 - 1, 
                life: 1.0, color: `rgba(150, 150, 150, ${Math.random()})`, size: Math.random()*10+5, type: 'smoke'
            });
        }
        function updateParticles(p) { 
            p.particles.forEach(pt => { 
                pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.03; 
                if(pt.type === 'smoke') pt.size += 0.5; else pt.size *= 0.9; 
            }); 
            p.particles = p.particles.filter(pt => pt.life > 0); 
        }
        function drawParticles(ctx, ps) { 
            ps.forEach(pt => { 
                ctx.globalAlpha = pt.life; ctx.fillStyle = pt.color; 
                ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill(); 
            }); 
            ctx.globalAlpha = 1.0; 
        }
    </script>
</body>
