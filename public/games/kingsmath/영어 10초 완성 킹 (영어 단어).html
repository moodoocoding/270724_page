        #result-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;

        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
        @keyframes popAnim { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.8; } 100% { transform: scale(0); opacity: 0; } }
        @keyframes spawnAnim { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

        @media (max-aspect-ratio: 1/1) {
            .play-area { flex-direction: column; }

            </div>
        </div>

            <div class="player-zone" id="zone-p1">
                <div class="game-board" id="board-p1"></div>

<script>
    /* 소프트 리셋 함수 추가 (전체화면 유지용) */
    function resetGame() {
        document.getElementById('result-modal').style.display = 'none';
        document.getElementById('game-screen').style.display = 'none';
        
        game.state.isPlaying = false;
        clearInterval(game.state.timerId);
        game.state.activePointers.clear();
        
        if (game.lineCtx) game.lineCtx.clearRect(0, 0, game.lineCanvas.width, game.lineCanvas.height);
        
        const intro = document.getElementById('intro-screen');
        intro.style.display = 'flex';
        intro.style.opacity = '1';
    }

    // 동적 폰트 크기 조절 (글자 수 감지)
    function adjustFontSize() {
        document.querySelectorAll('.dyn-text').forEach(el => {
            const length = el.innerText.replace(/\s/g, '').length;
            
            // 클래스별 기본 사이즈에서 텍스트 길이에 따라 비율 축소
            if (el.classList.contains('game-title')) {
                el.style.fontSize = length > 18 ? '3rem' : length > 12 ? '4rem' : '5rem';
            } else if (el.classList.contains('tutorial-text')) {
                el.style.fontSize = length > 50 ? '1.4rem' : '1.8rem';
            } else if (el.classList.contains('btn')) {
                el.style.fontSize = length > 15 ? '1.2rem' : length > 10 ? '1.4rem' : '1.8rem';
            } else if (el.classList.contains('team-name')) {
                el.style.fontSize = length > 12 ? '2rem' : '3rem';
            } else if (el.classList.contains('target-hint')) {
                el.style.fontSize = length > 25 ? '1.2rem' : '1.6rem';
            }
        });
    }

    window.addEventListener('load', adjustFontSize);

    /* ----------------------------------------------------------------
        Original Game Scripts
    ---------------------------------------------------------------- */
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    let lastTouch = 0;
    document.addEventListener('touchend', event => {
        const now = window.performance.now();
        if (now - lastTouch <= 300) event.preventDefault();
        lastTouch = now;
    }, false);

    function initBgBubbles() {
        const container = document.getElementById('bg-bubbles');
        for (let i = 0; i < 20; i++) {
            const b = document.createElement('div');
            b.classList.add('bg-bubble');
            const size = Math.random() * 60 + 20; 
            b.style.setProperty('--size', `${size}px`);
            b.style.setProperty('--left', `${Math.random() * 100}%`);
            b.style.setProperty('--duration', `${Math.random() * 10 + 10}s`);
            b.style.setProperty('--delay', `${Math.random() * 10}s`);
            container.appendChild(b);
        }
    }
    initBgBubbles();

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    const AudioSys = {
        ctx: null,
        init: function() { window.AudioContext = window.AudioContext || window.webkitAudioContext; this.ctx = new AudioContext(); },
        play: function(type) {
            if (!this.ctx) this.init();
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); const now = this.ctx.currentTime;
            
            if (type === 'start') {
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                notes.forEach((freq, i) => {
                    const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                    o.type = 'triangle'; o.frequency.value = freq;
                    g.gain.setValueAtTime(0.1, now + i * 0.05); g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.3);
                    o.connect(g); g.connect(this.ctx.destination); o.start(now + i * 0.05); o.stop(now + i * 0.05 + 0.3);
                });
                return;
            } else if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800 + Math.random() * 200, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'error') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1); osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'select') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'win') {
                const melody = [{f: 523.25, t: 0}, {f: 523.25, t: 0.1}, {f: 523.25, t: 0.2}, {f: 659.25, t: 0.4}, {f: 783.99, t: 0.6}, {f: 1046.50, t: 0.8}];
                melody.forEach(n => {
                    const o = this.ctx.createOscillator(); const g = this.ctx.createGain(); o.type = 'square'; o.frequency.value = n.f;
                    g.gain.setValueAtTime(0.1, now + n.t); g.gain.exponentialRampToValueAtTime(0.001, now + n.t + 0.4);
                    o.connect(g); g.connect(this.ctx.destination); o.start(now + n.t); o.stop(now + n.t + 0.4);
                });
                return;
            }
            osc.connect(gain); gain.connect(this.ctx.destination);
        }
    };

    const FX = {
        canvas: document.getElementById('fx-canvas'), ctx: null, particles: [],
        init: function() { this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); this.loop(); },
        resize: function() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
        spawn: function(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 6 + 2;
                this.particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.0, color: color, size: Math.random() * 8 + 3 });
            }
        },
        loop: function() {
            const ctx = this.ctx; ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            for (let i = this.particles.length - 1; i >= 0; i--) {
                let p = this.particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.04; p.size *= 0.92;
                if (p.life <= 0) { this.particles.splice(i, 1); continue; }
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill();
            }
            requestAnimationFrame(() => this.loop());
        }
    };

    const game = {
        state: { p1: { bubbles: [], dragging: null }, p2: { bubbles: [], dragging: null }, isPlaying: false, timeLeft: 60, timerId: null, activePointers: new Map() },
        colors: ['#ffb7b2', '#ffdac1', '#e2f0cb', '#b5ead7', '#c7ceea', '#fdfd96', '#fab1a0', '#81ecec'],
        lineCanvas: document.getElementById('line-canvas'),
        lineCtx: document.getElementById('line-canvas').getContext('2d'),

        init: function() {
            if (!this.initialized) {
                AudioSys.init(); FX.init(); 
                this.resizeLineCanvas();
                window.addEventListener('resize', () => this.resizeLineCanvas());
                const gameScreen = document.getElementById('game-screen');
                gameScreen.onpointerdown = (e) => this.handlePointerDown(e);
                gameScreen.onpointermove = (e) => this.handlePointerMove(e);
                gameScreen.onpointerup = (e) => this.handlePointerUp(e);
                gameScreen.onpointercancel = (e) => this.handlePointerUp(e);
                this.initialized = true;
            }
            AudioSys.play('start');

            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                
                // 점수 초기화
                document.getElementById('score-p1').innerText = '0';
                document.getElementById('score-p2').innerText = '0';
                
                this.setupPlayer('p1'); this.setupPlayer('p2');
                this.gameLoop(); 
            }, 500);
            
            this.state.isPlaying = true; this.state.timeLeft = 60; this.updateTimer();
            if(this.state.timerId) clearInterval(this.state.timerId);
            this.state.timerId = setInterval(() => {
                this.state.timeLeft--; this.updateTimer();
                if (this.state.timeLeft <= 0) this.endGame();
            }, 1000);
        },

        resizeLineCanvas: function() { this.lineCanvas.width = window.innerWidth; this.lineCanvas.height = window.innerHeight; },

        setupPlayer: function(pid) {
            const board = document.getElementById(`board-${pid}`);
            const hintText = "🎯 Make 10";
            board.innerHTML = `<div class="target-hint dyn-text">${hintText}</div>`;
            this.state[pid].bubbles = [];

            const rect = board.getBoundingClientRect();
            const bubbleSize = (rect.width / 9) * 1.2; 

            // 1부터 9까지 각 2개씩 총 18개 + 랜덤 2개를 배열로 생성합니다.
            let initialNumbers = [];
            for (let i = 1; i <= 9; i++) {
                initialNumbers.push(i);
                initialNumbers.push(i);
            }
            initialNumbers.push(Math.floor(Math.random() * 9) + 1);
            initialNumbers.push(Math.floor(Math.random() * 9) + 1);

            let positions = [];
            for (let i = 0; i < 20; i++) {
                let num = initialNumbers[i]; 
                let pos = this.getSafePosition(positions, rect.width, rect.height, bubbleSize);
                positions.push(pos);
                this.createBubbleElement(pid, num, pos.x, pos.y, bubbleSize, 1000 + i);
            }
        },

        getSafePosition: function(existing, w, h, size) {
            let x, y, overlap; let tries = 0;
            const padding = 4; const topMargin = 10; 
            do {
                overlap = false;
                x = Math.random() * (w - size - padding * 2) + padding;
                y = Math.random() * (h - size - padding * 2 - topMargin) + topMargin;
                for (let p of existing) {
                    const dist = Math.sqrt((x - p.x)**2 + (y - p.y)**2);
                    if (dist < size) { overlap = true; break; }
                }
                tries++;
            } while (overlap && tries < 1000);
            return {x, y};
        },

        createBubbleElement: function(pid, num, x, y, size, zIndex) {
            const numWords = {1: 'one', 2: 'two', 3: 'three', 4: 'four', 5: 'five', 6: 'six', 7: 'seven', 8: 'eight', 9: 'nine'};
            const board = document.getElementById(`board-${pid}`);
            const el = document.createElement('div');
            el.className = 'bubble'; 
            
            // 숫자를 영어 단어로 렌더링
            el.textContent = numWords[num]; 
            // 데이터셋에는 계속 정수를 보관하여 합산 검사가 제대로 작동하게 둡니다.
            el.dataset.val = num; 
            el.dataset.pid = pid; 
            
            const color = this.colors[Math.floor(Math.random() * this.colors.length)];
            el.style.setProperty('--bubble-bg', color);
            el.style.width = size + 'px'; el.style.height = size + 'px';
            el.style.left = x + 'px'; el.style.top = y + 'px';
            // 영어 단어가 한 줄에 잘 들어가도록 폰트 크기를 조절했습니다.
            el.style.fontSize = (size * 0.35) + 'px';
            el.style.zIndex = zIndex;
            board.appendChild(el);
            this.state[pid].bubbles.push({ num, el, x, y, size, color });
        },

        getBubbleAt: function(x, y, pid) {
            const pState = this.state[pid];
            for (let b of pState.bubbles) {
                const rect = b.el.getBoundingClientRect();
                const radius = rect.width / 2;
                if (Math.hypot(x - (rect.left + radius), y - (rect.top + radius)) < radius) return b.el;
            }
            return null;
        },

        handlePointerDown: function(e) {
            if (!this.state.isPlaying) return;
            if (e.target.classList.contains('bubble')) {
                e.preventDefault();
                const bubbleEl = e.target; const pid = bubbleEl.dataset.pid;
                bubbleEl.classList.add('active-drag'); AudioSys.play('select');
                this.state.activePointers.set(e.pointerId, { pid: pid, startEl: bubbleEl, path: [{x: e.clientX, y: e.clientY}], validPath: true });
            }
        },

        handlePointerMove: function(e) {
            if (this.state.activePointers.has(e.pointerId)) {
                e.preventDefault();
                const dragInfo = this.state.activePointers.get(e.pointerId);
                const curr = {x: e.clientX, y: e.clientY}; const prev = dragInfo.path[dragInfo.path.length - 1];
                if (Math.hypot(curr.x - prev.x, curr.y - prev.y) < 6) return;
                dragInfo.path.push(curr);

                const hoverBubbleEl = this.getBubbleAt(curr.x, curr.y, dragInfo.pid);
                if (dragInfo.validPath && this.checkSegmentCollision(dragInfo.pid, prev, curr, dragInfo.startEl, hoverBubbleEl)) {
                    this.handlePenalty(dragInfo.pid); this.stopDrag(e.pointerId); return;
                }
                if (hoverBubbleEl && hoverBubbleEl !== dragInfo.startEl) {
                    if (parseInt(dragInfo.startEl.dataset.val) + parseInt(hoverBubbleEl.dataset.val) !== 10) {
                        this.handlePenalty(dragInfo.pid); this.stopDrag(e.pointerId); return;
                    } else if (dragInfo.validPath) { 
                        this.handleCorrect(dragInfo.pid, dragInfo.startEl, hoverBubbleEl); this.stopDrag(e.pointerId); return;
                    }
                }
            }
        },

        handlePointerUp: function(e) { if (this.state.activePointers.has(e.pointerId)) this.stopDrag(e.pointerId, e.clientX, e.clientY); },

        stopDrag: function(pointerId, endX, endY) {
            const dragInfo = this.state.activePointers.get(pointerId);
            if(!dragInfo) return;
            dragInfo.startEl.classList.remove('active-drag');
            this.state.activePointers.delete(pointerId);
        },

        checkSegmentCollision: function(pid, p1, p2, startEl, hoverEl) {
            const pState = this.state[pid];
            for (let b of pState.bubbles) {
                if (b.el === startEl || b.el === hoverEl) continue; 
                const bRect = b.el.getBoundingClientRect();
                const bx = bRect.left + bRect.width/2; const by = bRect.top + bRect.height/2; const radius = bRect.width/2 * 0.6; 
                if (this.lineIntersectsCircle(p1.x, p1.y, p2.x, p2.y, bx, by, radius)) return true;
            }
            return false;
        },

        lineIntersectsCircle: function(x1, y1, x2, y2, cx, cy, r) {
            const dx = x2 - x1; const dy = y2 - y1; const lenSq = dx*dx + dy*dy;
            if (lenSq === 0) return false;
            let t = Math.max(0, Math.min(1, ((cx - x1) * dx + (cy - y1) * dy) / lenSq));
            return ((cx - (x1 + t * dx))**2 + (cy - (y1 + t * dy))**2) < r*r;
        },

        gameLoop: function() {
            if (!this.state.isPlaying) return;
            const ctx = this.lineCtx; ctx.clearRect(0, 0, this.lineCanvas.width, this.lineCanvas.height);
            this.state.activePointers.forEach(drag => {
                if (drag.path.length < 2) return;
                ctx.beginPath(); ctx.moveTo(drag.path[0].x, drag.path[0].y);
                for (let i = 1; i < drag.path.length; i++) ctx.lineTo(drag.path[i].x, drag.path[i].y);
                ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.setLineDash([]); ctx.stroke();
                
                const last = drag.path[drag.path.length - 1];
                ctx.beginPath(); ctx.arc(last.x, last.y, 8, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
            });
            requestAnimationFrame(() => this.gameLoop());
        },

        handleCorrect: function(pid, el1, el2) {
            AudioSys.play('pop');
            const color1 = getComputedStyle(el1).getPropertyValue('--bubble-bg'); const rect1 = el1.getBoundingClientRect(); FX.spawn(rect1.left + rect1.width/2, rect1.top + rect1.height/2, color1);
            const color2 = getComputedStyle(el2).getPropertyValue('--bubble-bg'); const rect2 = el2.getBoundingClientRect(); FX.spawn(rect2.left + rect2.width/2, rect2.top + rect2.height/2, color2);

            el1.classList.add('popping'); el2.classList.add('popping');
            setTimeout(() => { el1.remove(); el2.remove(); }, 300);

            const pState = this.state[pid];
            pState.bubbles = pState.bubbles.filter(b => b.el !== el1 && b.el !== el2);
            const scoreEl = document.getElementById(`score-${pid}`); scoreEl.innerText = parseInt(scoreEl.innerText) + 200;

            setTimeout(() => {
                const board = document.getElementById(`board-${pid}`); const rect = board.getBoundingClientRect();
                const existingPos = pState.bubbles.map(b => ({x: b.x, y: b.y})); 
                const size = (rect.width / 9) * 1.2;

                // 1~5 1개, 5~9 1개가 리스폰되도록 배열을 구성합니다.
                const newNums = [
                    Math.floor(Math.random() * 5) + 1,
                    Math.floor(Math.random() * 5) + 5
                ];

                for(let i=0; i<2; i++) {
                    const num = newNums[i];
                    const newPos = this.getSafePosition(existingPos, rect.width, rect.height, size);
                    existingPos.push(newPos); 
                    this.createBubbleElement(pid, num, newPos.x, newPos.y, size, 2000+i);
                    pState.bubbles[pState.bubbles.length-1].el.classList.add('respawning');
                }
            }, 300);
        },

        handlePenalty: function(pid) {
            AudioSys.play('error');
            const board = document.getElementById(`board-${pid}`); board.classList.remove('shake-anim'); void board.offsetWidth; board.classList.add('shake-anim');
            const scoreEl = document.getElementById(`score-${pid}`); scoreEl.innerText = Math.max(0, parseInt(scoreEl.innerText) - 50);
        },

        updateTimer: function() { document.getElementById('timer-display').innerText = this.state.timeLeft; document.getElementById('timer-bar').style.width = (this.state.timeLeft / 60) * 100 + '%'; },
        
        endGame: function() {
            this.state.isPlaying = false; clearInterval(this.state.timerId); AudioSys.play('win');
            const s1 = parseInt(document.getElementById('score-p1').innerText); const s2 = parseInt(document.getElementById('score-p2').innerText);
            document.getElementById('result-modal').style.display = 'flex';
            document.getElementById('final-p1').innerText = s1; document.getElementById('final-p2').innerText = s2;
            const wTxt = document.getElementById('winner-text');
            
            if (s1 > s2) wTxt.innerHTML = `<span style='color:var(--p1-main)'>🐶 Win!</span>`;
            else if (s2 > s1) wTxt.innerHTML = `<span style='color:var(--p2-main)'>🐱 Win!</span>`;
            else wTxt.innerText = "🤝 Draw!";
        }
    };
</script>
