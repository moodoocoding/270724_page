<style>
    /* 1. 기본 설정 및 전자칠판 최적화 */
    body {
        margin: 0; padding: 0;
        background-color: #0b0e27;
        background-image: 
            radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
            radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
            radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
        background-size: 550px 550px, 350px 350px, 250px 250px;
        overflow: hidden; /* 스크롤 방지 */
        font-family: 'Jua', sans-serif;
        touch-action: none; /* 터치 제스처(확대/이동) 차단 */
        user-select: none; /* 텍스트 선택 방지 */
        -webkit-user-select: none;
        -webkit-touch-callout: none; /* iOS 롱터치 메뉴 방지 */
    }

    /* 2. 레이아웃 */
    #top-area {
        position: absolute; top: 0; left: 0; width: 100%; height: 25%;
        display: none;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 500;
        padding-top: 5px; box-sizing: border-box;
    }
        
    #game-area {
        position: absolute; top: 25%; left: 0; width: 100%; height: 75%;
        display: flex;
    }

    .player-zone {
        flex: 1; position: relative;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        border-right: 2px solid rgba(255,255,255,0.1);
        overflow: hidden;
    }
    .player-zone:last-child { border-right: none; }

    /* 3. 데이터 표 스타일 */
    .data-table-container {
        background: rgba(255, 255, 255, 0.95);
        border: 3px solid #333;
        border-radius: 10px;
        padding: 5px 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        width: 85%;
        max-width: 900px;
        text-align: center;
    }
        
    .table-title {
        color: #000; font-size: 1.8vw; margin-bottom: 5px; font-weight: normal !important;
    }

    .custom-table {
        width: 100%; border-collapse: collapse; color: #000; font-size: 1.5vw;
        font-weight: normal !important;
    }
    .custom-table th, .custom-table td {
        border: 2px solid #555;
        padding: 5px 2px;
        background: #fff;
        font-weight: normal !important;
    }
    .custom-table thead th {
        background-color: #f0f0f0;
        font-weight: normal !important;
    }
    .table-header-col {
        background-color: #e0e0e0 !important;
        width: 15%;
        font-size: 1.3vw;
    }
        
    .t-sum { color: #000; background-color: #fffbd7 !important; font-weight: normal !important; }

    /* 4. 캔버스 및 컨트롤 */
    .canvas-container {
        flex: 1; width: 100%; height: 100%; position: relative;
    }
    canvas {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }

    /* 원그래프용 버튼 위치 조정 (그래프 아래) */
    .ingame-btn {
        position: absolute;
        top: 75%; /* 원그래프는 세로 공간을 더 쓰므로 버튼을 더 내림 */
        left: 50%; transform: translateX(-50%);
        width: 320px;
        height: 80px;
        border-radius: 20px;
        border: none;
        border-bottom: 10px solid rgba(0,0,0,0.3);
        font-family: inherit; font-size: 2vw; color: white;
        cursor: pointer; 
        transition: transform 0.05s, border-bottom 0.05s;
        display: flex; justify-content: center; align-items: center; flex-direction: row;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        z-index: 300;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        touch-action: manipulation;
        white-space: nowrap;
        gap: 10px;
    }

    .ingame-btn:active, .ingame-btn.pressed {
        transform: translateX(-50%) translateY(8px);
        border-bottom: 2px solid rgba(0,0,0,0.3);
    }
    
    .instruction-text {
        position: absolute;
        top: 90%; /* 버튼 바로 위 */
        width: 100%;
        text-align: center;
        color: rgba(255, 255, 255, 0.8);
        font-size: 1.3vw;
        pointer-events: none;
        z-index: 200;
        text-shadow: 0 0 5px black;
    }

    /* 5. 오버레이 및 UI */
    #overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(11, 14, 39, 0.98);
        display: flex; justify-content: center; align-items: center;
        flex-direction: column; z-index: 1000;
        text-align: center;
    }
    .title-logo {
        font-size: 4.5vw;
        color: #fff; margin-bottom: 10px;
        text-shadow: 0 0 20px #00ffff, 5px 5px 0px #e74c3c;
        animation: bounce 2s infinite;
    }
    .mode-select-box {
        display: flex; gap: 30px; margin-top: 30px;
    }
    .start-btn {
        padding: 15px 30px; font-size: 1.5vw;
        color: white;
        border: none; border-radius: 20px; cursor: pointer;
        font-family: inherit; 
        transition: transform 0.1s;
        min-width: 180px;
        box-shadow: 0 6px 0 rgba(0,0,0,0.3);
    }
    .btn-easy { background: linear-gradient(to bottom, #2ecc71, #27ae60); box-shadow: 0 6px 0 #1e8449; }
    .btn-hard { background: linear-gradient(to bottom, #e74c3c, #c0392b); box-shadow: 0 6px 0 #96281b; }
    
    .start-btn:active { transform: translateY(6px); box-shadow: none; }
    .start-btn:hover { filter: brightness(1.1); }

    .rules-box {
        background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 15px;
        margin-bottom: 15px; color: #ddd; font-size: 1.0vw;
        line-height: 1.6;
        text-align: left; border: 1px solid rgba(255,255,255,0.2); max-width: 60%;
    }

    #message-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); display: none; justify-content: center;
        align-items: center; flex-direction: column; z-index: 800; pointer-events: none;
    }
    .big-message {
        font-size: 8vw; color: white; text-shadow: 0 0 30px #ff00de;
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .winner-crown {
        position: absolute; 
        top: 1%; /* 위치를 위로 조금 더 올림 */
        left: 50%;
        transform: translateX(-50%) scale(0);
        font-size: 3vw; color: #FFD700; z-index: 600;
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        width: auto; text-align: center;
        white-space: nowrap;
        background-color: rgba(0, 0, 0, 0.8); /* 검정 배경 추가 */
        padding: 5px 20px; /* 패딩 추가 */
        border-radius: 15px; /* 둥근 모서리 */
    }
    .error-display {
        position: absolute; 
        top: 75%; /* 그래프 아래쪽 */
        width: 100%; text-align: center;
        font-size: 2.5vw; color: #fff; text-shadow: 0 0 10px #000;
        opacity: 0; transition: opacity 0.5s; z-index: 500; pointer-events: none;
    }

    #btn-home, #fullscreen-btn {
        position: absolute; bottom: 20px;
        padding: 10px 15px; font-size: 1.8vw;
        background: rgba(255, 255, 255, 0.2); color: white;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 15px; cursor: pointer; z-index: 2000;
        font-family: 'Jua', sans-serif;
    }
    #btn-home { left: 20px; }
    #fullscreen-btn { right: 20px; }

    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .fruit-icon { font-size: 2.5vw; display: inline-block; margin-right: 5px; margin-bottom: 0; }

    /* --- 다국어 버튼/모달 독립 CSS (충돌 방지 및 Z-INDEX 강제) --- */
    #langTriggerBtnContainer {
        position: absolute;
        top: 1rem;
        right: 1rem;
        z-index: 99999 !important;
    }
    @media (min-width: 640px) {
        #langTriggerBtnContainer { top: 1.5rem; right: 1.5rem; }
    }
    
    #langModal {
        z-index: 99999 !important;
        font-family: sans-serif;
    }
    
    #toastNotification {
        z-index: 99999 !important;
        font-family: sans-serif;
    }

    /* 폰트어썸 아이콘 깨짐 방지용 예외 처리 */
    i[class^="fa-"] {
        font-family: "Font Awesome 6 Free" !important;
        font-weight: 900 !important;
    }

    /* 모달창 내부 박스 사이징 강제 보정 */
    #langModal, #langModal * {
        box-sizing: border-box !important;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

    .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

    .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>

        grid.innerHTML = '';

        const filteredLangs = languagesList.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||

    function detectLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        if (langParam && I18N[langParam]) return langParam;
        const storedLang = localStorage.getItem('kingsmath_lang');
        if (storedLang && I18N[storedLang]) return storedLang;
        const browserLang = navigator.language.slice(0, 2);
        if (I18N[browserLang]) return browserLang;
        return 'en';
    }

    /* 오디오 시스템 */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function createOscillator(freq, type, startTime, duration, volVal) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(volVal, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
    }

    function sfxStart() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        createOscillator(523.25, 'sine', now, 0.2, 0.2); 
        createOscillator(659.25, 'sine', now + 0.1, 0.2, 0.2); 
        createOscillator(783.99, 'sine', now + 0.2, 0.2, 0.2); 
        createOscillator(1046.50, 'triangle', now + 0.3, 0.6, 0.3); 
    }

    function sfxStop() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        createOscillator(880, 'sine', now, 0.1, 0.3); 
        createOscillator(1760, 'sine', now, 0.05, 0.1); 
    }

    function sfxWin() { 
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        createOscillator(523.25, 'triangle', now, 0.3, 0.3);
        createOscillator(523.25, 'triangle', now + 0.15, 0.3, 0.3);
        createOscillator(523.25, 'triangle', now + 0.3, 0.3, 0.3);
        createOscillator(659.25, 'triangle', now + 0.45, 0.8, 0.3);
        
        setTimeout(() => {
            createOscillator(783.99, 'sine', audioCtx.currentTime, 1.0, 0.2);
            createOscillator(1046.50, 'sine', audioCtx.currentTime, 1.0, 0.2);
        }, 450);
    }

    function generateData() {
        let tempFruits = JSON.parse(JSON.stringify(RAW_FRUITS));
        let values = [];
        for(let i=0; i<5; i++) { values.push(Math.floor(Math.random() * 50) + 10); }

        tempFruits.forEach((f, i) => { f.rawValue = values[i]; });
        tempFruits.sort((a, b) => b.rawValue - a.rawValue);

        let total = tempFruits.reduce((a, b) => a + b.rawValue, 0);
        let currentPercentSum = 0;
        
        tempFruits.forEach((f, i) => {
            if (i === 4) { f.percent = 100 - currentPercentSum; } 
            else {
                f.percent = Math.round((f.rawValue / total) * 100);
                currentPercentSum += f.percent;
            }
        });

        gameConfig.sortedFruits = tempFruits;
        gameConfig.totalCount = total;
        renderTable();
    }

    function renderTable() {
        const t = I18N[currentLang]; 
        const thead = document.getElementById('table-head');
        const row = document.getElementById('data-row');
        
        let unit = gameConfig.mode === 'easy' ? '%' : t.unitPeople;
        let totalLabel = gameConfig.mode === 'easy' ? '100%' : gameConfig.totalCount;

        let thHtml = `<th class="table-header-col">${t.tableHeaderFruit}</th>`;
        gameConfig.sortedFruits.forEach(f => { thHtml += `<th style="color:${f.color}">${f.name}</th>`; });
        thHtml += `<th class="t-sum">${t.tableHeaderSum}</th>`;
        thead.innerHTML = thHtml;

        let tdHtml = `<td class="table-header-col">${unit === '%' ? t.tableHeaderRatio : t.tableHeaderCount} (${unit})</td>`;
        gameConfig.sortedFruits.forEach(f => {
            let displayContent = "";
            if (gameConfig.mode === 'easy') { displayContent = f.percent; } 
            else {
                if (gameConfig.showHardModeAnswer) {
                    displayContent = `${f.rawValue}<br><span style="font-size:0.8em; color:#e74c3c">(${f.percent}%)</span>`;
                } else {
                    displayContent = `${f.rawValue}<br><span style="font-size:0.8em; color:#aaa">(??%)</span>`;
                }
            }
            tdHtml += `<td>${displayContent}</td>`;
        });
        tdHtml += `<td class="t-sum">${totalLabel}</td>`;
        row.innerHTML = tdHtml;
    }

    function initPlayerState(p) {
        p.currentIdx = 0; p.clicks = []; p.movingVal = 0; p.dir = 1; p.finished = false;
        updateButton(p.id);

    function updateButton(pid) {
        const p = players[pid];
        const container = document.getElementById(`btn-container-${pid}`);
        container.innerHTML = ''; 

        if (p.finished || p.currentIdx >= 4) return;

        const fruit = gameConfig.sortedFruits[p.currentIdx];
        const btn = document.createElement('button');
        btn.className = 'ingame-btn';
        btn.style.backgroundColor = fruit.color;
        if (fruit.color === '#f1c40f') btn.style.color = '#333';
        
        const t = I18N[currentLang];
        // 폰트 크기 동적 조절 (글자가 너무 길면 줄임)
        let fontSizeStyle = "";
        let textLen = fruit.name.length + t.stopBtn.length;
        if (textLen > 15) { fontSizeStyle = "font-size: 1.2vw;"; } 
        else if (textLen > 9) { fontSizeStyle = "font-size: 1.5vw;"; }

        btn.innerHTML = `<span class="fruit-icon">${fruit.icon}</span> <span style="${fontSizeStyle}">${fruit.name} ${t.stopBtn}</span>`;
        
        const triggerInput = (e) => {
            if (e.cancelable) e.preventDefault();
            e.stopPropagation();
            btn.classList.add('pressed');
            handleInput(pid);
        };

        btn.addEventListener('touchstart', triggerInput, { passive: false });
        btn.addEventListener('mousedown', triggerInput);

        const release = function() { btn.classList.remove('pressed'); };
        btn.addEventListener('touchend', release);
        btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);

        container.appendChild(btn);
    }

    function startGame() {
        const t = I18N[currentLang];
        isPlaying = true;
        gameConfig.showHardModeAnswer = false;
        document.getElementById('result-modal').style.display = 'none';
        
        document.querySelectorAll('.instruction-text').forEach(el => { el.style.display = 'block'; });

        generateData();
        initPlayerState(players.p1);
        initPlayerState(players.p2);

        const msg = document.getElementById('message-overlay');
        const txt = document.getElementById('msg-text');
        msg.style.display = 'flex';
        txt.innerHTML = t.ready;
        sfxStart();

        setTimeout(() => {
            txt.innerHTML = t.start;
            setTimeout(() => {
                msg.style.display = 'none';

            }, 600);

    function handleInput(pid) {
        if (!isPlaying) return;
        const p = players[pid];
        if (p.finished) return;

        let capturedPercent = p.movingVal;
        let prevSum = 0;
        if (p.currentIdx > 0) prevSum = p.clicks[p.currentIdx - 1].accumulatedPercent;

        let segmentWidth = capturedPercent - prevSum;
        if (segmentWidth < 0) segmentWidth = 0;

        p.clicks.push({ fruitIdx: p.currentIdx, accumulatedPercent: capturedPercent, segmentWidth: segmentWidth });
        sfxStop(); 
        p.currentIdx++;

        if (p.currentIdx >= 4) { finishPlayer(p); } 
        else { p.dir = 1; updateButton(pid); }
    }

    function finishPlayer(p) {
        p.finished = true;
        let lastPrev = p.clicks[p.clicks.length - 1].accumulatedPercent;
        p.clicks.push({ fruitIdx: 4, accumulatedPercent: 100, segmentWidth: 100 - lastPrev });
        updateButton(p.id);

        if (players.p1.finished && players.p2.finished) endGame();
    }

    function endGame() {
        const t = I18N[currentLang];
        isPlaying = false;
        cancelAnimationFrame(animId);

        document.querySelectorAll('.instruction-text').forEach(el => { el.style.display = 'none'; });

        if (gameConfig.mode === 'hard') {
            gameConfig.showHardModeAnswer = true;
            renderTable();
        }

        let p1Err = calculateError(players.p1);
        let p2Err = calculateError(players.p2);

        document.getElementById('error-p1').innerText = `${t.totalError}: ${p1Err}`;
        document.getElementById('error-p1').style.opacity = 1;
        document.getElementById('error-p2').innerText = `${t.totalError}: ${p2Err}`;
        document.getElementById('error-p2').style.opacity = 1;

        if (p1Err < p2Err) { document.getElementById(`crown-p1`).style.transform = 'translateX(-50%) scale(1)'; } 
        else if (p2Err < p1Err) { document.getElementById(`crown-p2`).style.transform = 'translateX(-50%) scale(1)'; } 
        else {
            document.getElementById(`crown-p1`).style.transform = 'translateX(-50%) scale(1)';
            document.getElementById(`crown-p2`).style.transform = 'translateX(-50%) scale(1)';
        }
        sfxWin(); 
        
        draw(players.p1, 'canvas-p1');
        draw(players.p2, 'canvas-p2');

        setTimeout(() => { document.getElementById('result-modal').style.display = 'block'; }, 2000);
        
        // 결과창 표시 시 언어 모달 버튼도 다시 표시
        document.getElementById('langTriggerBtnContainer').style.display = 'block';
    }

    function calculateError(p) {
        let totalError = 0;
        for (let i = 0; i < 5; i++) {
            let target = gameConfig.sortedFruits[i].percent;
            let userWidth = p.clicks[i].segmentWidth;
            totalError += Math.abs(target - userWidth);
        }
        return Math.floor(totalError);
    }

    function loop() {
        if (!isPlaying) return;
        updatePlayer(players.p1);
        updatePlayer(players.p2);
        draw(players.p1, 'canvas-p1');
        draw(players.p2, 'canvas-p2');
        animId = requestAnimationFrame(loop);
    }

    function updatePlayer(p) {
        if (p.finished) return;
        let startPos = 0;
        if (p.currentIdx > 0) startPos = p.clicks[p.currentIdx - 1].accumulatedPercent;
        
        let endPos = 100;
        let baseSpeed = 0.4;
        let speed = baseSpeed + (p.currentIdx * 0.12); 

        if (p.movingVal < startPos) p.movingVal = startPos;
        p.movingVal += speed * p.dir;

        if (p.movingVal >= endPos) { p.movingVal = endPos; p.dir = -1; }
        if (p.movingVal <= startPos) { p.movingVal = startPos; p.dir = 1; }
    }

    function toRad(percent) { return (percent / 100) * (2 * Math.PI) - (Math.PI / 2); }

    function draw(p, canvasId) {
        const t = I18N[currentLang];
        const cvs = document.getElementById(canvasId);
        const ctx = cvs.getContext('2d');
        const w = cvs.width;
        const h = cvs.height;

        ctx.clearRect(0, 0, w, h);

        const cx = w / 2;
        const cy = h * 0.42; 
        const radius = Math.min(w, h) * 0.245; 

        // 1. 배경 원
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fillStyle = '#444'; ctx.fill();

        // 2. 확정된 구간
        let currentP = 0;
        p.clicks.forEach((click, i) => {
            const fruit = gameConfig.sortedFruits[i];
            const startAngle = toRad(currentP);
            const endAngle = toRad(currentP + click.segmentWidth);
            
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, radius, startAngle, endAngle);
            ctx.closePath(); ctx.fillStyle = fruit.color; ctx.fill();
            
            if (click.segmentWidth > 4) { 
                const midAngle = (startAngle + endAngle) / 2;
                const textRadius = radius * 0.7; 
                const tx = cx + Math.cos(midAngle) * textRadius;
                const ty = cy + Math.sin(midAngle) * textRadius;

                ctx.fillStyle = (fruit.color === '#f1c40f') ? '#000' : '#fff';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                
                let fontSize = Math.min(radius * 0.15, (click.segmentWidth/100)*radius*3);
                if (fontSize < 12) fontSize = 12;
                if (fontSize > 24) fontSize = 24;
       ctx.font = `${fontSize}px ${t.font}`;

                ctx.fillText(fruit.name, tx, ty - fontSize * 0.6);

                let displayVal = "";
                if (gameConfig.mode === 'easy') { displayVal = Math.round(click.segmentWidth) + '%'; } 
                else {
                    let val = Math.round((click.segmentWidth / 100) * gameConfig.totalCount);
                    let percentVal = Math.round(click.segmentWidth);
                    displayVal = val + t.unitPeople + '(' + percentVal + '%)';
                }
                ctx.fillText(displayVal, tx, ty + fontSize * 0.6);
            }
            currentP += click.segmentWidth;
        });

        // 3. 움직이는 게이지
        if (!p.finished) {
            const currentFruit = gameConfig.sortedFruits[p.currentIdx];
            let startP = 0;
            if (p.currentIdx > 0) startP = p.clicks[p.currentIdx - 1].accumulatedPercent;
            let movingP = p.movingVal;

            const startAngle = toRad(startP);
            const endAngle = toRad(movingP);

            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, radius, startAngle, endAngle);
            ctx.closePath(); ctx.fillStyle = currentFruit.color; ctx.globalAlpha = 0.8; ctx.fill(); ctx.globalAlpha = 1.0;

            const lineX = cx + Math.cos(endAngle) * (radius + 10);
            const lineY = cy + Math.sin(endAngle) * (radius + 10);
            
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(lineX, lineY); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();

ctx.fillStyle = '#fff'; ctx.font = `1vw ${t.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const textX = cx + Math.cos(endAngle) * (radius + 35);
            const textY = cy + Math.sin(endAngle) * (radius + 35);
            ctx.fillText(Math.round(movingP - startP) + '%', textX, textY);
        }

        // 4. 외곽선 및 눈금
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#ccc'; ctx.font = `1.0vw ${t.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

        for(let i=0; i<100; i+=10) {
            const angle = toRad(i);
            const rStart = radius - 5;
            const rEnd = radius + 5;
            const x1 = cx + Math.cos(angle) * rStart; const y1 = cy + Math.sin(angle) * rStart;
            const x2 = cx + Math.cos(angle) * rEnd; const y2 = cy + Math.sin(angle) * rEnd;

            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            const labelR = radius + 20; const lx = cx + Math.cos(angle) * labelR; const ly = cy + Math.sin(angle) * labelR;
            let label = i === 0 ? "0/100" : i; ctx.fillText(label, lx, ly);
        }
        if (p.finished && !isPlaying) drawAnswer(ctx, cx, cy, radius);
    }
    
    function drawAnswer(ctx, cx, cy, radius) {
        let currentP = 0;
        ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 4; ctx.setLineDash([5, 5]);
        gameConfig.sortedFruits.forEach(f => {
            currentP += f.percent;
            if (currentP < 100) {
                const angle = toRad(currentP);
                const x = cx + Math.cos(angle) * (radius + 15); const y = cy + Math.sin(angle) * (radius + 15);
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
                
                const tx = cx + Math.cos(angle) * (radius + 40); const ty = cy + Math.sin(angle) * (radius + 40);
            ctx.fillStyle = '#ffff00'; ctx.font = `1vw ${I18N[currentLang].font}`; ctx.fillText(currentP + '%', tx, ty);
            }
        });
        ctx.setLineDash([]);
    }

    function resizeCanvas() {
        const c1 = document.getElementById('canvas-p1'); const c2 = document.getElementById('canvas-p2');
        const con = c1.parentElement;
        c1.width = con.clientWidth; c1.height = con.clientHeight; c2.width = con.clientWidth; c2.height = con.clientHeight;
        if (!isPlaying && players.p1.clicks.length > 0) { draw(players.p1, 'canvas-p1'); draw(players.p2, 'canvas-p2'); }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } 
        else { if (document.exitFullscreen) document.exitFullscreen(); }
    }
</script>
