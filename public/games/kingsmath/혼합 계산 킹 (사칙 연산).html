/* ==============================================================
   [게임 기본 폰트 설정 및 언어별 폰트 분기]
   - 한국어는 주아체(Jua), 영문 및 다국어는 시스템 기본 고딕 사용
   ============================================================== */
body { font-family: 'Jua', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: normal; }
body.lang-en, body.lang-es, body.lang-fr, body.lang-de, body.lang-it, body.lang-pt-br, 
body.lang-ru, body.lang-id, body.lang-vi, body.lang-tr { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important; }
body.lang-zh { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif !important; }
body.lang-ja { font-family: 'Meiryo', 'Hiragino Kaku Gothic ProN', sans-serif !important; }
body.lang-th { font-family: 'Leelawadee UI', 'Tahoma', sans-serif !important; }
body.lang-hi { font-family: 'Mangal', 'Arial Unicode MS', sans-serif !important; }
body.lang-bn { font-family: 'Vrinda', 'Arial Unicode MS', sans-serif !important; }

/* 폰트 어썸 아이콘 깨짐 방지용 강제 보호 처리 */
i[class^="fa-"], i[class*=" fa-"], .fa-solid, .fa-regular {
    font-family: "Font Awesome 6 Free" !important;
    font-weight: 900 !important;
    font-style: normal !important;
}

:root {
    --bg: #121212;
    --panel-bg: #1e1e2e;
    --dark: #e0e0e0;
    --text-muted: #a0a0a0;
    --border-color: #333333;

    --dog-color: #332b00;
    --cat-color: #1e1b2e;
    --rabbit-color: #2e151a;
    --hamster-color: #2e1e0f;
    --panda-color: #0f2e26;
    --monkey-color: #221826;

    --correct: #69db7c;
    --wrong: #ff6b6b;
    --eliminated: #333333;
}

body {
    margin: 0; background: var(--bg); color: var(--dark); overflow: hidden;
    user-select: none; -webkit-user-select: none; 
    touch-action: none; 
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    transition: background 0.3s, color 0.3s;
}

/* ==============================================================
   [모달 및 글로벌 UI 전용 스타일] (기존 CSS와 독립)
   ============================================================== */
#langModal, #langModal * { box-sizing: border-box !important; }
#langModal span, #langModal p, #langModal input, #langModal h2 { font-family: 'Noto Sans KR', sans-serif; }
#langTriggerContainer button { font-family: 'Noto Sans KR', sans-serif; }

.custom-scrollbar::-webkit-scrollbar { width: 8px; }
.custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

.modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

.toast-anim { transform: translateY(100%); opacity: 0; font-family: 'Noto Sans KR', sans-serif; transition: all 0.3s ease; }
.toast-anim.show { transform: translateY(0); opacity: 1; }

/* ==============================================================
   [게임 UI Components]
   ============================================================== */
#overlay {
    position: fixed; inset: 0; background: var(--bg); opacity: 0.98;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 100; backdrop-filter: blur(15px);
    text-align: center; overflow-y: auto; padding-bottom: 50px;
}

.title-area { margin: 8px 0 4px 0; }
#msgTitle { font-size: clamp(2rem, 5vw, 3.5rem); color: var(--dark); margin: 0; text-shadow: 0 4px 10px rgba(0,0,0,0.2); font-weight: normal; line-height: 1.2; padding: 0 10px; transition: font-size 0.3s;}
.subtitle { color: var(--text-muted); font-size: clamp(1rem, 3vw, 1.2rem); margin-top: 0px; font-weight: normal; word-break: keep-all; }
.top-link { color: #339af0; text-decoration: none; font-weight: bold; }

#setupArea { width: 500px; max-width: 95vw; margin: 0 auto; display: flex; flex-direction: column; gap: 5px; }
.setup-group { text-align: left; }
.setup-label { font-size: 1.3rem; color: var(--dark); margin-bottom: 8px; display: block; font-weight: normal; }

.custom-select {
    width: 100%; font-family: inherit; font-size: 1.2rem; padding: 15px;
    border-radius: 15px; border: 2px solid var(--border-color);
    background: var(--panel-bg); color: var(--dark); outline: none;
    cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: normal;
}

.btn-large {
    font-size: clamp(1.5rem, 4vw, 2rem); padding: 8px 0; border-radius: 50px; border: none;
    background: #339af0; color: white; cursor: pointer; box-shadow: 0 6px 0 #1c7ed6;
    transition: 0.1s; font-family: inherit; width: 100%; margin-top: 7px; font-weight: normal; word-break: keep-all;
}
.btn-large:active { transform: translateY(4px); box-shadow: 0 2px 0 #1c7ed6; }
#otherGameLink { display: block; margin-top: 20px; color: var(--text-muted); text-decoration: underline; font-size: 1.1rem; }

/* 사이드 버튼 - 상단 20% 지점으로 이동 */
.side-btn {
    position: fixed; top: 20%; transform: translateY(-50%);
    font-size: 2.1rem; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50%; width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 9999; color: #fff; text-decoration: none;
    transition: 0.2s; -webkit-tap-highlight-color: transparent; font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
}
.side-btn:active { transform: translateY(-50%) scale(0.9); background: rgba(0,0,0,0.8); }
.left-btn { left: 20px; }
.right-btn { right: 20px; }

/* Game Screen Structure */
#topZone { position: relative; display: flex; flex-direction: column; z-index: 10; }
#header { height: 100px; background: var(--panel-bg); display: flex; align-items: center; justify-content: center; padding: 0 20px; border-bottom: 2px solid var(--border-color); position: relative; }
.header-title { font-size: clamp(1.2rem, 3vw, 2rem); color: var(--dark); display: flex; align-items: center; gap: 10px; position: absolute; left: 20px; font-weight: normal; word-break: keep-all;}
.timer-box { font-size: 4rem; font-weight: normal; color: #ff6b6b; background: rgba(0,0,0,0.1); padding: 5px 30px; border-radius: 20px; min-width: 120px; text-align: center; }
.timer-urgent { color: #fff; background: #ff6b6b; animation: pulse 0.5s infinite; }

#mainQuestionBoard { background: var(--panel-bg); padding: 10px; text-align: center; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 250px; flex-grow: 1; position: relative; }
#qNumber { font-size: 1.5rem; color: var(--text-muted); margin-bottom: 5px; font-weight: normal; }

#bigQuestion { font-size: clamp(2rem, 5vw, 4.5rem); color: var(--dark); line-height: 1.3; font-family: 'Noto Sans KR', sans-serif; font-weight: 700; word-break: keep-all; padding: 0 20px; letter-spacing: 2px; }

/* Result Popup */
#resultPopup { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30, 30, 46, 0.98); backdrop-filter: blur(10px); z-index: 100; flex-direction: column; align-items: center; justify-content: center; border-bottom: 4px solid var(--border-color); }
#resultTitle { font-size: 3rem; margin: 0 0 20px 0; color: var(--dark); font-weight: normal; text-align: center;}
.result-list { list-style: none; padding: 0; margin: 0; width: 80%; max-width: 600px; max-height: 60%; overflow-y: auto; }
.result-item { display: flex; justify-content: space-between; padding: 15px; background: rgba(128,128,128,0.1); margin-bottom: 8px; border-radius: 12px; font-size: 1.5rem; color: var(--dark); border: 1px solid var(--border-color); font-weight: normal; }
.rank-1 { background: #ffd43b; color: #000; font-weight: normal; border: none; }

/* Player Arena */
#arena { display: flex; flex: 1; width: 100vw; overflow: hidden; background: var(--bg); }
.player-col { flex: 1; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 10px 5px; position: relative; transition: opacity 0.3s; }
.player-col:last-child { border-right: none; }
.player-col.eliminated { opacity: 0.3; filter: grayscale(100%); pointer-events: none; }

.p-header { text-align: center; margin-bottom: 5px; width: 100%; flex-shrink: 0;}
.p-emoji { font-size: 2rem; display: block; }
.p-name { font-size: 1rem; white-space: nowrap; font-weight: normal; }
.p-info { font-size: 1rem; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; margin-top: 2px; color: var(--dark); font-weight: normal; }

.mini-question { font-size: 1.1rem; color: var(--dark); margin: 5px 0; text-align: center; word-break: break-all; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 8px; width: 90%; min-height: 1.5em; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; letter-spacing: 1px; }

/* Keypad Styles */
.p-answer-display {
    font-size: 1.8rem; background: #fff; color: #000; border-radius: 8px;
    margin: 5px 0; min-height: 40px; display: flex; align-items: center; justify-content: center; width: 90%; max-width: 250px;
    font-family: 'Noto Sans KR', sans-serif; font-weight: 700; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); letter-spacing: 2px;
}
.p-answer-display:empty::before { content: '?'; color: #ccc; }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 90%; max-width: 250px; flex: 1; align-content: center; padding-bottom: 10px; }
.kp-btn {
    background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 8px; color: var(--dark);
    font-size: 1.5rem; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1); transition: 0.1s; min-height: 45px;
}
.kp-btn:active { transform: translateY(2px); box-shadow: none; }
.kp-btn.kp-del { background: #ff6b6b; color: #fff; font-size: 1rem; border-color: #e03131; font-family: inherit; } 
.kp-btn.kp-enter { background: #339af0; color: #fff; font-size: 1rem; border-color: #1c7ed6; font-family: inherit; }

/* Feedback Overlay */
.feedback-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; flex-direction: column; font-size: 5rem; z-index: 20; border-radius: 0; }
.feedback-overlay.secret { background: #000000 !important; opacity: 1; display: flex; color: white; transition: none; animation: none; }
.feedback-overlay.show-result { display: flex; animation: none; }
.submitted-text { font-size: 1.5rem; margin-top: 15px; color: #fff; text-align: center; line-height: 1.5; font-weight: normal; }
.final-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; box-sizing: border-box; background: rgba(0,0,0,0.85); padding: 15px 10px; border-radius: 15px; text-align: center; z-index: 50; border: 2px solid #fff; display: none; animation: popIn 0.5s; word-break: keep-all; overflow-wrap: break-word; }
.final-status h3 { margin: 0; font-size: 1.2rem; color: #fff; font-weight: normal; }
.final-status p { margin: 5px 0 0 0; font-size: 1.8rem; color: #ffd43b; font-weight: normal; line-height: 1.2;}

/* Countdown */
#countdownLayer { position: fixed; inset: 0; background: #000000; z-index: 2000; display: none; align-items: center; justify-content: center; }
#countdownText { font-size: 25rem; color: #ffec99; text-shadow: 0 0 50px rgba(255, 212, 59, 0.8); font-weight: normal; opacity: 0; }
@keyframes countPop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1.0); opacity: 0; } }
.count-animate { animation: countPop 0.8s ease-in-out forwards; }

/* Responsive */
@media (max-width: 768px) {
    .header-title span:last-child { display: none; } 
    .p-name { display: none; } 
    .p-info { font-size: 0.8rem; } 
    .kp-btn { min-height: 35px; font-size: 1.2rem; }
    .p-answer-display { font-size: 1.5rem; min-height: 35px; }
}

.bg-dog { background: var(--dog-color); } .bg-cat { background: var(--cat-color); } .bg-rabbit { background: var(--rabbit-color); } .bg-hamster { background: var(--hamster-color); } .bg-panda { background: var(--panda-color); } .bg-monkey { background: var(--monkey-color); }
</style>
</head>

function getInitialLanguage() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('lang')) {
        const langParam = urlParams.get('lang').toLowerCase();
        if (languages.find(l => l.code === langParam)) return langParam;
    }
    
    const storedLang = localStorage.getItem('kingsmath_lang');
    if (storedLang && languages.find(l => l.code === storedLang)) return storedLang;
    
    const browserLangFull = navigator.language.toLowerCase();
    const browserLang = browserLangFull.substring(0, 2);
    if (languages.find(l => l.code === browserLangFull)) return browserLangFull;
    if (languages.find(l => l.code === browserLang)) return browserLang;
    
    return fallbackLang;
}

function renderLanguages(filterText = '') {
    grid.innerHTML = '';
    const lowerFilter = filterText.toLowerCase();
    const filteredLangs = languages.filter(lang => 
        lang.name.toLowerCase().includes(lowerFilter) || 
        lang.enName.toLowerCase().includes(lowerFilter) ||
        lang.code.toLowerCase().includes(lowerFilter)
    );

    if (filteredLangs.length === 0) {
        grid.classList.add('hidden'); noResult.classList.remove('hidden'); noResult.classList.add('flex');
    } else {
        grid.classList.remove('hidden'); noResult.classList.add('hidden'); noResult.classList.remove('flex');
        filteredLangs.forEach(lang => {
            const isSelected = lang.code === currentLang;
            const btn = document.createElement('div');
            btn.className = `flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden ${isSelected ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500"}`;
            btn.innerHTML = `
                <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                    <img src="https://flagcdn.com/w40/${lang.country}.png" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                </div>
                <div class="flex-1 min-w-0 flex flex-col items-start">
                    <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                    <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                </div>
                ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
            `;
            btn.addEventListener('click', () => selectLanguage(lang));
            grid.appendChild(btn);
        });
    }
}

function selectLanguage(lang) {
    currentLang = lang.code;
    
    // 3. 상태 유지 및 공유 기능 (URL & LocalStorage 업데이트)
    localStorage.setItem('kingsmath_lang', currentLang);
    const newUrl = new URL(window.location.href);
    newUrl.searchParams.set('lang', currentLang);
    window.history.pushState(null, '', newUrl);

    applyLanguage();
    
    // 모달 닫기
    modal.classList.remove('active');
    document.body.style.overflow = '';

    toast.classList.add('show');

}

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(type) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const t = audioCtx.currentTime;
    if (type === 'start') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(440, t); osc.frequency.linearRampToValueAtTime(880, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.5);
    } else if (type === 'count') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'click') {
        osc.type = 'square'; osc.frequency.setValueAtTime(1200, t);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.05);
    } else if (type === 'correct') {
        const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
        osc.frequency.setValueAtTime(523.25, t); osc2.frequency.setValueAtTime(659.25, t + 0.1);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.4);
        gain2.gain.setValueAtTime(0, t); gain2.gain.linearRampToValueAtTime(0.3, t + 0.1); gain2.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.4); osc2.start(t); osc2.stop(t + 0.5);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(100, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);
    } else if (type === 'end') {
        const freqs = [523.25, 659.25, 783.99, 1046.50];
        freqs.forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.value = f;
            g.gain.setValueAtTime(0.2, t + i*0.1); g.gain.linearRampToValueAtTime(0, t + i*0.1 + 0.5);
            o.connect(g); g.connect(audioCtx.destination); o.start(t + i*0.1); o.stop(t + i*0.1 + 0.5);
        });
    }
}

function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function generateMixedCalc(diff) {
    let minL = 3, maxL = 4;
    if(diff === 'normal') { minL = 5; maxL = 6; }
    else if(diff === 'hard') { minL = 7; maxL = 10; }

    let targetLeaves = getRandomInt(minL, maxL);
    let targetAns = getRandomInt(10, 50);
    let tree = { type: 'val', val: targetAns };
    let currentLeaves = 1;

    while(currentLeaves < targetLeaves) {
        let valNodes = [];
        function traverse(n, parent, side) {
            if(n.type === 'val') valNodes.push({node: n, parent: parent, side: side});
            else { traverse(n.left, n, 'left'); traverse(n.right, n, 'right'); }
        }
        traverse(tree, null, null);

        let t = valNodes[Math.floor(Math.random() * valNodes.length)];
        let v = t.node.val;
        let op = ['+', '-', '*', '/'][Math.floor(Math.random() * 4)];

        if (v <= 2 && op === '*') op = '+';
        if (v <= 1 && op === '/') op = '+';

        let l, r;
        if (op === '+') { l = getRandomInt(1, Math.max(1, v - 1)); r = v - l; }
        else if (op === '-') { r = getRandomInt(2, 20); l = v + r; }
        else if (op === '*') {
            let facts = [];
            for (let i = 2; i <= Math.floor(Math.sqrt(v)); i++) {
                if (v % i === 0) facts.push(i);
            }
            if (facts.length === 0) {
                op = ['+', '-'][Math.floor(Math.random()*2)];
                if(op==='+'){ l=getRandomInt(1, Math.max(1,v-1)); r=v-l; }
                else { r=getRandomInt(2,15); l=v+r; }
            } else {
                l = facts[Math.floor(Math.random() * facts.length)];
                r = v / l;
                if (Math.random()>0.5) [l,r]=[r,l];
            }
        } else if (op === '/') {
            r = getRandomInt(2, 9);
            l = v * r;
            if(l > 200) { op = '-'; r = getRandomInt(2, 20); l = v + r; }
        }

        let newNode = { type: 'op', op: op, left: {type: 'val', val: l}, right: {type: 'val', val: r} };
        if (t.parent === null) tree = newNode;
        else t.parent[t.side] = newNode;
        currentLeaves++;
    }

    function formatNode(node, isRoot, diffMode) {
        if (node.type === 'val') return { str: node.val.toString(), depth: 0 };
        let left = formatNode(node.left, false, diffMode);
        let right = formatNode(node.right, false, diffMode);
        let maxDepth = Math.max(left.depth, right.depth);
        let myDepth = isRoot ? 0 : maxDepth + 1;

        let opStr = node.op === '*' ? '×' : node.op === '/' ? '÷' : node.op;
        let innerStr = `${left.str} ${opStr} ${right.str}`;

        if (isRoot) return { str: innerStr, depth: myDepth };
        let bL = '( ', bR = ' )';
        if (diffMode === 'normal') { if (myDepth >= 2) { bL = '{ '; bR = ' }'; } } 
        else if (diffMode === 'hard') { if (myDepth === 2) { bL = '{ '; bR = ' }'; } if (myDepth >= 3) { bL = '[ '; bR = ' ]'; } }
        return { str: `${bL}${innerStr}${bR}`, depth: myDepth };
    }

    let result = formatNode(tree, true, diff);
    return { q: result.str + ' = ?', a: targetAns.toString() };
}

function initGame() {
    initAudio();
    const pCount = parseInt(document.getElementById('playerCount').value);
    state.difficulty = document.getElementById('difficulty').value;
    state.mode = document.getElementById('gameMode').value;
    state.timeLimit = parseInt(document.getElementById('timeLimit').value);
    
    state.currentQ = 0; state.maxQ = 10;
    state.players = [];

    const arena = document.getElementById('arena');
    arena.innerHTML = '';
    const txt = STRINGS[currentLang] || STRINGS[fallbackLang];

    for(let i=0; i<pCount; i++) {
        const teamName = txt[`team_${TEAM_DATA[i].id}`];
        state.players.push({ ...TEAM_DATA[i], name: teamName, score: 0, survived: 0, alive: true, answered: false, selected: null, answerTime: 0, currentInput: '' });
        
        const col = document.createElement('div');
        col.className = `player-col ${state.players[i].color}`;
        col.id = `p-${i}`;
        
        col.innerHTML = `
            <div class="p-header">
                <span class="p-emoji">${state.players[i].icon}</span>
                <span class="p-name">${teamName}</span>
                <div class="p-info" id="p-info-${i}">${state.mode==='challenge' ? '0' : '0'}${state.mode==='challenge' ? txt.score_pt : ''}</div>
            </div>
            <div class="mini-question" id="p-q-${i}">...</div>
            <div class="p-answer-display" id="p-ans-${i}"></div>
            <div class="keypad" id="p-keypad-${i}">
                <button class="kp-btn" data-val="1">1</button><button class="kp-btn" data-val="2">2</button><button class="kp-btn" data-val="3">3</button>
                <button class="kp-btn" data-val="4">4</button><button class="kp-btn" data-val="5">5</button><button class="kp-btn" data-val="6">6</button>
                <button class="kp-btn" data-val="7">7</button><button class="kp-btn" data-val="8">8</button><button class="kp-btn" data-val="9">9</button>
                <button class="kp-btn kp-del" data-val="del">${txt.btn_del}</button><button class="kp-btn" data-val="0">0</button><button class="kp-btn kp-enter" data-val="enter">${txt.btn_enter}</button>
            </div>
            <div class="feedback-overlay" id="p-fb-${i}"></div>
            <div class="final-status" id="p-final-${i}"></div>
        `;
        arena.appendChild(col);
        bindKeypad(i);
    }

    document.getElementById('overlay').style.display = 'none';
    document.getElementById('resultPopup').style.display = 'none';
    
    // 게임 시작 시 언어 선택 모달 버튼 숨김 처리 (몰입 유지)
    document.getElementById('langTriggerContainer').style.display = 'none';

    playSound('start');
    nextTurn();
}

function bindKeypad(pIdx) {
    const keypad = document.getElementById(`p-keypad-${pIdx}`);
    const display = document.getElementById(`p-ans-${pIdx}`);
    
    keypad.addEventListener('pointerdown', (e) => {
        const p = state.players[pIdx];
        if(!p.alive || p.answered || state.phase !== 'playing') return;
        
        const btn = e.target.closest('.kp-btn');
        if(!btn) return;
        e.preventDefault();
        playSound('click');

        const val = btn.getAttribute('data-val');
        if(val === 'del') { p.currentInput = p.currentInput.slice(0, -1); } 
        else if(val === 'enter') { if(p.currentInput.length > 0) submitAnswer(pIdx, p.currentInput); } 
        else { if(p.currentInput.length < 5) p.currentInput += val; }
        display.innerText = p.currentInput;
    });
}

function submitAnswer(pIdx, val) {
    const p = state.players[pIdx];
    p.answered = true; p.selected = val; p.answerTime = Date.now();

    document.getElementById(`p-keypad-${pIdx}`).style.opacity = '0.5';

    const fb = document.getElementById(`p-fb-${pIdx}`);
    const txt = STRINGS[currentLang] || STRINGS[fallbackLang];
    fb.innerHTML = `<div style="font-size:3rem; margin-bottom:10px;">🔒</div><div class="submitted-text">${txt.submitted}</div>`;
    fb.classList.add('secret');

    if(state.players.filter(pl => pl.alive).every(pl => pl.answered)) finishRound();
}

async function nextTurn() {
    const aliveCount = state.players.filter(p=>p.alive).length;
    if (state.mode === 'survival' && aliveCount <= 1 && state.players.length > 1) { endGame(); return; }
    if (state.mode === 'survival' && aliveCount === 0) { endGame(); return; }
    if (state.currentQ >= 10) { endGame(); return; }

    state.currentQ++; state.phase = 'counting';
    state.players.forEach((p, idx) => {
        if(p.alive) {
            p.answered = false; p.selected = null; p.answerTime = 0; p.currentInput = '';
            document.getElementById(`p-ans-${idx}`).innerText = '';
            document.getElementById(`p-keypad-${idx}`).style.opacity = '1';
            const fb = document.getElementById(`p-fb-${idx}`);
            fb.className = 'feedback-overlay'; fb.innerHTML = '';
            document.getElementById(`p-q-${idx}`).innerText = '';
        }
    });

    state.problem = generateMixedCalc(state.difficulty);
    const txt = STRINGS[currentLang] || STRINGS[fallbackLang];
    
    document.getElementById('qNumber').innerText = `${txt.q_num} ${state.currentQ} / 10`;
    document.getElementById('bigQuestion').innerText = txt.ready;
    document.getElementById('bigQuestion').style.fontSize = 'clamp(2.5rem, 6vw, 5rem)';
    
    await runCountdown();

    state.phase = 'playing';
    const qStr = state.problem.q; const qLen = qStr.length;
    const bigQ = document.getElementById('bigQuestion');
    bigQ.innerHTML = qStr;
    
    if (qLen > 30) bigQ.style.fontSize = 'clamp(1.5rem, 3vw, 2.5rem)';
    else if (qLen > 20) bigQ.style.fontSize = 'clamp(2rem, 4vw, 3.5rem)';
    else bigQ.style.fontSize = 'clamp(2.5rem, 6vw, 5rem)';

    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const mq = document.getElementById(`p-q-${idx}`);
        mq.innerHTML = qStr;
        if(qLen > 30) mq.style.fontSize = '0.8rem';
        else if(qLen > 20) mq.style.fontSize = '0.9rem';
        else mq.style.fontSize = '1.1rem';
    });
    
    startTimer();
}

async function runCountdown() {
    const layer = document.getElementById('countdownLayer');
    const txt = document.getElementById('countdownText');
    layer.style.display = 'flex';
    for(let i=3; i>0; i--) {
        txt.innerText = i; txt.classList.remove('count-animate');
        void txt.offsetWidth; txt.classList.add('count-animate');
        playSound('count'); await new Promise(r => setTimeout(r, 1000));
    }
    layer.style.display = 'none';
}

function startTimer() {
    state.timer = state.timeLimit;
    const tBox = document.getElementById('mainTimer');
    tBox.classList.remove('timer-urgent');
    
    if(state.timerInterval) clearInterval(state.timerInterval);
    if (state.timeLimit === 0) { tBox.innerText = '∞'; return; }

    tBox.innerText = state.timer;
    state.timerInterval = setInterval(() => {
        state.timer--; tBox.innerText = state.timer;
        if(state.timer <= 5 && state.timer > 0) { tBox.classList.add('timer-urgent'); playSound('count'); }
        if(state.timer <= 0) finishRound();
    }, 1000);
}

function finishRound() {
    clearInterval(state.timerInterval);
    state.phase = 'result';
    const correctAns = state.problem.a; let someoneWrong = false;
    const txt = STRINGS[currentLang] || STRINGS[fallbackLang];

    let correctPlayers = state.players.filter(p => p.alive && p.selected === correctAns);
    correctPlayers.sort((a, b) => a.answerTime - b.answerTime);
    correctPlayers.forEach((p, index) => {
        const bonusList = [50, 30, 10];
        p.currentRoundScore = 100 + (bonusList[index] || 0);
    });

    document.getElementById('bigQuestion').innerHTML = state.problem.q.replace('?', `<span style="color:#69db7c">${correctAns}</span>`);

    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const fb = document.getElementById(`p-fb-${idx}`);
        const info = document.getElementById(`p-info-${idx}`);
        const display = document.getElementById(`p-ans-${idx}`);

        fb.classList.remove('secret'); fb.innerHTML = '';
        
        if(p.selected === correctAns) {
            display.style.color = '#40c057'; fb.innerHTML = '<span style="color:#69db7c">⭕</span>'; 
            if(state.mode === 'challenge') { 
                p.score += p.currentRoundScore; info.innerText = `${p.score}${txt.score_pt}`; 
                fb.innerHTML += `<div style="font-size:1.5rem; color:#ffd43b; margin-top:10px; font-weight:bold; font-family:inherit;">+${p.currentRoundScore}</div>`;
            } else { info.innerText = `${p.survived + 1} ${txt.survived_count}`; }
            fb.classList.add('show-result'); p.survived++;
        } else {
            someoneWrong = true; display.style.color = '#fa5252';
            fb.innerHTML = '<span style="color:#ff6b6b">❌</span>'; fb.classList.add('show-result');
            if(state.mode === 'survival') {
                p.alive = false;
                setTimeout(() => { document.getElementById(`p-${idx}`).classList.add('eliminated'); info.innerText = `${txt.eliminated} (${p.survived})`; }, 1500);
            }
        }
    });
    if(!someoneWrong) playSound('correct'); else playSound('wrong');
    setTimeout(() => nextTurn(), 3000);
}

function endGame() {
    clearInterval(state.timerInterval); state.phase = 'gameover'; playSound('end');
    const popup = document.getElementById('resultPopup');
    const list = document.getElementById('finalResultList');
    popup.style.display = 'flex'; list.innerHTML = '';
    const txt = STRINGS[currentLang] || STRINGS[fallbackLang];

    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`); finalDiv.style.display = 'block';
        if (state.mode === 'challenge') { finalDiv.innerHTML = `<h3>${txt.final_score}</h3><p>${p.score}${txt.score_pt}</p>`; }
        else { finalDiv.innerHTML = p.alive ? `<h3>${txt.record}</h3><p>${txt.winner}</p>` : `<h3>${txt.record}</h3><p>${p.survived}</p>`; if(p.alive) finalDiv.style.border = "4px solid #ffd43b"; }
    });

    let ranked = [...state.players];
    if(state.mode === 'challenge') ranked.sort((a,b) => b.score - a.score);
    else ranked.sort((a,b) => { if (a.alive && !b.alive) return -1; if (!a.alive && b.alive) return 1; return b.survived - a.survived; });

    let currentRank = 1;
    ranked.forEach((p, i) => {
        if (i > 0) {
            const prev = ranked[i-1]; let isTie = false;
            if (state.mode === 'challenge') { if (p.score === prev.score) isTie = true; } 
            else { if (p.alive && prev.alive) isTie = true; else if (!p.alive && !prev.alive && p.survived === prev.survived) isTie = true; }
            if (!isTie) currentRank = i + 1;
        } else { currentRank = 1; }

        const li = document.createElement('li');
        li.className = `result-item ${currentRank===1 ? 'rank-1' : ''}`;
        let status = state.mode === 'challenge' ? `${p.score}${txt.score_pt}` : (p.alive ? txt.winner : `${p.survived}`);
        li.innerHTML = `<span>${currentRank}${txt.rank} ${p.icon} ${p.name}</span><span>${status}</span>`;
        list.appendChild(li);
    });
}

document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.log(e));
    else document.exitFullscreen();
});

document.getElementById('startBtn').addEventListener('click', initGame);
document.getElementById('restartBtn').addEventListener('click', () => { location.reload(); });

// 4. 홈 이모지 전체 화면 지체 없이 첫 화면으로 가는 소스
document.getElementById('btn-home').addEventListener('click', () => {
    if (document.fullscreenElement) {
        clearInterval(state.timerInterval);
        state.phase = 'setup';
        
        // 게임 오버 혹은 플레이 요소 숨기기 및 세팅화면 부활
        document.getElementById('resultPopup').style.display = 'none';
        document.getElementById('countdownLayer').style.display = 'none';
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('langTriggerContainer').style.display = 'block';
        document.getElementById('arena').innerHTML = ''; // 플레이어 보드 리셋
        if(window.playSound) window.playSound('click');
    } else {
        location.reload();
    }
});

document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('dragstart', event => event.preventDefault());

    renderLanguages();
    applyLanguage();
});
