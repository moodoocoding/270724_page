    <title>단위킹 - 팀 배틀</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Fredoka+One&display=swap" rel="stylesheet">

    <style>
        /* 폰트어썸 아이콘 깨짐 방지용 예외 처리 */
        i[class^="fa-"] {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
        }

        /* --- 커스텀 스크롤바 (모달 내부 스크롤용) --- */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        /* --- 모달 등장 애니메이션 --- */
        .modal-overlay {
            opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active {
            opacity: 1; visibility: visible;
        }
        .modal-content {
            transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0); opacity: 1;
        }

        /* --- 토스트 알림 애니메이션 --- */
        .toast {
            transform: translateY(100%); opacity: 0; transition: all 0.3s ease;
        }
        .toast.show {
            transform: translateY(0); opacity: 1;
        }

        /* --- 기본 게임 설정 (원본 유지) --- */
        :root {
            --bg-color: #2b2b2b; --card-bg: #3a3a3a; --text-color: #f0f0f0;
            --accent-color: #FFD93D; --btn-active: #6c5ce7;
            --p0-main: #2980b9; --p0-light: #85c1e9; --p0-accent: #00ffff;
            --p1-main: #d35400; --p1-light: #f5b041; --p1-accent: #ffff00;
            --p2-main: #c2185b; --p2-light: #f8bbd0; --p2-accent: #FF1493;
            --p3-main: #27ae60; --p3-light: #a5d6a7; --p3-accent: #00FF00;
        }

        body {
            margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-color);
            color: var(--text-color); font-family: 'Jua', 'Noto Sans KR', sans-serif;
            touch-action: manipulation; user-select: none; -webkit-user-select: none;
            height: 100vh; display: flex; flex-direction: column;
        }

        /* 언어별 폰트 조정 */
        body.lang-ru, body.lang-es, body.lang-fr, body.lang-pt-br, body.lang-de, body.lang-it {
            font-family: 'Fredoka One', 'Noto Sans KR', sans-serif;
        }

        /* 링크 스타일 */
        a { text-decoration: none; color: inherit; }
        .top-link {
            font-size: 1.2rem; color: #aaa; margin-bottom: 10px; transition: color 0.3s; text-align: center;
        }
        .top-link:hover { color: #fff; text-decoration: underline; }
        .bottom-link {
            margin-top: 20px; font-size: 1.3rem; color: #81ecec; cursor: pointer; transition: transform 0.2s;
        }
        .bottom-link:hover { transform: scale(1.05); color: #fff; }

        /* --- 헤더 --- */
        header {
            background-color: #1e1e1e; color: var(--accent-color); padding: 0 30px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); z-index: 10; height: 70px; position: relative;
        }
        header h1 {
            font-size: 1.8rem; margin: 0; text-shadow: 1px 1px 0 #000; cursor: pointer;
            position: absolute; left: 30px; white-space: nowrap;
        }

        /* 타이머 & 점수 안내 */
        #header-info { display: none; align-items: center; gap: 20px; }
        #timer-display {
            font-size: 2.5rem; color: #fff; background: #444; padding: 5px 20px;
            border-radius: 15px; border: 2px solid #666; min-width: 80px; text-align: center;
            box-shadow: inset 0 0 10px #000;
        }
        #timer-display.urgent { background: #c0392b; color: #fff; animation: blink 0.5s infinite alternate; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }

        /* --- 메인 컨테이너 --- */
        #app-container {
            flex: 1; position: relative; display: flex; justify-content: center;
            align-items: center; width: 100%; height: calc(100% - 70px);
        }

        /* --- 설정 화면 --- */
        #setup-screen {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            background: var(--card-bg); padding: 30px; border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 3px solid #444;
            max-height: 90vh; overflow-y: auto; min-width: 360px;
        }

        .screen-title { 
            font-size: 4rem; color: #fff; text-shadow: 3px 3px 0 #000; 
            margin-bottom: 10px; line-height: 1.2; text-align: center;
        }
        .option-section { width: 100%; text-align: center; margin-bottom: 10px; }
        .label-text { color: #aaa; margin-bottom: 8px; font-size: 1.1rem; }
        .option-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .btn-option {
            padding: 10px 20px; font-size: 1.1rem; border: 2px solid #555; background: #222;
            color: #aaa; border-radius: 20px; cursor: pointer; transition: all 0.2s; touch-action: manipulation;
        }
        .btn-option.selected {
            background-color: var(--btn-active); color: white; border-color: var(--btn-active);
            box-shadow: 0 0 10px var(--btn-active); transform: translateY(-2px);
        }

        #btn-start {
            margin-top: 10px; padding: 12px 60px; font-size: 2rem; background-color: #ff7675;
            color: white; border: none; border-radius: 50px; box-shadow: 0 6px 0 #d63031;
            font-family: 'Jua', sans-serif; cursor: pointer; transition: transform 0.1s; touch-action: manipulation;
        }
        #btn-start:active { transform: translateY(6px); box-shadow: none; }

        /* --- 게임 화면 --- */
        #game-board {
            display: none; width: 100%; height: 100%; padding: 20px; padding-bottom: 80px;
            box-sizing: border-box; flex-direction: row; justify-content: center;
            align-items: center; gap: 20px; flex-wrap: nowrap;
        }

        .team-card {
            background: var(--card-bg); padding: 20px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column;
            align-items: center; position: relative; border: 3px solid #666;
            height: 90%; width: 23%; min-width: 260px; max-width: 400px; transition: all 0.3s;
        }

        .team-0 { border-color: var(--p0-main); } .team-0 .player-label { color: var(--p0-accent); } .team-0 .score-bar-fill { background-color: var(--p0-main); }
        .team-1 { border-color: var(--p1-main); } .team-1 .player-label { color: var(--p1-accent); } .team-1 .score-bar-fill { background-color: var(--p1-main); }
        .team-2 { border-color: var(--p2-main); } .team-2 .player-label { color: var(--p2-accent); } .team-2 .score-bar-fill { background-color: var(--p2-main); }
        .team-3 { border-color: var(--p3-main); } .team-3 .player-label { color: var(--p3-accent); } .team-3 .score-bar-fill { background-color: var(--p3-main); }

        .crown-icon {
            position: absolute; top: -60px; left: 50%; transform: translateX(-50%) scale(0.5);
            font-size: 4rem; opacity: 0; transition: all 0.4s; z-index: 10; pointer-events: none;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .crown-icon.show { opacity: 1; transform: translateX(-50%) scale(1); }
        .player-label { font-size: 2.8rem; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }

        .score-container {
            width: 100%; height: 41px; background: #222; border-radius: 10px; overflow: hidden;
            margin-bottom: 5px; border: 1px solid #555; position: relative;
        }
        .score-text { font-size: 2.2rem; color: #fff; margin-bottom: 5px; }
        .score-bar-fill { height: 100%; width: 0%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        .problem-area {
            flex: 1; width: 100%; display: flex; flex-direction: column;
            gap: 10px; justify-content: flex-end; align-items: center;
        }

        .hint-box {
            width: 90%; min-height: 50px; background: rgba(0, 0, 0, 0.2); border-radius: 10px; padding: 5px;
            color: #bbb; font-size: 1.3rem; text-align: center; display: flex; flex-direction: column; justify-content: center;
            line-height: 1.4; font-family: 'jua', sans-serif; white-space: pre-wrap;
        }

        .question-prompt {
            color: var(--accent-color); font-size: 1.6rem; text-align: center; margin: 5px 0;
            text-shadow: 1px 1px 0 #000; width: 100%; word-break: keep-all; min-height: 2.4rem;
            display: flex; align-items: center; justify-content: center;
            transition: font-size 0.2s; /* 폰트 사이즈 동적 조정 */
        }

        .choice-btn {
            width: 90%; flex: 1; max-height: 75px; background: #eee; color: #333; border: none; border-radius: 15px; font-size: 1.4rem;
            font-family: 'Jua', sans-serif; cursor: pointer; box-shadow: 0 5px 0 #bbb; transition: transform 0.1s, background 0.2s, font-size 0.2s;
            display: flex; align-items: center; word-break: keep-all; justify-content: center; touch-action: manipulation;
        }
        .choice-btn:active { transform: translateY(5px); box-shadow: none; }
        .choice-btn:hover { background: #fff; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.3s; background-color: #ff7675 !important; color: white !important; box-shadow: 0 5px 0 #d63031 !important; }
        
        .win-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); border-radius: 17px; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(5px); animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .rank-medal { font-size: 5rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        .rank-text { font-size: 3rem; color: var(--accent-color); margin-bottom: 20px; }
        .final-score { font-size: 1.5rem; color: #fff; margin-bottom: 20px; }

        .floating-btn {
            position: fixed; bottom: 20px; width: 50px; height: 50px; border-radius: 50%; background: #444; color: white; display: flex;
            justify-content: center; align-items: center; font-size: 1.5rem; z-index: 60; border: 2px solid #666; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer; touch-action: manipulation;
        }
        .floating-btn:active { transform: scale(0.9); }
        #btn-home { left: 20px; }
        #btn-fullscreen { right: 20px; }
        
        #confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 100; }
        .confetti { position: absolute; width: 10px; height: 10px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

        #game-over-controls {
            display: none; position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); z-index: 200;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #btn-restart {
            padding: 15px 50px; font-size: 2.2rem; font-family: 'Jua', sans-serif; background: linear-gradient(to bottom, #00b894, #00cec9);
            color: white; border: 4px solid #fff; border-radius: 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 6px 0 #006266;
            cursor: pointer; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); transition: transform 0.1s, box-shadow 0.1s; pointer-events: auto; white-space: nowrap;
        }
        #btn-restart:hover { filter: brightness(1.1); transform: scale(1.05) translateX(-50%); }
        #btn-restart:active { transform: scale(0.95) translateY(6px) translateX(-50%); box-shadow: 0 4px 0 #006266; }
    </style>
</head>

        function detectLanguage() {
            // 1순위 (URL 파라미터)
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            if (langParam && TRANSLATIONS[langParam]) return langParam;

            // 2순위 (저장된 설정)
            const storedLang = localStorage.getItem('kingsmath_lang');
            if (storedLang && TRANSLATIONS[storedLang]) return storedLang;

            // 3순위 (기기 설정)

        // 동적 폰트 조절 함수 (글자 수에 따라 작아지게)
        function adjustDynamicFonts() {
            document.querySelectorAll('.choice-btn, .question-prompt').forEach(el => {
                el.style.fontSize = ''; // 초기화
                let currentSize = parseFloat(window.getComputedStyle(el).fontSize);
                while((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && currentSize > 12) {
                    currentSize -= 1;
                    el.style.fontSize = currentSize + 'px';
                }
            });
        }

        function setLanguage(langCode, showToastMsg = false) {
            currentLang = langCode;
            localStorage.setItem('kingsmath_lang', langCode);
            
            // URL 업데이트
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', langCode);
            window.history.pushState({}, '', newUrl);

            // HTML lang 및 바디 클래스 업데이트
            document.documentElement.lang = langCode;
            document.body.className = `bg-gray-900 text-gray-100 min-h-screen flex flex-col relative overflow-x-hidden lang-${langCode}`;

            const langObj = languages.find(l => l.code === langCode);

            currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;
            currentLangSpan.textContent = langObj.name;

            document.title = t.appTitle;
            document.getElementById('meta-desc').content = t.metaDesc;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');

            // 플레이어 이름 업데이트

        function renderLanguages(filterText = '') {
            grid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            
            const filteredLangs = languages.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                grid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                noResult.classList.add('hidden');

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";

                    const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;

                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;
                    btn.innerHTML = `

        function formatNumber(num) {
            return Number(num).toLocaleString(currentLang, { maximumFractionDigits: 10 });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'end') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(880, now); osc.frequency.linearRampToValueAtTime(440, now + 0.5);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        const UNITS = {

            area: { base: 'm²', units: { 'mm²': 0.000001, 'cm²': 0.0001, 'm²': 1, 'km²': 1000000 } }
        };

        const UNIT_HINTS = {
            length: "1km = 1,000m<br>1m = 100cm<br>1cm = 10mm",
            weight: "1t = 1,000kg<br>1kg = 1,000g",
            volume: "1L = 1,000mL<br>1km³ = 1,000,000,000m³<br>1m³ = 1,000,000cm³<br>1cm³ = 1,000mm³",
            area: "1km² = 1,000,000m²<br>1m² = 10,000cm²<br>1cm² = 100mm²"
        };
        
        function getPrompt(key) {
            const map = { length: 'promptLength', weight: 'promptWeight', volume: 'promptVolume', area: 'promptArea' };
            return TRANSLATIONS[currentLang][map[key]];
        }

        const GOAL_SCORE = 10;
        const TIME_LIMIT = 60;

        class Team {
            constructor(index) {
                this.index = index; this.score = 0; this.currentProblem = null; this.element = this.createElement();
            }
            createElement() {
                const div = document.createElement('div'); div.className = `team-card ${PLAYERS[this.index].theme}`;
                div.innerHTML = `
                    <div class="crown-icon" id="crown-${this.index}">👑</div>
                    <div class="player-label">${PLAYERS[this.index].name}</div>
                    <div class="score-container"><div class="score-bar-fill" style="width: 0%"></div></div>

                    <div class="problem-area">

                        <div class="rank-medal"></div><div class="rank-text"></div><div class="final-score"></div>
                    </div>
                `;
                const btnA = div.querySelector('.btn-a'); const btnB = div.querySelector('.btn-b');
                this.addFastClick(btnA, () => this.checkAnswer(0)); this.addFastClick(btnB, () => this.checkAnswer(1));
                this.ui = {
                    scoreFill: div.querySelector('.score-bar-fill'), scoreText: div.querySelector('.score-text'),
                    hintBox: div.querySelector('.hint-box'), promptText: div.querySelector('.question-prompt'), 
                    btnA: btnA, btnB: btnB, overlay: div.querySelector('.win-overlay'), medal: div.querySelector('.rank-medal'),
                    rankText: div.querySelector('.rank-text'), finalScore: div.querySelector('.final-score')
                };
                return div;
            }
            addFastClick(el, callback) {
                el.addEventListener('pointerdown', (e) => { e.preventDefault(); if(!isGameActive) return; callback(); });
            }
            generateProblem() {
                if (!isGameActive) return;
                const catKey = activeCategories[Math.floor(Math.random() * activeCategories.length)];
                const category = UNITS[catKey];
                
                this.ui.hintBox.innerHTML = UNIT_HINTS[catKey];
                this.ui.promptText.innerText = getPrompt(catKey);
                
                const unitKeys = Object.keys(category.units); let u1, u2;
                do { u1 = unitKeys[Math.floor(Math.random() * unitKeys.length)]; u2 = unitKeys[Math.floor(Math.random() * unitKeys.length)]; } while (u1 === u2);

                const isHard = Math.random() < 0.5;
                let val1 = parseFloat((Math.random() * 50 + 1).toFixed(2));
                let realVal1 = val1 * category.units[u1];

                let multiplier;
                if (isHard) { const diff = Math.random() * 0.2 + 0.05; multiplier = Math.random() < 0.5 ? (1 + diff) : (1 - diff); } 
                else { const diff = Math.random() * 5 + 2; multiplier = Math.random() < 0.5 ? diff : (1/diff); }

                let targetRealVal2 = realVal1 * multiplier;
                let val2Raw = targetRealVal2 / category.units[u2];
                let val2 = parseFloat(val2Raw.toFixed(2));
                let realVal2 = val2 * category.units[u2];

                if (Math.abs(realVal1 - realVal2) < (realVal1 * 0.01) || val1 === val2) {
                    val2 += 1; realVal2 = val2 * category.units[u2];
                }

                this.currentProblem = {
                    textA: `${formatNumber(val1)} ${u1}`, textB: `${formatNumber(val2)} ${u2}`,
                    winner: realVal1 > realVal2 ? 0 : 1
                };

                this.ui.btnA.innerText = this.currentProblem.textA; this.ui.btnB.innerText = this.currentProblem.textB;
                setTimeout(adjustDynamicFonts, 10); // 동적 폰트 조절
            }
            checkAnswer(choiceIdx) {
                if (choiceIdx === this.currentProblem.winner) {
                    playSound('correct'); this.score++; this.updateScoreUI();
                    if (this.score >= GOAL_SCORE) finishGame();
                    else this.generateProblem();
                } else {
                    playSound('wrong'); this.score = Math.max(0, this.score - 1); this.updateScoreUI();
                    const wrongBtn = choiceIdx === 0 ? this.ui.btnA : this.ui.btnB;
                    wrongBtn.classList.add('shake');
                    setTimeout(() => { wrongBtn.classList.remove('shake'); this.generateProblem(); }, 400);
                }
                updateCurrentLeader();
            }
            updateScoreUI() {
                this.ui.scoreText.innerText = `${this.score} / ${GOAL_SCORE}`;
                this.ui.scoreFill.style.width = `${(this.score / GOAL_SCORE) * 100}%`;
            }
            showResult(rank) {
                let medal = ''; let textKey = '';
                if (rank === 1) { medal = '🥇'; textKey = 'rank1'; }
                else if (rank === 2) { medal = '🥈'; textKey = 'rank2'; }
                else if (rank === 3) { medal = '🥉'; textKey = 'rank3'; }
                else { medal = ''; textKey = 'rank4'; } 
                const rankText = TRANSLATIONS[currentLang][textKey];
                const scoreLabel = TRANSLATIONS[currentLang]['finalScore'];
                this.ui.medal.innerText = medal; this.ui.rankText.innerText = rankText;
                this.ui.finalScore.innerText = `${scoreLabel}${this.score}`;
                this.ui.overlay.style.display = 'flex';
                if(rank === 1) createConfetti();
            }
        }

        function updateCurrentLeader() {
            let maxScore = -1; teams.forEach(t => { if (t.score > maxScore) maxScore = t.score; });
            teams.forEach(t => {
                const crown = document.getElementById(`crown-${t.index}`);
                if (maxScore > 0 && t.score === maxScore) crown.classList.add('show'); else crown.classList.remove('show');
            });
        }

        function startGame() {
            isGameActive = true;
            document.getElementById('setup-screen').style.display = 'none';
            // 게임 시작 시 몰입을 위해 언어 선택 UI 숨기기

            const board = document.getElementById('game-board');

        function startTimer() {
            timeLeft = TIME_LIMIT; const timerDisplay = document.getElementById('timer-display');

        }

        function finishGame() {
            if(!isGameActive) return;
            isGameActive = false; clearInterval(timerInterval); playSound('end');
            let sortedTeams = [...teams].sort((a, b) => b.score - a.score);
            let currentRank = 1;
            for (let i = 0; i < sortedTeams.length; i++) {
                if (i > 0 && sortedTeams[i].score < sortedTeams[i-1].score) currentRank = i + 1;
                sortedTeams[i].showResult(currentRank);

            document.getElementById('game-over-controls').style.display = 'block';

        const playerOptionBtns = document.querySelectorAll('#player-options .btn-option');

            playSound('click'); startGame();
        });

        // 🏠 홈 이모지 전체 화면 지체 없이 첫화면 가는 소스 완벽 적용
        document.getElementById('btn-home').addEventListener('click', () => {
            if (document.fullscreenElement) {
                // 새로고침 대신 화면 초기화 로직 실행 (전체 화면 유지)
                isGameActive = false; // 현재 게임 상태 정지
                clearInterval(timerInterval);
                
                // 다시 첫화면에 노출될 언어 선택기 표시
                document.getElementById('langSelectorContainer').style.display = 'block';
                document.getElementById('game-board').style.display = 'none';
                document.getElementById('header-info').style.display = 'none';
                document.getElementById('game-over-controls').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'flex';
                
                if(window.playSound) window.playSound('click');
            } else {
                // 전체 화면이 아니라면 그냥 새로고침
                location.reload();
            }
        });
        
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
            else if (document.exitFullscreen) document.exitFullscreen();
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            playSound('click');
            setTimeout(() => location.reload(), 200); 
        });

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];
            for (let i = 0; i < 150; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti'; conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.opacity = Math.random();
                container.appendChild(conf);
            }
        }

        // 초기 언어 감지 및 세팅
        setLanguage(detectLanguage());
        renderLanguages();
    </script>

</body>
</html>
