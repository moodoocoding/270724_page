/* i 태그(아이콘)를 제외한 모달 내부에만 폰트 적용 */

    #langModal, #langModal * {

        let currentLang = 'ko'; // Default Init

        // --- 2. 다국어 모달 & 감지 로직 ---
        const triggerBtnWrapper = document.getElementById('langTriggerBtnWrapper');
        const triggerBtn = document.getElementById('langTriggerBtn');
        const modal = document.getElementById('langModal');
        const closeBtn = document.getElementById('closeModalBtn');
        const searchInput = document.getElementById('searchInput');
        const grid = document.getElementById('languageGrid');
        const noResult = document.getElementById('noResult');
        const currentFlagImg = document.getElementById('currentFlag');
        const currentLangSpan = document.getElementById('currentLangName');
        const toast = document.getElementById('toastNotification');
        const toastLangName = document.getElementById('toastLangName');
        let toastTimeout;

        function detectLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && translations[urlLang]) return urlLang;

            const savedLang = localStorage.getItem('kingsmath_lang');
            if (savedLang && translations[savedLang]) return savedLang;

            const browserLang = navigator.language.slice(0, 2);
            if (translations[browserLang]) return browserLang;

            return 'en'; // 기본값 (영어)
        }

        function renderLanguages(filterText = '') {
            grid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            
            const filteredLangs = languages.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                grid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                noResult.classList.add('hidden');
                noResult.classList.remove('flex');

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden m-0";
                    const stateClasses = isSelected 
                        ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                        : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                    const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                    const dirAttr = lang.dir === 'rtl' ? 'dir="rtl"' : '';

                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;
                    btn.innerHTML = `
                        <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50 m-0">
                            <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col items-start m-0" ${dirAttr}>
                            <span class="text-sm font-medium text-white truncate w-full m-0 ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                            <span class="text-xs text-gray-400 truncate w-full m-0">${lang.enName}</span>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                    `;
                    btn.addEventListener('click', () => selectLanguage(lang));
                    grid.appendChild(btn);
                });
            }
        }

        function selectLanguage(lang) {
            currentLang = lang.code;
            
            // 데이터 유지 및 URL 푸시
            localStorage.setItem('kingsmath_lang', currentLang);
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', currentLang);
            window.history.pushState({}, '', newUrl);

            // UI 갱신
            currentFlagImg.src = `https://flagcdn.com/w40/${lang.country}.png`;
            currentLangSpan.textContent = lang.name;
            updateTextContent();
            
            closeModal();
            showToast(lang.name, lang.code);
            renderLanguages(searchInput.value);
        }

        function openModal() {
            modal.classList.add('active');
            // 게임 내에서 overflow 제어를 최소화하기 위해 body 스크롤 방지만 처리
            setTimeout(() => searchInput.focus(), 100);
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function showToast(langName, langCode) {
            const toastMsg = toastTranslations[langCode] || toastTranslations['en'];
            document.getElementById('ui-toast').textContent = toastMsg;
            toastLangName.textContent = langName;
            
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        triggerBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
        searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });

        // --- 3. 텍스트 업데이트 로직 ---
        function updateTextContent() {
            const t = translations[currentLang];
            if (!t) return;

            // 한국어가 아닐 경우 기본 폰트로 전환 방어 코드
            if (currentLang !== 'ko') {
                document.body.classList.add('lang-non-ko');
            } else {
                document.body.classList.remove('lang-non-ko');
            }

            document.title = t.title;
            document.querySelector('meta[name="description"]').setAttribute("content", t.metaDesc);
            document.querySelector('meta[name="keywords"]').setAttribute("content", t.metaKey);
            document.querySelector('meta[property="og:title"]').setAttribute("content", t.title);
            document.querySelector('meta[property="og:description"]').setAttribute("content", t.metaDesc);
            document.querySelector('meta[property="og:site_name"]').setAttribute("content", t.gameTitle);

            // 링크들 강제 속성 반영 및 하드코딩 업데이트
            const homeLinks = [
                document.getElementById('header-brand'),
                document.getElementById('link-other-games'),
                document.getElementById('link-other-games-bottom')
            ];
            homeLinks.forEach(el => {
                if(el) { el.href = "/"; el.target = "_self"; }
            });

            document.getElementById('header-brand').innerText = t.brandLink;
            document.getElementById('sub-brand').innerText = t.subBrand;
            document.getElementById('game-title').innerText = t.gameTitle;
            document.getElementById('txt-participants').innerText = t.participants;
            document.getElementById('txt-target').innerText = t.targetTime;
            document.getElementById('btn-mode-fixed').innerText = t.modeFixed;
            document.getElementById('btn-mode-random').innerText = t.modeRandom;
            document.getElementById('start-btn').innerText = t.startBtn;
            document.getElementById('link-other-games').innerText = t.moreGames;
            document.getElementById('link-other-games-bottom').innerText = t.moreGames;
            document.getElementById('btn-restart').innerText = t.playAgain;
            
            if(document.getElementById('overlay-msg').innerText === translations[getPrevLang()]?.overlayTarget) {
                 document.getElementById('overlay-msg').innerText = t.overlayTarget;
            }

            // 언어 텍스트 길이에 따라 폰트 사이즈 조정을 위한 처리
            document.querySelectorAll('.dynamic-text').forEach(el => {
                el.style.fontSize = currentLang === 'ko' ? '' : '1.3rem'; // 예시: 외국어는 텍스트가 길어지므로 폰트 살짝 축소
            });
        }

        function getPrevLang() { return localStorage.getItem('kingsmath_lang') || 'en'; }
        function getT(key) { return translations[currentLang][key] || key; }


        // --- 4. 게임 기존 로직 (수정 최소화) ---
        let playerCount = 6;
        let timeMode = 'fixed';
        let targetTime = 10.00;
        let gameState = 'idle';
        let startTime = 0;
        let animationFrameId;
        let finishedCount = 0;
        let results = [];
        const TIMEOUT_OFFSET = 5;

        const playerEmojis = ["🐶", "🐱", "🐰", "🐹", "🐼", "🐵"];
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'start') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'whistle') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(1000, now); osc.frequency.linearRampToValueAtTime(1500, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'click') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'finish') {
                const frequencies = [523.25, 659.25, 783.99, 1046.50];
                frequencies.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'sine'; o.frequency.value = freq;
                    const startTime = now + (idx * 0.05);
                    g.gain.setValueAtTime(0, startTime); g.gain.linearRampToValueAtTime(0.2, startTime + 0.05); g.gain.exponentialRampToValueAtTime(0.001, startTime + 1.5);
                    o.start(startTime); o.stop(startTime + 1.5);
                });
            }
        }

        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const overlay = document.getElementById('overlay');
        const overlayMsg = document.getElementById('overlay-msg');
        const overlayBig = document.getElementById('overlay-big-text');
        const resultMenu = document.getElementById('result-menu');
        const targetDisplay = document.getElementById('target-display');
        const selectorContainer = document.getElementById('player-selector');

        for(let i=1; i<=6; i++) {
            const btn = document.createElement('div');
            btn.className = `p-btn ${i===6 ? 'selected' : ''}`;
            btn.innerText = i;
            btn.onclick = () => {
                playerCount = i;
                document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            };
            selectorContainer.appendChild(btn);
        }

        function setMode(mode) {
            timeMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            if (mode === 'fixed') document.getElementById('btn-mode-fixed').classList.add('selected');
            else document.getElementById('btn-mode-random').classList.add('selected');
        }

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); initGame(); });
        startBtn.addEventListener('click', initGame);

        function initGame() {
            if(gameState !== 'idle') return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // [핵심] 게임 시작 시 언어 선택기 UI 숨김 (몰입도 향상)
            triggerBtnWrapper.style.display = 'none';

            if(timeMode === 'fixed') targetTime = 10.00;
            else {
                targetTime = (Math.random() * (15 - 5) + 5);
                targetTime = Math.round(targetTime * 100) / 100;
            }

            setupScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            targetDisplay.style.display = 'block';
            targetDisplay.innerText = `${getT('targetLabel')}${targetTime.toFixed(2)}${getT('sec')}`;
            
            initGameColumns();

            overlay.style.display = 'flex';
            overlayMsg.innerText = getT('overlayTarget');
            overlayBig.innerText = `${targetTime.toFixed(2)}${getT('sec')}`;
            overlayBig.style.color = "var(--accent)";

            setTimeout(startCountdown, 2000);
        }

        function initGameColumns() {
            gameScreen.innerHTML = '';
            gameScreen.appendChild(targetDisplay);
            
            results = []; finishedCount = 0;
            
            for(let i=1; i<=playerCount; i++) {
                const col = document.createElement('div');
                col.className = 'col'; col.id = `p-${i}`;
                const myEmoji = playerEmojis[i-1];

                col.innerHTML = `
                    <div class="p-emoji" id="icon-${i}">${myEmoji}</div>
                    <div class="status-text" id="status-${i}">0.00</div>
                    <div class="result-box" id="res-box-${i}">
                        <span class="rank-badge" id="rank-badge-${i}"></span>
                        <div class="rank-text" id="rank-text-${i}"></div>
                        <div class="time-text" id="time-${i}"></div>
                        <div class="diff-text" id="diff-${i}"></div>
                    </div>
                    <button class="stop-btn dynamic-text" id="btn-${i}">${getT('stopBtn')}</button>
                `;
                gameScreen.appendChild(col);

                const stopBtn = document.getElementById(`btn-${i}`);
                stopBtn.addEventListener('touchstart', (e) => { e.preventDefault(); stopPlayer(i); }, {passive: false});
                stopBtn.addEventListener('click', () => { stopPlayer(i); });
            }
        }

        function startCountdown() {
            gameState = 'ready';
            overlayMsg.innerText = getT('readyMsg');
            let count = 3; overlayBig.innerText = count;
            playTone('start'); 

            const timer = setInterval(() => {
                count--;
                if(count > 0) {
                    overlayBig.innerText = count; playTone('start');
                } else if (count === 0) {
                    overlayBig.innerText = getT('startMsg');
                    overlayBig.style.color = "var(--danger)";
                    playTone('whistle');
                } else {
                    clearInterval(timer);
                    overlay.style.display = 'none';
                    runGame();
                }
            }, 1000);
        }

        function runGame() {
            gameState = 'running'; startTime = Date.now();
            document.querySelectorAll('.stop-btn').forEach(btn => btn.classList.add('active-mode'));
            updateTimer();
        }

        function updateTimer() {
            if(gameState !== 'running') return;
            const now = Date.now();
            const elapsed = (now - startTime) / 1000;

            if (elapsed > targetTime + TIMEOUT_OFFSET) { finishGame(true); return; }

            for(let i=1; i<=playerCount; i++) {
                if(results.find(r => r.id === i)) continue;
                const statusDiv = document.getElementById(`status-${i}`);
                if(elapsed <= 3.0) { statusDiv.innerText = elapsed.toFixed(2); statusDiv.style.color = "#fff"; } 
                else { statusDiv.innerText = "???"; statusDiv.style.color = "var(--accent)"; }
            }
            animationFrameId = requestAnimationFrame(updateTimer);
        }

        function stopPlayer(id) {
            if(gameState !== 'running' || results.find(r => r.id === id)) return;

            playTone('click');
            const now = Date.now();
            const elapsed = (now - startTime) / 1000;
            const diff = elapsed - targetTime;
            
            results.push({ id: id, time: elapsed, diffAbs: Math.abs(diff), diffRaw: diff });
            
            const icon = document.getElementById(`icon-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            const status = document.getElementById(`status-${id}`);
            
            icon.style.filter = "grayscale(0) drop-shadow(0 0 10px white)";
            btn.classList.remove('active-mode');
            btn.innerText = getT('doneBtn');
            status.innerText = getT('statusStop');
            status.style.color = "#666"; status.style.fontSize = "3rem";

            finishedCount++;
            if(finishedCount >= playerCount) finishGame(false);
        }

        function finishGame(isTimeout) {
            gameState = 'finished';
            cancelAnimationFrame(animationFrameId);

            if(isTimeout) {
                const now = Date.now();
                const elapsed = (now - startTime) / 1000;
                for(let i=1; i<=playerCount; i++) {
                    if(!results.find(r => r.id === i)) {
                        results.push({ id: i, time: elapsed, diffAbs: 9999, diffRaw: 9999 });
                        document.getElementById(`status-${i}`).innerText = getT('statusTimeout');
                    }
                }
            }
            results.sort((a, b) => a.diffAbs - b.diffAbs);
            setTimeout(showResults, 500);
        }

        function showResults() {
            playTone('finish');
            const rankEmojis = ["🥇", "🥈", "🥉", "4️⃣", "5️⃣", "6️⃣"];

            results.forEach((res, index) => {
                const rank = index + 1; const pId = res.id;
                document.getElementById(`status-${pId}`).style.display = 'none';
                const resBox = document.getElementById(`res-box-${pId}`);
                const badge = document.getElementById(`rank-badge-${pId}`);
                const rankText = document.getElementById(`rank-text-${pId}`);
                const timeText = document.getElementById(`time-${pId}`);
                const diffText = document.getElementById(`diff-${pId}`);
                const btn = document.getElementById(`btn-${pId}`);

                btn.style.visibility = 'hidden';
                badge.innerText = rankEmojis[index] || ""; 
                
                if(rank === 1) { rankText.innerText = getT('rank1'); rankText.style.color = "var(--gold)"; document.getElementById(`p-${pId}`).style.background = "#2a2510"; } 
                else if (rank === 2) { rankText.innerText = getT('rank2'); rankText.style.color = "var(--silver)"; } 
                else if (rank === 3) { rankText.innerText = getT('rank3'); rankText.style.color = "var(--bronze)"; } 
                else { rankText.innerText = rank + getT('rankN'); rankText.style.color = "#888"; badge.style.fontSize = "2.5rem"; }

                if(res.diffAbs === 9999) {
                    timeText.innerText = getT('fail'); diffText.innerText = getT('timeout'); badge.innerText = "💀";
                } else {
                    timeText.innerText = res.time.toFixed(2) + getT('sec');
                    const sign = res.diffRaw > 0 ? "+" : "";
                    diffText.innerText = `(${sign}${res.diffRaw.toFixed(2)})`;
                    if(res.diffAbs <= 0.05) diffText.style.color = "var(--success)"; else diffText.style.color = "#888";
                }
                resBox.style.display = 'block';
            });
            resultMenu.style.display = 'flex';
        }

        function resetGame() {
            gameState = 'idle';
            resultMenu.style.display = 'none';
            setupScreen.style.display = 'flex';
            gameScreen.style.display = 'none';
            targetDisplay.style.display = 'none';
            // [핵심] 다시 메인 화면으로 돌아왔으므로 언어 선택기 표시
            triggerBtnWrapper.style.display = 'block';
            results = [];
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        // --- 5. 커스텀 홈 버튼 클릭 로직 (핵심 요청사항) ---
        document.getElementById('btn-home').addEventListener('click', () => {
            if (document.fullscreenElement) {
                // 전체 화면 모드라면 초기 셋업 화면으로 리셋하고, 언어 버튼도 다시 보이게 함
                resetGame();
                if(window.playTone) playTone('click'); 
            } else {
                // 전체 화면이 아니라면 새로고침/홈 주소로 이동 (킹수학 메인 주소 강제)
                location.href = "/";
            }
        });

        // --- 초기 로드 ---
        window.onload = function() {
            const detectedLangCode = detectLanguage();
            const selectedLangObj = languages.find(l => l.code === detectedLangCode) || languages[1];
            
            currentLang = selectedLangObj.code;
            currentFlagImg.src = `https://flagcdn.com/w40/${selectedLangObj.country}.png`;
            currentLangSpan.textContent = selectedLangObj.name;
            
            updateTextContent();
            renderLanguages(); // 첫 시작 시 모달 내부 리스트 렌더링 호출 확인!
        }
    </script>


</body>
