<html lang="ko">
<head>

    <meta id="meta-desc" name="description" content="외워라! 그리고 생존하라! 짜릿한 두뇌 서바이벌 게임.">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'HsSantoki';
            src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/HS-Regular.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --primary-color: #00d2d3;
            --secondary-color: #ff9f43;
            --accent-color: #f368e0;
            --danger-color: #ff4757;
            --text-color: #ffffff;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --keypad-bg: rgba(255, 255, 255, 0.1);
        }

        /* 폰트어썸 아이콘 깨짐 방지용 예외 처리 */
        i[class^="fa-"] {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
        }

        /* 모달창 내부 박스 사이징 강제 보정 */
        #langModal, #langModal * {
            box-sizing: border-box !important;
        }

        * { box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        
        body {
            margin: 0; padding: 0;
            background: var(--bg-gradient);
            /* 기본 폰트. JS에서 한국어일 경우 HsSantoki로 덮어씌움 */
            font-family: 'HsSantoki', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh; 
            overflow: hidden;
            color: var(--text-color);
            display: flex; flex-direction: column;
        }

        .num-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: bold; }

        /* --- 공통 상단 바 --- */
        #top-info-bar {
            height: 8vh;
            background: rgba(0,0,0,0.3);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
            width: 100%;
        }
        .info-title { font-size: 3vh; color: var(--primary-color); }
        .info-val { font-size: 4vh; color: white; margin-left: 10px; }
        
        /* 타이머 바 */
        #global-timer-container {
            position: absolute; top: 8vh; left: 0; width: 100%; height: 1vh;
            background: rgba(255,255,255,0.1); z-index: 10;
        }
        #global-timer-bar {
            height: 100%; width: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            transition: width 0.1s linear;
        }

        /* --- 메인 게임 영역 컨테이너 --- */
        #game-grid-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            background: transparent;
        }

        /* --- 메인 게임 그리드 --- */
        #game-grid {
            display: grid;
            height: 92vh; 
            width: 100%;
            transition: width 0.3s;
        }

        /* --- 플레이어 컬럼 --- */
        .player-column {
            position: relative;
            border-right: 2px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column;
            overflow: hidden;
            transition: background 0.3s;
        }
        .player-column:last-child { border-right: none; }
        
        /* 탈락자 스타일 */
        .player-column.eliminated {
            background: rgba(0,0,0,0.6);
            filter: grayscale(100%);
            pointer-events: none; 
        }

        .player-column.submitted {
            background: rgba(0, 210, 211, 0.1);
            border-top: 5px solid var(--primary-color);
        }

        /* 플레이어 헤더 (이모지) */
        .p-header {
            height: 8vh;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.2);
            font-size: 5vh;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        /* 문제/입력 표시 영역 */
        .p-display-area {
            flex: 1;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .input-slots-row {
            display: flex; 
            gap: 4px;
            justify-content: center;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }
        
        .slot {
            border-bottom: 3px solid rgba(255,255,255,0.3);
            color: white;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }

        .slot.filled { border-color: var(--primary-color); }
        .slot.showing { border-color: var(--accent-color); color: var(--accent-color); }
        .slot.correct { border-color: var(--primary-color); color: var(--primary-color); }
        .slot.wrong { border-color: var(--danger-color); color: var(--danger-color); }

        /* --- 칭찬 메시지 스타일 --- */
        .praise-msg {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 7vh;
            color: #ffeaa7;
            font-weight: bold;
            text-shadow: 0 0 20px #e17055, 0 0 10px #fdcb6e;
            z-index: 20;
            white-space: nowrap;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        @keyframes popUp {
            from { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        /* --- 키패드 --- */
        .p-keypad {
            height: 30vh;
            padding: 10px;
            background: var(--panel-bg);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 5px;
            opacity: 0.3; pointer-events: none; 
            transition: opacity 0.3s;
        }
        .p-keypad.active { opacity: 1; pointer-events: auto; }

        .key-row { display: flex; flex: 1; gap: 5px; }
        .key-btn {
            flex: 1;
            background: var(--keypad-bg);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: white; font-size: 3vh;
            cursor: pointer; position: relative;
            touch-action: manipulation;
        }
        .key-btn:active { background: rgba(255,255,255,0.3); }
        
        .btn-clear { background: rgba(255, 71, 87, 0.2); border-color: rgba(255, 71, 87, 0.4); font-size: 2vh; }
        .btn-enter { background: rgba(0, 210, 211, 0.2); border-color: rgba(0, 210, 211, 0.4); font-size: 2vh; color: var(--primary-color); font-weight: bold; }

        /* --- 등수 표시 영역 (하단) --- */
        .rank-area {
            height: 10vh;
            background: rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center;
            font-size: 6vh;
        }
        .medal-emoji { font-size: 8vh; filter: drop-shadow(0 0 10px gold); }
        .rank-num-emoji { font-size: 5.6vh; }

        /* --- 시작 화면 --- */
        #setup-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient); z-index: 100;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        /* 링크 컨테이너 */
        .header-links-container {
            display: flex; flex-direction: column;
            align-items: center; gap: 10px;
            margin-bottom: 2vh;
        }

        .top-link { 
            font-size: 2.5vh; color: var(--primary-color); 
            text-decoration: none; font-weight: bold; 
            text-align: center;
        }

        .setup-title { 
            font-size: 10vh; color: var(--text-color); margin-bottom: 1vh; 
            text-shadow: 0 0 20px var(--primary-color);
            text-align: center; line-height: 1.1;
        }
        .setup-subtitle { 
            font-size: 3vh; color: var(--secondary-color); margin-bottom: 5vh; 
            text-align: center;
        }
        
        .player-select-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
            width: 80%; max-width: 800px;
        }
        .p-select-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: white; padding: 25px 10px; border-radius: 15px;
            font-size: 2.5vh; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
            word-break: keep-all; overflow: hidden;
        }
        .p-select-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); border-color: var(--primary-color); }
        .auto-resize { white-space: nowrap; transition: font-size 0.2s; }

        /* --- 오버레이 (카운트다운 등) --- */
        #overlay-msg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 50;
            display: none; justify-content: center; align-items: center; flex-direction: column;
            pointer-events: none;
        }
        #overlay-text { font-size: 15vh; color: white; text-shadow: 0 0 30px var(--primary-color); animation: pop 0.2s infinite alternate; text-align: center; }
        @keyframes pop { from{transform:scale(1);} to{transform:scale(1.1);} }

        /* --- 결과 버튼 화면 (투명 배경) --- */
        #result-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: 200;
            display: none;
            justify-content: center; align-items: center;
            pointer-events: none;
        }
        .btn-restart { 
            pointer-events: auto;
            padding: 20px 50px; 
            font-size: 4vh; 
            background: var(--accent-color); 
            color: white; 
            border: 5px solid white; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from{transform:scale(1);} to{transform:scale(1.05);} }

        /* --- 플로팅 버튼 스타일 --- */
        .floating-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 60px; height: 60px;
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            color: white;
            font-size: 30px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            z-index: 300;
            transition: 0.2s;
            text-decoration: none;
        }
        .floating-btn:hover { background: rgba(0,0,0,0.7); transform: translateY(-50%) scale(1.1); }
        .floating-left { left: 10px; }
        .floating-right { right: 10px; }

        .hidden { display: none !important; }
        
        .bottom-link { margin-top: 5vh; font-size: 2.2vh; color: #fff; text-decoration: none; padding: 10px 25px; border: 1px solid rgba(255,255,255,0.3); border-radius: 30px; background: rgba(0,0,0,0.2); }

        /* --- 모달 관련 CSS --- */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay {
            opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .toast {
            transform: translateY(100%); opacity: 0; transition: all 0.3s ease;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

    </style>
</head>

        /* --- 언어 감지 (우선순위 철저히 적용) --- */
        function detectLanguage() {
            // 1순위: URL
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('lang')) {
                const lang = urlParams.get('lang').toLowerCase();
                if (i18n[lang]) return lang;
            }
            // 2순위: 저장소
            const stored = localStorage.getItem('kingsmath_lang');
            if (stored && i18n[stored]) return stored;
            
            // 3순위: 브라우저 환경
            const browserLang = navigator.language.toLowerCase();
            if (i18n[browserLang]) return browserLang;
            const prefix = browserLang.split('-')[0];
            if (i18n[prefix]) return prefix;

            return 'en';
        }

        /* --- 언어 목록 렌더링 --- */
        function renderLanguages(filterText = '') {
            grid.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();
            
            const filteredLangs = languagesList.filter(lang => 
                lang.name.toLowerCase().includes(lowerFilter) || 
                lang.enName.toLowerCase().includes(lowerFilter) ||
                lang.code.toLowerCase().includes(lowerFilter)
            );

            if (filteredLangs.length === 0) {
                grid.classList.add('hidden');
                noResult.classList.remove('hidden');
                noResult.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                noResult.classList.add('hidden');
                noResult.classList.remove('flex');

                filteredLangs.forEach(lang => {
                    const isSelected = lang.code === currentLang;
                    const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                    const stateClasses = isSelected 
                        ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                        : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

                    const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                    const btn = document.createElement('div');
                    btn.className = `${baseClasses} ${stateClasses}`;

                    btn.innerHTML = `
                        <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                            <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col items-start">
                            <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                            <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                    `;
                    btn.addEventListener('click', () => setLanguage(lang.code, lang));
                    grid.appendChild(btn);
                });
            }
        }

        /* --- 언어 설정 적용 --- */

            if (!i18n[langCode]) return;
            currentLang = langCode;
            
            // 로컬스토리지 및 URL 즉시 업데이트
            localStorage.setItem('kingsmath_lang', langCode);
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', langCode);
            window.history.pushState({}, '', newUrl);

            // 해당 언어 객체 찾기 (초기 로드시용)
            if(!langObj) langObj = languagesList.find(l => l.code === langCode);

            // 상단 토글 버튼 갱신
            currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;
            currentLangSpan.textContent = langObj.name;
            
            // 모달 닫기 및 알림
            closeModal();
            showToast(langObj.name, langCode);

            // 다시 열 때를 대비하여 재렌더링
            renderLanguages(searchInput.value);
            
            // 실제 콘텐츠 변환
            updateContent();
        }

            for(let i=1; i<=6; i++) {

        /* --- 글자 수에 따른 폰트 사이즈 동적 축소 로직 --- */
        function adjustFontSize() {
            document.querySelectorAll('.auto-resize').forEach(el => {
                el.style.fontSize = ''; // 초기화
                const parentWidth = el.parentElement.clientWidth - 20; // 패딩 여유분
                const elWidth = el.scrollWidth;
                
                if(elWidth > parentWidth) {
                    const ratio = parentWidth / elWidth;
                    // 부모의 현재 폰트 사이즈 기준
                    const currentSize = parseFloat(window.getComputedStyle(el.parentElement).fontSize);
                    el.style.fontSize = (currentSize * ratio * 0.9) + 'px';
                }
            });
        }
        window.addEventListener('resize', adjustFontSize);

            }
        };

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        }

        function initGame(num) {
            totalPlayers = num;
            
            // 게임 시작 시 언어 선택기 숨기기 (몰입도 상승)
            document.getElementById('langSelectorContainer').style.display = 'none';
            document.getElementById('setup-screen').classList.add('hidden');
            
            document.getElementById('top-info-bar').classList.remove('hidden');
            document.getElementById('game-grid-container').classList.remove('hidden');

            const grid = document.getElementById('game-grid');
            if (num <= 3) { grid.style.width = `${num * 25}%`; } 
            else { grid.style.width = '100%'; }

            grid.style.gridTemplateColumns = `repeat(${num}, 1fr)`;
            grid.innerHTML = '';
            playersData = [];

            const t = i18n[currentLang];

            for(let i=1; i<=num; i++) {
                playersData.push({ id: i, active: true, sequence: [], input: [], submitted: false, diedRound: 999 });
                
                const emoji = PLAYER_EMOJIS[i-1];
                const col = document.createElement('div');
                col.className = 'player-column';
                col.id = `p-col-${i}`;
                col.innerHTML = `
                    <div class="p-header" id="p-header-${i}">${emoji}</div>
                    
                    <div class="p-display-area" id="p-display-${i}">
                        <div class="input-slots-row" id="slots-area-${i}"></div>
                    </div>

                    <div class="p-keypad" id="keypad-${i}">
                        <div class="key-row">
                            <button class="key-btn num-font" onclick="handleInput(${i}, 1)">1</button>
                            <button class="key-btn num-font" onclick="handleInput(${i}, 2)">2</button>
                            <button class="key-btn num-font" onclick="handleInput(${i}, 3)">3</button>
                        </div>
                        <div class="key-row">
                            <button class="key-btn num-font" onclick="handleInput(${i}, 4)">4</button>
                            <button class="key-btn num-font" onclick="handleInput(${i}, 5)">5</button>
                            <button class="key-btn num-font" onclick="handleInput(${i}, 6)">6</button>
                        </div>
                        <div class="key-row">
                            <button class="key-btn num-font" onclick="handleInput(${i}, 7)">7</button>
                            <button class="key-btn num-font" onclick="handleInput(${i}, 8)">8</button>
                            <button class="key-btn num-font" onclick="handleInput(${i}, 9)">9</button>
                        </div>
                        <div class="key-row">
                            <button class="key-btn btn-clear" onclick="clearInput(${i})">${t.clear}</button>
                            <button class="key-btn num-font" onclick="handleInput(${i}, 0)">0</button>
                            <button class="key-btn btn-enter" onclick="submitInput(${i})">${t.enter}</button>
                        </div>
                    </div>
                    
                    <div class="rank-area" id="rank-area-${i}"></div>
                `;
                grid.appendChild(col);
            }

            updateSurvivorCount();
            startRound();
        }

        function updateSurvivorCount() {
            const survivors = playersData.filter(p => p.active).length;
            document.getElementById('survivor-disp').innerText = survivors;
            return survivors;
        }

        async function startRound() {
            document.getElementById('global-timer-container').classList.add('hidden');

            const survivors = playersData.filter(p => p.active);
            if (totalPlayers > 1 && survivors.length <= 1) {
                if(survivors.length === 1) { survivors[0].diedRound = currentRound + 100; }
                endGame();
                return;
            }

            document.getElementById('round-disp').innerText = currentRound;
            isInputPhase = false;
            
            playersData.forEach(p => {
                if(!p.active) return;
                p.input = [];
                p.submitted = false;
                document.getElementById(`p-col-${p.id}`).classList.remove('submitted');
                
                const len = currentRound + 2;
                p.sequence = [];
                for(let k=0; k<len; k++) p.sequence.push(Math.floor(Math.random()*10));

                const slotsArea = document.getElementById(`slots-area-${p.id}`);
                slotsArea.innerHTML = '';
                for(let k=0; k<len; k++) {
                    const s = document.createElement('div');
                    s.className = 'slot num-font';
                    slotsArea.appendChild(s);
                }
                
                document.getElementById(`keypad-${p.id}`).classList.remove('active');
            });

            resizeSlots();
            
            const t = i18n[currentLang];
            await showCountDown(3, t.msgCode);
            await runSequenceDisplay();
        }

        function resizeSlots() {
            playersData.forEach(p => {
                if (!p.active) return;
                
                const slotsRow = document.getElementById(`slots-area-${p.id}`);
                const container = document.getElementById(`p-display-${p.id}`);
                
                if (!slotsRow || slotsRow.children.length === 0 || !container) return;

                const count = slotsRow.children.length;
                const containerWidth = container.clientWidth;
                const gap = 4;
                const padding = 20;

                let slotW = (containerWidth - ((count - 1) * gap) - padding) / count;

                const maxW = window.innerHeight * 0.06; 
                if (slotW > maxW) slotW = maxW;

                const slotH = slotW * (8/6);
                const fontSize = slotW * 0.8;

                for (let s of slotsRow.children) {
                    s.style.width = `${slotW}px`;
                    s.style.height = `${slotH}px`;
                    s.style.fontSize = `${fontSize}px`;
                }
            });
        }
        window.addEventListener('resize', resizeSlots);

        async function showCountDown(seconds, finalMsg) {
            const ov = document.getElementById('overlay-msg');
            const txt = document.getElementById('overlay-text');
            ov.style.display = 'flex';

            for(let i=seconds; i>0; i--) {
                txt.innerText = i;
                playSound('count');
                await sleep(800);
            }
            txt.innerText = finalMsg;
            playSound('tick');
            await sleep(800);
            ov.style.display = 'none';
        }

        async function runSequenceDisplay() {
            const len = currentRound + 2;
            for(let i = 0; i < len; i++) {
                playersData.forEach(p => {
                    if(!p.active) return;
                    const slots = document.getElementById(`slots-area-${p.id}`).children;
                    if(slots[i]) {
                        slots[i].innerText = p.sequence[i];
                        slots[i].classList.add('showing');
                    }
                });
                playSound('tick');
                await sleep(800); 
            }

            await sleep(3000);

            playersData.forEach(p => {
                const slots = document.getElementById(`slots-area-${p.id}`).children;
                for(let s of slots) {
                    s.innerText = '';
                    s.classList.remove('showing');
                }
            });

            const t = i18n[currentLang];
            await showCountDown(3, t.msgInput);
            startInputPhase();
        }

        function startInputPhase() {
            isInputPhase = true;
            
            const container = document.getElementById('global-timer-container');
            container.classList.remove('hidden');

            playersData.forEach(p => {
                if(p.active) document.getElementById(`keypad-${p.id}`).classList.add('active');
            });

            const bar = document.getElementById('global-timer-bar');
            bar.style.transition = 'none';
            bar.style.width = '100%';
            void bar.offsetWidth; 
            
            let timeLimit = 20 + (currentRound * 2); 
            bar.style.transition = `width ${timeLimit}s linear`;
            bar.style.width = '0%';

            if(timerInterval) clearTimeout(timerInterval);
            timerInterval = setTimeout(() => {
                finishRound(); 
            }, timeLimit * 1000);
        }

        function handleInput(pid, num) {
            if(!isInputPhase) return;
            const p = playersData[pid-1];
            if(!p.active || p.submitted) return;
            if(p.input.length >= p.sequence.length) return;

            p.input.push(num);
            playSound('input');

            const slots = document.getElementById(`slots-area-${pid}`).children;
            slots[p.input.length-1].innerText = num;
            slots[p.input.length-1].classList.add('filled');
        }

        function clearInput(pid) {
            if(!isInputPhase) return;
            const p = playersData[pid-1];
            if(!p.active || p.submitted) return;

            p.input = [];
            const slots = document.getElementById(`slots-area-${pid}`).children;
            for(let s of slots) {
                s.innerText = '';
                s.classList.remove('filled');
            }
        }

        function submitInput(pid) {
            if(!isInputPhase) return;
            const p = playersData[pid-1];
            if(!p.active || p.submitted) return;

            p.submitted = true;
            playSound('submit');
            
            document.getElementById(`p-col-${pid}`).classList.add('submitted');
            document.getElementById(`keypad-${pid}`).classList.remove('active');

            checkAllSubmitted();
        }

        function checkAllSubmitted() {
            const activePlayers = playersData.filter(p => p.active);
            const allSubmitted = activePlayers.every(p => p.submitted);
            if(allSubmitted) finishRound();
        }

        function finishRound() {
            isInputPhase = false;
            if(timerInterval) clearTimeout(timerInterval);

            let anyCorrect = false;

            playersData.forEach(p => {
                if(!p.active) return;
                
                let correct = p.submitted; 
                if(p.input.length !== p.sequence.length) correct = false;
                
                if(correct) {
                    for(let i=0; i<p.sequence.length; i++) {
                        if(p.sequence[i] !== p.input[i]) {
                            correct = false;
                            break;
                        }
                    }
                }

                const slots = document.getElementById(`slots-area-${p.id}`).children;
                for(let i=0; i<p.sequence.length; i++) {
                    if(slots[i]) {
                        if(correct) slots[i].classList.add('correct');
                        else slots[i].classList.add('wrong');
                    }
                }

                if(correct) {
                    anyCorrect = true;
                    const col = document.getElementById(`p-col-${p.id}`);
                    const msg = document.createElement('div');
                    msg.className = 'praise-msg';
                    msg.innerText = i18n[currentLang].praise; 
                    col.appendChild(msg);
                }
            });

            if (anyCorrect) { playSound('cheer'); }

            setTimeout(() => {
                const msgs = document.querySelectorAll('.praise-msg');
                msgs.forEach(m => m.remove());

                playersData.forEach(p => {
                    if (!p.active) return;
                    
                    let correct = p.submitted;
                    if(p.input.length !== p.sequence.length) correct = false;
                    if(correct) {
                        for(let i=0; i<p.sequence.length; i++) {
                            if(p.sequence[i] !== p.input[i]) { correct = false; break; }
                        }
                    }

                    if(!correct) { eliminatePlayer(p.id); }
                });

                const survivors = updateSurvivorCount();
                if (totalPlayers > 1 && survivors <= 1) {
                    const winner = playersData.find(p => p.active);
                    if(winner) winner.diedRound = currentRound + 100; 
                    endGame();
                } else if (totalPlayers === 1 && survivors === 0) {
                    endGame();
                } else {
                    currentRound++;
                    startRound();
                }
            }, 2500);
        }

        function eliminatePlayer(pid) {
            const p = playersData[pid-1];
            p.active = false;
            p.diedRound = currentRound; 
            playSound('wrong');
            
            const col = document.getElementById(`p-col-${pid}`);
            col.classList.remove('submitted');
            col.classList.add('eliminated');
            
            const slots = document.getElementById(`slots-area-${pid}`).children;
            for(let i=0; i<p.sequence.length; i++) {
                if(slots[i]) {
                    slots[i].innerText = p.sequence[i];
                    slots[i].style.color = '#ff4757';
                }
            }
        }

        function endGame() {
            playSound('fanfare');
            document.getElementById('result-overlay').style.display = 'flex';

            const sortedPlayers = [...playersData].sort((a, b) => b.diedRound - a.diedRound);
            
            let currentRank = 1;
            for (let i = 0; i < sortedPlayers.length; i++) {
                const p = sortedPlayers[i];
                
                if (i > 0 && p.diedRound === sortedPlayers[i-1].diedRound) {
                    // 동점자
                } else {
                    currentRank = i + 1;
                }

                let rankEmoji = '';
                if (currentRank === 1) rankEmoji = `<span class="medal-emoji">${RANK_MEDALS[0]}</span>`;
                else if (currentRank === 2) rankEmoji = `<span class="medal-emoji">${RANK_MEDALS[1]}</span>`;
                else if (currentRank === 3) rankEmoji = `<span class="medal-emoji">${RANK_MEDALS[2]}</span>`;
                else if (currentRank <= 6) rankEmoji = `<span class="rank-num-emoji">${RANK_NUMS[currentRank-4]}</span>`;
                
                const rankArea = document.getElementById(`rank-area-${p.id}`);
                if (rankArea) {
                    rankArea.innerHTML = rankEmoji;
                }
            }
        }
    </script>
</body>
