        /* 1. 기본 설정 */
        body {
            margin: 0; padding: 0;
            background-color: #0b0e27;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;

        }

        /* 2. 레이아웃 */
        #top-area {
            position: absolute; top: 0; left: 0; width: 100%; height: 35%;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            z-index: 10; pointer-events: none;
            padding-top: 40px; box-sizing: border-box;
        }
        
        #game-area {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
        }

        .player-zone {
            flex: 1; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            overflow: visible; 
        }

        /* 3. UI 디자인 */
        .mission-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 30px; border-radius: 30px; 
            border: 2px solid rgba(255,255,255,0.3);
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            pointer-events: auto;
            display: flex; 
            flex-direction: column; 
            align-items: center; justify-content: center;
            margin-top: 10px; 
        }

        #mission-text { 
            color: #fff; font-size: 1.8vw; 
            margin-bottom: 5px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
        }
        
        #target-val { 
            color: #00ffff; font-size: 4vw; font-weight: bold; line-height: 1;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            display: inline-flex; align-items: center;
        }
 /* 분수 스타일 */
        .fraction { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin-right: 5px; }
        .fraction sup { position: static; line-height: 1; font-size: 1em; border-bottom: 3px solid currentColor; padding-bottom: 3px; width: 100%; }
        .fraction sub { position: static; line-height: 1; font-size: 1em; padding-top: 3px; width: 100%; }

        .timer-circle {
            width: 8vw; height: 8vw;
            background: #ff4757; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 4px solid white; box-shadow: 0 0 30px #ff4757;
            animation: pulse 1s infinite;
            transition: background 0.3s; 
            margin-bottom: 5px; 
        }
        #timer-text { color: white; font-size: 4vw; font-weight: bold; }

        /* 컨트롤 영역 (버튼들) */
        .control-row {
            position: absolute; bottom: 5%; width: 100%;
            display: flex; justify-content: center; align-items: center;
            gap: 15px; 
            z-index: 200; 
            pointer-events: none; 
        }

        .lock-btn {
            position: relative; 
            padding: 1.5vh 3vw; font-size: 2.2vw;
            border: none; border-radius: 50px; cursor: pointer;
            font-family: 'Jua', sans-serif; color: #0b0e27;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s, background 0.3s; 
            pointer-events: auto; white-space: nowrap;
        }
        .lock-btn:active { transform: scale(0.95); }
        
        #btn-left { background: #FFD700; }
        #btn-left:hover { background: #ffe44d; }
        #btn-right { background: #70ffea; }
        #btn-right:hover { background: #9dfff2; }
        .lock-btn.locked { background: #555 !important; color: #aaa; pointer-events: none; transform: scale(0.9); }

        /* 되돌리기 버튼 스타일 */
        .undo-btn {
            position: relative; 
            padding: 10px 15px; border-radius: 30px; border: none;
            background: rgba(255,255,255,0.25); color: white; font-size: 1.5vw; font-family: 'Jua';
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.5); transition: 0.2s; 
            pointer-events: auto; white-space: nowrap;
        }
        .undo-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.05); }
        .undo-btn:disabled { opacity: 0.5; background: #333; cursor: not-allowed; transform: none; }

        /* --- 오버레이 (첫 화면) 디자인 --- */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2b1055 0%, #0b0e27 80%);
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; 
            z-index: 4000; 
        }
        
        .promo-link-top {
            color: #FFD700; font-size: 1.8vw; text-decoration: none; margin-bottom: 20px;

            border: 1px solid rgba(255, 215, 0, 0.4); transition: 0.3s;
            display: flex; align-items: center; gap: 10px;
        }

        .promo-link-top span { color: #fff; font-weight: bold; text-decoration: underline; }

        .title-logo {
            font-size: 8vw; color: #fff; margin-bottom: 10px;
            text-shadow: 0 0 20px #ffeb3b, 0 0 40px #ff9800;
            animation: bounce 2s infinite; font-family: 'Jua', sans-serif;
            background: linear-gradient(to bottom, #fff, #ffeb3b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            position: relative; z-index: 10;
        }

        .alien-container {
            display: flex; justify-content: center; gap: 50vw; 
            width: 100%;
            position: absolute; top: 45%; transform: translateY(-50%); pointer-events: none; z-index: -1;
        }
        .alien-char {
            width: 15vw; animation: float 3s ease-in-out infinite; opacity: 0.8;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        .rules-card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            padding: 20px 40px; border-radius: 20px; margin: 30px 0;
            border: 1px solid rgba(255,255,255,0.2); text-align: left;
            color: #eee; font-size: 1.5vw; line-height: 1.8;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 700px;
        }
        .rules-card strong { color: #00ffff; }

        .start-btn {
            padding: 15px 60px; font-size: 3vw; color: #fff;
            background: linear-gradient(45deg, #FF00CC, #3333FF);
            border: none; border-radius: 60px; cursor: pointer;
            font-family: 'Jua', sans-serif;
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative; overflow: hidden;
            z-index: 10; pointer-events: auto; 
            margin-bottom: 20px; white-space: nowrap;
        }
        .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(255, 0, 204, 0.7); }
        .start-btn:active { transform: scale(0.95); }

        .other-game-btn {
            background: #2b1055; border: 2px solid #FFD700; color: #FFD700;
            padding: 10px 30px; border-radius: 30px; text-decoration: none;
            font-size: 1.5vw; font-weight: bold; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 100;
            white-space: nowrap;
        }
        .other-game-btn:hover { background: #FFD700; color: #2b1055; }

        /* 결과 화면 등 기타 버튼 */
        .result-actions {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: none; flex-direction: column; align-items: center; gap: 15px;
            z-index: 600;
        }

        #replay-btn {
            padding: 15px 50px; font-size: 2.5vw; 
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white; border: none; border-radius: 50px;
            box-shadow: 0 0 20px rgba(255, 75, 43, 0.6);
            cursor: pointer; font-family: 'Jua', sans-serif;
            animation: popIn 0.5s; white-space: nowrap;
        }

        .result-angle {
            position: absolute; bottom: 20%; width: 100%;
            text-align: center; font-size: 4vw; opacity: 0;
            pointer-events: none; z-index: 600; 
        }
        .score-box {
            background: rgba(0,0,0,0.85); padding: 10px 25px; border-radius: 20px; display: inline-block;
            box-shadow: 0 0 15px rgba(255,255,255,0.2); color: white; line-height: 1.2;
        }
        .diff-text { display: block; font-size: 0.5em; color: #ffcccc; margin-top: 5px; }

  .winner-crown {
            position: absolute; top: 25vh; left: 50%; transform: translateX(-50%) scale(0);
            font-size: 5vw; color: #fff; z-index: 500; pointer-events: none;
            text-shadow: 3px 3px 0 #000; filter: drop-shadow(0 0 20px rgba(255, 215, 0, 1));
            transition: transform 0.5s; width: 100%; white-space: nowrap;
            display: flex; justify-content: center; align-items: center; /* 텍스트와 이미지를 가로로 완벽히 정렬 */
        }
        .winner-crown img { height: 1.2em; margin-right: 15px; object-fit: contain; } /* flex 정렬에 맞춰 불필요한 속성 제거 */

        .canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .canvas-fg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; cursor: crosshair; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

        .float-btn {
            position: absolute; bottom: 15px; width: 50px; height: 50px;
            background-color: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px; color: white; font-size: 24px; cursor: pointer; 
            z-index: 5000; 
            display: flex; justify-content: center; align-items: center; transition: 0.3s;
            text-decoration: none; pointer-events: auto;
        }
        .float-btn:hover { background-color: rgba(255, 255, 255, 0.4); }
        #fullscreen-btn { right: 15px; }
        #home-btn { left: 15px; }

        /* 커스텀 스크롤바 (모달 내부 스크롤용) */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        /* 모달 등장 애니메이션 */
        .modal-overlay {
            opacity: 0; visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            transform: scale(0.95) translateY(-10px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        /* 토스트 알림 애니메이션 */
        .toast {
            transform: translateY(100%); opacity: 0;
            transition: all 0.3s ease;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);

        }

        function playExplosionSound() {

            const bufferSize = audioCtx.sampleRate * 0.8; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        function redrawPlayer(p) {
            if (p.canvasBg.width === 0) resizeCanvas(p);

            drawBaseShape(p, p.ctxBg, colors[p.id === 'left' ? 'p1' : 'p2']);
            drawBaseShape(p, p.ghostCtx, '#FFFFFF');
            p.totalPixels = countPixels(p.ghostCtx, p.ghostCanvas.width, p.ghostCanvas.height);
            p.history.forEach(path => { applyCutToCanvas(p.ctxBg, path); applyCutToCanvas(p.ghostCtx, path); });

        function drawBaseShape(p, ctx, color) {
            ctx.clearRect(0, 0, p.canvasBg.width, p.canvasBg.height);
            const size = Math.min(p.canvasBg.width, p.canvasBg.height) * 0.55 * 0.8;
            ctx.fillStyle = color; ctx.beginPath();
            
            ctx.setLineDash([]); 

            if (shapeType === 'circle') ctx.arc(p.cx, p.cy, size/2, 0, Math.PI*2);
            else if (shapeType === 'rect') ctx.rect(p.cx - size/2, p.cy - size/2, size, size);
            else if (shapeType === 'triangle') drawPolygon(ctx, p.cx, p.cy, size/2 + 20, 3, -Math.PI/2);
            else if (shapeType === 'pentagon') drawPolygon(ctx, p.cx, p.cy, size/2 + 10, 5, -Math.PI/2);
            ctx.fill();
        }
        
        function drawBaseOutline(p, ctx) {
            const size = Math.min(p.canvasBg.width, p.canvasBg.height) * 0.55 * 0.8;

            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; 
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]); 
            ctx.beginPath();
            if (shapeType === 'circle') ctx.arc(p.cx, p.cy, size/2, 0, Math.PI*2);
            else if (shapeType === 'rect') ctx.rect(p.cx - size/2, p.cy - size/2, size, size);
            else if (shapeType === 'triangle') drawPolygon(ctx, p.cx, p.cy, size/2 + 20, 3, -Math.PI/2);
            else if (shapeType === 'pentagon') drawPolygon(ctx, p.cx, p.cy, size/2 + 10, 5, -Math.PI/2);
            ctx.stroke();
            ctx.restore();
        }

        function drawPolygon(ctx, x, y, radius, sides, rotateOffset) {
            ctx.moveTo(x + radius * Math.cos(rotateOffset), y + radius * Math.sin(rotateOffset));
            for (let i = 1; i <= sides; i++) ctx.lineTo(x + radius * Math.cos(rotateOffset + i * 2 * Math.PI / sides), y + radius * Math.sin(rotateOffset + i * 2 * Math.PI / sides));

        function moveDraw(e, p) { if (!p.isDrawing || p.locked) return; e.preventDefault(); addPathPoint(e, p); drawTrace(p); }
        function endDraw(e, p) { if (!p.isDrawing) return; p.isDrawing = false; p.ctxFg.clearRect(0, 0, p.canvasFg.width, p.canvasFg.height); if (p.path.length < 5) return; playCutSound(); p.history.push([...p.path]); applyCutToCanvas(p.ctxBg, p.path); applyCutToCanvas(p.ghostCtx, p.path); updateRatio(p); createThrustParticles(p, p.path[p.path.length-1].x, p.path[p.path.length-1].y, '#fff'); redrawPlayer(p); }
        
        function addPathPoint(e, p) { const rect = p.canvasFg.getBoundingClientRect(); p.path.push({x: e.clientX - rect.left, y: e.clientY - rect.top}); }
        function drawTrace(p) {
            const ctx = p.ctxFg; ctx.clearRect(0, 0, p.canvasFg.width, p.canvasFg.height);
            ctx.beginPath(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.lineCap = 'round';
            if (p.path.length > 2) {
                ctx.moveTo(p.path[0].x, p.path[0].y);
                for (let i = 1; i < p.path.length - 2; i++) {
                    const xc = (p.path[i].x + p.path[i+1].x) / 2; const yc = (p.path[i].y + p.path[i+1].y) / 2;
                    ctx.quadraticCurveTo(p.path[i].x, p.path[i].y, xc, yc);
                }
                ctx.stroke();
            }
        }
        function applyCutToCanvas(ctx, path) {
            ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length - 2; i++) { const xc = (path[i].x + path[i+1].x) / 2; const yc = (path[i].y + path[i+1].y) / 2; ctx.quadraticCurveTo(path[i].x, path[i].y, xc, yc); }
            ctx.lineTo(path[path.length-1].x, path[path.length-1].y); ctx.closePath(); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
        }
        function updateRatio(p) { const cur = countPixels(p.ghostCtx, p.ghostCanvas.width, p.ghostCanvas.height); p.removedPixels = p.totalPixels - cur; p.currentRatio = p.removedPixels / p.totalPixels; }

        function undo(p) {
            if (gameState !== 'playing' || p.locked || p.history.length === 0 || p.undoUsed) return;
            p.history.pop(); p.undoUsed = true;
            
            const btn = document.getElementById(`undo-${p.id}`);
            btn.disabled = true; 
            btn.style.opacity = 0.5;
            btn.innerText = translations[currentLang].undoUsed; // 다국어
            
            playLockSound(); redrawPlayer(p);
        }

        function lockPlayer(p) {
            if (gameState !== 'playing' || p.locked) return;
            playLockSound(); p.locked = true;
            const btn = document.getElementById(`btn-${p.id}`); 
            btn.classList.add('locked'); 
            btn.innerText = translations[currentLang].waiting; // 다국어
            if (p1.locked && p2.locked) endGame();
            else if (timeLeft > 5) { timeLeft = 5.0; playTickSound(); }
        }

        function endGame() {
            clearInterval(timerInterval); gameState = 'end';
            document.getElementById('timer-text').innerText = translations[currentLang].end; // 다국어
            
            // 컨트롤 버튼 숨기기
            document.getElementById('btn-left').style.display = 'none'; document.getElementById('btn-right').style.display = 'none';
            document.getElementById('undo-left').style.display = 'none'; document.getElementById('undo-right').style.display = 'none';

            // Z-Index 조정하여 캐릭터가 위로 오게 함
            document.getElementById('canvas-left-bg').style.zIndex = '500';
            document.getElementById('canvas-right-bg').style.zIndex = '500';

            [p1, p2].forEach(p => {
                let diff = Math.abs(targetRatio - p.currentRatio);
                p.score = parseFloat((diff * 100).toFixed(1));
            });

            // 결과 표시
            showScore(p1); showScore(p2);

            setTimeout(() => {
                if (p1.score < p2.score) { triggerWin(p1); triggerLose(p2); }
                else if (p2.score < p1.score) { triggerWin(p2); triggerLose(p1); }
                else { // 무승부
                    const tieText = translations[currentLang].tie;
                    document.getElementById('crown-left').innerText = tieText; document.getElementById('crown-right').innerText = tieText;
                    document.getElementById('crown-left').style.transform = 'translateX(-50%) scale(1)';
                    document.getElementById('crown-right').style.transform = 'translateX(-50%) scale(1)';
                    playWinSound();
                }
                setTimeout(() => { document.getElementById('result-group').style.display = 'flex'; }, 1500);
            }, 500);
        }

        function showScore(p) {
            const el = document.getElementById(`score-${p.id}`);
            const removedPer = (p.currentRatio*100).toFixed(1);
            const displayScore = missionMode === 'keep' ? (100 - parseFloat(removedPer)).toFixed(1) : removedPer;
            
            // 다국어 점수판
            const t = translations[currentLang];
            const typeLabel = missionMode === 'remove' ? t.scoreRemove : t.scoreKeep;
            
            el.querySelector('.score-box').innerHTML = `${typeLabel}: ${displayScore}%<br><span class="diff-text">(${p.score}% ${t.diff})</span>`;
            el.style.opacity = 1;
        }

        function triggerWin(p) {
            const crownId = p.id === 'left' ? 'crown-left' : 'crown-right';
            document.getElementById(crownId).style.transform = 'translateX(-50%) scale(1)';
            p.anim.active = true; p.anim.state = 'win'; p.anim.speed = 0.6; p.anim.yOffset = 0;
            playWinSound(); playRiseSound(); createConfetti(p, p.cx, p.cy);
        }

        function triggerLose(p) {
            p.anim.active = true; p.anim.state = 'lose'; p.anim.speed = 0.6; p.anim.yOffset = 0; p.anim.rotOffset = 0;
            playExplosionSound();
        }

        function animate() {
            updateGiantAnimation(p1); updateGiantAnimation(p2);
            drawScene(p1); drawScene(p2);
            updateParticles(p1); updateParticles(p2);
            requestAnimationFrame(animate);
        }

        function updateGiantAnimation(p) {
            if (!p.anim.active) return;
            if (p.anim.state === 'win') {
                p.anim.speed *= 1.01; p.anim.yOffset -= p.anim.speed;
                createThrustParticles(p, p.cx, p.cy + p.anim.yOffset + 50, '#FFD700');
            } else if (p.anim.state === 'lose') {
                p.anim.speed *= 1.01; p.anim.yOffset += p.anim.speed; p.anim.rotOffset += 0.1;
            }
        }

        function drawScene(p) {
            if (!p.anim.active) return;

            const ctx = p.ctxBg; 
            ctx.clearRect(0, 0, p.canvasBg.width, p.canvasBg.height);
            
            drawParticles(ctx, p.particles);

            ctx.save();
            ctx.translate(p.cx, p.cy + p.anim.yOffset);
            
            if (p.anim.state === 'lose') {
                ctx.rotate(Math.PI + p.anim.rotOffset); 
            } else {
                ctx.rotate(0);
            }

            ctx.scale(10, 10); // 캐릭터 확대
            if (p.anim.state === 'lose') ctx.filter = 'grayscale(100%)';
            
            if (p.img.complete) {
                ctx.rotate(0); 
                ctx.drawImage(p.img, -20, -20, 40, 40);
            }
            ctx.restore();
        }

        function createThrustParticles(p, x, y, c) { for(let i=0; i<5; i++) p.particles.push({ x: x+(Math.random()-0.5)*20, y: y, vx: (Math.random()-0.5)*2, vy: Math.random()*5+5, life: 1.0, color: c, size: Math.random()*3+2 }); }
        function createConfetti(p, x, y) { for(let i=0; i<30; i++) p.particles.push({ x: x, y: y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1.0, color: '#fff', size: 4 }); }
        function updateParticles(p) { p.particles.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.02; }); p.particles = p.particles.filter(pt => pt.life > 0); }
        function drawParticles(ctx, ps) { ps.forEach(pt => { ctx.globalAlpha = pt.life; ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill(); }); ctx.globalAlpha = 1.0; }

    </script>

</body>
