    <style>
        /* 폰트: HS산토끼 */
        @font-face {
            font-family: 'HsSantoki';
            src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/HS-Regular.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --p1-main: #ff9f43; 
            --p1-glow: rgba(255, 159, 67, 0.6);
            --p2-main: #54a0ff;
            --p2-glow: rgba(84, 160, 255, 0.6);
            --bg-color: #1e1e2e;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'HsSantoki', 'Noto Sans KR', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            color: white;
            font-weight: normal;
        }

        body { display: flex; flex-direction: column; background-color: #1e1e2e; }
        a { text-decoration: none; color: inherit; }

        /* --- 신규 다국어 모달 관련 CSS --- */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay {
            opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active {
            opacity: 1; visibility: visible;
        }
        .modal-content {
            transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Noto Sans KR', sans-serif; /* 모달 내부는 가독성 폰트 사용 */
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0); opacity: 1;
        }
        .toast {
            transform: translateY(100%); opacity: 0; transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .toast.show {
            transform: translateY(0); opacity: 1;
        }

        /* --- 배경 (전역) --- */
        .background-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #222f3e 0%, #1e1e2e 100%);
            z-index: -10;
            overflow: hidden;
        }

        .bg-bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            animation: rise var(--duration) infinite linear;
            left: var(--left);
            width: var(--size);
            height: var(--size);
            animation-delay: var(--delay);
            pointer-events: none;
            will-change: transform, opacity;
        }
        @keyframes rise {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.5; }
            50% { opacity: 0.8; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* --- 인트로 화면 --- */
        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
            transition: opacity 0.5s;
        }

        .promo-link {
            font-size: 1.5rem; color: #ccc; margin-bottom: 10px; opacity: 0.9;
            transition: transform 0.2s, color 0.2s; cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .promo-link span { color: #feca57; text-decoration: underline; }
        .promo-link:hover { transform: scale(1.05); color: #fff; }

        .game-title {
            font-size: 5rem; margin-bottom: 0px;
            background: linear-gradient(to right, #ff9f43, #54a0ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2));
            animation: float 3s ease-in-out infinite; font-weight: normal;
            white-space: nowrap;
        }

        .tutorial-box {
            background: rgba(30, 30, 40, 0.1); padding: 10px 50px;
            border-radius: 20px; border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 30px; 
            max-width: 80%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tutorial-text { font-size: 1.8rem; line-height: 1.6; color: #eee; font-weight: normal; }
        .highlight { color: #feca57; font-size: 2rem; font-weight: normal; }
        .warning { color: #ff6b6b; font-weight: normal; display: block; margin-top: 10px; }
        b { font-weight: normal; }

        .btn-group { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }

        .btn {
            padding: 15px 40px; font-size: 1.8rem; font-family: 'HsSantoki';
            border: none; border-radius: 50px; cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s; color: #fff;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2); text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            font-weight: normal;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn:active { transform: scale(0.95); }
        .btn-basic { background: linear-gradient(45deg, #1dd1a1, #10ac84); }
        .btn-normal { background: linear-gradient(45deg, #feca57, #ff9f43); }
        .btn-hard { background: linear-gradient(45deg, #54a0ff, #2e86de); }
        .btn small { display: block; font-size: 0.7em; margin-top: 5px; opacity: 0.9; }

        .other-game-link {
            font-size: 1.2rem; color: #aaa; margin-top: 10px;
            text-decoration: none; cursor: pointer; transition: color 0.2s;
        }
        .other-game-link:hover { color: #fff; text-decoration: underline; }

        /* --- 게임 UI --- */
        #game-screen {
            display: none; flex: 1; flex-direction: column; width: 100%; height: 100%;
        }

        .top-hud {
            flex: 0 0 90px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: rgba(30, 30, 40, 0.9);
            border-bottom: 3px solid rgba(255,255,255,0.1); z-index: 100;
        }

        .team-score { 
            font-size: 1.5rem; display: flex; flex-direction: row; 
            align-items: center; min-width: 180px; gap: 15px; font-weight: normal;
        }
        .p1-score-box { justify-content: flex-start; }
        .p2-score-box { flex-direction: row-reverse; justify-content: flex-start; }

        .team-name { font-size: 3rem; opacity: 1.0; white-space: nowrap; font-weight: normal; }
        .score-num { font-size: 3rem; min-width: 60px; text-align: center; font-weight: normal; }
        
        .p1-color { color: var(--p1-main); text-shadow: 0 0 5px rgba(255, 159, 67, 0.3); }
        .p2-color { color: var(--p2-main); text-shadow: 0 0 5px rgba(84, 160, 255, 0.3); }

        .timer-box { flex: 1; text-align: center; max-width: 300px; margin: 0 20px; }
        .timer-num { font-size: 2.2rem; color: #feca57; margin-bottom: 5px; font-weight: normal; }
        .progress-track { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; border: 1px solid #555; }
        .progress-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #1dd1a1, #feca57, #ff6b6b); transition: width 0.2s linear; }

        .play-area {
            flex: 1; display: flex; position: relative; flex-direction: row; 
        }

        .player-zone {
            flex: 1; position: relative; display: flex; justify-content: center; 
            align-items: flex-end; 
            border-right: 2px dashed rgba(255,255,255,0.1); overflow: hidden;
            padding-bottom: 5vh;
        }
        .player-zone:last-child { border-right: none; }

        .bg-watermark { display: none; }

        .game-board {
            width: 74%; 
            aspect-ratio: 1/1; 
            max-width: 64vh; 
            max-height: 90%;
            background: rgba(20, 20, 30, 0.6); border-radius: 24px;
            position: relative; z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 5px solid rgba(255,255,255,0.1); transition: border-color 0.2s;
            margin-top: 0;
        }

        #board-p1 { border-color: var(--p1-main); }
        #board-p2 { border-color: var(--p2-main); }

        .shake-anim { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; border-color: #ff4757 !important; }

        .target-hint {
            position: absolute;
            top: -60px; left: 50%; transform: translateX(-50%);
            background: rgba(30, 30, 46, 0.95);
            padding: 8px 30px; border-radius: 50px;
            font-size: 1.6rem; white-space: nowrap;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 50; color: #feca57;
            text-shadow: 0 0 5px rgba(254, 202, 87, 0.5);
        }
        .target-hint::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-top: 10px solid #fff;
        }

        .bubble {
            position: absolute; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            /* 폰트 굵기 두껍게 변경 */
            font-size: 1.4rem; font-weight: bold; color: #000;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.6), 0 3px 6px rgba(0, 0, 0, 0.3);
            /* 투명도 제거: rgba 알파 값을 1.0으로 변경 */
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,1.0) 0%, rgba(255,255,255,1.0) 20%, var(--bubble-bg) 100%);
            opacity: 1.0; 
            border: 2px solid rgba(255,255,255,0.5);
            transform: scale(1); transition: transform 0.1s;
            animation: floatBubble 3s ease-in-out infinite alternate;
            white-space: nowrap;
            text-shadow: 0 0 2px #fff;
            will-change: transform;
            /* 숫자 폰트 변경: 기본 폰트 적용 */
            font-family: Arial, sans-serif;
        }
        .bubble:active { transform: scale(0.9); filter: brightness(0.9); }
        .bubble::after {
            content: ''; position: absolute; top: 15%; left: 15%;
            width: 25%; height: 12%; border-radius: 50%;
            /* 하이라이트 투명도 제거: rgba 알파 값을 1.0으로 변경 */
            background: rgba(255,255,255,1.0); transform: rotate(-45deg);
        }
        .bubble.hint-active {
            animation: hintPulse 0.8s ease-in-out infinite alternate;
            border: 4px solid #fff000; z-index: 9999 !important; filter: brightness(1.2);
        }

        .float-btn {
            position: fixed; bottom: 20px; width: 50px; height: 50px;
            background: rgba(60, 60, 70, 0.8); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; cursor: pointer; z-index: 5000;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 24px; transition: all 0.2s;
        }
        .float-btn:hover { background: rgba(80, 80, 90, 0.9); transform: scale(1.1); }
        .float-btn:active { transform: scale(0.95); }
        #home-btn { left: 20px; }
        #fullscreen-btn { right: 20px; }

        .popping { animation: popAnim 0.2s forwards ease-out; pointer-events: none; }
        .respawning { animation: spawnAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        #fx-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

        #result-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 3000;
            flex-direction: column; justify-content: center; align-items: center;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes floatBubble { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
        @keyframes popAnim { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.8; } 100% { transform: scale(0); opacity: 0; } }
        @keyframes spawnAnim { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes hintPulse { 0% { transform: scale(1); box-shadow: 0 0 10px #fff000; } 100% { transform: scale(1.15); box-shadow: 0 0 20px #fff000; } }

        @media (max-aspect-ratio: 1/1) {
            .play-area { flex-direction: column; }
            .player-zone { border-right: none; border-bottom: 2px dashed rgba(255,255,255,0.1); }
            .game-board { width: auto; height: 85%; margin-top: 0; margin-left: 20px; }
            .target-hint { top: 10px; left: 10px; transform: none; font-size: 1.2rem; padding: 5px 15px; }
            .target-hint::after { display: none; }
        }

        @media (max-width: 600px) and (orientation: portrait) {
            .game-board { width: 90%; height: auto; margin-top: 25px; }
            .target-hint { top: -45px; left: 50%; transform: translateX(-50%); }
            .top-hud { padding: 0 10px; }
            .team-score { min-width: auto; font-size: 1.2rem; }
            .score-num { font-size: 1.8rem; min-width: 40px; }
            .team-name { display: none; }
        }
    </style>
</head>

            <p id="ui-toast" class="text-sm font-medium text-white">언어가 변경되었습니다.</p>

    </div>

    <div id="intro-screen">

            <span data-i18n="slogan">게임으로 수학의 킹이 되어라</span> <span id="site-name-span" data-i18n="siteName">킹수학.com</span>

        <h1 class="game-title">🫧 <span data-i18n="gameTitle" style="word-break: keep-all;">킹방울 터트리기</span> 🫧</h1>
        <div class="tutorial-box">
            <p class="tutorial-text">
                <b style="color:var(--p1-main)" data-i18n="teamDog">🐶강아지팀</b> vs <b style="color:var(--p2-main)" data-i18n="teamCat">🐱고양이팀</b><br>                <span data-i18n="rules1">화면 상단의</span> <span class="highlight" data-i18n="rules2">규칙</span><span data-i18n="rules3">을 확인하고</span><br>
                <span data-i18n="rules4">순서대로 방울을 터트리세요!</span><br>

    function renderLanguages(filterText = '') {
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languages.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === LangSys.current;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected 
                    ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                    : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;

                btn.addEventListener('click', () => selectLanguage(lang));
                grid.appendChild(btn);
            });
        }

    const AudioSys = {
        ctx: null,
        init: function() {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        },
        play: function(type) {
            if (!this.ctx) this.init();
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const now = this.ctx.currentTime;
            
            if (type === 'start') {
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                notes.forEach((freq, i) => {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.1, now + i * 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.3);
                    o.connect(g);
                    g.connect(this.ctx.destination);
                    o.start(now + i * 0.05);
                    o.stop(now + i * 0.05 + 0.3);
                });
                return;
            } else if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800 + Math.random() * 200, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'error') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1); osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'respawn') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(600, now + 0.3);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'hint') {
                const osc1 = this.ctx.createOscillator();
                const gain1 = this.ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(400, now);
                osc1.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc1.connect(gain1); gain1.connect(this.ctx.destination);
                osc1.start(now); osc1.stop(now + 0.1);

                const osc2 = this.ctx.createOscillator();
                const gain2 = this.ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(600, now + 0.15);
                osc2.frequency.exponentialRampToValueAtTime(900, now + 0.25);
                gain2.gain.setValueAtTime(0.2, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc2.connect(gain2); gain2.connect(this.ctx.destination);
                osc2.start(now + 0.15); osc2.stop(now + 0.25);
                return;
            } else if (type === 'win') {
                const melody = [
                    {f: 523.25, t: 0}, {f: 523.25, t: 0.1}, {f: 523.25, t: 0.2}, 
                    {f: 659.25, t: 0.4}, {f: 783.99, t: 0.6}, {f: 1046.50, t: 0.8}
                ];
                melody.forEach(n => {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.type = 'square';
                    o.frequency.value = n.f;
                    g.gain.setValueAtTime(0.1, now + n.t);
                    g.gain.exponentialRampToValueAtTime(0.001, now + n.t + 0.4);
                    o.connect(g); g.connect(this.ctx.destination);
                    o.start(now + n.t); o.stop(now + n.t + 0.4);
                });
                const chord = [523.25, 659.25, 783.99, 1046.50];
                chord.forEach(freq => {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.1, now + 0.8);
                    g.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
                    o.connect(g); g.connect(this.ctx.destination);
                    o.start(now + 0.8); o.stop(now + 2.0);
                });
                return;
            }
            osc.connect(gain); gain.connect(this.ctx.destination);
        }
    };

    const FX = {
        canvas: document.getElementById('fx-canvas'), ctx: null, particles: [],
        init: function() {
            this.ctx = this.canvas.getContext('2d', { alpha: true }); 
            this.resize(); window.addEventListener('resize', () => this.resize()); this.loop();
        },
        resize: function() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
        spawn: function(x, y, color) {
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 6 + 2;
                this.particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.0, color: color, size: Math.random() * 8 + 3 });
            }
        },
        loop: function() {
            const ctx = this.ctx; ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            if(this.particles.length > 0) { 
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.05; p.size *= 0.92;
                    if (p.life <= 0) { this.particles.splice(i, 1); continue; }
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill();
                }
            }
            requestAnimationFrame(() => this.loop());
        }
    };

    const game = {
        config: {

        colors: ['#ffb7b2', '#ffdac1', '#e2f0cb', '#b5ead7', '#c7ceea', '#fdfd96', '#fab1a0', '#81ecec'],

        init: function(mode) {
            // 게임 시작 시 언어 선택 UI 숨기기

            this.state.isPlaying = true; this.state.timeLeft = 60; this.updateTimer();
            if(this.state.timerId) clearInterval(this.state.timerId);

        setupPlayer: function(pid, mode, step) {
            const cfg = this.config[mode];
            const board = document.getElementById(`board-${pid}`);
            
            let ruleText;
            if (step === 1) ruleText = LangSys.getText('ruleSeq');
            else ruleText = LangSys.format('ruleSkip', step);

            board.innerHTML = `<div class="target-hint">${ruleText}</div>`;

            const startNum = (mode === 'basic') ? 1 : step;
            
            this.state[pid].current = startNum; 
            this.state[pid].startNum = startNum; 
            this.state[pid].step = step; 
            this.state[pid].bubbles = [];
            this.state[pid].lastAction = Date.now();
            this.state[pid].isHinting = false;

            let numbers = []; 
            for (let i = 0; i < cfg.count; i++) numbers.push(startNum + (i * step));
            
            const rect = board.getBoundingClientRect();
            const bubbleSize = rect.width / 7; 

            let positions = [];
            numbers.forEach((num, index) => {
                let pos = this.getSafePosition(positions, rect.width, rect.height, bubbleSize);
                positions.push(pos);
                let zIndex = 1000 + (cfg.count - index); 
                this.createBubbleElement(pid, num, pos.x, pos.y, size=bubbleSize, zIndex);
            });
        },

        getSafePosition: function(existing, w, h, size) {
            let x, y, overlap; let tries = 0;
            const padding = 4;
            const topMargin = 10; 
            do {
                overlap = false;
                x = Math.random() * (w - size - padding * 2) + padding;
                y = Math.random() * (h - size - padding * 2 - topMargin) + topMargin;
                for (let p of existing) {
                    const dist = Math.sqrt((x - p.x)**2 + (y - p.y)**2);
                    if (dist < size) { overlap = true; break; }
                }
                tries++;
            } while (overlap && tries < 1000);
            return {x, y};
        },

        createBubbleElement: function(pid, num, x, y, size, zIndex) {
            const board = document.getElementById(`board-${pid}`);
            const el = document.createElement('div');
            el.className = 'bubble';
            el.textContent = num;
            el.dataset.val = num;
            const color = this.colors[Math.floor(Math.random() * this.colors.length)];
            el.style.setProperty('--bubble-bg', color);
            el.style.width = size + 'px'; el.style.height = size + 'px';
            el.style.left = x + 'px'; el.style.top = y + 'px';
            // 폰트 크기 비율을 살짝 더 줄임 (0.6 -> 0.5, 0.45 -> 0.35)
            el.style.fontSize = (num > 99) ? (size * 0.35) + 'px' : (size * 0.5) + 'px';
            el.style.zIndex = zIndex;
            board.appendChild(el);
            this.state[pid].bubbles.push({ num, el, x, y, size, color });
        },

        handleBoardTouch: function(e, pid) {
            if (!this.state.isPlaying) return;
            if (e.target.classList.contains('bubble')) {
                const val = parseInt(e.target.dataset.val);
                if (val === this.state[pid].current) this.handleCorrect(pid, e.target, val);
                else this.handleWrong(pid, e.target);
            } else if (!e.target.classList.contains('target-hint') && e.target.tagName !== 'B') {
                this.handleWrong(pid, null);
            }
        },

        handleCorrect: function(pid, el, val) {
            AudioSys.play('pop');
            const rect = el.getBoundingClientRect();
            const color = getComputedStyle(el).getPropertyValue('--bubble-bg');
            FX.spawn(rect.left + rect.width/2, rect.top + rect.height/2, color);
            el.classList.add('popping');
            setTimeout(() => el.remove(), 200); 
            
            const pState = this.state[pid];
            pState.bubbles = pState.bubbles.filter(b => b.num !== val);
            pState.current += pState.step;
            
            pState.lastAction = Date.now();
            pState.isHinting = false;
            pState.bubbles.forEach(b => b.el.classList.remove('hint-active'));

            document.getElementById(`score-${pid}`).innerText = parseInt(document.getElementById(`score-${pid}`).innerText) + 100;
            
            if (pState.bubbles.length === 0) this.endGame();
        },

        handleWrong: function(pid, clickedEl) {
            AudioSys.play('error');
            const board = document.getElementById(`board-${pid}`);
            board.classList.remove('shake-anim'); void board.offsetWidth; board.classList.add('shake-anim');
            if (clickedEl) { clickedEl.style.transform = 'scale(0.8)'; setTimeout(() => clickedEl.style.transform = 'scale(1)', 100); }
            
            const pState = this.state[pid];
            pState.lastAction = Date.now();
            pState.isHinting = false;
            pState.bubbles.forEach(b => b.el.classList.remove('hint-active'));

            const scoreEl = document.getElementById(`score-${pid}`);
            scoreEl.innerText = Math.max(0, parseInt(scoreEl.innerText) - 50);

            if (pState.current > pState.startNum) {
                setTimeout(() => {
                    AudioSys.play('respawn');
                    pState.current -= pState.step;
                    
                    const prevNum = pState.current;
                    const boardRect = board.getBoundingClientRect();
                    const existingPos = pState.bubbles.map(b => ({x: b.x, y: b.y}));
                    const size = boardRect.width / 7; 
                    
                    const newPos = this.getSafePosition(existingPos, boardRect.width, boardRect.height, size);
                    this.createBubbleElement(pid, prevNum, newPos.x, newPos.y, size, 2000);
                    const newBubble = pState.bubbles[pState.bubbles.length-1].el;
                    newBubble.classList.add('respawning');
                }, 200);
            }
        },

        checkHints: function() {
            if (!this.state.isPlaying) return;
            const now = Date.now();
            ['p1', 'p2'].forEach(pid => {
                const pState = this.state[pid];
                if (now - pState.lastAction > 3000 && !pState.isHinting) {
                    const targetBubble = pState.bubbles.find(b => b.num === pState.current);
                    if (targetBubble) {
                        pState.isHinting = true;
                        targetBubble.el.classList.add('hint-active');
                        AudioSys.play('hint');
                    }
                }
            });
        },

        updateTimer: function() {
            document.getElementById('timer-display').innerText = this.state.timeLeft;
            document.getElementById('timer-bar').style.width = (this.state.timeLeft / 60) * 100 + '%';
        },
        endGame: function() {
            this.state.isPlaying = false; 
            clearInterval(this.state.timerId); 
            clearInterval(this.state.hintInterval);
            AudioSys.play('win');
            const s1 = parseInt(document.getElementById('score-p1').innerText);
            const s2 = parseInt(document.getElementById('score-p2').innerText);
            document.getElementById('result-modal').style.display = 'flex';
            document.getElementById('final-p1').innerText = s1; document.getElementById('final-p2').innerText = s2;
            const wTxt = document.getElementById('winner-text');
            
            if (s1 > s2) wTxt.innerHTML = `<span style='color:var(--p1-main)'>${LangSys.getText('winDog')}</span>`;
            else if (s2 > s1) wTxt.innerHTML = `<span style='color:var(--p2-main)'>${LangSys.getText('winCat')}</span>`;
            else wTxt.innerText = LangSys.getText('draw');
        }
    };
</script>

</body>
</html>
