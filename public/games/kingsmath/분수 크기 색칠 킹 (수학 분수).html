        function initLanguageSystem() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            const localLang = localStorage.getItem('kingsmath_lang');
            const navLang = navigator.language.toLowerCase();
            const validCodes = languages.map(l => l.code);
            
            if (urlLang && validCodes.includes(urlLang)) {
                currentLang = urlLang;
            } else if (localLang && validCodes.includes(localLang)) {
                currentLang = localLang;
            } else if (validCodes.includes(navLang)) {
                currentLang = navLang;
            } else if (navLang.startsWith('pt')) {
                currentLang = 'pt-br';
            } else {
                const shortNav = navLang.split('-')[0];
                if (validCodes.includes(shortNav)) {
                    currentLang = shortNav;
                }
            }
            
            const activeLangObj = languages.find(l => l.code === currentLang);
            updateUIAndApplyLanguage(activeLangObj, false);
            renderLanguages(); // 제미나이 체크용 목록 호출
        }

        function updateUIAndApplyLanguage(langObj, showToastAlert = true) {

            localStorage.setItem('kingsmath_lang', currentLang);
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?lang=' + currentLang;
            window.history.pushState({path:newUrl}, '', newUrl);

            // 게임 텍스트 및 SEO 태그 변경 반영

            if (showToastAlert) {

        // --- 오디오 시스템 ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playTone(freq, type, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function playCutSound() { playTone(400, 'sine', 0.1); playTone(600, 'sine', 0.1); }
        function playLockSound() { playTone(1200, 'triangle', 0.1); setTimeout(() => playTone(600, 'square', 0.1), 100); }
        function playWinSound() { if (!audioCtx) return; setTimeout(() => playTone(523.25, 'sine', 0.3), 0); setTimeout(() => playTone(659.25, 'sine', 0.3), 100); setTimeout(() => playTone(783.99, 'sine', 0.6), 200); }
        function playStartSound() { if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.5); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
        function playTickSound() { playTone(800, 'sine', 0.1); }
        
        function playRiseSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 1.5);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.8; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1000; filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.8);
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(1.0, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start();
        }

        // --- 게임 로직 ---
        const colors = { p1: '#FFD700', p2: '#70ffea' };
        let gameState = 'ready', timeLeft = 20, timerInterval;
        let targetN = 1, targetD = 2; 
        let targetRatio = 0.5, targetLabel = "1/2";
        let shapeType = "square";

        const p1 = { id: 'left', canvasBg: null, ctxBg: null, canvasFg: null, ctxFg: null, ghostCanvas: null, ghostCtx: null, 
                      totalPixels: 0, paintedPixels: 0, currentRatio: 0, 
                      isDrawing: false, path: [], history: [],
                      locked: false, score: 0, particles: [], img: imgP1, cx: 0, cy: 0, anim: { active: false, state: '', yOffset: 0, rotOffset: 0, speed: 0 } };
        
        const p2 = { id: 'right', canvasBg: null, ctxBg: null, canvasFg: null, ctxFg: null, ghostCanvas: null, ghostCtx: null,
                      totalPixels: 0, paintedPixels: 0, currentRatio: 0,
                      isDrawing: false, path: [], history: [],
                      locked: false, score: 0, particles: [], img: imgP2, cx: 0, cy: 0, anim: { active: false, state: '', yOffset: 0, rotOffset: 0, speed: 0 } };

        window.onload = () => {

        function initPlayer(p, side) {
            p.canvasBg = document.getElementById(`canvas-${side}-bg`);
            p.ctxBg = p.canvasBg.getContext('2d', { willReadFrequently: true });
            p.canvasFg = document.getElementById(`canvas-${side}-fg`);

            p.ghostCanvas = document.createElement('canvas');

        function resizeAll() {

        function resizeCanvas(p) { 
            const rect = p.canvasFg.parentElement.getBoundingClientRect();
            const width = rect.width || window.innerWidth / 2;
            const height = rect.height || window.innerHeight;
            
            p.canvasBg.width = width; p.canvasBg.height = height;
            p.canvasFg.width = width; p.canvasFg.height = height;
            p.ghostCanvas.width = width; p.ghostCanvas.height = height;
            p.cx = width / 2; p.cy = height * 0.55; 
        }

    function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {

        function initAudioAndStart() { initAudio(); startGame(); }

        function startGame() {

            const denoms = [2, 3, 4, 5, 6, 7, 8, 9];

      targetLabel = `

`;
            const shapes = ['circle', 'square', 'rect'];

            calculateTotalArea(p1);

        function resetPlayer(p) {
            p.paintedPixels = 0; p.currentRatio = 0; p.locked = false; p.score = 0; p.particles = []; 
            p.anim = { active: false, state: '', yOffset: 0, rotOffset: 0, speed: 0 };
            p.path = []; p.history = [];
            
            const btn = document.getElementById(`btn-${p.id}`);
            btn.classList.remove('locked');

            undoBtn.disabled = false;

            setTimeout(autoResizeTexts, 50);
        }

        function applyShapeClip(p, ctx) {
            const size = Math.min(p.canvasBg.width, p.canvasBg.height) * 0.55 * 0.8;
            ctx.beginPath();
            if (shapeType === 'circle') ctx.arc(p.cx, p.cy, size/2, 0, Math.PI*2);
            else if (shapeType === 'square') ctx.rect(p.cx - size/2, p.cy - size/2, size, size);
            else if (shapeType === 'rect') ctx.rect(p.cx - size/1.5, p.cy - size/2.5, size*1.33, size*0.8);
            ctx.clip();
        }

        function calculateTotalArea(p) {
            p.ghostCtx.clearRect(0, 0, p.ghostCanvas.width, p.ghostCanvas.height);
            p.ghostCtx.save();
            p.ghostCtx.fillStyle = "#FFF";
            applyShapeClip(p, p.ghostCtx);
            p.ghostCtx.fill();
            p.ghostCtx.restore();
            p.totalPixels = countPixels(p.ghostCtx, p.ghostCanvas.width, p.ghostCanvas.height);
        }

        function redrawPlayer(p) {
            if (p.canvasBg.width === 0) resizeCanvas(p);

            const w = p.canvasBg.width; const h = p.canvasBg.height;
            const paintColor = colors[p.id === 'left' ? 'p1' : 'p2'];

            p.ctxBg.clearRect(0, 0, w, h);
            
            p.ctxBg.save();
            applyShapeClip(p, p.ctxBg);
            p.ctxBg.fillStyle = "rgba(255, 255, 255, 0.1)";
            p.ctxBg.fill();
            
            p.history.forEach(stroke => drawBrushStroke(p.ctxBg, stroke, paintColor));
            p.ctxBg.restore();

            drawBaseOutline(p, p.ctxBg);

            p.ghostCtx.clearRect(0, 0, w, h);
            p.ghostCtx.save();
            applyShapeClip(p, p.ghostCtx);
            p.history.forEach(stroke => drawBrushStroke(p.ghostCtx, stroke, "#FFF"));
            p.ghostCtx.restore();
            
            p.paintedPixels = countPixels(p.ghostCtx, w, h);
            p.currentRatio = p.totalPixels > 0 ? p.paintedPixels / p.totalPixels : 0;
        }

        function drawBaseOutline(p, ctx) {
            const size = Math.min(p.canvasBg.width, p.canvasBg.height) * 0.55 * 0.8;
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.7)"; 
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 8]); 
            ctx.beginPath();
            if (shapeType === 'circle') ctx.arc(p.cx, p.cy, size/2, 0, Math.PI*2);
            else if (shapeType === 'square') ctx.rect(p.cx - size/2, p.cy - size/2, size, size);
            else if (shapeType === 'rect') ctx.rect(p.cx - size/1.5, p.cy - size/2.5, size*1.33, size*0.8);
            ctx.stroke();
            ctx.restore();
        }

        function countPixels(ctx, w, h) {
            const imgData = ctx.getImageData(0, 0, w, h); let count = 0;
            for(let i=3; i<imgData.data.length; i+=16) {
                if(imgData.data[i] > 50) count++;
            }
            return count;
        }

        function gameLoop() {
            timeLeft -= 0.1;
            if (Math.abs(timeLeft - Math.round(timeLeft)) < 0.05 && Math.ceil(timeLeft) <= 5 && Math.ceil(timeLeft) > 0) playTickSound();
            updateTimerUI();
            if (timeLeft <= 0) endGame();
        }

        function updateTimerUI() {
            const displayTime = Math.ceil(timeLeft);
            document.getElementById('timer-text').innerText = displayTime;
            const timerBg = document.getElementById('timer-bg');
            if (timeLeft <= 5) { timerBg.style.background = '#ff0000'; timerBg.style.transform = `scale(${1 + (0.5 * (1 - (timeLeft % 1)) )})`; } 
            else { timerBg.style.background = '#ff4757'; timerBg.style.transform = 'scale(1)'; }
        }

        function startDraw(e, p) { 
            if (gameState !== 'playing' || p.locked) return; 
            e.preventDefault(); 
            e.target.setPointerCapture(e.pointerId); 
            p.isDrawing = true; 
            const rect = p.canvasFg.getBoundingClientRect();
            p.path = [{x: e.clientX - rect.left, y: e.clientY - rect.top}]; 
            drawLiveTrace(p);
        }
        function moveDraw(e, p) { 
            if (!p.isDrawing || p.locked) return; 
            e.preventDefault(); 
            const rect = p.canvasFg.getBoundingClientRect();
            p.path.push({x: e.clientX - rect.left, y: e.clientY - rect.top}); 
            drawLiveTrace(p); 
        }
        function endDraw(e, p) { 
            if (!p.isDrawing) return; 
            p.isDrawing = false; 
            p.ctxFg.clearRect(0, 0, p.canvasFg.width, p.canvasFg.height); 
            if (p.path.length < 2) return; 
            playCutSound(); 
            p.history.push([...p.path]); 
            redrawPlayer(p); 
            createThrustParticles(p, p.path[p.path.length-1].x, p.path[p.path.length-1].y, '#fff'); 
        }
        
        function drawLiveTrace(p) {
            const ctx = p.ctxFg; 
            ctx.clearRect(0, 0, p.canvasFg.width, p.canvasFg.height);
            ctx.save();
            applyShapeClip(p, ctx);
            drawBrushStroke(ctx, p.path, colors[p.id === 'left' ? 'p1' : 'p2']);
            ctx.restore();
        }

        function drawBrushStroke(ctx, stroke, color) {
            if(stroke.length === 0) return;
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 40;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            if(stroke.length === 1) {
                ctx.arc(stroke[0].x, stroke[0].y, 20, 0, Math.PI*2);
                ctx.fill();
                return;
            }
            ctx.moveTo(stroke[0].x, stroke[0].y);
            for(let i=1; i<stroke.length-1; i++) {
                const xc = (stroke[i].x + stroke[i+1].x)/2;
                const yc = (stroke[i].y + stroke[i+1].y)/2;
                ctx.quadraticCurveTo(stroke[i].x, stroke[i].y, xc, yc);
            }
            ctx.lineTo(stroke[stroke.length-1].x, stroke[stroke.length-1].y);
            ctx.stroke();
        }

        function undo(p) {
            if (gameState !== 'playing' || p.locked || p.history.length === 0) return;
            p.history.pop();
            playLockSound(); redrawPlayer(p);
        }

        function lockPlayer(p) {
            if (gameState !== 'playing' || p.locked) return;
            playLockSound(); p.locked = true;
            const btn = document.getElementById(`btn-${p.id}`); 
            btn.classList.add('locked'); 
            btn.querySelector('.auto-resize-text').innerText = translations[currentLang].waiting;
            if (p1.locked && p2.locked) endGame();
            else if (timeLeft > 5) { timeLeft = 5.0; playTickSound(); }
        }

        function endGame() {
            clearInterval(timerInterval); gameState = 'end';
            document.getElementById('timer-text').innerText = translations[currentLang].end;
            
            document.getElementById('btn-left').style.display = 'none'; document.getElementById('btn-right').style.display = 'none';
            document.getElementById('undo-left').style.display = 'none'; document.getElementById('undo-right').style.display = 'none';

            document.getElementById('canvas-left-bg').style.zIndex = '500';
            document.getElementById('canvas-right-bg').style.zIndex = '500';
            
            // 종료시 다시 언어 선택 모달 등장
            document.getElementById('langTriggerWrapper').style.display = 'block';

            [p1, p2].forEach(p => {
                let diff = Math.abs(targetRatio - p.currentRatio);
                p.score = parseFloat((diff * 100).toFixed(1));
            });

            showScore(p1); showScore(p2);

            setTimeout(() => {
                if (p1.score < p2.score) { triggerWin(p1); triggerLose(p2); }
                else if (p2.score < p1.score) { triggerWin(p2); triggerLose(p1); }
                else { 
                    const tieText = translations[currentLang].tie;
                    document.getElementById('crown-left').innerText = tieText; document.getElementById('crown-right').innerText = tieText;
                    document.getElementById('crown-left').style.transform = 'translateX(-50%) scale(1)';
                    document.getElementById('crown-right').style.transform = 'translateX(-50%) scale(1)';
                    playWinSound();
                    drawAnswerOverlay(p1); drawAnswerOverlay(p2);
                }
                setTimeout(() => { document.getElementById('result-group').style.display = 'flex'; }, 1500);
            }, 500);
        }

        function showScore(p) {
            const el = document.getElementById(`score-${p.id}`);
            const paintedPer = (p.currentRatio*100).toFixed(1);
            const t = translations[currentLang];
            
            el.querySelector('.score-box').innerHTML = `${t.scorePainted}: ${paintedPer}%<br><span class="diff-text">(${p.score}% ${t.diff})</span>`;
            el.style.opacity = 1;
        }
        
        function drawAnswerOverlay(p) {
            const ctx = p.ctxBg;
            const size = Math.min(p.canvasBg.width, p.canvasBg.height) * 0.55 * 0.8;
            
            ctx.save();
            applyShapeClip(p, ctx);

            ctx.fillStyle = "rgba(0, 255, 100, 0.4)"; 
            
            if (shapeType === 'circle') {
                const angleStep = (Math.PI * 2) / targetD;
                ctx.beginPath();
                ctx.moveTo(p.cx, p.cy);
                ctx.arc(p.cx, p.cy, size/2, -Math.PI/2, -Math.PI/2 + angleStep * targetN);
                ctx.lineTo(p.cx, p.cy);
                ctx.fill();

                ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                for (let i = 0; i < targetD; i++) {
                    ctx.beginPath();
                    ctx.moveTo(p.cx, p.cy);
                    const a = -Math.PI/2 + angleStep * i;
                    ctx.lineTo(p.cx + Math.cos(a) * size / 2, p.cy + Math.sin(a) * size / 2);
                    ctx.stroke();
                }

            } else if (shapeType === 'square') {
                const w = size; const h = size;
                const startX = p.cx - size/2; const startY = p.cy - size/2;
                const stepX = w / targetD;
                
                ctx.fillRect(startX, startY, stepX * targetN, h);

                ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                for (let i = 1; i < targetD; i++) {
                    ctx.beginPath();
                    ctx.moveTo(startX + stepX * i, startY);
                    ctx.lineTo(startX + stepX * i, startY + h);
                    ctx.stroke();
                }

            } else if (shapeType === 'rect') {
                const w = size * 1.33; const h = size * 0.8;
                const startX = p.cx - size/1.5; const startY = p.cy - size/2.5;
                const stepX = w / targetD;

                ctx.fillRect(startX, startY, stepX * targetN, h);

                ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                for (let i = 1; i < targetD; i++) {
                    ctx.beginPath();
                    ctx.moveTo(startX + stepX * i, startY);
                    ctx.lineTo(startX + stepX * i, startY + h);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        function triggerWin(p) {
            const crownId = p.id === 'left' ? 'crown-left' : 'crown-right';
            document.getElementById(crownId).style.transform = 'translateX(-50%) scale(1)';
            playWinSound(); playRiseSound(); createConfetti(p, p.cx, p.cy);
            drawAnswerOverlay(p);
        }

        function triggerLose(p) {
            playExplosionSound();
            drawAnswerOverlay(p);
        }

        function animate() {
            drawScene(p1); drawScene(p2);
            updateParticles(p1); updateParticles(p2);
            requestAnimationFrame(animate);
        }

        function drawScene(p) {
            if (gameState === 'end') {
                p.ctxFg.clearRect(0, 0, p.canvasFg.width, p.canvasFg.height);
                drawParticles(p.ctxFg, p.particles);
            }
        }

        function createThrustParticles(p, x, y, c) { for(let i=0; i<5; i++) p.particles.push({ x: x+(Math.random()-0.5)*20, y: y, vx: (Math.random()-0.5)*2, vy: Math.random()*5+5, life: 1.0, color: c, size: Math.random()*3+2 }); }
        function createConfetti(p, x, y) { for(let i=0; i<30; i++) p.particles.push({ x: x, y: y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1.0, color: '#fff', size: 4 }); }
        function updateParticles(p) { p.particles.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.02; }); p.particles = p.particles.filter(pt => pt.life > 0); }
        function drawParticles(ctx, ps) { ps.forEach(pt => { ctx.globalAlpha = pt.life; ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill(); }); ctx.globalAlpha = 1.0; }

    </script>

</body>
