<style>
    :root { --app-height: 100vh; }

    /* 전자칠판 터치 최적화: 파란 화면(선택/드래그) 및 더블탭 줌 완벽 차단 */
    * {
        -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        -webkit-user-drag: none; -khtml-user-drag: none; -moz-user-drag: none; -o-user-drag: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; outline: none;
    }

    html, body {
        margin: 0; padding: 0; overflow: hidden;
        background-color: #121212; font-family: 'Nanum Gothic', sans-serif;
        width: 100%; height: 100vh; height: 100dvh; height: var(--app-height); 
        touch-action: none;
        display: flex; flex-direction: column; color: #fff; overscroll-behavior: none;
    }

    /* --- Top Information Area --- */
    #top-area {
        flex: 0 0 auto; min-height: 8vmin;
        background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        position: relative; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #scoreboard-row {
        display: flex; justify-content: space-between; align-items: stretch;
        width: 100%; padding: 1vmin 3vmin; flex: 1; gap: 2vmin;
    }

    .team-panel {
        flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: rgba(255,255,255,0.05); border-radius: 12px; padding: 1vmin 2vmin;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5); position: relative; overflow: hidden;
    }
    .p1-panel { border: 3px solid #ff4d4d; }
    .p2-panel { border: 3px solid #4d88ff; }

    /* 점수 대신 팀 이름을 크게 강조 */
    .player-label { font-size: clamp(24px, 4vmin, 40px); font-weight: 900; letter-spacing: 2px; margin: 0; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
    .p1-label { color: #ff4d4d; }
    .p2-label { color: #4d88ff; }

    .win-overlay {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.85); display: none; flex-direction: column;
        justify-content: center; align-items: center; font-weight: 800; z-index: 20;
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .win-overlay.win { color: #ffcc00; font-size: clamp(40px, 5vw, 70px); text-shadow: 0 0 20px rgba(255,204,0,0.8); }
    .win-overlay.lose { color: #777; font-size: clamp(24px, 3vw, 40px); text-shadow: none; }
    .win-overlay.draw { color: #fff; font-size: clamp(30px, 4vw, 50px); text-shadow: 0 0 15px rgba(255,255,255,0.5); }

    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .timer-container { width: 15%; max-width: 200px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .timer-label { color: #ffcc00; font-size: clamp(16px, 2.5vmin, 30px); font-weight: 800; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
    #top-timer-bar { width: 100%; height: 1.5vmin; background: #333; flex-shrink: 0; }
    #top-timer-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff3b30, #ffcc00, #4cd964); transition: width 1s linear; }

    /* --- Bottom Game Area --- */
    #game-area-wrapper {
        flex: 1; display: flex; justify-content: center; align-items: flex-end; 
        padding: 1vmin 2vmin 2vmin 2vmin; background-color: #0d0d0d; position: relative; min-height: 0; 
    }

    #game-area {
        width: 100%; max-width: 1920px; height: 100%; 
        display: flex; gap: 2vmin; justify-content: center; min-height: 0; 
    }

    .player-section {
        flex: 1; display: flex; flex-direction: column; justify-content: flex-end; 
        align-items: center; gap: 1vmin; min-width: 0; height: 100%; padding-bottom: 0.5vmin;
    }

    .targets-container {
        display: grid; gap: 1vmin; width: 100%; max-width: 600px; flex: 0 0 auto; margin-top: auto;
    }

    .target-box {
        background: rgba(0,0,0,0.6); border: 2px solid #555; border-radius: 8px;
        display: flex; justify-content: center; align-items: center;
        aspect-ratio: 1/1; font-size: clamp(16px, 3.5vmin, 40px);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .target-box.filled-p1 { border-color: #ff4d4d; background: rgba(255, 77, 77, 0.2); transform: scale(1.05); box-shadow: 0 0 15px rgba(255,77,77,0.5); }
    .target-box.filled-p2 { border-color: #4d88ff; background: rgba(77, 136, 255, 0.2); transform: scale(1.05); box-shadow: 0 0 15px rgba(77,136,255,0.5); }

    .grid-container {
        background: #1a1a1a; border-radius: 12px; border: 4px solid #333;
        padding: 0.5vmin; display: grid; gap: 0.5vmin; 
        box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-template-rows: repeat(8, minmax(0, 1fr));
        width: 100%; max-width: 100%; flex: 1 1 auto; 
        min-height: 0; aspect-ratio: 12 / 8; margin: 0 auto;
        transition: filter 0.3s, opacity 0.3s;
    }

    .p1-board { border-color: rgba(255, 77, 77, 0.4); }
    .p2-board { border-color: rgba(77, 136, 255, 0.4); }

    .emoji-btn {
        display: flex; justify-content: center; align-items: center;
        font-size: clamp(16px, 4vmin, 50px); 
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
        border-radius: 8px; cursor: pointer;
        transition: transform 0.1s, background 0.1s, filter 0.8s, opacity 0.8s;
        width: 100%; height: 100%; position: relative;
    }
    .emoji-btn:active { transform: scale(0.85); background: rgba(255,255,255,0.15); }

    .hint-fade { filter: grayscale(100%); opacity: 0.05; pointer-events: none; transform: scale(0.8); }

    .correct-mark { pointer-events: none; transform: scale(1.1); z-index: 5; }
    .correct-mark::after {
        content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 90%; height: 90%; border-radius: 50%; border: 5px solid; box-sizing: border-box;
        box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }
    .p1-board .correct-mark::after { border-color: #ff4d4d; }
    .p2-board .correct-mark::after { border-color: #4d88ff; }

    .disabled-mark { filter: grayscale(100%) opacity(0.2); pointer-events: none; }

    .penalty-mode {
        pointer-events: none; border-color: #ff3333 !important;
        animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
        10%, 90% { transform: translate3d(-2px, 0, 0); }
        20%, 80% { transform: translate3d(4px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
        40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .divider { width: 4px; background: rgba(255, 215, 0, 0.4); border-radius: 2px; margin-top: auto; height: 80%; }

    /* Floating Buttons (상단으로 위치 변경) */
    .float-btn {
        position: fixed; top: 75px; width: 40px; height: 40px;
        background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%; cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center;
        color: white; font-size: 20px; transition: all 0.2s; backdrop-filter: blur(4px); pointer-events: auto;
    }
    .float-btn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.1); }
    .float-btn:active { transform: scale(0.95); }
    #fullscreen-btn { right: 20px; }
    #home-btn { left: 20px; }

    /* Overlay (초기 시작화면) */
    #overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 100; backdrop-filter: blur(8px);
    }
    
    .modal-content {
        background: rgba(30, 30, 30, 0.95); padding: 40px 50px; border-radius: 30px; border: 2px solid rgba(197, 160, 89, 0.5);
        display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 900px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.9); pointer-events: auto;
    }

    .modal-content h1 { 
        font-size: clamp(30px, 4.5vw, 46px) !important; margin: 0 0 25px 0; font-weight: 800 !important;
        color: #ffcc00; text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    
    .instruction-box {
        text-align: left; background: rgba(0,0,0,0.5); padding: 25px 35px; border-radius: 20px;
        margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1);
    }
    .instruction-box p {
        font-size: clamp(16px, 2vw, 26px); line-height: 1.6; margin: 12px 0; font-weight: 700; color: #eee;
        display: flex; align-items: center; gap: 10px; word-break: keep-all;
    }
    .instruction-box b { color: #ffcc00; }
    .instruction-box .highlight { color: #ff4d4d; }

    .action-btn {
        padding: 15px 50px; font-size: clamp(22px, 3vw, 32px); font-weight: 800; font-family: 'Nanum Gothic', sans-serif;
        background: linear-gradient(to bottom, #4cd964, #28a745); border: 3px solid #fff; border-radius: 60px; color: #fff; cursor: pointer;
        box-shadow: 0 10px 30px rgba(40, 167, 69, 0.5); transition: transform 0.1s, box-shadow 0.2s;
    }
    .action-btn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(40, 167, 69, 0.7); }
    .action-btn:active { transform: scale(0.95); }

    #restart-container { position: fixed; bottom: 50px; left: 0; width: 100%; display: none; justify-content: center; align-items: center; z-index: 1000; pointer-events: none; }
    #restart-container .action-btn { pointer-events: auto; animation: popIn 0.5s ease-out forwards; }

    #countdown-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; color: white; display: none; flex-direction: column; 
        justify-content: center; align-items: center; z-index: 9999; font-size: clamp(80px, 15vw, 200px); font-weight: 800; text-shadow: 0 0 40px rgba(255,255,255,0.5);
    }
    .count-anim { animation: popCount 1s ease-in-out forwards; }
    @keyframes popCount { 0% { transform: scale(0.5); opacity: 0; } 20% { transform: scale(1.2); opacity: 1; } 80% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

    /* =========================================
       다국어 UI 및 모달 전용 독립 CSS (Z-index 99999)
       ========================================= */
    #top-links-container {
        position: fixed; top: 20px; left: 20px; z-index: 99999;
    }
    #lang-ui-container {
        position: fixed; top: 20px; right: 20px; z-index: 99999;
    }

    .styled-header-btn {
        display: flex; items-center; gap: 8px;
        background: rgba(55, 65, 81, 0.8); border: 1px solid rgba(75, 85, 99, 1);
        border-radius: 9999px; padding: 8px 16px; transition: all 0.2s;
        font-size: 14px; font-weight: 700; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        cursor: pointer; text-decoration: none; align-items: center; backdrop-filter: blur(4px);
    }
    .styled-header-btn:hover { background: rgba(55, 65, 81, 1); transform: scale(1.05); }

    #langModalContainer {
        font-family: 'Noto Sans KR', sans-serif;
    }
    #langModalContainer, #langModalContainer * {
        box-sizing: border-box !important;
    }
    #langModalContainer .fa-solid, #langModalContainer .fa-regular {
        font-family: "Font Awesome 6 Free" !important; font-weight: 900;
    }

    .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    
    .lang-modal-content {
        transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-overlay.active .lang-modal-content { transform: scale(1) translateY(0); opacity: 1; }

    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

    .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }

</style>
</head>
<body>

                <p id="ui-inst2"><span>👆</span> <span>다른 이모지를 찾아 내 팀의 보드를 터치하면 전리품 획득!</span></p>

<script>
    // 표정을 제외하고 동물, 음식, 과일, 탈것, 사물, 스포츠 등 120개의 다채로운 이모지로 교체
    const allEmojis = [
        "🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵",

        { code: 'bn', country: 'bd', name: 'বাংলা', enName: 'Bengali' },
        { code: 'id', country: 'id', name: 'Bahasa Indonesia', enName: 'Indonesian' },
        { code: 'vi', country: 'vn', name: 'Tiếng Việt', enName: 'Vietnamese' },
        { code: 'th', country: 'th', name: 'ไทย', enName: 'Thai' },
        { code: 'tr', country: 'tr', name: 'Türkçe', enName: 'Turkish' }
    ];

    let currentLang = 'ko';

    // 다국어 초기 감지 로직
    function getInitialLang() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('lang') && i18n[urlParams.get('lang')]) return urlParams.get('lang');
        const storedLang = localStorage.getItem('kingsmath_lang');
        if (storedLang && i18n[storedLang]) return storedLang;
        const browserLang = navigator.language.split('-')[0].toLowerCase();
        if (browserLang === 'pt') return 'pt-br';
        if (i18n[browserLang]) return browserLang;
        return 'en';
    }

    function applyLanguage(code, showToastMsg = false) {
        currentLang = code;
        localStorage.setItem('kingsmath_lang', code);
        const url = new URL(window.location);
        url.searchParams.set('lang', code);
        window.history.pushState({}, '', url);

        const t = i18n[code];
        document.getElementById('page-title').textContent = t.pageTitle;
        document.getElementById('og-title').content = t.pageTitle + ' | KingsMath';
        document.getElementById('og-site-name').content = t.siteName;
        document.getElementById('site-link-text').textContent = t.siteName;

        document.getElementById('ui-title').innerHTML = t.title;
        document.getElementById('ui-p1').textContent = t.p1;
        document.getElementById('ui-p2').textContent = t.p2;
        document.getElementById('ui-restart').textContent = t.restart;
        document.getElementById('ui-start').textContent = t.start;
        document.getElementById('ui-inst1').innerHTML = t.inst1;
        document.getElementById('ui-inst2').innerHTML = t.inst2;
        document.getElementById('ui-inst3').innerHTML = t.inst3;
        document.getElementById('ui-inst4').innerHTML = t.inst4;
        document.getElementById('ui-inst5').innerHTML = t.inst5;

        // 버튼 업데이트
        const langObj = langDefs.find(l => l.code === code);
        document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${langObj.country}.png`;
        document.getElementById('currentLangName').textContent = langObj.name;

        if (showToastMsg) {
            document.getElementById('ui-toast-msg').textContent = t.toast;
            document.getElementById('toastLangName').textContent = langObj.enName;
            const toast = document.getElementById('toastNotification');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    }

    // 모달 관련
    const modal = document.getElementById('langModal');
    function openModal() {
        modal.classList.add('active');
        setTimeout(() => document.getElementById('searchInput').focus(), 100);
    }
    function closeModal() {
        modal.classList.remove('active');
    }

    function renderLanguages(filterText = '') {
        const grid = document.getElementById('languageGrid');
        const noResult = document.getElementById('noResult');
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = langDefs.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected 
                    ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                    : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;
                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="https://flagcdn.com/w40/${lang.country}.png" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;
                btn.addEventListener('click', () => {
                    applyLanguage(lang.code, true);
                    closeModal();
                    renderLanguages(document.getElementById('searchInput').value);
                });
                grid.appendChild(btn);
            });
        }
    }

    document.getElementById('langTriggerBtn').addEventListener('click', openModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.getElementById('searchInput').addEventListener('input', (e) => renderLanguages(e.target.value));


    // 게임 코어 기능
    const AudioEngine = {
        ctx: null,
        init: function() {
            if (!this.ctx) { window.AudioContext = window.AudioContext || window.webkitAudioContext; this.ctx = new AudioContext(); }
            else if (this.ctx.state === 'suspended') { this.ctx.resume(); }
        },
        playTone: function(freq, type, duration, vol=0.3, startTime=null) {
            if (!this.ctx) this.init(); if (this.ctx.state === 'suspended') this.ctx.resume();
            const now = startTime || this.ctx.currentTime; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, now); gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + duration);
        },
        playCorrect: function(isP1) { 
            if (!this.ctx) return; const now = this.ctx.currentTime; const base = isP1 ? 660 : 880; 
            this.playTone(base, 'square', 0.1, 0.15, now); this.playTone(base * 1.25, 'triangle', 0.2, 0.2, now + 0.1);
        },
        playWrong: function() { this.playTone(150, 'sawtooth', 0.3, 0.4); setTimeout(() => this.playTone(100, 'sawtooth', 0.4, 0.4), 150); },
        playCountdown: function() { this.playTone(1200, 'sine', 0.1, 0.2); },
        playHint: function() { 
            if (!this.ctx) return; const now = this.ctx.currentTime;
            this.playTone(800, 'sine', 0.1, 0.1, now); this.playTone(1200, 'sine', 0.15, 0.1, now + 0.1); 
        },
        playFanfare: function() {
            if (!this.ctx) return; const now = this.ctx.currentTime;
            [523, 659, 783, 1046, 783, 1046].forEach((freq, i) => { this.playTone(freq, 'square', 0.2, 0.3, now + i*0.15); });
        }
    };

    function toggleFullscreen() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(err => {console.log(err);}); } 
        else { if (document.exitFullscreen) document.exitFullscreen(); }
    }

    let state = { p1: { score: 0 }, p2: { score: 0 } };
    let timeLeft = 60, maxTime = 60, timerId, hintTimerId, isPlaying = false;
    
    const TOTAL_CELLS = 96; 
    const TOTAL_DIFFS = 11; // 맵에 생성되는 총 정답 개수
    const WIN_SCORE = 6;    // 6개 찾으면 승리
    const FILL_ORDER = [2, 3, 1, 4, 0, 5];

    let currentPool = [];
    let baseBoard = [];
    let p1Board = [];
    let p2Board = [];
    let diffIndices = [];
    let foundIndices = new Set();

    function initGame() {
        document.getElementById('win-p1').style.display = 'none';
        document.getElementById('win-p2').style.display = 'none';
        document.getElementById('restart-container').style.display = 'none';

        state.p1.score = 0; state.p2.score = 0;
        foundIndices.clear();

        let shuffledAll = [...allEmojis].sort(() => Math.random() - 0.5);
        currentPool = shuffledAll.slice(0, 10);

        baseBoard = [];
        for(let i=0; i<TOTAL_CELLS; i++) { baseBoard.push(currentPool[Math.floor(Math.random() * 10)]); }
        p1Board = [...baseBoard]; p2Board = [...baseBoard];

        diffIndices = [];
        while(diffIndices.length < TOTAL_DIFFS) {
            let r = Math.floor(Math.random() * TOTAL_CELLS);
            if(!diffIndices.includes(r)) diffIndices.push(r);
        }

        diffIndices.forEach(idx => {
            let original = baseBoard[idx];
            let available = currentPool.filter(e => e !== original);
            p2Board[idx] = available[Math.floor(Math.random() * available.length)];
        });

        renderTargets('p1'); renderTargets('p2');
        renderGrid('p1', p1Board); renderGrid('p2', p2Board);
    }

    function renderTargets(playerStr) {
        const container = document.getElementById(`${playerStr}-targets`);
        container.style.gridTemplateColumns = `repeat(${WIN_SCORE}, 1fr)`;
        container.innerHTML = Array(WIN_SCORE).fill(`<div class="target-box">❓</div>`).join('');
    }

    function renderGrid(playerStr, boardData) {
        const container = document.getElementById(`${playerStr}-grid`);
        container.innerHTML = boardData.map((emoji, index) => {
            return `<div class="emoji-btn" data-index="${index}" onpointerdown="handleTap('${playerStr}', ${index}, this, event)">${emoji}</div>`;
        }).join('');
    }

    function handleTap(playerStr, index, element, event) {
        if(event) { event.preventDefault(); event.stopPropagation(); }
        if(!isPlaying) return;
        if(foundIndices.has(index)) return;

        if(diffIndices.includes(index)) {
            foundIndices.add(index);
            AudioEngine.playCorrect(playerStr === 'p1');

            element.classList.add('correct-mark');
            const oppStr = playerStr === 'p1' ? 'p2' : 'p1';
            const oppBtn = document.querySelector(`#${oppStr}-grid .emoji-btn[data-index="${index}"]`);
            if(oppBtn) oppBtn.classList.add('disabled-mark');

            const targetBoxes = document.getElementById(`${playerStr}-targets`).children;
            const targetIndex = FILL_ORDER[state[playerStr].score];
            const currentBox = targetBoxes[targetIndex];
            
            if(currentBox) {
                currentBox.textContent = playerStr === 'p1' ? p1Board[index] : p2Board[index];
                currentBox.classList.add(playerStr === 'p1' ? 'filled-p1' : 'filled-p2');
            }

            state[playerStr].score++;

            if (state[playerStr].score >= WIN_SCORE) endGame();
        } else {
            AudioEngine.playWrong();
            const grid = document.getElementById(`${playerStr}-grid`);
            grid.classList.add('penalty-mode'); grid.classList.add('disabled-mark'); 
            setTimeout(() => {
                grid.classList.remove('penalty-mode'); grid.classList.remove('disabled-mark'); 
            }, 3000);
        }
    }

    function applyHint() {
        if(!isPlaying) return;
        let identicalIndices = [];
        for(let i=0; i<TOTAL_CELLS; i++) {
            if(!diffIndices.includes(i)) identicalIndices.push(i);
        }
        
        const p1Grid = document.getElementById('p1-grid');
        const p2Grid = document.getElementById('p2-grid');
        
        let availableToRemove = identicalIndices.filter(idx => {
            const btn = p1Grid.querySelector(`.emoji-btn[data-index="${idx}"]`);
            return btn && !btn.classList.contains('hint-fade');
        });

        if(availableToRemove.length > 0) {
            AudioEngine.playHint(); 
            availableToRemove.sort(() => Math.random() - 0.5);
            const toHide = availableToRemove.slice(0, 8); 
            
            toHide.forEach(idx => {
                p1Grid.querySelector(`.emoji-btn[data-index="${idx}"]`).classList.add('hint-fade');
                p2Grid.querySelector(`.emoji-btn[data-index="${idx}"]`).classList.add('hint-fade');
            });
        }
    }

    function startCountdown(event) {
        if(event) { event.preventDefault(); event.stopPropagation(); }
        AudioEngine.init();
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('restart-container').style.display = 'none';
        document.getElementById('top-links-container').style.display = 'none'; // 헤더 링크 숨김
        document.getElementById('lang-ui-container').style.display = 'none'; // 헤더 언어선택 숨김
        
        const countOverlay = document.getElementById('countdown-overlay');
        const countText = document.getElementById('countdown-text');
        countOverlay.style.display = 'flex';
        
        let count = 3; let countInt; 
        
        function updateCount() {
            countText.classList.remove('count-anim');
            void countText.offsetWidth; 
            countText.classList.add('count-anim');
            
            if(count > 0) { countText.textContent = count; AudioEngine.playTone(800, 'square', 0.1, 0.3); } 
            else if(count === 0) { countText.textContent = 'GO!'; AudioEngine.playTone(1200, 'sine', 0.5, 0.4); } 
            else { clearInterval(countInt); countOverlay.style.display = 'none'; startGame(); return; }
            count--;
        }
        updateCount(); countInt = setInterval(updateCount, 1000);
    }

    function startGame() {
        if(isPlaying) return;
        initGame(); timeLeft = maxTime; isPlaying = true;
        const timerFill = document.getElementById('top-timer-fill'); timerFill.style.width = '100%';

        clearInterval(timerId); clearInterval(hintTimerId);

        timerId = setInterval(() => {
            timeLeft--; let pct = (timeLeft / maxTime) * 100; timerFill.style.width = pct + '%';
            if (timeLeft <= 10 && timeLeft > 0) AudioEngine.playCountdown();
            if (timeLeft <= 0) endGame();
        }, 1000);

        hintTimerId = setInterval(applyHint, 10000);
    }

    function endGame() {
        isPlaying = false; clearInterval(timerId); clearInterval(hintTimerId); AudioEngine.playFanfare();

        const winP1 = document.getElementById('win-p1'); const winP2 = document.getElementById('win-p2');
        winP1.style.display = 'flex'; winP2.style.display = 'flex';
        winP1.className = 'win-overlay'; winP2.className = 'win-overlay';
        const t = i18n[currentLang];

        if (state.p1.score > state.p2.score) {
            winP1.innerHTML = t.win; winP1.classList.add('win'); winP2.innerHTML = t.lose; winP2.classList.add('lose');
        } else if (state.p2.score > state.p1.score) {
            winP2.innerHTML = t.win; winP2.classList.add('win'); winP1.innerHTML = t.lose; winP1.classList.add('lose');
        } else {
            winP1.innerHTML = t.draw; winP1.classList.add('draw'); winP2.innerHTML = t.draw; winP2.classList.add('draw');
        }

        setTimeout(() => { document.getElementById('restart-container').style.display = 'flex'; }, 3000);
    }

    // 홈 버튼: 전체화면일 때 지체 없이 초기화 처리
    document.getElementById('home-btn').addEventListener('pointerdown', () => {
        if (document.fullscreenElement) {
            isPlaying = false;
            clearInterval(timerId);
            clearInterval(hintTimerId);
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('top-links-container').style.display = 'block';
            document.getElementById('lang-ui-container').style.display = 'block';
            document.getElementById('restart-container').style.display = 'none';
        } else {
            location.reload();
        }
    });

    const setAppHeight = () => { document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`); }
    window.addEventListener('resize', setAppHeight); window.addEventListener('orientationchange', setAppHeight); setAppHeight();

    // 초기화 실행
    applyLanguage(getInitialLang());
    renderLanguages();
</script>
