    <style>
        :root {
            --bg-color: #212529;
            --p1-bg: #e3f2fd; --p1-main: #1565c0; --p1-cell: #2196f3;
            --p2-bg: #fff3e0; --p2-main: #e65100; --p2-cell: #ff9800;
            --p3-bg: #fce4ec; --p3-main: #ad1457; --p3-cell: #ec407a;
            --p4-bg: #e8f5e9; --p4-main: #2e7d32; --p4-cell: #4caf50;
        }

        /* 기본 설정: 모든 터치 제스처 및 선택 방지 강력 적용 */
        * { 
            box-sizing: border-box; 
            touch-action: none; 
            user-select: none; 
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Jua', 'Fredoka One', 'Noto Sans KR', 'Noto Sans SC', 'Noto Sans JP', sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            overscroll-behavior: none; 
        }

        /* 헤더 */
        header {
            background-color: #111; color: #FFD93D;
            padding: 10px 30px; 
            height: 70px;
            flex-shrink: 0;
            display: flex; align-items: center;
            position: relative; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.6); z-index: 10;
        }
        .header-title { font-size: 1.8rem; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; }
        .header-title a { color: #fff; text-decoration: none; border-bottom: 3px solid #FFD93D; transition: color 0.3s; }
        
        /* 타이머 */
        #timer-display {
            font-size: 2.5rem; color: #fff; background: #c62828;
            padding: 2px 25px; border-radius: 20px; border: 3px solid #ff8a80;
            min-width: 100px; text-align: center;
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        /* 게임 영역 */
        #app-container {
            flex: 1; position: relative; width: 100%;
            display: flex; justify-content: center; align-items: center;
            background: #2b2b2b; padding: 10px; gap: 10px;
        }

        /* 플레이어 구역 */
        .player-area {
            flex: 0 0 24%; max-width: 24%; height: 95%;
            display: flex; flex-direction: column;
            border-radius: 15px; overflow: hidden;
            border: 4px solid #555; background: #fff; position: relative;
        }

        .player-header {
            padding: 8px 10px; text-align: center;
            border-bottom: 3px solid rgba(0,0,0,0.15); flex-shrink: 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .team-name { font-size: 1.5rem; margin: 0; line-height: 1.2; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); }
        .team-score { 
            font-size: 1.8rem; font-weight: bold; 
            background: rgba(0,0,0,0.2); 
            padding: 2px 15px; border-radius: 10px; min-width: 60px;
        }

        /* 그리드 컨테이너 */
        .grid-wrapper {
            flex: 1; display: flex; justify-content: center; align-items: center;
            padding: 10px; background: #9e9e9e; 
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px; width: 100%; aspect-ratio: 1/1; max-width: 95%; 
            background: #ccc; border: 3px solid #333; position: relative;
        }

        /* 그리드 셀 */
        .cell { background: white; border-radius: 2px; cursor: pointer; position: relative; }
        .cell.problem { background: #546e7a !important; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); pointer-events: none; }
        
        .theme-1 .cell.painted { background: var(--p1-cell); }
        .theme-2 .cell.painted { background: var(--p2-cell); }
        .theme-3 .cell.painted { background: var(--p3-cell); }
        .theme-4 .cell.painted { background: var(--p4-cell); }

        .grid-line-sym::after {
            content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px;
            background: #ff1744; z-index: 10; box-shadow: 0 0 5px rgba(255, 23, 68, 0.5);
        }

        .grid-point-sym::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            background: #ff1744; border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 10; box-shadow: 0 0 5px rgba(255, 23, 68, 0.8); border: 2px solid white;
        }

        /* 팀 테마 */
        .theme-1 { background: var(--p1-bg); border-color: var(--p1-main); }
        .theme-1 .player-header { background: var(--p1-main); color: white; }
        .theme-2 { background: var(--p2-bg); border-color: var(--p2-main); }
        .theme-2 .player-header { background: var(--p2-main); color: white; }
        .theme-3 { background: var(--p3-bg); border-color: var(--p3-main); }
        .theme-3 .player-header { background: var(--p3-main); color: white; }
        .theme-4 { background: var(--p4-bg); border-color: var(--p4-main); }
        .theme-4 .player-header { background: var(--p4-main); color: white; }

        /* 시작 화면 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(43, 43, 43, 0.95); z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .start-card {
            background: #fff; color: #333; padding: 20px; border-radius: 30px; 
            width: 95%; max-width: 650px; border: 6px solid #FFD93D;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; gap: 10px; position: relative; align-items: center;
        }
        
        .top-link { text-align: center; font-size: 1.1rem; color: #555; margin-bottom: 5px; }
        .top-link a { color: #1976d2; text-decoration: none; border-bottom: 2px solid #1976d2; font-weight: bold; }

        .title-box { text-align: center; margin-bottom: 0px; }
        .title-box h1 { font-size: 3.5rem; margin: 0; color: #333; letter-spacing: -2px; line-height: 1; }
        
        .instruction-box { display: flex; gap: 15px; justify-content: center; margin: 10px 0; width: 100%; }
        .inst-item {
            flex: 1; background: #f1f8e9; border: 2px solid #8bc34a; border-radius: 15px;
            padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center;
        }
        .inst-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #2e7d32; }
        .inst-desc { font-size: 0.9rem; color: #555; margin-bottom: 5px; word-break: keep-all; }
        
        .mini-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
            width: 60px; height: 60px; background: #ccc; border: 2px solid #555; position: relative;
        }
        .mini-cell { background: white; }
        .mini-cell.fill { background: #546e7a; } 
        .mini-cell.ans { background: #ff9800; }  
        
        .line-ex::after { content:''; position: absolute; left: 50%; top:0; bottom:0; width: 2px; background: red; }
        .point-ex::after {
            content:''; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; 
            background: red; border-radius: 50%; transform: translate(-50%, -50%);
        }

        .option-box {
            background: #fff8e1; border: 3px dashed #ffb300; border-radius: 20px; padding: 15px;
            display: flex; flex-direction: column; gap: 8px; width: 100%;
        }
        .option-row { display: flex; align-items: center; gap: 10px; }
        .option-label { font-size: 1.3rem; font-weight: bold; width: 70px; text-align: right; margin-right: 5px; white-space: nowrap; }
        .btn-group { flex: 1; display: flex; gap: 6px; }
        
        .btn-option {
            background: #fff; border: 2px solid #ddd; padding: 8px 0;
            border-radius: 10px; font-size: 1.1rem; cursor: pointer; transition: 0.2s;
            flex: 1; text-align: center; color: #555; box-shadow: 0 2px 0 #ddd;
        }
        .btn-option:hover { background: #fafafa; transform: translateY(-1px); }
        .btn-option.selected { 
            background: #FFD93D; border-color: #f57f17; color: #000; 
            font-weight: bold; box-shadow: 0 3px 0 #f57f17; transform: translateY(-2px);
        }

        #btn-start {
            background: #2979ff; color: white; border: none; padding: 15px 40px;
            font-size: 2rem; border-radius: 50px; cursor: pointer; font-family: 'Jua', 'Fredoka One', sans-serif;
            box-shadow: 0 6px 0 #1565c0; transition: 0.1s; width: auto; min-width: 250px; margin-top: 10px;
        }
        #btn-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #1565c0; }

        .bottom-link { text-align: center; margin-top: 10px; }
        .bottom-link a {
            display: inline-block; background: #616161; color: white; 
            padding: 8px 20px; border-radius: 20px; text-decoration: none;
            font-size: 1rem; box-shadow: 0 4px 0 #424242;
        }
        .bottom-link a:active { transform: translateY(2px); box-shadow: 0 2px 0 #424242; }

        /* 결과 및 기타 */
        .overlay-msg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 50; color: white; border-radius: 12px;
        }
        
        @keyframes successPop {
            0% { transform: scale(1); opacity: 0; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        .success-effect {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; display: flex; justify-content: center; align-items: center;
        }
        .success-icon { font-size: 6rem; color: #00e676; text-shadow: 0 0 15px #fff; opacity: 0; }
        .animate-pop .success-icon { animation: successPop 0.6s ease-out forwards; }

        .float-btn {
            position: fixed; bottom: 20px; width: 50px; height: 50px; background: #444; color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; border: 2px solid #888; z-index: 1000;
        }
        #home-btn { left: 20px; background: #d32f2f; }
        #full-btn { right: 20px; background: #1976d2; }

        #game-over-controls {
            position: fixed; bottom: 30px; left: 0; width: 100%;
            display: none; justify-content: center; z-index: 2000;
        }
        #btn-restart {
            background: #00e676; color: #000; border: none; padding: 10px 40px; font-size: 2rem; border-radius: 50px;
            font-family: 'Jua', 'Fredoka One', sans-serif; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); border: 4px solid #fff;
        }

        /* --- 추가된 언어 선택 UI 전용 CSS --- */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* 번역 텍스트 길이에 따른 동적 폰트 조절 */
        body.lang-long .btn-option, body.lang-long .option-label, body.lang-long .inst-title { font-size: 0.95rem; }
        body.lang-long #btn-start { font-size: 1.5rem; }
        body.lang-long .title-box h1 { font-size: 2.8rem; }
    </style>
</head>

    function renderLanguages(filterText = '') {
        languageGrid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languagesList.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            languageGrid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            languageGrid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected 
                    ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                    : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;

                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;
                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;
                btn.addEventListener('click', () => {
                    selectLanguage(lang);
                    closeModal();
                    showToast(lang.name);
                });
                languageGrid.appendChild(btn);
            });
        }
    }

    function selectLanguage(langObj) {
        currentLang = langObj.code;
        localStorage.setItem('kingsmath_lang', currentLang);
        
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('lang', currentLang);
        window.history.pushState({}, '', newUrl);
        
        currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;
        currentLangSpan.textContent = langObj.name;
        
        const t = uiTranslations[currentLang] || uiTranslations['en'];
        document.getElementById('searchInput').placeholder = t.search;

        applyLanguage(currentLang);
        renderLanguages(searchInput.value);
    }

    function showToast(langName) {
        toastLangName.textContent = langName;

        const storedLang = localStorage.getItem('kingsmath_lang');
        const browserLang = navigator.language.slice(0, 2).toLowerCase();

        // 감지 우선순위 철저: 파라미터 -> 로컬스토리지 -> 브라우저 -> 기본값 영어(en)
        if (urlLang && I18N[urlLang]) currentLang = urlLang;
        else if (storedLang && I18N[storedLang]) currentLang = storedLang;
        else if (I18N[browserLang]) currentLang = browserLang;
        else currentLang = 'en';
        
        const targetLangObj = languagesList.find(l => l.code === currentLang) || languagesList[1];
        currentFlagImg.src = `https://flagcdn.com/w40/${targetLangObj.country}.png`;
        currentLangSpan.textContent = targetLangObj.name;

        applyLanguage(currentLang);
        renderLanguages();
    }

    function applyLanguage(lang) {
        const textData = I18N[lang] || I18N['en'];
        
        document.getElementById('header-title-text').innerText = textData.title;
        document.getElementById('main-title').innerText = textData.title;
        document.getElementById('top-msg').innerText = textData.topMsg;
        document.getElementById('inst-line-title').innerText = textData.instLineTitle;
        document.getElementById('inst-line-desc').innerHTML = textData.instLineDesc;
        document.getElementById('inst-point-title').innerText = textData.instPointTitle;
        document.getElementById('inst-point-desc').innerHTML = textData.instPointDesc;
        document.getElementById('label-mode').innerText = textData.labelMode;
        document.getElementById('label-player').innerText = textData.labelPlayer;
        document.getElementById('btn-line').innerText = textData.btnLine;
        document.getElementById('btn-point').innerText = textData.btnPoint;
        document.getElementById('time-limit-msg').innerText = textData.timeLimit;
        document.getElementById('btn-start').innerText = textData.btnStart;
        document.getElementById('btn-restart').innerText = textData.btnRestart;
        
        const updateLink = (id) => {
            const el = document.getElementById(id);
            if(el) el.innerText = textData.linkText;
        };
        updateLink('header-link');
        updateLink('top-link-anchor');
        
        const moreBtn = document.getElementById('btn-more-games');
        if(moreBtn) moreBtn.innerText = textData.btnMore;

        // SEO 강화 업데이트
        document.title = textData.title + " - " + textData.linkText;
        document.querySelector('meta[name="description"]').setAttribute("content", textData.metaDesc);

        // 긴 문자열 언어일 경우 글자 크기 동적 조절 CSS용 클래스 부여
        const longTextLangs = ['ru', 'fr', 'es', 'pt-br', 'de', 'it', 'vi', 'id', 'th', 'hi', 'bn', 'tr'];
        if (longTextLangs.includes(lang)) {
            document.body.classList.add('lang-long');
        } else {
            document.body.classList.remove('lang-long');
        }

        if (activePlayers.length > 0) {
            activePlayers.forEach(p => p.name = textData.animals[p.originalId]);
        }
    }

    /* --- 브라우저 기본 동작 방지 (전자칠판/태블릿 최적화) --- */
    document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function(event) {
        if (event.scale !== 1) event.preventDefault();
    }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
    }, false);
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.ondragstart = function() { return false; };

    /* --- 오디오 시스템 --- */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type='sine', dur=0.1, vol=0.1) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }
    
    function playSuccess() {
        playTone(600, 'sine', 0.1, 0.2);
        setTimeout(() => playTone(800, 'sine', 0.2, 0.2), 100);
    }
    function playWin() {
        playTone(523.25, 'triangle', 0.2);
        setTimeout(() => playTone(659.25, 'triangle', 0.2), 200);
        setTimeout(() => playTone(783.99, 'triangle', 0.4), 400);
    }

    /* --- 게임 설정 및 상태 --- */
    const GRID_SIZE = 8;
    let gameMode = 'line';
    let gameDuration = 60;
    let timeLeft = 60;
    let timerInterval;
    let isGameOver = false;
    let playerCount = 2;

    const playerConfigTemplate = [
        { id: 0, class: "theme-1" },
        { id: 1, class: "theme-2" },
        { id: 2, class: "theme-3" },
        { id: 3, class: "theme-4" }
    ];
    let activePlayers = [];

    /* --- 초기화 및 이벤트 리스너 --- */
    function init() {
        initLanguage(); 

        document.querySelectorAll('#mode-selector .btn-option').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#mode-selector .btn-option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                gameMode = btn.dataset.value;
                playTone(400, 'sine', 0.05);
            };
        });

        document.querySelectorAll('#player-selector .btn-option').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#player-selector .btn-option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                playerCount = parseInt(btn.dataset.value);
                playTone(450, 'sine', 0.05);
            };
        });

        document.getElementById('btn-start').onclick = startGame;
        document.getElementById('btn-restart').onclick = () => window.location.reload();
        document.getElementById('home-btn').onclick = () => window.location.reload();
        document.getElementById('full-btn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
    }

    function startGame() {
        playTone(600, 'square', 0.2);
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-over-controls').style.display = 'none';
        
        // 중요: 게임 시작 시 언어 선택 모달/버튼 컨테이너 완전 숨김 처리
        document.getElementById('language-ui-container').style.display = 'none';
        
        const container = document.getElementById('app-container');
        container.innerHTML = '';
        
        timeLeft = gameDuration;
        isGameOver = false;
        updateTimerDisplay();

        activePlayers = [];
        const textData = I18N[currentLang];

        for(let i=0; i<playerCount; i++) {
            const p = { 
                ...playerConfigTemplate[i], 
                originalId: i,
                name: textData.animals[i],
                score: 0, problem: [], painted: [] 
            };
            activePlayers.push(p);
            createPlayerBoard(p);
            nextProblem(p);
        }

        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if(timeLeft <= 5 && timeLeft > 0) playTone(800, 'sine', 0.05);
            if(timeLeft <= 0) endGame();
        }, 1000);
    }

    function updateTimerDisplay() {
        document.getElementById('timer-display').innerText = timeLeft;
    }

    /* --- 게임 로직 --- */
    function createPlayerBoard(p) {
        const container = document.getElementById('app-container');
        const area = document.createElement('div');
        area.className = `player-area ${p.class}`;
        area.innerHTML = `
            <div class="player-header">
                <div class="team-name">${p.name}</div>
                <div class="team-score" id="score-${p.id}">0</div>
            </div>
            <div class="grid-wrapper">
                <div class="game-grid ${gameMode === 'line' ? 'grid-line-sym' : 'grid-point-sym'}" id="grid-${p.id}"></div>
                <div class="success-effect" id="effect-${p.id}"><div class="success-icon">⭕</div></div>
            </div>
            <div class="overlay-msg" id="res-${p.id}"></div>
        `;
        container.appendChild(area);
        
        const gridEl = area.querySelector('.game-grid');
        for(let r=0; r<GRID_SIZE; r++) {
            for(let c=0; c<GRID_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.r = r; cell.dataset.c = c; cell.dataset.pid = p.id;
                
                cell.onpointerdown = (e) => handleInputStart(e, p.id, r, c);
                cell.onpointerenter = (e) => handleInputMove(e, p.id, r, c);
                gridEl.appendChild(cell);
            }
        }
    }

    function nextProblem(p) {
        if(isGameOver) return;
        p.problem = Array(GRID_SIZE * GRID_SIZE).fill(0);
        p.painted = Array(GRID_SIZE * GRID_SIZE).fill(0);
        
        const numCells = 4 + Math.floor(Math.random() * 4); 
        for(let i=0; i<numCells; i++) {
            let r = Math.floor(Math.random() * GRID_SIZE);
            let c = Math.floor(Math.random() * (GRID_SIZE / 2));
            p.problem[r * GRID_SIZE + c] = 1;
        }
        renderGrid(p);
    }

    function renderGrid(p) {
        const gridEl = document.getElementById(`grid-${p.id}`);
        const cells = gridEl.children;
        
        for(let i=0; i<cells.length; i++) {
            const r = parseInt(cells[i].dataset.r);
            const c = parseInt(cells[i].dataset.c);
            const idx = r * GRID_SIZE + c;
            
            cells[i].className = 'cell'; 
            if (p.problem[idx] === 1) cells[i].classList.add('problem');
            if (p.painted[idx] === 1) cells[i].classList.add('painted');
        }
    }

    /* --- 입력 처리 --- */
    let isDrawing = [false, false, false, false]; 
    let drawMode = [1, 1, 1, 1]; 

    function handleInputStart(e, pid, r, c) {
        if(isGameOver) return;
        e.preventDefault();
        if (c < GRID_SIZE / 2) return; 
        e.target.releasePointerCapture(e.pointerId); 
        
        pid = parseInt(pid);
        const p = activePlayers[pid]; 
        const idx = r * GRID_SIZE + c;
        
        drawMode[pid] = p.painted[idx] === 1 ? 0 : 1;
        isDrawing[pid] = true;
        updateCell(p, idx, drawMode[pid]);
        
        const stopDrawing = () => { isDrawing[pid] = false; document.removeEventListener('pointerup', stopDrawing); };
        document.addEventListener('pointerup', stopDrawing);
    }

    function handleInputMove(e, pid, r, c) {
        pid = parseInt(pid);
        if(isGameOver || !isDrawing[pid]) return;
        if (c < GRID_SIZE / 2) return;
        if(e.pointerType === 'mouse' && e.buttons === 0) {
            isDrawing[pid] = false;
            return;
        }
        const p = activePlayers[pid];
        const idx = r * GRID_SIZE + c;
        if (p.painted[idx] !== drawMode[pid]) updateCell(p, idx, drawMode[pid]);
    }

    function updateCell(p, idx, value) {
        p.painted[idx] = value;
        renderGrid(p);
        playTone(300 + (value ? 100 : 0), 'sine', 0.05, 0.05);
        checkAnswer(p);
    }

    function checkAnswer(p) {
        let solutionMap = Array(GRID_SIZE * GRID_SIZE).fill(0);
        for(let r=0; r<GRID_SIZE; r++) {
            for(let c=0; c<GRID_SIZE/2; c++) {
                if (p.problem[r*GRID_SIZE + c] === 1) {
                    let targetR, targetC;
                    if (gameMode === 'line') {
                        targetR = r; targetC = (GRID_SIZE - 1) - c;
                    } else {
                        targetR = (GRID_SIZE - 1) - r; targetC = (GRID_SIZE - 1) - c;
                    }
                    solutionMap[targetR * GRID_SIZE + targetC] = 1;
                }
            }
        }
        
        let isCorrect = true;
        for(let i=0; i<p.painted.length; i++) {
            if (solutionMap[i] !== p.painted[i]) {
                isCorrect = false; break;
            }
        }
        
        if (isCorrect) {
            p.score++;
            document.getElementById(`score-${p.id}`).innerText = p.score;
            playSuccess();
            
            const effect = document.getElementById(`effect-${p.id}`);
            effect.classList.remove('animate-pop');
            void effect.offsetWidth;
            effect.classList.add('animate-pop');
            
            setTimeout(() => nextProblem(p), 500);
        }
    }

    function endGame() {
        if(isGameOver) return;
        isGameOver = true;
        clearInterval(timerInterval);
        playWin();

        let sortedPlayers = [...activePlayers].sort((a, b) => b.score - a.score);
        const textData = I18N[currentLang];
        
        activePlayers.forEach(p => {
            let rank = sortedPlayers.findIndex(sp => sp.score === p.score) + 1;
            let title = "";
            if (rank === 1) title = textData.rank[0];
            else if (rank === 2) title = textData.rank[1];
            else if (rank === 3) title = textData.rank[2];
            else title = rank + textData.rank[3];
            
            let scoreText = `${textData.scoreFinal}${p.score}${textData.scoreUnit}`;
            showResult(p.id, title, scoreText);
        });
        
        document.getElementById('game-over-controls').style.display = 'flex';
    }

    function showResult(pid, title, subText) {
        const div = document.getElementById(`res-${pid}`);
        div.innerHTML = `
            <h1 style="font-size:2.5rem; color:#FFD93D; margin-bottom:10px;">${title}</h1>
            <h2 style="font-size:1.5rem;">${subText}</h2>
        `;
        div.style.display = 'flex';
    }

    init();
</script>
</body>
</html>
