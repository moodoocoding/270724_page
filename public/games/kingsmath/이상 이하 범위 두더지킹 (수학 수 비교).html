    <style>
         /* [폰트어썸 아이콘 깨짐 방지용 예외 처리] */
        i[class^="fa-"] {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
        }

        /* [전자칠판 최적화] */
        * {
            box-sizing: border-box;
            user-select: none; -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #f0f0f0;
            --accent-color: #FFD93D;
            --btn-active: #6c5ce7;
            
            --p0-main: #2980b9; --p0-light: #85c1e9; --p0-accent: #00ffff;
            --p1-main: #d35400; --p1-light: #f5b041; --p1-accent: #ffff00;
            --p2-main: #c2185b; --p2-light: #f8bbd0; --p2-accent: #FF1493;
            --p3-main: #27ae60; --p3-light: #a5d6a7; --p3-accent: #00FF00;
        }

 body {
            margin: 0; padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Jua', sans-serif;
            height: 100vh; /* 구형 브라우저 호환용 */
            height: 100dvh; /* 변경: 전체화면이 아닐 때 상하단 브라우저 UI를 제외한 실제 화면 크기에 딱 맞춤 */
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }
        
        /* 헤더 */
        header {
            background-color: #111; color: var(--accent-color); padding: 0 30px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); z-index: 10; height: 70px; position: relative;
        }
        header h1 { font-size: 1.6rem; margin: 0; position: absolute; left: 30px; cursor: pointer; }
        #header-info { display: none; align-items: center; gap: 20px; }
        #timer-display {
            font-size: 2.5rem; color: #fff; background: #444; padding: 5px 20px;
            border-radius: 15px; border: 2px solid #666; min-width: 100px; text-align: center;
        }
        #timer-display.urgent { background: #c0392b; animation: blinkTimer 0.5s infinite alternate; }
        @keyframes blinkTimer { from { opacity: 1; } to { opacity: 0.5; } }

        /* 메인 컨테이너 */
        #app-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; width: 100%; }

        /* 상단 글로벌 미션 표시 영역 */
        #global-mission-area {
            position: absolute; top: 20px; width: 100%; text-align: center;
            font-size: 6rem; color: #FFF; text-shadow: 4px 4px 0 #000;
            z-index: 5; display: none; font-weight: bold;
        }

        /* 3-2-1 카운트다운 오버레이 */
        #countdown-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; flex-direction: column;
        }
        .countdown-text { font-size: 15rem; color: #FFD93D; text-shadow: 5px 5px 0 #000; font-family: 'Fredoka One', 'Jua', sans-serif; }

        /* 설정 화면 */
        #setup-screen {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            background: var(--card-bg); padding: 30px; border-radius: 30px;
            border: 3px solid #444; z-index: 20; max-height: 90vh; overflow-y: auto;
        }
        .screen-title { font-size: 3rem; color: #fff; text-shadow: 2px 2px 0 #000; margin-bottom: 5px; }
        .screen-desc {
            font-size: 1.2rem; color: #ccc; text-align: center; margin-bottom: 20px;
            background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; border: 1px solid #555;
            word-break: keep-all; /* 텍스트 줄바꿈 최적화 */
        }
        .highlight { color: #ff7675; }
        .option-section { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; width: 100%; }
        .label-text { font-weight: bold; min-width: 80px; text-align: right; color: #aaa; font-size: 1.3rem; white-space: nowrap; transition: font-size 0.2s; }
        .option-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;}
        .btn-option { padding: 10px 20px; font-size: 1.1rem; border: 2px solid #555; background: #222; color: #aaa; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: all 0.2s;}
        .btn-option.selected { background-color: var(--btn-active); color: white; border-color: var(--btn-active); transform: translateY(-2px); }
        #btn-start { margin-top: 10px; padding: 12px 60px; font-size: 2rem; background-color: #ff7675; color: white; border: none; border-radius: 50px; cursor: pointer; font-family: 'Jua', sans-serif;}

        /* 게임 보드 */
/* 게임 보드 */
#game-board {
    display: none; 
    width: 100%; 
    height: 100%; 
    padding: 100px 10px 20px 10px; /* 변경됨: 상단에 100px 여백을 주어 미션 텍스트 공간 확보 */
    box-sizing: border-box; 
    flex-direction: row; 
    justify-content: space-evenly; 
    align-items: center; 
    gap: 8px; 
}

.team-card {
    background: var(--card-bg); 
    border-radius: 20px; 
    border: 3px solid #666;
    height: 85%; 
    width: 24%; /* 4인 플레이 시 꽉 차도록 23% -> 24% 미세 조정 */
    min-width: 150px; /* 변경됨: 1280x800 4분할 시 삐져나가지 않도록 200px에서 150px로 완화 */
    max-width: 400px;
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    position: relative; 
    overflow: hidden;
    justify-content: flex-end; 
    padding-top: 60px; 
}
        
        /* 테마별 색상 */
        .team-0 { border-color: var(--p0-main); } .team-0 .player-label { color: var(--p0-accent); } .team-0 .target-box { border-color: var(--p0-main); color: var(--p0-accent); }
        .team-1 { border-color: var(--p1-main); } .team-1 .player-label { color: var(--p1-accent); } .team-1 .target-box { border-color: var(--p1-main); color: var(--p1-accent); }
        .team-2 { border-color: var(--p2-main); } .team-2 .player-label { color: var(--p2-accent); } .team-2 .target-box { border-color: var(--p2-main); color: var(--p2-accent); }
        .team-3 { border-color: var(--p3-main); } .team-3 .player-label { color: var(--p3-accent); } .team-3 .target-box { border-color: var(--p3-main); color: var(--p3-accent); }

        .header-section { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; z-index: 5; position: absolute; top: 0; left: 0; right: 0; }
        .player-label { font-size: 4rem; text-shadow: 2px 2px 0 #000; }
        .score-text { font-size: 4rem; color: #fff; }
        .crown-icon { position: absolute; top: 10px; left: 10px; font-size: 2rem; opacity: 0; transition: all 0.4s; z-index: 10; }
        .crown-icon.show { opacity: 1; transform: scale(1.2) rotate(-15deg); }

        /* 두더지 그리드 영역 */
        .mole-grid-area {
            flex: none; width: 100%; padding: 5px;
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 5px;
            background: #222; margin-bottom: 5px;
        }

        /* 하단 미션 영역 */
        .mission-area {
            width: 100%; padding: 5px; background: rgba(0,0,0,0.5); display: flex; justify-content: center;
            align-items: center; border-top: 2px solid #555; height: 80px; gap: 15px; z-index: 5; flex: none;
        }
        .mission-label { font-size: 1.5rem; color: #fff; }
        .target-box { font-size: 1.8rem; padding: 5px 15px; border-radius: 10px; border: 3px solid #fff; background: rgba(0,0,0,0.6); text-align: center; }
        .target-box.pulse { transform: scale(1.1); transition: 0.2s; }

        /* --- 두더지 구멍 래퍼 --- */
        .hole-wrapper {
            position: relative; width: 100%; height: 100%; min-height: 120px;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .hole-scale-box {
            position: absolute; bottom: 0;
            transform-origin: bottom center;
            transform: scale(0.42); 
            width: 300px; height: 300px;
        }

        /* --- 원본 두더지 CSS 병합 --- */
        .donut-back {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            width: 260px; height: 80px; box-sizing: border-box;
            border: 45px solid #C2185B; border-bottom: 0; border-radius: 130px 130px 0 0; z-index: 1; pointer-events: none;
        }
        .hole-mask {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            width: 200px; height: 220px; overflow: hidden; z-index: 2; pointer-events: none;
        }
        .mole {
            position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%) translateY(200px);
            width: 130px; height: 190px; background-color: #D68C5E;
            border-radius: 65px 65px 35px 35px;
            transition: transform 0.4s cubic-bezier(0.5, -0.5, 0.3, 1.5);
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; pointer-events: auto;
        }
        .mole.up { transform: translateX(-50%) translateY(0); }
        .mole.wrong { animation: shakeMole 0.4s ease-in-out; filter: grayscale(50%); }

        @keyframes shakeMole {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            25% { transform: translateX(-55%) translateY(0) rotate(-5deg); }
            75% { transform: translateX(-45%) translateY(0) rotate(5deg); }
        }

        .donut-front {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 260px; height: 80px; box-sizing: border-box;
            border: 45px solid #FF4081; border-top: 0; border-radius: 0 0 130px 130px;
            z-index: 6; box-shadow: 0 15px 30px rgba(255, 64, 129, 0.2); pointer-events: none;
        }
        
        .sprinkle { position: absolute; width: 6px; height: 18px; border-radius: 4px; box-shadow: 1px 1px 2px rgba(0,0,0,0.4); pointer-events: none; }
        .back-s { z-index: 2; } .front-s { z-index: 7; }

        /* 두더지 데코 */
        .sprout { position: absolute; top: -20px; width: 24px; height: 24px; z-index: 3; }
        .leaf { position: absolute; width: 14px; height: 14px; background-color: #AEEA00; border-radius: 0 12px 0 12px; }
        .leaf.left { left: -5px; top: 5px; transform: rotate(-30deg); } .leaf.right { right: -3px; top: 0px; transform: rotate(50deg); }
        
        .number-badge {
            margin-top: 15px; background-color: #FFF; color: #FF5722;
            font-family: 'Fredoka One', 'Jua', cursive; font-size: 55px; 
            padding: 5px 20px; border-radius: 30px; border: 5px solid #FFCCBC;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 4;
        }
        .eyes { position: absolute; top: 100px; display: flex; gap: 40px; z-index: 4; pointer-events: none;}
        .eye { position: relative; width: 18px; height: 22px; background-color: #3E2723; border-radius: 50%; animation: blink 4s infinite; }
        .eye::before { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 9px; background-color: white; border-radius: 50%; }
        .eye::after { content: ''; position: absolute; bottom: 4px; left: 4px; width: 3px; height: 3px; background-color: white; border-radius: 50%; }
        .blushes { position: absolute; top: 115px; display: flex; gap: 70px; z-index: 3; pointer-events: none;}
        .blush { width: 22px; height: 12px; background-color: #FF8A80; border-radius: 50%; opacity: 0.7; filter: blur(1px); }
        .muzzle { position: absolute; top: 115px; width: 60px; height: 45px; background-color: #FFF3E0; border-radius: 50%; display: flex; flex-direction: column; align-items: center; z-index: 4; pointer-events: none;}
        .nose { margin-top: 6px; width: 22px; height: 14px; background-color: #FF4081; border-radius: 50%; }
        .mouth { display: flex; margin-top: 3px; }
        .mouth-part { width: 12px; height: 8px; border: 2px solid transparent; border-bottom-color: #8D6E63; border-radius: 50%; }
        .paws { position: absolute; bottom: 25px; display: flex; gap: 70px; z-index: 5; pointer-events: none;}
        .paw { width: 28px; height: 20px; background-color: #D68C5E; border-radius: 50%; border-bottom: 3px solid #A86B44; }
        .paw.left { transform: rotate(-15deg); } .paw.right { transform: rotate(15deg); }
        
        @keyframes blink { 0%, 96%, 98% { transform: scaleY(1); } 97%, 99% { transform: scaleY(0.1); } 100% { transform: scaleY(1); } }

        /* 타격 효과 ('정답' 텍스트) */
        .hit-effect { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 10; display: flex; justify-content: center; align-items: center;}
        .pow { position: absolute; font-size: 55px; font-family: 'Jua', sans-serif; color: #FFEB3B; text-shadow: 3px 3px 0 #F44336; transform: scale(0); transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0;}
        .pow.active { transform: scale(1) translateY(-60px) rotate(-10deg); opacity: 1; }

        /* 결과/종료 화면 */
        .win-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); border-radius: 17px; display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(5px);
        }
        .rank-medal { font-size: 5rem; margin-bottom: 10px; }
        .rank-text { font-size: 3rem; color: var(--accent-color); margin-bottom: 20px; }
        .final-score { font-size: 3.5rem; color: #fff; margin-bottom: 20px; }
        #game-over-controls { display: none; position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); z-index: 200; }
        #btn-restart { padding: 15px 50px; font-size: 2.2rem; font-family: 'Jua', sans-serif; background: linear-gradient(to bottom, #00b894, #00cec9); color: white; border: 4px solid #fff; border-radius: 50px; cursor: pointer; }

        .floating-btn { position: fixed; bottom: 20px; width: 50px; height: 50px; border-radius: 50%; background: #444; color: white; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; z-index: 60; cursor: pointer; border: 2px solid #666;}
        #btn-home { left: 20px; } #btn-fullscreen { right: 20px; }
        
        #confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 100; }
        .confetti { position: absolute; width: 10px; height: 10px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

        /* --- [다국어 UI용 추가 CSS] --- */
        .font-noto { font-family: 'Noto Sans KR', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
        
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }

/* [해상도 맞춤형 미디어 쿼리] 1334x800, 1280x800 등 소형/와이드 액정 최적화 */
@media (max-width: 1400px), (max-height: 850px) {
    /* 헤더 및 상단 UI 축소 */

    header h1 { font-size: 1.3rem; left: 15px; }

    #timer-display { font-size: 1.8rem; padding: 3px 15px; min-width: 70px; }

    /* 시작 설정 화면 축소 */
    .screen-title { font-size: 2.2rem; }
    .screen-desc { font-size: 1rem; padding: 10px; margin-bottom: 10px; }

    .btn-option { padding: 6px 12px; font-size: 0.9rem; }

    /* 보드 여백 및 폰트 축소 */
#game-board { 
        padding: 60px 5px 5px 5px; /* 변경됨: 좁은 화면용 상단 여백 60px 확보 */
        gap: 5px; 
    }
    .team-card { padding-top: 40px; }
    .player-label { font-size: 2.5rem; }
    .score-text { font-size: 2.5rem; }
    
    /* 하단 미션 영역 축소 */

    .mission-label { font-size: 1.2rem; }

    /* 두더지 크기 및 스케일 축소 */

    /* 종료 화면 축소 */

    #btn-restart { padding: 10px 30px; font-size: 1.5rem; }
}

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                const playNote = (freq, time, dur, vol) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'sine'; o.frequency.setValueAtTime(freq, time);
                    g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.01, time + dur);
                    o.start(time); o.stop(time + dur);
                };
                playNote(1046.50, now, 0.1, 0.3);
                playNote(1567.98, now + 0.08, 0.4, 0.4);
            } else if (type === 'urgent') {
                for (let i = 0; i < 3; i++) {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'square'; o.frequency.setValueAtTime(1200, now + i * 0.15);
                    g.gain.setValueAtTime(0.15, now + i * 0.15); g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.05);
                    o.start(now + i * 0.15); o.stop(now + i * 0.15 + 0.05);
                }
            } else if (type === 'gameover') {
                const playNote = (freq, time, dur) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'triangle'; o.frequency.setValueAtTime(freq, time);
                    g.gain.setValueAtTime(0.3, time); g.gain.exponentialRampToValueAtTime(0.01, time + dur);
                    o.start(time); o.stop(time + dur);
                };
                playNote(523.25, now, 0.2); playNote(659.25, now + 0.2, 0.2);
                playNote(783.99, now + 0.4, 0.2); playNote(1046.50, now + 0.6, 0.6);
            } else {
                const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                
                if (type === 'wrong') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                    gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'mission') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(900, now + 0.1);
                    gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'beep') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(880, now);
                    gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'start') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(1200, now);
                    gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                }
            }
        }

        function generateMoleNumber(isCorrect, m) {
            let n = m.val1;
            let minCorrect, maxCorrect, minWrong, maxWrong;

            if (m.type === '>=') {
                minCorrect = n; maxCorrect = n + 20; minWrong = n - 20; maxWrong = n - 1;
            } else if (m.type === '<=') {
                minCorrect = n - 20; maxCorrect = n; minWrong = n + 1; maxWrong = n + 20;
            } else if (m.type === '>') {
                minCorrect = n + 1; maxCorrect = n + 20; minWrong = n - 20; maxWrong = n;
            } else if (m.type === '<') {
                minCorrect = n - 20; maxCorrect = n - 1; minWrong = n; maxWrong = n + 20;
            }

            let minTarget, maxTarget;
            if (isCorrect) { minTarget = minCorrect; maxTarget = maxCorrect; } 
            else { minTarget = minWrong; maxTarget = maxWrong; }

            minTarget = Math.max(0, minTarget);
            maxTarget = Math.max(0, maxTarget);
            if(minTarget > maxTarget) { let temp = minTarget; minTarget = maxTarget; maxTarget = temp; }

            return Math.floor(Math.random() * (maxTarget - minTarget + 1)) + minTarget;
        }

                `;
                
                this.ui = {
                    scoreText: div.querySelector('.score-text'),
                    targetBox: div.querySelector('.target-box'),
                    overlay: div.querySelector('.win-overlay'),
                    medal: div.querySelector('.rank-medal'),
                    rankText: div.querySelector('.rank-text'),
                    finalScore: div.querySelector('.final-score'),
                    moles: Array.from(div.querySelectorAll('.mole'))
                };

                this.ui.moles.forEach((mole, idx) => {
                    this.holes[idx] = { el: mole, isUp: false, timeout: null };
                });

                return div;
            }

            updateScore(points) {
                this.score = Math.max(0, this.score + points);
                this.ui.scoreText.innerText = `${this.score}${i18n[currentLang].score_unit}`;
                updateCurrentLeader();
            }

            spawnMole(forcedData) {
                if(!state.isPlaying) return;

                let hole, isCorrect, num, stayTime;

                if (forcedData) {
                    hole = this.holes[forcedData.holeIndex];
                    if (hole.isUp) return;
                    isCorrect = forcedData.isCorrect;
                    num = forcedData.num;
                    stayTime = forcedData.stayTime;
                    if(this.moleBag && this.moleBag.length > 0) this.moleBag.pop();
                } else {
                    const availableHoles = this.holes.filter(h => !h.isUp);
                    if (availableHoles.length === 0) return;
                    hole = availableHoles[Math.floor(Math.random() * availableHoles.length)];
                    
                    isCorrect = false;
                    if (this.moleBag && this.moleBag.length > 0) isCorrect = this.moleBag.pop();
                    else isCorrect = Math.random() > 0.5;
                    
                    num = generateMoleNumber(isCorrect, state.currentMission);
                    stayTime = 2250 + Math.random() * 750;
                }

                hole.isUp = true;
                hole.el.dataset.correct = isCorrect;
                hole.el.querySelector('.number-badge').innerText = num;
                hole.el.classList.remove('wrong');
                hole.el.classList.add('up');

                hole.timeout = setTimeout(() => {
                    if(hole.isUp) {
                        hole.el.classList.remove('up');
                        setTimeout(() => hole.isUp = false, 400); 
                    }
                }, stayTime);
            }
        }

        function setGlobalTarget() {
            let mode = config.gameMode;
            if (mode === 'random') {
                const modes = ['gte_lte', 'gt_lt'];
                mode = modes[Math.floor(Math.random() * modes.length)];
            }

            const t = i18n[currentLang];
            let label = ""; 
            let n = Math.floor(Math.random() * 90) + 10;
            let subMode;

            if (mode === 'gte_lte') subMode = Math.random() > 0.5 ? '>=' : '<=';
            else subMode = Math.random() > 0.5 ? '>' : '<';

            if (subMode === '>=') label = t.txt_gte.replace('{n}', n);
            else if (subMode === '<=') label = t.txt_lte.replace('{n}', n);
            else if (subMode === '>') label = t.txt_gt.replace('{n}', n);
            else if (subMode === '<') label = t.txt_lt.replace('{n}', n);

            let mData = { type: subMode, val1: n };
            state.currentMission = mData;
            
            document.getElementById('global-mission-area').innerHTML = label;

            let masterBag = [true, true, true, true, true, false, false, false, false, false];
            masterBag.sort(() => Math.random() - 0.5);

            state.teams.forEach(team => {
                team.moleBag = [...masterBag];
                team.ui.targetBox.innerHTML = label;
                team.ui.targetBox.classList.add('pulse');
                setTimeout(() => team.ui.targetBox.classList.remove('pulse'), 300);
            });
        }

        function updateCurrentLeader() {
            let maxScore = -1;
            state.teams.forEach(t => { if (t.score > maxScore) maxScore = t.score; });
            state.teams.forEach(t => {
                const crown = document.getElementById(`crown-${t.index}`);
                if (maxScore > 0 && t.score === maxScore) crown.classList.add('show');
                else crown.classList.remove('show');
            });
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // 게임 몰입을 위해 상단 언어 선택 UI 숨김
            document.getElementById('langSelectorContainer').style.display = 'none';

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('header-info').style.display = 'flex';
            
            const board = document.getElementById('game-board');
            board.innerHTML = ''; board.style.display = 'flex';
            
            state.teams = [];
            for (let i = 0; i < config.playerCount; i++) {
                const team = new Team(i);
                state.teams.push(team);
                board.appendChild(team.element);
            }
            
            document.getElementById('global-mission-area').style.display = 'block';
            setGlobalTarget(); 

            const overlay = document.getElementById('countdown-overlay');
            const text = overlay.querySelector('.countdown-text');
            overlay.style.display = 'flex';
            let count = 3;
            text.innerText = count;
            playSound('beep');

            const countInterval = setInterval(() => {
                count--;
                if(count > 0) {
                    text.innerText = count;
                    playSound('beep');
                } else if (count === 0) {
                    text.innerText = "START!";
                    playSound('start');
                } else {
                    clearInterval(countInterval);
                    overlay.style.display = 'none';
                    
                    state.isPlaying = true;
                    board.removeEventListener('pointerdown', handleWhack);
                    board.addEventListener('pointerdown', handleWhack);
                    state.timeLeft = config.gameTime;
                    startTimer();
                    scheduleMoleSpawns();
                }
            }, 1000);
        }

        function handleWhack(e) {
            if(!state.isPlaying) return;
            const target = e.target.closest('.mole');
            if(!target || !target.classList.contains('up') || target.classList.contains('wrong')) return;

            const tIdx = target.dataset.team;
            const hIdx = target.dataset.hole;
            const team = state.teams[tIdx];
            const hole = team.holes[hIdx];
            const isCorrect = target.dataset.correct === 'true';

            clearTimeout(hole.timeout);

            if(isCorrect) {
                playSound('hit');
                team.updateScore(10);
                target.classList.remove('up');
                
                const powEl = target.closest('.hole-scale-box').querySelector('.pow');
                powEl.classList.add('active');
                setTimeout(() => powEl.classList.remove('active'), 300);
                
                setTimeout(() => hole.isUp = false, 400);
            } else {
                playSound('wrong');
                team.updateScore(-5);
                target.classList.add('wrong');
                setTimeout(() => {
                    target.classList.remove('up', 'wrong');
                    setTimeout(() => hole.isUp = false, 400);
                }, 500);
            }
        }

        function scheduleMoleSpawns() {
            if(!state.isPlaying) return;

            if (config.moleMode === 'same') {
                let availableHoleIndices = [];
                for(let i=0; i<9; i++) {
                    let allDown = true;
                    for(let t=0; t<state.teams.length; t++) {
                        if(state.teams[t].holes[i].isUp) { allDown = false; break; }
                    }
                    if(allDown) availableHoleIndices.push(i);
                }

                if (availableHoleIndices.length > 0) {
                    let spawnCount = (Math.random() > 0.7 && availableHoleIndices.length >= 2) ? 2 : 1;
                    
                    for(let k=0; k<spawnCount; k++) {
                        if(availableHoleIndices.length === 0) break;
                        
                        const randIdx = Math.floor(Math.random() * availableHoleIndices.length);
                        const holeIndex = availableHoleIndices[randIdx];
                        availableHoleIndices.splice(randIdx, 1);

                        let isCorrect = false;
                        if (state.teams[0].moleBag && state.teams[0].moleBag.length > 0) {
                            isCorrect = state.teams[0].moleBag[state.teams[0].moleBag.length - 1]; 
                        } else {
                            isCorrect = Math.random() > 0.5;
                        }

                        const num = generateMoleNumber(isCorrect, state.currentMission);
                        const stayTime = 2250 + Math.random() * 750;

                        state.teams.forEach(team => {
                            team.spawnMole({ holeIndex, isCorrect, num, stayTime });
                        });
                    }
                }
                setTimeout(scheduleMoleSpawns, 800 + Math.random() * 500);
            } else {
                state.teams.forEach(team => {
                    if(Math.random() > 0.3) team.spawnMole();
                    if(Math.random() > 0.7) setTimeout(() => team.spawnMole(), 500);
                });
                setTimeout(scheduleMoleSpawns, 800 + Math.random() * 500);
            }
        }

        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.innerText = state.timeLeft;
            timerDisplay.classList.remove('urgent');

            if(state.timerInterval) clearInterval(state.timerInterval);
            
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                timerDisplay.innerText = state.timeLeft;

                if(state.timeLeft % 10 === 0 && state.timeLeft > 0) {
                     setGlobalTarget();
                     playSound('mission');
                }

                if (state.timeLeft <= 10) timerDisplay.classList.add('urgent');
                if (state.timeLeft <= 5 && state.timeLeft > 0) playSound('urgent');
                if (state.timeLeft <= 0) finishGame();
            }, 1000);
        }

        function finishGame() {
            state.isPlaying = false;
            clearInterval(state.timerInterval);
            playSound('gameover');
            
            // 게임 종료시 언어 선택 UI 다시 보이기
            document.getElementById('langSelectorContainer').style.display = 'block';

            state.teams.forEach(t => t.holes.forEach(h => {
                clearTimeout(h.timeout);
                h.el.classList.remove('up');
            }));

            let sortedTeams = [...state.teams].sort((a, b) => b.score - a.score);
            let currentRank = 1;
            for (let i = 0; i < sortedTeams.length; i++) {
                if (i > 0 && sortedTeams[i].score < sortedTeams[i-1].score) currentRank = i + 1;
                let t = i18n[currentLang];
                
                sortedTeams[i].ui.medal.innerHTML = currentRank === 1 ? '🥇' : currentRank === 2 ? '🥈' : currentRank === 3 ? '🥉' : '<span style="font-size: 70%;">4️⃣</span>';
                sortedTeams[i].ui.rankText.innerText = ''; // 기존 다국어 텍스트는 불필요하여 출력 생략
                sortedTeams[i].ui.finalScore.innerText = `${sortedTeams[i].score}${t.score_unit}`;
                sortedTeams[i].ui.overlay.style.display = 'flex';
                if(currentRank === 1) createConfetti();
            }

            document.getElementById('game-over-controls').style.display = 'block';
        }

        // --- 이벤트 리스너 ---
        document.querySelectorAll('#player-options .btn-option').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#player-options .btn-option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected'); config.playerCount = parseInt(btn.dataset.value);
            });
        });
        document.querySelectorAll('#mode-options .btn-option').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#mode-options .btn-option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected'); config.gameMode = btn.dataset.value;
            });
        });
        document.querySelectorAll('#molemode-options .btn-option').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#molemode-options .btn-option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected'); config.moleMode = btn.dataset.value;
            });
        });

        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-restart').addEventListener('click', () => location.reload());
        
        // 홈 이모지 전체 화면 지체 없이 첫 화면 가는 로직 + UI 복원
        document.getElementById('btn-home').addEventListener('click', () => {
            if (document.fullscreenElement) {
                state.isPlaying = false;
                clearInterval(state.timerInterval);
                if (state.animationId) cancelAnimationFrame(state.animationId);
                
                // 각종 UI 요소 리셋
                document.getElementById('langSelectorContainer').style.display = 'block';
                document.getElementById('game-board').style.display = 'none';
                document.getElementById('header-info').style.display = 'none';
                document.getElementById('game-over-controls').style.display = 'none';
                document.getElementById('countdown-overlay').style.display = 'none';
                document.getElementById('global-mission-area').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'flex';
                
                if(window.playSound) window.playSound('beep');
            } else {
                location.reload();
            }
        });

      document.getElementById('btn-fullscreen').addEventListener('click', () => {
            // 표준 및 webkit(사파리/모바일) 지원 여부 동시 체크
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err=>{});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen(); // 사파리 지원
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen(); // 사파리 지원
                }
            }
        });

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];
            for (let i = 0; i < 150; i++) {
                const conf = document.createElement('div'); conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.opacity = Math.random();
                container.appendChild(conf);
            }
        }

        // 초기 시작
        window.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            renderLanguages(); // 모달 내부 목록 초기화
        });
    </script>
</body>
</html>
